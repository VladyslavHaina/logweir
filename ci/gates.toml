# The gate map (FX-53 §2.1): every CI gate, the tracked files it reads, and
# the files that define it. `scripts/ci-gate.sh hash <gate>` hashes a gate's
# inputs; a gate is skipped only when a same-repository run of ci.yml proves
# that the same gate passed on the same hash (§2.2). A marker artifact
# `gate-<gate>-<hash>` only points at that run: the proof is the run itself,
# where the gate's own job (`job`, default the gate's name) concluded success
# on a commit whose tree gives the same hash (scripts/ci-gate.sh, PROVERS).
#
# HOW A GATE'S INPUTS ARE EXPANDED (all matching is git's own pathspec glob,
# `git ls-files -- ':(glob)<pattern>'`, so `*` stops at `/` and `**` crosses it):
# - [global].paths: inputs of EVERY gate. They hold the toolchain, the lockfile,
#   the root manifest, this map, the gate machinery, the local actions and
#   every workflow a proving run executes: a change to CI changes every hash,
#   so everything runs.
# - definition: the scripts and recipes the gate's job runs. Every gate has one.
# - crates: workspace packages, expanded from `cargo metadata --locked --no-deps`
#   to the package directory and every workspace package it depends on
#   (normal, dev and build edges for the named package; normal and build edges
#   below it). `*` means every workspace member.
# - paths: the gate's own inputs.
# - readers: hidden readers, the repository files its tests read at run time or
#   compile in (cicd-structure §2.2, §2.3).
# - walks: files the gate reads because it walks the tree. Walks are inputs of
#   the gate, but they do not CLASSIFY a path (below).
# - tests: e2e test binaries; each adds `e2e/tests/<name>.rs` to the inputs.
# - exists ([global] and per gate): files the gate only LOOKS FOR (stat,
#   access): hashed by path, so adding or removing one changes the hash and
#   editing one does not. The traced run accepts only stat-like calls on them.
# - job: the name of the ci.yml job that runs the gate, as the jobs API shows
#   it (default: the gate's name; a caller prefixes `<caller job> / `).
# - always = true: the result depends on time or the outside world (advisory
#   databases, the npm registry). The gate never skips; its marker is recorded
#   only for the record.
#
# THE FAIL-SAFE FOR AN UNKNOWN PATH: a tracked file that no gate classifies
# (through definition, crates, paths or readers) is an input of EVERY gate. A
# new top-level directory, a new root file, or anything this map forgot runs
# everything until a gate claims it.
#
# Job names (FX-53 stage 4, reconciled with ci.yml): a gate's `job` is the
# name of the ci.yml job that runs it (default: the gate's own name). Twelve
# check gates run in eight jobs (GitHub Free's 20 concurrent jobs): `lint`
# also runs `supply-chain`, `python-docs` runs `python` and `docs`, and
# `unit-small` runs the retention, xtask and e2e unit groups, each gate a step
# of its own. A shard's job is `e2e N`. workflow_lint holds every ci.yml job
# to a gate here or to [not_gates], and every gate here to its job.
# `covers` names today's gate ids (cicd-structure §1.1), so the parity is
# checkable: C1-C30, E1-E5 and K1 each sit in at least one gate.
schema = 1

[global]
paths = [
  "Cargo.lock",
  "Cargo.toml",
  "rust-toolchain.toml",
  ".cargo/**",
  # cargo loads every workspace member's manifest for any command, so one
  # broken manifest breaks every cargo gate (the traced run sees the reads).
  "crates/*/Cargo.toml",
  "xtask/Cargo.toml",
  "e2e/Cargo.toml",
  # Every gate but `console` runs scripts/extract-engine.sh (ci-check.sh's
  # `prepare`, each e2e shard's setup), which reads the OSO digest, checks
  # that the licence and the source tarball are present, and greps the
  # Dockerfile for the same pin (traced run 38817431902).
  "scripts/extract-engine.sh",
  "third_party/kafka-backup-binary.digest",
  "third_party/LICENSE-MIT",
  "third_party/kafka-backup-v*.tar.gz",
  "Dockerfile",
  "ci/gates.toml",
  "scripts/ci-gate.sh",
  ".github/actions/**",
  # Every workflow a proving run executes (scripts/ci-gate.sh PROVERS, and
  # every workflow they call): ci.yml and the images it publishes, release.yml
  # and its drill, the nightly. A changed caller could add a job whose name
  # collides with a gate's; hashing it means its runs prove nothing for us.
  ".github/workflows/ci.yml",
  ".github/workflows/images.yml",
  ".github/workflows/release.yml",
  ".github/workflows/release-drill.yml",
  ".github/workflows/ci-nightly.yml",
]
# Presence only: cargo's target discovery looks for every member's target
# roots (and e2e's README) on every command, and a member with neither a lib
# nor a bin fails the workspace load (traced run 38817431902: statx by cargo).
# Their paths are hashed, not their contents.
exists = [
  "crates/*/src/lib.rs",
  "crates/*/src/main.rs",
  "xtask/src/main.rs",
  "e2e/src/lib.rs",
  "e2e/README.md",
]

# ci.yml jobs that are plumbing, not gates: they read no product input.
[not_gates]
changes = "the path classifier; it decides nothing a marker could prove"
ci-ok = "the aggregate of every gate (re-actors/alls-green)"
publish = "calls images.yml after ci-ok; publication is not skipped by a marker"
engine = "a build (E1) the e2e shards consume; it builds whenever any shard's gate misses, and its identity check runs again in every shard"
build-e2e = "a build (E3) the e2e shards consume; it builds whenever any shard's gate misses"

# ------------------------------------------------------------------ lint
# fmt, clippy, the shell and Python lints (`just lint`), the engine string scan
# of the debug CLI, and the pure-library dependency checks (ci-check.sh:7-31).
[gates.lint]
covers = ["C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8", "C9", "C10", "C11", "C12", "C13", "C14", "C15", "C18"]
definition = [
  "justfile",
  "scripts/ci-check.sh",
  "scripts/extract-engine.sh",
  "scripts/check-no-oso.sh",
  "scripts/check-pure-core.sh",
  "scripts/check-one-signer.sh",
  "scripts/logweir-evidence-primitives.classify",
  "scripts/check-no-archive-write.sh",
  "scripts/reaper-linkage-walk.py",
  "scripts/check-unsafe-scope.sh",
  "scripts/check-no-engine-in-binary.sh",
  "scripts/check-cosign-verify.py",
]
crates = ["*"]
paths = ["clippy.toml", "third_party/kafka-backup-binary.digest"]
# C13 and C18 read the whole tree's text (check-unsafe-scope.sh,
# check-cosign-verify.py:83-98).
walks = ["**"]

# ------------------------------------------------------------------ unit
# `cargo test` (nextest) by crate group: C16 split (FX-53 §2.4). Group names
# guessed.
[gates.unit-core]
covers = ["C16"]
definition = ["justfile", "scripts/ci-check.sh", ".config/nextest.toml"]
crates = [
  "logweir-core", "logweir-evidence", "logweir-verify", "logweir-store",
  "logweir-kafka", "logweir-rdkafka-ffi", "logweir-engine-oso",
]
readers = [
  # binding_fixture, fixture_regen, scorecard_golden, engine-oso's engine and
  # kbak rows, evidence key_provenance, verify deps
  "e2e/fixtures/**",
  # the #[path] stack.rs and its include_str! (store minio_options, kafka live)
  "e2e/tests/harness/**",
  "e2e/compose/**",
  "schemas/**",
  "justfile",
  "scripts/**",
  "docs/**",
  "console/fixtures/**",
  "config/**",
  # logweir-core topic_budget reads these crates' text
  "crates/weirkeeper/**",
  "crates/logweir/**",
  # logweir-store's capped.rs reads every crate's src/**/*.rs (traced run
  # 38817431902), and stats every entry it walks under crates/
  "crates/*/src/**",
]
exists = ["crates/**"]

[gates.unit-logweir]
covers = ["C16"]
definition = ["justfile", "scripts/ci-check.sh", ".config/nextest.toml"]
crates = ["logweir"]
# chart_lint's withdrawn-image scan, doc_lint, message_lint, unsafe_scope_gate,
# one_signer_gate (overlay copies) and withdrawn_claim walk the tree
# (cicd-structure §2.3, "whole-tree walkers").
walks = ["**"]
readers = [
  "docs/**",
  "README.md", "CONTRIBUTING.md", "SECURITY.md", "MAINTAINERS.md", "TRADEMARKS.md",
  "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md",
  "charts/**",
  "schemas/**",
  "console/fixtures/**",
  "console/src/main.tsx",
  "console/scripts/emit-restore-body.mjs",
  "e2e/**",
  "examples/**",
  "config/**",
  "dashboards/**",
  "third_party/**",
  "scripts/**",
  ".github/**",
  "justfile",
  "clippy.toml",
  "deny.toml",
  "Dockerfile", "Dockerfile.console", "Dockerfile.weirkeeper", ".dockerignore",
  "deploy/**",
  "crates/**",
  "xtask/**",
  ".gitignore",
]

[gates.unit-weirkeeper]
covers = ["C16"]
definition = ["justfile", "scripts/ci-check.sh", ".config/nextest.toml"]
# its runner rows drive `target/debug/logweir`, which the group builds first
crates = ["weirkeeper", "logweir"]
readers = [
  "charts/**",
  "config/**",
  "e2e/fixtures/**",
  "console/fixtures/**",
  "docs/**",
  "scripts/**",
  "examples/**",
  "schemas/**",
  "justfile",
  ".github/workflows/**",
  # line_token walks crates/; approval_controller, catalog_controller,
  # preflight_controller and schedule_controller read logweir's source text
  "crates/**",
  "xtask/**",
  # linkage.rs copies crates/, e2e/ and xtask/ whole (`cp -a`) into the
  # overlay it runs cargo in (traced run 38817431902)
  "e2e/**",
]

[gates.unit-api]
covers = ["C16"]
definition = ["justfile", "scripts/ci-check.sh", ".config/nextest.toml"]
crates = ["logweir-api"]
readers = [
  "docs/**",
  "README.md", "CONTRIBUTING.md", "SECURITY.md", "MAINTAINERS.md", "TRADEMARKS.md",
  "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md",
  "charts/**",
  "schemas/**",
  "console/fixtures/**",
  "config/**",
  "scripts/**",
  "deny.toml",
  # linkage reads the other packages' manifests and sources
  "crates/**",
]

[gates.unit-retention]
job = "unit-small"
covers = ["C16"]
definition = ["justfile", "scripts/ci-check.sh", ".config/nextest.toml"]
crates = ["logweir-retention", "logweir-reaper"]
# tests/worker.rs reads the controller's wire for the policy (traced run
# 38817431902)
readers = ["crates/weirkeeper/src/controllers/retention_policy.rs"]

[gates.unit-xtask]
job = "unit-small"
covers = ["C16"]
definition = ["justfile", "scripts/ci-check.sh", ".config/nextest.toml"]
crates = ["xtask"]
# xtask reads the vendored engine tarball and engine-oso's vendored copies.
readers = ["third_party/kafka-backup-*", "crates/logweir-engine-oso/**"]

# e2e's rows without the `e2e` feature (stack_params, record_semantics_oracle,
# fixture_retention, ...): today they run in C16's `cargo test --workspace`.
# Name guessed; the design's six groups do not name it.
[gates.unit-e2e]
job = "unit-small"
covers = ["C16"]
definition = ["justfile", "scripts/ci-check.sh", ".config/nextest.toml"]
crates = ["logweir", "logweir-core", "logweir-engine-oso", "logweir-evidence", "logweir-kafka"]
paths = ["e2e/Cargo.toml", "e2e/src/**", "e2e/tests/**"]
readers = [
  "e2e/compose/**",
  "e2e/fixtures/**",
  "e2e/README.md",
  "examples/**",
  # the only docs/ files e2e/tests name
  "docs/support-matrix.md",
  "docs/verify_scorecard.py",
  "scripts/**",
  "justfile",
  ".github/workflows/**",
  "third_party/**",
  "Dockerfile", "Dockerfile.console", "Dockerfile.weirkeeper", ".dockerignore",
  "console/src/**",
  "console/scripts/**",
  "console/package.json",
  # stack_params walks every crates/**/*.rs for `--features e2e` rows (traced
  # run 38817431902)
  "crates/**",
]

# ------------------------------------------------------------------ generated
# Schema, CRD and chart drift (ci-check.sh:44-46).
[gates.generated]
covers = ["C23", "C24", "C25"]
definition = [
  "justfile",
  "scripts/ci-check.sh",
  "scripts/check-chart.sh",
  "scripts/check-chart-values.sh",
]
# the emitters: logweir-core x6, logweir-api emit_openapi, logweir
