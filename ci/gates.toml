crates = ["logweir-core", "logweir-api", "logweir", "weirkeeper"]
paths = ["schemas/**", "charts/**", "config/**"]
readers = [
  "scripts/approval-policy-refusals/**",
  "scripts/ci-images.sh",
  "scripts/check-image-api.sh",
  "Dockerfile",
  "Dockerfile.console",
]

# ------------------------------------------------------------------ supply chain
# The notices diff, both `cargo deny` runs and the engine patch oracle
# (ci-check.sh:49-89). Advisories come from the RustSec database: always.
[gates.supply-chain]
job = "lint"
covers = ["C27", "C28", "C29", "C30"]
always = true
definition = [
  "justfile",
  "scripts/ci-check.sh",
  "scripts/gen-third-party-notices.sh",
  "scripts/engine-source.sh",
]
crates = ["*"]
paths = [
  "deny.toml",
  "THIRD_PARTY_NOTICES.md",
  "third_party/kafka-backup-*",
  "third_party/kafka-backup-patches/**",
]

# ------------------------------------------------------------------ python
# The Python rows, the verifier checks and `just verify-py`
# (justfile:12-17, ci-check.sh:34-42).
[gates.python]
job = "python-docs"
covers = ["C17", "C19", "C20", "C21", "C22"]
definition = [
  "justfile",
  "scripts/ci-check.sh",
  "scripts/test-ci-gate.py",
  "scripts/test-ci-trace.py",
]
# LOGWEIR_BIN (C7, C22)
crates = ["logweir"]
paths = ["docs/verify_scorecard.py", "docs/test_verify_scorecard.py", "scripts/**"]
readers = [
  "e2e/fixtures/**",
  "docs/**",
  "charts/**",
  "schemas/**",
  "README.md", "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md",
  "third_party/LICENSE-MIT",
  # C8 reads the Scorecard struct's text
  "crates/logweir-core/src/**",
]

# ------------------------------------------------------------------ docs
# Links, doc_lint and the unverified-label scan (FX-53 §2.4).
[gates.docs]
job = "python-docs"
covers = ["C12", "C26"]
definition = [
  "justfile",
  "scripts/ci-check.sh",
  "scripts/check-links.sh",
  "scripts/check-unverified-labels.sh",
  ".config/nextest.toml",
]
# doc_lint is a logweir test binary
crates = ["logweir"]
paths = ["docs/**", "README.md", "CONTRIBUTING.md", "SECURITY.md", "MAINTAINERS.md", "TRADEMARKS.md"]
readers = [
  "LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md",
  "third_party/**",
  "e2e/README.md",
  "e2e/fixtures/**",
  "console/README.md",
  "console/fixtures/**",
  "charts/**",
  "deploy/**",
  "scripts/**",
  "Dockerfile", "Dockerfile.console", "Dockerfile.weirkeeper",
]
# C12 greps the whole tree; doc_lint walks docs/**/*.md and crates/.
walks = ["**"]

# ------------------------------------------------------------------ console
# `just console` (K1): the lockfile install, the API types, tsc, ESLint, Vitest,
# the build, npm audit and the licence allowlist. npm audit reads the npm
# advisory database: always.
[gates.console]
covers = ["K1"]
always = true
definition = ["justfile"]
paths = ["console/**", "schemas/logweir-api-v1.openapi.json"]

# ------------------------------------------------------------------ e2e
# Seven shards (ci.yml's `e2e` matrix, FX-53 stage 2), balanced longest-first
# on run 38810896223's nextest times. Each shard reads the e2e build's closure,
# the harness, the stack, the fixtures, the examples, the engine's inputs and
# the verifier the harness runs (harness/mod.rs:1357, gap 1), plus what its own
# binaries read. The engine (E1) and the e2e build (E3) are built for the
# shards, whenever one of them misses, so the shards cover them.

[gates.e2e-1]
job = "e2e 1"
covers = ["E0", "E1", "E2", "E3", "E4", "E6"]
tests = ["position_evidence"]
definition = ["justfile", "scripts/e2e-seed.sh", "scripts/seed-manifest-check.py", "scripts/extract-engine.sh", "scripts/engine-source.sh", ".config/nextest.toml"]
crates = ["logweir", "logweir-core", "logweir-engine-oso", "logweir-evidence", "logweir-kafka"]
paths = ["e2e/Cargo.toml", "e2e/src/**", "e2e/tests/harness/**", "e2e/compose/**", "e2e/fixtures/**"]
readers = [
  "examples/**",
  "docs/verify_scorecard.py",
  "third_party/kafka-backup-*",
  "third_party/kafka-backup-patches/**",
  ".gitignore",
]

[gates.e2e-2]
job = "e2e 2"
covers = ["E0", "E1", "E2", "E3", "E4", "E6"]
tests = ["topic_identity", "scram", "consumer_group_snapshot", "topic_configuration_apply", "created_topics", "fixture_retention", "replication_factor_parity"]
definition = ["justfile", "scripts/e2e-seed.sh", "scripts/seed-manifest-check.py", "scripts/extract-engine.sh", "scripts/engine-source.sh", ".config/nextest.toml"]
crates = ["logweir", "logweir-core", "logweir-engine-oso", "logweir-evidence", "logweir-kafka"]
paths = ["e2e/Cargo.toml", "e2e/src/**", "e2e/tests/harness/**", "e2e/compose/**", "e2e/fixtures/**"]
readers = [
  "examples/**",
  "docs/verify_scorecard.py",
  "third_party/kafka-backup-*",
  "third_party/kafka-backup-patches/**",
  ".gitignore",
  # created_topics and fixture_retention walk every e2e/tests/**/*.rs (traced
  # run 38822348638)
  "e2e/tests/**",
]

[gates.e2e-3]
job = "e2e 3"
covers = ["E0", "E1", "E2", "E3", "E4", "E6"]
tests = ["auth_modes", "clone_ttl", "consumer_positions", "compat_contract", "stack_params", "credential_binding_store", "check_image", "resume_semantics"]
definition = ["justfile", "scripts/e2e-seed.sh", "scripts/seed-manifest-check.py", "scripts/extract-engine.sh", "scripts/engine-source.sh", ".config/nextest.toml"]
crates = ["logweir", "logweir-core", "logweir-engine-oso", "logweir-evidence", "logweir-kafka"]
paths = ["e2e/Cargo.toml", "e2e/src/**", "e2e/tests/harness/**", "e2e/compose/**", "e2e/fixtures/**"]
readers = [
  "examples/**",
  "docs/verify_scorecard.py",
  "third_party/kafka-backup-*",
  "third_party/kafka-backup-patches/**",
  ".gitignore",
  # stack_params walks e2e/tests, e2e/compose and scripts, and reads
  # docs/support-matrix.md, the workflows and the justfile
  "e2e/tests/**",
  "scripts/**",
  "docs/support-matrix.md",
  ".github/workflows/**",
  # check_image reads the Dockerfiles and third_party/
  "Dockerfile", "Dockerfile.console", "Dockerfile.weirkeeper", ".dockerignore",
  "third_party/**",
  # stack_params walks every crates/**/*.rs (traced run 38817431902)
  "crates/**",
]

# The `--features e2e` rows under crates/ (E5): logweir-kafka `live`, two
