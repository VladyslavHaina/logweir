[package]
name = "logweir-evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
hex.workspace = true
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Only for the `mint_fixture` example (Task 6 step 6), which parses and
# re-serialises a `Scorecard` before signing it. Not a dependency of the
# library.
logweir-core = { path = "../logweir-core" }
# `tests/key_provenance.rs` mints keys into throwaway directories to prove
# `SigningKey::load_or_generate` mints only when the path is absent. Pulls no
# OSO, AWS or Kubernetes crate (Global Constraint 1), and it is a DEV
# dependency, so `--no-default-features` library builds never see it.
tempfile = "3"

[features]
default = []
