[package]
name = "weirkeeper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Inherited, and REQUIRED: `dist` refuses to plan a GitHub release for a crate
# that names no repository.
repository.workspace = true

# THE CONTROLLER CRATE. It is a NEW crate and had to be one: the
# forbidden-dependency loop in `.github/workflows/no-oso.yml:23` forbids the
# pure layer from taking `kube` or `k8s-openapi`, and
# `docs/mvp/02-k8s-transition-plan.md:986-989` rules that any operator code
# lives in a new crate or that guard gets renegotiated. Global Constraint 1
# names `crates/weirkeeper` as outside the pure layer BY ADR, never by a quiet
# edit to that grep.
#
# WHAT IT LINKS, AND WHAT IT MUST NOT. `logweir-verify` — the verifying half —
# and never `logweir-evidence`, which keeps `SigningKey` and `sign_detached`
# (Global Constraint 27, guard G-SIGN: `scripts/check-one-signer.sh`'s
# `ALLOWED_VERIFY_LINK` and `ALLOWED_PRIMITIVE` admit this crate, and
# `ALLOWED_LINK` / `ALLOWED_SOURCE` do not). An edge back to the signer would
# also be a dependency CYCLE and break the build, which sounds like enough and
# is not: a build failure is not a NAMED property. `tests/linkage.rs` reads
# both halves out of `cargo metadata`, so the boundary has a test that names
# it.
[dependencies]
# THE ONE DEPENDENCY DECISION OF THIS PLAN, recorded rather than implied.
# `default-features = false` is load-bearing. kube 0.99's own default set is
# `[client, rustls-tls, ring]` (`cargo info kube@0.99`, run against the pinned
# 1.89.0 toolchain), and taking the defaults would leave the feature set free
# to drift with the upstream crate instead of being a decision this repository
# holds. This workspace already resolves the entire rustls HTTP stack through
# `object_store`'s Global-Constraint-9 feature set — rustls 0.23.43,
# tokio-rustls 0.26.4, hyper-rustls 0.27.9, hyper 1.11.1, hyper-util 0.1.20,
# http 1.5.0, http-body-util 0.1.5, tower 0.5.3, tower-http 0.6.11 — so the
# rustls arm adds no HTTP stack at all. `openssl-tls`, `oauth`, `gzip` and the
# jsonpatch-heavy optional features are deliberately NOT taken.
#
# The exact list is asserted by
# `tests/linkage.rs::kube_is_declared_without_default_features`: a fifth
# feature, a dropped entry or a dropped `default-features = false` fails that
# test at ASSERTION time, with no build.
kube = { version = "0.99", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
# Global Constraint 25: minimum Kubernetes 1.29, so the `v1_29` feature and no
# other — `k8s-openapi` refuses to build with two version features at once,
# which makes this a single-value choice rather than a set. `cargo info
# k8s-openapi@0.24` confirms `v1_29` is exposed at this version.
k8s-openapi = { version = "0.24", features = ["v1_29"] }
# THE NEXT THREE ARE ALREADY RESOLVED IN `Cargo.lock` AND ADD NO PACKAGE
# (Global Constraint 38, critique B M4). They are DECLARED anyway, because
# being in the lock file is not being a declared dependency — today `tower` is
# reached only by `reqwest` and `tower-http`, neither of which is this crate's.
# They are NORMAL dependencies and not `[dev-dependencies]`, because
# `src/testing.rs` is a `src/` module that ships in the library.
# `service_fn` sits behind tower's `util` feature and tower 0.5's own defaults
# are `["log"]`, so the feature is required rather than decorative;
# `tests/linkage.rs::the_three_declared_entries_carry_their_features` asserts
# it, and `no_new_package_enters_the_graph_for_the_mock` asserts the three add
# nothing to the resolved graph.
tower = { version = "0.5", features = ["util"] }
# `http::Request` / `http::Response` are the types a `kube::Client`'s inner
# service speaks.
http = "1"
# `BodyExt::collect`, for reading a response body back in the double's own
# tests.
http-body-util = "0.1"
# THE PROCESS-LEVEL rustls CRYPTO PROVIDER, declared because the binary has to
# INSTALL one and cannot be handed one by a feature (fix round 1, review
# finding H1).
#
# rustls 0.23 picks a process-level `CryptoProvider` from its own crate
# features, and only when EXACTLY ONE of `ring` / `aws-lc-rs` is enabled. This
# workspace's unified graph enables BOTH — `aws-lc-rs` through
# `object_store` → `reqwest`, `ring` through `ureq 2.12.1` — and two is the
# same as none: `ClientConfig::builder()` panics
# (`rustls-0.23.43/src/crypto/mod.rs:249`). Measured on the shipped binary
# before this entry existed: `weirkeeper` with no argv aborted at **exit 101**
# inside rustls, before `kube::Client::try_default()` could return anything, so
# `main.rs`'s `error!("no Kubernetes client…")` branch was unreachable and a pod
# would have CrashLoopBackOff'd on a raw panic with no structured log line.
#
# WHY `ring` AND NOT `aws-lc-rs`. `ring` is the provider kube 0.99 itself pairs
# with the `rustls-tls` this crate takes: kube's own `default` set is
# `["client", "ring"]` and its `ring` feature is exactly
# `hyper-rustls?/ring` → `rustls/ring` (`kube-client-0.99.0/Cargo.toml:344`).
# `ring 0.17.14` is ALREADY in `Cargo.lock`, so this entry adds no package
# (Global Constraint 38) — `cargo metadata` holds at 392 either way, and
# `tests/linkage.rs::no_new_package_enters_the_graph_for_the_mock` MEASURES
# that rather than asserting it. `aws-lc-rs 1.18.1` is in the lock too, but it
# builds `aws-lc-sys` through cmake and a C/asm toolchain that Task 23's image
# would then have to carry, and rustls reaches it only through `default` /
# `prefer-post-quantum`, which `default-features = false` declines here.
#
# WHY AN INSTALL AND NOT A FIFTH kube FEATURE. Adding `"ring"` to kube's list
# would yield exactly one provider in a `cargo build -p weirkeeper` graph and
# fix NOTHING under `cargo test --workspace`, where feature unification puts
# both provider features back on rustls. An explicit
# `CryptoProvider::install_default()` is the only fix that holds in every
# graph — and it leaves kube's feature list at the four the brief pins, which
# `kube_is_declared_without_default_features` asserts.
#
# `default-features = false`: rustls's own default set is
# `["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"]`, and taking
# it would drag the second provider into this crate's own graph and re-create
# the ambiguity in the `-p weirkeeper` build an image uses. `std` is supplied
# by `tokio-rustls`, which declares `rustls` with `features = ["std"]`.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# TASK 15B — THE FIVE ENTRIES THE `CustomResource` DERIVE AND THE EMITTER NEED,
# ALL OF THEM WORKSPACE REQUIREMENTS, SO ALL OF THEM ADD NO PACKAGE (Global
# Constraint 38). `kube-derive` 0.99 expands to `::schemars::JsonSchema`,
# `::serde::{Serialize, Deserialize}` and `::serde_json::json!` at their DEFAULT
# crate paths, so all three have to be named here rather than reached through
# `kube`; `chrono` is what `crds::Time` is (see its doc comment for why not
# `k8s-openapi`'s own `Time`, which would cost a second k8s-openapi feature and
# reopen the pinned list above); `serde_yaml` is the emitter's serialiser and is
# permitted in this workspace by Global Constraint 1.
#
# `workspace = true` throughout, so the versions and feature sets stay the root
# manifest's single decision — which is also why
# `tests/linkage.rs::no_new_package_enters_the_graph_for_the_mock` leaves them
# out of its commented-out set: that test measures the entries whose
# justification is "already in `Cargo.lock`" as a plain third-party
# requirement, and a workspace requirement is a different claim, already held
# elsewhere in the tree.
#
# `serde_json` MOVED HERE FROM `[dev-dependencies]` in this task. It was a dev
# dependency while nothing in the library parsed or built JSON; the
# `printcolumn` attributes are `serde_json::json!` literals in expanded derive
# code, so the library itself now needs it. Tests still see it — a normal
# dependency is available to every target.
# TASK 18 — NO ENTRY AT ALL, AND THAT IS THE DECISION BEING RECORDED.
# `BackupSchedule`'s five-field cron expression is parsed by a HAND-WRITTEN
# parser in `src/slot.rs`, not by `cron`, `croner`, `saffron` or
# `cron-parser`. Global Constraint 38 closes the workspace graph: the only
# packages this plan adds are `kube`, `k8s-openapi` and their closure, and none
# of the cron crates is in `Cargo.lock` — so any of them would be a NEW package
# and a stop-and-report. Five integer fields, five syntactic forms (`*`, a
# literal, a comma list, an `a-b` range, a `*/n` step) and three `@` aliases do
# not justify a dependency edge, and the parser's compensating obligation is
# written into `slot.rs` and tested by
# `tests/schedule_controller.rs::cron_parse_refuses_what_it_does_not_understand`:
# it refuses what it does not understand, NAMING THE FIELD, so an unknown token
# never becomes a silent `*`.
#
# `chrono` below is the only thing `slot.rs` needs, and it was already declared
# for `crds::Time`. This task adds no manifest ENTRY of any kind.
#
# D1 W1 — AND THIS ONE DOES, FOR THE HALF A HAND-WRITTEN PARSER CANNOT HOLD.
# The paragraph above still stands for the cron GRAMMAR: five integer fields do
# not justify a dependency edge. The IANA time-zone DATABASE is the opposite
# case — it is 350-odd zones of historical rules amended several times a year
# by an external body, and a hand-written reader of it would be a second,
# unmaintained tzdb that decides when a customer's backup runs. `chrono-tz`
# 0.10.4 (MIT OR Apache-2.0, `rust-version = "1.65"`, under this workspace's
# 1.89 floor) is the compiled-in database decision D1 §4.3 records; the root
# manifest's `[workspace.dependencies]` entry carries the full reasoning,
# including why the host's `/usr/share/zoneinfo` was rejected and which three
# packages come with it.
#
# `workspace = true`, so the version and feature set are the root manifest's
# single decision — which is also why this entry is outside
# `tests/linkage.rs::claimed_already_resolved`'s set: that test measures the
# entries whose justification is "already in `Cargo.lock`", and this one's
# justification is the opposite, a recorded and notice-generating ADDITION.
chrono-tz.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
# The VERIFYING half of the DSSE machinery — `VerifyingKey`, `Sidecar`,
# `verify_detached` and the three payload-type constants (Task 14, interface
# I4). Declared NOW and used from Task 16: the controller checks the scorecard
# and teardown signatures the UI renders (spec §8) and must not thereby link
# the signer.
logweir-verify = { path = "../logweir-verify" }
# TASK 16 — `ids::sha256_prefixed`, AND NOTHING ELSE FROM THIS CRATE. Check 7
# of `controllers::approval::evaluate` RECOMPUTES the plan hash from the
# referent's own `spec.planBytes` and compares it with the hash the approval
# document names, so the controller and `logweir drill approve`
# (`crates/logweir/src/drill/phase1_approval.rs:88`) must agree on the hash
# function BY SHARING IT — a second `sha256_prefixed` in this crate is exactly
# how the two halves come to disagree about which document was approved.
#
# ADDS NO PACKAGE (Global Constraint 38): `logweir-core` is a workspace member
# and already in the resolved graph. A `path =` entry is also outside
# `tests/linkage.rs::claimed_already_resolved`'s set, so the four-entry
# assertion there is untouched.
#
# THE EDGE POINTS THE PERMITTED WAY. Global Constraint 1 forbids the PURE layer
# from taking `kube`/`k8s-openapi`; it says nothing about this crate taking the
# pure layer, and `crates/weirkeeper` is outside the pure layer by ADR. Nor
# does it reach the signer: `logweir-core` declares no `logweir-evidence` edge,
# so `scripts/check-one-signer.sh`'s check 1 still computes {logweir, e2e}.
logweir-core = { path = "../logweir-core" }
# TASK 19 — THE READ-ONLY ARCHIVE HANDLE, AND NOTHING ELSE FROM THIS CRATE.
# `src/retention.rs` needs `Store`, `Store::read_only_from_url`,
# `Store::list_manifest_keys` and `Store::manifest_facts` (interface I12) to
# report what retention WOULD remove; `src/main.rs` builds the one handle at
# controller start (interface I13). Guard G-RET is that the handle this crate
# can construct is the read-only one: `scripts/check-no-archive-write.sh`
# refuses `Store::from_url` and every put/delete token anywhere under
# `crates/weirkeeper/src/`, so taking this edge does not take the ability to
# write.
#
# ADDS NO PACKAGE (Global Constraint 38): `logweir-store` is a workspace
# member already in the resolved graph, and a `path =` entry is outside
# `tests/linkage.rs::claimed_already_resolved`'s set, so the four-entry
# assertion there is untouched.
#
# NOR DOES IT REACH THE SIGNER. `logweir-store` declares `logweir-core`,
# `object_store`, `futures` and `tokio` and no `logweir-evidence` edge, so
# `scripts/check-one-signer.sh`'s check 1 still computes {logweir, e2e}.
logweir-store = { path = "../logweir-store" }
# TASK 16 — `StreamExt`, TO DRIVE A `kube::runtime::Controller` TO COMPLETION.
# `Controller::run` returns a `Stream`, not a `Future`, and `main.rs`'s
# registration point takes `Pin<Box<dyn Future<Output = ()> + Send>>`; there is
# no way to poll that stream without naming the `Stream`/`StreamExt` traits,
# and `kube` re-exports neither (`kube::runtime::WatchStreamExt` has `Stream`
# as a SUPERTRAIT, which does not bring it into scope).
#
# `workspace = true`, so the version stays the root manifest's single decision
# — and `futures = "0.3"` is already a `[workspace.dependencies]` entry, taken
# by `crates/logweir-store`, so this adds NO package (Global Constraint 38) and
# is outside `claimed_already_resolved`'s set for the same reason the five
# entries below are.
futures.workspace = true
# `main.rs` needs a runtime for the kube client and a SIGTERM handler.
# `signal` pulls `signal-hook-registry` and `mio`, both already in
# `Cargo.lock`, so it adds no package either. `io-util` is the loopback health
# listener's read/write (`health.rs`, chart gap G5): a feature of the same
# resolved crate, with no dependency of its own.
tokio = { workspace = true, features = ["signal", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `tests/linkage.rs` reads `cargo metadata`'s JSON, the same shape and for the
# same reason as `crates/logweir-verify/tests/deps.rs`. `serde_json` used to be
# declared HERE, with the reason "the library itself parses no JSON yet"; Task
# 15B moved it to `[dependencies]` above, because `kube-derive`'s expansion of
# the `printcolumn` attributes builds `serde_json::json!` literals in library
# code. Nothing is lost: a normal dependency is visible to `tests/` too, and
# the package was already in `Cargo.lock` either way.

[features]
default = []
