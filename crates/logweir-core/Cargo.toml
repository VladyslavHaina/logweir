[package]
name = "logweir-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
hex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
# ENCODER ONLY. Global Constraint 1 forbids a clock read in this crate, so
# `ids::format_run_id` uses `Ulid::from_parts` + `to_string` and NOTHING that
# reads `SystemTime` or the entropy pool — `Ulid::new()` reads both and lives
# in `crates/logweir/src/ids.rs`. `scripts/check-pure-core.sh` greps for it.
ulid = { version = "1", default-features = false }

[features]
default = []
