[package]
name = "logweir-engine-oso"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# `DateTime::from_timestamp_millis` (describe()'s manifest.created_at) and
# `Utc::now()` (restore()'s OWN start/finish timing — `restore` prints no
# report file, see engine.rs).
chrono.workspace = true
logweir-core = { path = "../logweir-core" }
byteorder = "1"
crc32fast = "1"
zstd = "0.13"
# Matches the WRITER exactly: upstream compresses with lz4_flex 0.13's
# `compress_prepend_size` [VERIFIED U/kafka-backup/Cargo.toml:37,
# U/kafka-backup/crates/kafka-backup-core/src/compression.rs:85-87]. A decoder
# must not float a major-equivalent range away from the encoder it reads.
lz4_flex = "0.13"
# `default-features = false` keeps the `client` feature off for THIS crate's own
# per-package build, so logweir-engine-oso never pulls rdkafka (a much heavier
# native dependency than libzstd) or needs rdkafka's C toolchain/library to
# build. `zstd` above DOES need a C compiler — it builds libzstd from C via
# `zstd-sys`/`cc` — so this crate is not C-toolchain-free overall; only the
# rdkafka half of that claim holds.
logweir-kafka = { path = "../logweir-kafka", default-features = false }
# The object-store half of this crate, extracted (ADR 0008 §E). The
# `pub use logweir_store as storage;` in lib.rs is what keeps
# `logweir_engine_oso::storage::…` resolving for every existing caller.
#
# `object_store`, `futures`, `tokio` and `thiserror` left with it: after
# the move no file in this crate names any of the four (the only
# remaining `object_store` occurrence is the prose comment at
# engine.rs:130). They are declared by `logweir-store` instead.
logweir-store = { path = "../logweir-store" }

[dev-dependencies]
insta.workspace = true

[features]
default = []
e2e = []
