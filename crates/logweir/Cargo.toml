[package]
name = "logweir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "logweir"
path = "src/lib.rs"

[[bin]]
name = "logweir"
path = "src/main.rs"

# Task 5b. `logweir-kafka`, `logweir-engine-oso` and `e2e` already carried an
# `e2e` feature; this crate did not, so the two tests here that can only get
# their answer from a live dependency had nowhere to go but the default suite,
# where they cost 33 s of every run. `default = []` is explicit so
# `--no-default-features` means the same thing here as in the pure layer.
[features]
default = []
e2e = []

[dependencies]
base64.workspace = true
chrono.workspace = true
clap.workspace = true
logweir-core = { path = "../logweir-core" }
logweir-engine-oso = { path = "../logweir-engine-oso" }
logweir-evidence = { path = "../logweir-evidence" }
logweir-kafka = { path = "../logweir-kafka" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Global Constraint 1: the ULID clock/entropy read lives in THIS crate
# (`src/ids.rs`), never in `logweir-core`, which keeps only the pure encoder.
ulid.workspace = true
ureq.workspace = true

[dev-dependencies]
insta.workspace = true
logweir-engine-oso = { path = "../logweir-engine-oso" }
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
serde_json.workspace = true
tempfile = "3"
