# A kubeconfig whose current context is NOT docker-desktop. Task 28 fixture.
#
# `laptop_demo_refuses_a_wrong_context` exports `KUBECONFIG` at this file while
# running `scripts/laptop-demo.sh` against `fixtures/stub-kubectl`. The stub
# never reads it — it answers `config current-context` from its own argument
# scan — but the variable is set anyway, so the test states the situation it is
# about (an operator on a kind cluster) rather than relying on whatever
# kubeconfig the machine running `cargo test` happens to have.
#
# THE SERVER IS UNROUTABLE ON PURPOSE. `https://127.0.0.1:1` is the reserved
# port 1: nothing in this repository or on a developer machine listens there,
# so if a future edit ever let a REAL `kubectl` see this file, it would fail
# fast on connection refused rather than hang on a timeout — and Global
# Constraint 22 still forbids a default-suite test from dialling at all, which
# is why the stub exists.
apiVersion: v1
kind: Config
preferences: {}
current-context: kind-x
clusters:
  - name: kind-x
    cluster:
      server: https://127.0.0.1:1
      insecure-skip-tls-verify: true
contexts:
  - name: kind-x
    context:
      cluster: kind-x
      user: kind-x
      namespace: default
users:
  - name: kind-x
    user: {}
