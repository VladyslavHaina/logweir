[licenses]
# CDLA-Permissive-2.0 added by Task 12b: `webpki-root-certs` (pulled in via
# object_store 0.14's aws+azure+gcp+http tree — reqwest ->
# rustls-platform-verifier -> webpki-root-certs) is licensed under it and
# nothing narrower is available upstream.
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Global Constraint 2: the OSO library must never enter the workspace graph.
deny = [{ name = "kafka-backup-core" }]

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = [
  # serde_yaml 0.9 resolves to 0.9.34+deprecated, which is archived
  # (RUSTSEC-2024-0370). Kept for v0.1: the drill spec and both rendered engine
  # documents are YAML and no alternative was evaluated. Revisit before v0.2 —
  # the same sentence appears in docs/stability.md's non-contracts section.
  { id = "RUSTSEC-2024-0370", reason = "tracked; see docs/stability.md" },
]
