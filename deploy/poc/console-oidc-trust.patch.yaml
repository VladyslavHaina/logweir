# deploy/poc/console-oidc-trust.patch.yaml — the PoC's stand-in for two values
# the Logweir chart does not have yet (README.md, "Chart gaps" G1 and G2).
#
# The console must reach Dex at the issuer URL the browser uses,
# https://dex.localtest.me, and must trust the certificate the local CA issued
# for it. Inside the cluster `dex.localtest.me` resolves to 127.0.0.1 (the pod
# itself), and the console's system trust store does not hold the local CA. So
# this patch, applied after every `helm upgrade` (README.md step 6):
#   * maps dex.localtest.me to the ingress controller Service's ClusterIP
#     (INGRESS_SVC_IP, substituted by the README's command), and
#   * mounts the local CA's PUBLIC certificate (ConfigMap `logweir-poc-ca`) and
#     points SSL_CERT_FILE at it — `logweir-api`'s OIDC client reads the system
#     roots through rustls-native-certs, which honours SSL_CERT_FILE.
# A production install with a publicly trusted issuer needs neither half.
spec:
  template:
    spec:
      hostAliases:
        - ip: INGRESS_SVC_IP
          hostnames: [dex.localtest.me]
      containers:
        - name: api
          env:
            - name: SSL_CERT_FILE
              value: /etc/logweir/poc-ca/ca.crt
          volumeMounts:
            - name: poc-ca
              mountPath: /etc/logweir/poc-ca
              readOnly: true
      volumes:
        - name: poc-ca
          configMap:
            name: logweir-poc-ca
