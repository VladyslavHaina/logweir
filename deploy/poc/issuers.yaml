# deploy/poc/issuers.yaml — the PoC's local certificate authority.
#
#   kubectl --context docker-desktop apply -f deploy/poc/issuers.yaml
#
# A self-signed bootstrap issuer signs one CA certificate (its key stays in the
# cert-manager namespace), and the `logweir-poc-ca` ClusterIssuer signs every
# Ingress certificate with it. Export the CA certificate to trust it in your
# browser and to hand it to the console (README.md, step 5).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: logweir-poc-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: logweir-poc-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Logweir PoC local CA
  secretName: logweir-poc-ca
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: logweir-poc-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: logweir-poc-ca
spec:
  ca:
    secretName: logweir-poc-ca
---
# DEX'S BACK-CHANNEL PKI — ITS OWN, AND USABLE IN NAMESPACE `dex` ONLY.
#
# The console verifies Dex's back-channel certificate against a bundle that
# holds THIS CA and nothing else (logweir.values.yaml: `oidc.caBundle` names it,
# `systemRoots: false`). It is not the `logweir-poc-ca` ClusterIssuer: every
# namespace can request a certificate from a ClusterIssuer (cert-manager's
# aggregated `edit` role grants `certificates`), so a bundle holding that CA
# would accept a `dex.localtest.me` certificate minted by any namespace editor —
# which, with an on-path position (a Service `externalIPs` claim on Dex's
# address, CVE-2020-8554, or Dex's ClusterIP taken while its Service is absent),
# is a forged IdP holding the console's client secret. A namespaced `Issuer`
# can be referenced only from its own namespace. The browser path through
# Traefik keeps the cluster-wide local CA; that is a separate trust.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dex-backchannel-selfsigned
  namespace: dex
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dex-backchannel-ca
  namespace: dex
spec:
  isCA: true
  commonName: Logweir PoC Dex back-channel CA
  secretName: dex-backchannel-ca
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: dex-backchannel-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dex-backchannel
  namespace: dex
spec:
  ca:
    secretName: dex-backchannel-ca
---
# Dex's OWN serving certificate for the console's back-channel (dex.values.yaml
# `web.https`), issued by the namespaced `dex-backchannel` Issuer above. The
# `dex` namespace must exist first (README.md step 1).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dex-internal-tls
  namespace: dex
spec:
  secretName: dex-internal-tls
  dnsNames: [dex.localtest.me]
  duration: 2160h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: dex-backchannel
