# deploy/poc/issuers.yaml — the PoC's local certificate authority.
#
#   kubectl --context docker-desktop apply -f deploy/poc/issuers.yaml
#
# A self-signed bootstrap issuer signs one CA certificate (its key stays in the
# cert-manager namespace), and the `logweir-poc-ca` ClusterIssuer signs every
# Ingress certificate with it. Export the CA certificate to trust it in your
# browser and to hand it to the console (README.md, step 5).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: logweir-poc-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: logweir-poc-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Logweir PoC local CA
  secretName: logweir-poc-ca
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: logweir-poc-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: logweir-poc-ca
spec:
  ca:
    secretName: logweir-poc-ca
---
# Dex's OWN serving certificate, for the console's back-channel (dex.values.yaml
# `web.https`): the console reaches Dex's Service directly and Dex terminates
# that TLS itself, so no Ingress is on the console's path to its IdP. Issued by
# the same local CA the console's `oidc.caBundle` carries. The `dex` namespace
# must exist first (README.md step 1).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dex-internal-tls
  namespace: dex
spec:
  secretName: dex-internal-tls
  dnsNames: [dex.localtest.me]
  duration: 2160h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: logweir-poc-ca
