# deploy/poc/minio-grants.yaml — least-privilege MinIO users per WORKSPACE, so
# the demo MinIO's ROOT credential is never handed to Logweir and no
# workspace's credential reaches another workspace's archive.
#
#   kubectl --context "$CTX" apply -f deploy/poc/minio-grants.yaml
#   kubectl --context "$CTX" -n logweir wait --for=condition=complete \
#     job/logweir-poc-minio-grants --timeout=180s
#
# THE PoC REVIEW'S L7. The chart's demo MinIO takes its root credential from
# chart values (`minio.rootUser`/`minio.rootPassword`, the public default
# `minioadmin`), so that one credential IS in a rendered Secret and in Helm's
# release history — the profile's single exception to "nothing secret in a
# values file", and one reason the demo MinIO is not production. It can also
# delete. So it stays inside this Job: the Job reads it from the chart's own
# `logweir-minio-root` Secret (no workspace label: no Logweir object may name
# it), and the console is given only the per-workspace users below. None of
# them holds `s3:DeleteObject`.
#
# THE BUCKET CREDENTIAL IS THE BOUNDARY BETWEEN WORKSPACES (PROD-19.1 open
# point 2). Each workspace gets its own bucket `poc-<ws>` (archive prefix
# `poc`), because a destination's evidence root is the fixed `logweir/` of its
# own bucket (`logweir/backups/<id>/…`, `logweir/drills/<run>…`): a bucket per
# workspace is the only layout that also keeps evidence apart. `poc-stg` also
# holds `legacy/`, where an earlier install's archive is mirrored for import
# (README.md, *Import an earlier install's archive*).
#
#   user                        grant(s) of that workspace's destination
#   logweir-poc-<ws>-writer     archiveWrite (+ evidenceWrite)
#   logweir-poc-<ws>-reader     archiveRead (and catalog sync)
#   logweir-poc-<ws>-evidence   evidenceRead
#   logweir-poc-evidence        the CONTROLLER's `logweir-evidence-ro`: reads
#                               kafka-backups/logweir/* (runs with no saved
#                               destination) and no workspace bucket
#
# The secret keys come from the Secret `logweir-poc-minio-users` (README.md
# step 5), keys `<ws>-writer`, `<ws>-reader`, `<ws>-evidence` and `evidence`,
# generated on your machine; nothing secret is in this file. That Secret is
# read by this Job alone and carries no workspace label.
apiVersion: batch/v1
kind: Job
metadata:
  name: logweir-poc-minio-grants
  namespace: logweir
  labels:
    app.kubernetes.io/part-of: logweir-poc
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: logweir-poc
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mc
          # The chart's own `minio.mcImage` digest (charts/logweir/values.yaml).
          image: docker.io/vladyslavhaina/mc-mirror@sha256:9c7cbc3f47b092d52b73124fb9ab12f3266534c23c283b2e984d07408c9ff381
          imagePullPolicy: IfNotPresent
          env:
            - { name: MC_CONFIG_DIR, value: /tmp/.mc }
            - name: ROOT_USER
              valueFrom: { secretKeyRef: { name: logweir-minio-root, key: MINIO_ROOT_USER } }
            - name: ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: logweir-minio-root, key: MINIO_ROOT_PASSWORD } }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mc alias set poc http://logweir-minio.logweir.svc:9000 "$ROOT_USER" "$ROOT_PASSWORD" >/dev/null
              add_user() { # user policy secret-file
                mc admin policy create poc "$2" "/tmp/$2.json"
                mc admin user add poc "$1" "$(cat "/users/$3")"
                # Attaching twice is refused by MinIO; a re-run is a no-op here.
                mc admin policy attach poc "$2" --user "$1" || true
                mc admin user info poc "$1"
              }
              for ws in dev tst stg prd; do
                b="poc-$ws"
                mc mb --ignore-existing "poc/$b"
                printf '%s' "{\"Version\":\"2012-10-17\",\"Statement\":[
                  {\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$b\"],
                   \"Condition\":{\"StringLike\":{\"s3:prefix\":[\"poc/*\"]}}},
                  {\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\"],\"Resource\":[\"arn:aws:s3:::$b/poc/*\"]},
                  {\"Effect\":\"Allow\",\"Action\":[\"s3:PutObject\"],\"Resource\":[\"arn:aws:s3:::$b/logweir/*\"]}]}" \
                  > "/tmp/logweir-poc-$ws-archive-write.json"
                printf '%s' "{\"Version\":\"2012-10-17\",\"Statement\":[
                  {\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$b\"],
                   \"Condition\":{\"StringLike\":{\"s3:prefix\":[\"poc/*\",\"logweir/*\",\"legacy/*\"]}}},
                  {\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\"],
                   \"Resource\":[\"arn:aws:s3:::$b/poc/*\",\"arn:aws:s3:::$b/logweir/*\",\"arn:aws:s3:::$b/legacy/*\"]}]}" \
                  > "/tmp/logweir-poc-$ws-archive-read.json"
                printf '%s' "{\"Version\":\"2012-10-17\",\"Statement\":[
                  {\"Effect\":\"Allow\",\"Action\":[\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$b\"],
                   \"Condition\":{\"StringLike\":{\"s3:prefix\":[\"logweir/*\"]}}},
                  {\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$b/logweir/*\"]}]}" \
                  > "/tmp/logweir-poc-$ws-evidence-read.json"
                add_user "logweir-poc-$ws-writer" "logweir-poc-$ws-archive-write" "$ws-writer"
                add_user "logweir-poc-$ws-reader" "logweir-poc-$ws-archive-read" "$ws-reader"
                add_user "logweir-poc-$ws-evidence" "logweir-poc-$ws-evidence-read" "$ws-evidence"
              done
              printf '%s' '{"Version":"2012-10-17","Statement":[
                {"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::kafka-backups"],
                 "Condition":{"StringLike":{"s3:prefix":["logweir/*"]}}},
                {"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::kafka-backups/logweir/*"]}]}' \
                > /tmp/logweir-poc-evidence-read.json
              add_user logweir-poc-evidence logweir-poc-evidence-read evidence
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: users, mountPath: /users, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: users
          secret: { secretName: logweir-poc-minio-users }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
