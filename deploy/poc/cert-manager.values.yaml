# deploy/poc/cert-manager.values.yaml — certificates for the two Ingresses,
# issued by a local CA (issuers.yaml). Chart cert-manager v1.21.2; its images
# are pinned by digest below (resolved from quay.io/jetstack on 2026-09-23).
#
#   helm upgrade --install cert-manager cert-manager \
#     --repo https://charts.jetstack.io --version v1.21.2 \
#     -n cert-manager --create-namespace -f deploy/poc/cert-manager.values.yaml --wait
#
# PoC vs production: the local CA stands in for your organisation's CA or ACME
# issuer; everything that consumes a certificate (the two Ingresses, the
# console's trust of Dex) is unchanged when the issuer changes.
crds:
  enabled: true                  # installed and kept by the chart (crds.keep)
  keep: true
replicaCount: 1
podDisruptionBudget:
  enabled: false                 # one replica on one node; enable with >= 2
image:
  digest: sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
resources:
  requests: { cpu: 10m, memory: 64Mi }
  limits: { memory: 256Mi }
webhook:
  image:
    digest: sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
cainjector:
  image:
    digest: sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
startupapicheck:
  image:
    digest: sha256:46e75b6866359ffb5d82624f41e3ed1c70b2994982702ced547ce5edb418a8f5
acmesolver:
  image:
    digest: sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503
prometheus:
  enabled: false
