# deploy/poc/logweir.values.yaml — Logweir, the shared (SSO) console, for the
# PoC profile. README.md step 6 has the exact command; in short:
#
#   helm upgrade --install logweir "$LOGWEIR_CHART" --version "$LOGWEIR_CHART_VERSION" \
#     -n logweir-system -f deploy/poc/logweir.values.yaml --wait --timeout 15m
#
# THE IMAGES ARE NOT IN THIS FILE. The published chart (versions.env's
# LOGWEIR_CHART at LOGWEIR_CHART_VERSION) already names the four Logweir images
# of its own commit by their `sha-<commit>` tag (a tag, which Docker Hub lets
# the publisher move; the digests are recorded per publication — README.md); the development path from a
# checkout passes the same four with `--set` from versions.env (README.md,
# *From a checkout*). One file, versions.env, decides the release.
#
# NOTHING IN THIS FILE IS A CLUSTER'S RUNTIME ADDRESS, AND NOTHING IS PATCHED
# AFTER THE INSTALL. The ingress controller is trusted by its Service
# (`trustedProxyService`), the issuer's name is mapped to DEX'S OWN Service's
# fixed ClusterIP (`hostAliases`, dex.values.yaml) — never to the shared
# ingress — the private CA arrives by reference (`oidc.caBundle`), and the
# console's egress to Dex is a pod selector (`networkPolicy.oidcPeers`).
#
# NOTHING SECRET IS IN THIS FILE: every key and the OIDC client secret are named
# Secrets created before the install (README.md, step 5). The ONE exception in
# this profile is the demo MinIO's root credential — README.md, *The demo
# archive*.

imagePullPolicy: IfNotPresent    # `sha-<commit>` tags; Docker Hub tags CAN be moved — see README.md
runnerImagePullPolicy: IfNotPresent

environment: poc

# ---------------------------------------------------- where backups execute
# `logweir-poc` is the one execution namespace. It must exist before the
# install (the chart copies the signing identity and the runner account into
# it). The controller is scoped to it (D0 stage 5): it cannot create Jobs in
# logweir-system, where the console's keys live.
kubernetes:
  namespace: logweir-poc
  connectionsNamespace: logweir-poc   # G3: the demo archive credential lands where Backups run
identity:
  authorizedRunnerNamespaces: [logweir-poc]
controller:
  watchNamespaces: [logweir-poc]
retention:
  enabled: true                  # the account an Enforce policy would need; deletes nothing by itself

# The console's `create secrets` is fenced to Logweir-shaped Secrets
# (Kubernetes >= 1.30; docker-desktop ships 1.34).
admissionPolicy:
  enabled: true
  consoleServiceAccountName: logweir-api

# -------------------------------------------------------- the shared console
api:
  enabled: true
  namespaces: [logweir-poc]
  console:
    enabled: true
    imagePullPolicy: IfNotPresent
    mode: shared
    replicas: 2                  # >= 2 renders the PodDisruptionBudget
    keySecret: logweir-console-keys
    keyVersion: 1
    publicBaseUrl: https://logweir.localtest.me
    sessionMaxAgeSeconds: 900
    # G6: the Traefik Service's SERVING pods are the one trusted proxy,
    # re-read every five seconds — a recreated Traefik pod is trusted on its
    # new address with nothing re-run. The chart grants the console `list
    # endpointslices` in namespace `traefik` and nowhere else.
    trustedProxyService: { namespace: traefik, name: traefik }
    requireTrustedProxy: true
    # G2: inside the cluster `dex.localtest.me` resolves to 127.0.0.1 (the pod
    # itself). This maps it to DEX'S OWN Service (its fixed ClusterIP,
    # dex.values.yaml), where Dex terminates TLS itself with a certificate for
    # that name. It is deliberately NOT the ingress controller: a shared
    # ingress routes Ingresses from other namespaces too, and one of them could
    # then answer the console's discovery, JWKS and token requests behind
    # Dex's real certificate (the review's M1). The console's back-channel
    # reaches only pods of Service `dex/dex`; browsers still use Traefik.
    hostAliases:
      - ip: 10.96.0.81
        hostnames: [dex.localtest.me]
    oidc:
      issuer: https://dex.localtest.me     # EXACT: Dex's `issuer`, no trailing slash
      clientId: logweir-console
      clientSecret: logweir-console-oidc   # the NAME of a Secret with key `clientSecret`
      # G1: the local CA's PUBLIC certificate (README.md step 5), added to the
      # system roots. Never inline PEM.
      caBundle: { configMap: logweir-poc-ca, key: ca.crt }
    roles:
      revision: "poc-2026-09-23.2"
      # One Dex user per role, bound by subject (`<issuer>#<sub>`; dex.values.yaml
      # says why). The `groups` entries are what a real connector's groups bind
      # to; they match nobody under Dex's static users.
      bindings:
        - role: viewer
          namespace: logweir-poc
          groups: ["logweir-poc-viewers"]
          subjects: ["https://dex.localtest.me#CiQxZjBjOWE0ZS0wMDAxLTRhMWUtOWUxYS0wMDAwMDAwMDAwMDESBWxvY2Fs"]
        - role: operator
          namespace: logweir-poc
          groups: ["logweir-poc-operators"]
          subjects: ["https://dex.localtest.me#CiQxZjBjOWE0ZS0wMDAyLTRhMWUtOWUxYS0wMDAwMDAwMDAwMDISBWxvY2Fs"]
        - role: approver
          namespace: logweir-poc
          groups: ["logweir-poc-approvers"]
          subjects: ["https://dex.localtest.me#CiQxZjBjOWE0ZS0wMDAzLTRhMWUtOWUxYS0wMDAwMDAwMDAwMDMSBWxvY2Fs"]
        - role: administrator
          namespace: logweir-poc
          groups: ["logweir-poc-admins"]
          subjects: ["https://dex.localtest.me#CiQxZjBjOWE0ZS0wMDA0LTRhMWUtOWUxYS0wMDAwMDAwMDAwMDQSBWxvY2Fs"]
    ingress:
      enabled: true
      className: traefik
      host: logweir.localtest.me
      tlsSecretName: logweir-console-tls
      annotations:
        cert-manager.io/cluster-issuer: logweir-poc-ca
        # HSTS is Traefik's `websecure` entry point's (traefik.values.yaml).
    networkPolicy:
      enabled: true              # rendered; docker-desktop does NOT enforce NetworkPolicy
      ingressNamespace: traefik
      ingressPodLabels:
        app.kubernetes.io/name: traefik
      # The console reaches Dex's own pods (not Traefik). An enforcing CNI
      # matches egress after the Service's DNAT — against the Dex pod, on its
      # HTTPS container port 5554 — so the rule names the pods, not the
      # ClusterIP (the PLAT-20.2 review's L8).
      oidcPeers:
        - namespace: dex
          podLabels: { app.kubernetes.io/name: dex }
          port: 5554
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 256Mi }

# -------------------------------------------------------- approval policy
# `logweir-poc` restores are authorised by the console's own confirmation of
# the signed-in requester (Ordinary). The confirmation key is a Secret created
# before the install, and its PUBLIC half goes on the TrustPolicy that governs
# logweir-poc (README.md, step 7).
approvalPolicy:
  allowOrdinaryConfirmation: true
  policies:
    - name: poc-ordinary
      mode: Ordinary
      maxAgeSeconds: 900
  namespaces:
    logweir-poc: poc-ordinary
  confirmationKeySecret: logweir-console-confirmation

# ------------------------------------------- something to back up (demo only)
# Two throwaway KRaft brokers and a MinIO archive, in logweir-system. They are
# reached from logweir-poc by Service name; the connection, destination and
# credentials are created in logweir-poc through the console (README.md,
# step 9). Remove both for a real installation.
demoKafka:
  enabled: true
minio:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
