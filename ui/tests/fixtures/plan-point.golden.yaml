# The restore plan document. Its grammar is the runner's restore document:
# logweir_core::spec::RestoreSpec, stated once in docs/mvp/03-spec.md section 6.1,
# "The restore plan document has ONE grammar, and it is the runner's
# restore.yaml (amendment 4)". These bytes are what Restore.spec.planBytes
# carries, what the controller writes into the runner's plan ConfigMap verbatim,
# and what logweir restore run --spec parses. Rendered by the Logweir UI; the
# sha256 of exactly these bytes is the plan hash an approval binds.
name: "orders-disaster-restore"
source:
  storage:
    backend: "s3"
    bucket: "kafka-backups"
    prefix: "drill-demo"
    region: "us-east-1"
    endpoint: "http://localhost:9000"
    path_style: true
    allow_http: true
  backup: "3f1c9d2e-8a7b-4c6d-9e0f-1a2b3c4d5e6f-20260907-140000"
  topics:
    - "orders"
    - "payments"
  point:
    point_id: "lwp1-0123456789abcdef0123456789abcdef"
    receipt_key: "logweir/backups/3f1c9d2e-8a7b-4c6d-9e0f-1a2b3c4d5e6f-20260907-140000/01JB7Z00000000000000000000.receipt.json"
    receipt_sha256: "sha256:0123456789abcdef0123456789abcdeffedcba9876543210fedcba9876543210"
    manifest_sha256: "sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
target:
  bootstrap_servers:
    - "localhost:9092"
  mode: "newTopic"
  topic_naming:
    prefix: "restore-20260907T140500Z-"
  topic_mapping_prefix: "restore-20260907T140500Z-"
  marker_topic: "logweir.scratch"
  default_replication_factor: 1
  teardown: "delete"
restore:
  point_in_time: "2026-09-07T14:05:00Z"
sample:
  window_start: "2026-09-07T12:00:00Z"
  window_end: "2026-09-07T15:00:00Z"
  records_per_partition: 25
  anchor: "head"
objectives:
  rto_seconds: 900
  rpo_seconds: 300
  pass_rate: 1.0
evidence:
  backend: "s3"
  bucket: "logweir-evidence"
  prefix: "logweir/"
  region: "us-east-1"
  endpoint: "http://localhost:9000"
  path_style: true
  allow_http: true
notifications:
  webhooks: []
