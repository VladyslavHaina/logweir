# Adapted from osodevops/kafka-backup-demos/docker-compose.yml (MIT).
# Kept: kafka-broker-1 (KRaft, no ZooKeeper), minio, minio-setup, kafka-backup.
# Removed: the demo topic zoo, the monitoring profile, the whole enterprise
# profile (schema registry, Apicurio, the EE image) — none of it is in scope.
#
# An explicit project name: without it compose derives one from this file's
# parent directory, i.e. the project would be called `compose`, which collides
# with every other repo on the machine that keeps its stack in a `compose/`
# directory. `just e2e-down`'s `down -v` deletes volumes by project, so a
# generic name is also a footgun.
name: logweir-e2e

networks:
  kafka-net: { driver: bridge }
volumes:
  minio-data:

services:
  kafka-broker-1:
    image: apache/kafka:${KAFKA_VERSION:-3.7.1}
    hostname: kafka-broker-1
    restart: always
    networks: [kafka-net]
    # THREE published ports, and each one is published for a client that
    # cannot reach the broker any other way (Task 7, spec §10):
    #   9092  EXTERNAL — the host-side harness (`harness::BOOTSTRAP`).
    #   9095  K8S      — a POD on docker-desktop Kubernetes. `EXTERNAL` is
    #                    useless there: the broker's metadata redirects every
    #                    client to `localhost:9092`, which inside a pod is the
    #                    pod's own loopback.
    #   9097  SASLEXT  — the host-side SCRAM client. `SASL://kafka-broker-1:9096`
    #                    is advertised for in-network clients and its name does
    #                    not resolve on the host, so the ONE SASL listener is
    #                    advertised twice rather than once.
    # 9096 is deliberately NOT published: it is the in-network advertisement of
    # the same SCRAM credential store, reached over `kafka-net`.
    ports: ["9092:9092", "9095:9095", "9097:9097"]
    environment:
      KAFKA_NODE_ID: 1001
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka-broker-1:9094,EXTERNAL://kafka-broker-1:9092,CONTROLLER://kafka-broker-1:9093,SASL://kafka-broker-1:9096,SASLEXT://kafka-broker-1:9097,K8S://kafka-broker-1:9095
      # `K8S` is the one advertised name a CI runner has to change, and it is
      # therefore a PARAMETER and not a literal: `kind` on a Linux GitHub
      # runner has no `host.docker.internal` inside a node, and STANDING
      # RULE 15 makes Task 7 the only editor of this file — so the override
      # has to exist here or a later task has to break that rule to get one.
      # The default is the docker-desktop name every local gate uses.
      # Documented in `docs/kubernetes.md`, "Task 7 — the five-listener stack".
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:9094,EXTERNAL://localhost:9092,SASL://kafka-broker-1:9096,SASLEXT://localhost:9097,K8S://${LOGWEIR_K8S_ADVERTISED_HOST:-host.docker.internal}:9095
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,SASL:SASL_PLAINTEXT,SASLEXT:SASL_PLAINTEXT,K8S:PLAINTEXT
      # SCRAM-SHA-512 and nothing else: `sasl_mechanism: "SCRAM-SHA512"` is the
      # engine's spelling of the same mechanism and `SCRAM-SHA-512` is
      # librdkafka's; both authenticate against this one enabled mechanism.
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      # THE LISTENER-SCOPED JAAS VARIABLE, and its spelling was MEASURED, not
      # read. `kafka.docker.KafkaDockerWrapper` strips `KAFKA_`, lowercases,
      # and then maps `___` -> `-`, `__` -> `_`, `_` -> `.`, so these two
      # variables become, in /opt/kafka/config/server.properties:
      #
      #   listener.name.sasl.scram-sha-512.sasl.jaas.config=…
      #   listener.name.saslext.scram-sha-512.sasl.jaas.config=…
      #
      # read back with `docker compose exec kafka-broker-1 cat
      # /opt/kafka/config/server.properties` — the transcript is in
      # `docs/kubernetes.md`, and it is what closed spec §15's sixth
      # `[UNVERIFIED]` mark.
      #
      # No username/password in the module options: on a listener the broker
      # SERVES, `ScramLoginModule` validates against the broker's own
      # credential store (the one `scram-setup` writes). Inter-broker traffic
      # is PLAINTEXT here, so the broker is never its own SASL client.
      KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LISTENER_NAME_SASLEXT_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1001@kafka-broker-1:9093
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      # MUST carry the KAFKA_ prefix: the apache/kafka entrypoint translates only
      # KAFKA_*-prefixed variables into server.properties, so the unprefixed form
      # is silently ignored and auto-creation stays at its default `true` —
      # which would let `a_restore_into_an_empty_scratch_target_succeeds` pass
      # without `create_topics: true` ever being honoured.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    # A `Running` broker that is not yet serving is the false-pass this project
    # keeps hitting, so health is proved by an actual client round trip on the
    # INTERNAL listener — the one every in-network client uses — rather than by
    # a port probe or a `sleep`. `--list` opens a real Kafka connection and
    # fetches metadata; it fails while the KRaft quorum is still forming.
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka-broker-1:9094", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the SOURCE topics, the MARKER topic and the READER-FIXTURE topic.
  # The marker topic is the v0.1 segregation proof: without it, phase 0 refuses
  # with exit 3.
  topic-setup:
    image: ${KAFKA_CLI_IMAGE:-confluentinc/cp-kafka:7.6.0}
    networks: [kafka-net]
    # The brief's `sleep 10` is a guess about broker startup; the healthcheck
    # above is a measurement of it. Waiting on `service_healthy` is why this
    # command no longer opens with a sleep.
    depends_on:
      kafka-broker-1: { condition: service_healthy }
    restart: on-failure
    profiles: [setup]
    command: >
      bash -c '
      kafka-topics --create --if-not-exists --bootstrap-server kafka-broker-1:9094 --partitions 3 --replication-factor 1 --topic orders &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka-broker-1:9094 --partitions 3 --replication-factor 1 --topic payments &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka-broker-1:9094 --partitions 1 --replication-factor 1 --topic logweir.scratch &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka-broker-1:9094 --partitions 3 --replication-factor 1 --topic test-topic &&
      echo READY'

  # Creates the ONE SCRAM credential the SASL listeners authenticate against.
  #
  # IT MUST HAVE EXITED 0 BEFORE ANY SASL CLIENT AUTHENTICATES. In KRaft there
  # is no ZooKeeper to pre-seed and no `--zookeeper` path: the SCRAM credential
  # is a user config record in the metadata log, so it has to be written by a
  # client after the quorum is serving. `just e2e-up` runs this as a third
  # FOREGROUND step whose exit code `just` checks, after `minio-setup` and
  # `topic-setup`.
  #
  # OVER THE EXISTING PLAINTEXT LISTENER (`kafka-broker-1:9094`), and that is
  # not a convenience. The credential this step creates is the credential a
  # client would need to reach `SASL://kafka-broker-1:9096` — so bootstrapping
  # this over a SASL listener is a circular dependency, and it fails, which is
  # exactly what Task 7's third mutant asserts.
  #
  # `--alter --add-config` is idempotent: a second run overwrites the same
  # credential with the same value and still exits 0, so `just e2e-up` on a
  # stack that is already up is not a failure.
  #
  # THE PASSWORD IS A FIXTURE CONSTANT AND NOT KEY MATERIAL. It is the same
  # literal in `e2e/tests/harness/mod.rs::SCRAM_PASSWORD` and in
  # `e2e/compose/config/backup-scram.yaml`'s `${LOGWEIR_SOURCE_PASSWORD}`
  # expansion; it authenticates to one throwaway broker on one developer
  # machine and to nothing else. No SIGNING key ever appears in this tree.
  #
  # The broker's OWN image, so the binary is `kafka-configs.sh` verbatim as
  # spec §10 writes it; `/opt/kafka/bin` is not on that image's PATH, so the
  # path is absolute for the same reason the healthcheck above spells out
  # `/opt/kafka/bin/kafka-topics.sh`. `entrypoint:` is overridden because the
  # image's own entrypoint is the broker's `run` script, and the argv is a LIST
  # so no shell stands between `kafka-configs.sh` and its exit code.
  scram-setup:
    image: apache/kafka:${KAFKA_VERSION:-3.7.1}
    networks: [kafka-net]
    depends_on:
      kafka-broker-1: { condition: service_healthy }
    profiles: [setup]
    entrypoint: ["/opt/kafka/bin/kafka-configs.sh"]
    command:
      - "--bootstrap-server"
      - "kafka-broker-1:9094"
      - "--alter"
      - "--add-config"
      - "SCRAM-SHA-512=[password=logweir-e2e-not-a-secret]"
      - "--entity-type"
      - "users"
      - "--entity-name"
      - "logweir"

  minio:
    # THE PROJECT'S OWN REBUILD, PINNED BY DIGEST. This stack first pinned the
    # upstream image at quay.io (2026-09-12: Docker Hub refused anonymous pulls
    # of the upstream name). MinIO then withdrew its public images altogether —
    # Docker Hub on 2026-09-11, anonymous quay.io pulls on 2026-09-24 — and CI's
    # `just e2e-up` failed at this pull. The image below is the SAME release,
    # RELEASE.2025-09-07T16-13-09Z, rebuilt from upstream source for amd64 and
    # arm64 under the project's Docker Hub namespace: third_party/minio-mirror/
    # README.md carries the recipe, the provenance, the licence (AGPL-3.0), the
    # publication status and the smoke that shows it behaves as the upstream
    # image did. A stopgap until MinIO is
    # replaced by a maintained S3 server. Pinned by digest so that the stack is
    # the same stack on every host.
    image: docker.io/vladyslavhaina/minio-mirror@sha256:a707398148b545774fc98264d16e76307f1b3727f77b1cc49c67ccde8998709d
    hostname: minio
    networks: [kafka-net]
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes: [minio-data:/data]
    # MinIO's own readiness probe, the same one its Kubernetes chart uses
    # (httpGet /minio/health/ready on 9000). `mc ready local` is the documented
    # in-image equivalent and needs no curl (which the image does carry).
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-setup:
    # Same mirror and same reason as `minio` above: mc RELEASE.2025-08-13T08-35-41Z,
    # rebuilt from upstream source, byte-identical to upstream's signed binary.
    image: docker.io/vladyslavhaina/mc-mirror@sha256:4824f9b00fd4ca9e3b7d61f66211450cd5d63f5f99d3170654af49568869b77b
    networks: [kafka-net]
    # Same reason as topic-setup: `sleep 5` replaced by MinIO's readiness probe.
    depends_on:
      minio: { condition: service_healthy }
    restart: on-failure
    # Behind a profile for the same reason topic-setup is: it is a one-shot that
    # exits, and `docker compose up -d --wait` fails (exit 1) the moment any
    # container it is waiting on exits, even with status 0. Profiling it keeps
    # the default `up --wait` set to exactly the two long-running services, so
    # `just e2e-up`'s first line means "both servers are actually serving".
    # `docker compose run <svc>` auto-enables the target service's own profiles,
    # so the smoke test and scripts/e2e-seed.sh still reach it with no flag.
    profiles: [setup]
    environment:
      # `docker compose run --rm ... minio-setup` starts a FRESH container every
      # time, and `mc` keeps aliases in the container's own ~/.mc/config.json —
      # so an alias created by one `run` is gone by the next. Both the smoke
      # test and scripts/e2e-seed.sh do exactly that, and would otherwise fail
      # with "Unable to find alias". MC_HOST_<alias> defines the alias from the
      # environment instead, so every container of this service has it.
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: >
      /bin/sh -c "
      mc mb local/kafka-backups --ignore-existing;
      mc mb local/logweir-evidence --ignore-existing;
      echo 'buckets ready';
      "

  # The engine, PINNED BY DIGEST — never by tag (Global Constraint 7).
  # Global Constraint 14 forbids Logweir from PUBLISHING its own artifacts under
  # `osodevops/`; pulling upstream's published image to extract the pinned engine
  # binary is required by Global Constraints 7, 8, 10 and 15 and is not a
  # violation (controller ruling GR6).
  kafka-backup:
    image: osodevops/kafka-backup@${OSO_DIGEST}
    # Upstream publishes linux/amd64 ONLY — no arm64 manifest exists for any
    # tag. Without this the daemon asks for its own default platform and fails
    # with "no matching manifest for linux/arm64/v8". It is a no-op on an
    # amd64 host, so the pin is safe everywhere and required on Apple Silicon.
    platform: linux/amd64
    networks: [kafka-net]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      RUST_LOG: info
    depends_on:
      kafka-broker-1: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes: ["./config:/config"]
    profiles: [tools]
