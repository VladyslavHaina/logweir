# Adapted from osodevops/kafka-backup-demos/docker-compose.yml (MIT).
# Kept: kafka-broker-1 (KRaft, no ZooKeeper), minio, minio-setup, kafka-backup.
# Removed: the demo topic zoo, the monitoring profile, the whole enterprise
# profile (schema registry, Apicurio, the EE image) — none of it is in scope.
#
# An explicit project name: without it compose derives one from this file's
# parent directory, i.e. the project would be called `compose`, which collides
# with every other repo on the machine that keeps its stack in a `compose/`
# directory. `just e2e-down`'s `down -v` deletes volumes by project, so a
# generic name is also a footgun.
#
# PARALLEL STACKS (PROD-01.5). The project name and every published host port
# are parameters whose defaults are the values above and below, so an
# unparameterized `docker compose` renders exactly what it always rendered:
#   COMPOSE_PROJECT_NAME          compose's own override of `name:` below
#   LOGWEIR_E2E_KAFKA_PORT        9092  EXTERNAL  (host port AND advertisement)
#   LOGWEIR_E2E_K8S_PORT          9095  K8S       (host port AND advertisement)
#   LOGWEIR_E2E_SASL_PORT         9097  SASLEXT   (host port AND advertisement)
#   LOGWEIR_E2E_S3_PORT           9000  MinIO S3 API
#   LOGWEIR_E2E_S3_CONSOLE_PORT   9001  MinIO console
# Container-side ports never change; only the host side and the host-facing
# advertised names move. `e2e/compose/stack-env.sh --slot N` prints one
# coherent set (slot N adds N*10000 to every default port), and the optional
# profiles below (`COMPOSE_PROFILES`) follow the same rule. THE list of these
# variables is `e2e/compose/stack-lib.sh`: the scripts source it, the Rust
# harness compiles it in (`e2e/tests/harness/stack.rs`), and
# `e2e/tests/stack_params.rs` checks every `${VAR:-N}` below against it.
# Two more per-stack inputs, neither changing the default render:
#   KAFKA_IMAGE    the broker image, pinned by digest by `stack-env.sh
#                  --kafka LINE`; unset, `apache/kafka:${KAFKA_VERSION}` as
#                  always (KAFKA_VERSION comes from `.env`)
#   slots/<project>/<cluster>.env  each Kafka cluster's CLUSTER_ID on that
#                  stack, so no two stacks share one: kafka-broker-1's on slots
#                  1..4 only (the default broker keeps the image's id), and the
#                  auth, cluster3, cluster2 and autocreate profiles' on every
#                  stack
#                  (slots/logweir-e2e/ holds the ids they always had)
# The guide is `e2e/README.md`.
name: logweir-e2e

networks:
  kafka-net: { driver: bridge }
volumes:
  minio-data:
  objectstore-data:

services:
  kafka-broker-1:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    hostname: kafka-broker-1
    restart: always
    networks: [kafka-net]
    # A SLOT's broker gets its own KRaft cluster id (PROD-01.5): every broker
    # would otherwise answer the image's default `5L6g3nShT-eMCtK--X86sw`, and
    # the cluster-id allowlist could not tell one slot's cluster from another's.
    # There is deliberately NO slots/logweir-e2e/kafka-broker-1.env: for the
    # default project `required: false` then loads nothing, and the default
    # stack renders exactly as before.
    env_file:
      - path: ./slots/${COMPOSE_PROJECT_NAME:-logweir-e2e}/kafka-broker-1.env
        required: false
    # THREE published ports, and each one is published for a client that
    # cannot reach the broker any other way (Task 7, spec §10):
    #   9092  EXTERNAL — the host-side harness (`harness::BOOTSTRAP`).
    #   9095  K8S      — a POD on docker-desktop Kubernetes. `EXTERNAL` is
    #                    useless there: the broker's metadata redirects every
    #                    client to `localhost:9092`, which inside a pod is the
    #                    pod's own loopback.
    #   9097  SASLEXT  — the host-side SCRAM client. `SASL://kafka-broker-1:9096`
    #                    is advertised for in-network clients and its name does
    #                    not resolve on the host, so the ONE SASL listener is
    #                    advertised twice rather than once.
    # 9096 is deliberately NOT published: it is the in-network advertisement of
    # the same SCRAM credential store, reached over `kafka-net`.
    # The HOST side of each mapping is a parameter (PROD-01.5, see the header);
    # the advertised names below move with it, so a client on a non-default
    # slot is redirected to that slot's port and never to 9092.
    ports:
      - "${LOGWEIR_E2E_KAFKA_PORT:-9092}:9092"
      - "${LOGWEIR_E2E_K8S_PORT:-9095}:9095"
      - "${LOGWEIR_E2E_SASL_PORT:-9097}:9097"
    environment:
      KAFKA_NODE_ID: 1001
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # SHARE GROUPS' STATE TOPIC (KIP-932, the 4.x lines), sized for ONE broker
      # like the two internal topics above (PROD-04.0d). Its defaults —
      # replication factor 3, min ISR 2 — cannot be met here, so
      # `__share_group_state` is never created (INVALID_REPLICATION_FACTOR on
      # every attempt) and share groups get members but no share-partition
      # state: no start offsets to read (PROD-04.0 §3.8, measured on 4.3.1).
      # A 3.x broker does not USE either key, but it does not hide them:
      # measured on 3.7.1 and 3.9.2, both reach server.properties, the broker
      # starts and serves as before and its log never names them, and
      # DescribeConfigs on the broker reports both as STATIC entries,
      # `sensitive=true` with a null value — a key the broker cannot type is
      # withheld (PROD-04.0 §3.9's mechanism, as for `super.users`). So a 3.x
      # broker's configuration reads two more "set, value withheld" keys.
      # Every single-node broker below carries the same two lines
      # (e2e/tests/stack_params.rs checks it).
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka-broker-1:9094,EXTERNAL://kafka-broker-1:9092,CONTROLLER://kafka-broker-1:9093,SASL://kafka-broker-1:9096,SASLEXT://kafka-broker-1:9097,K8S://kafka-broker-1:9095
      # `K8S` is the one advertised name a CI runner has to change, and it is
      # therefore a PARAMETER and not a literal: `kind` on a Linux GitHub
      # runner has no `host.docker.internal` inside a node, and STANDING
      # RULE 15 makes Task 7 the only editor of this file — so the override
      # has to exist here or a later task has to break that rule to get one.
      # The default is the docker-desktop name every local gate uses.
      # Documented in `docs/kubernetes.md`, "Task 7 — the five-listener stack".
      # The three HOST-FACING advertisements carry the published host port
      # (PROD-01.5); the two in-network ones name container ports and never move.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:9094,EXTERNAL://localhost:${LOGWEIR_E2E_KAFKA_PORT:-9092},SASL://kafka-broker-1:9096,SASLEXT://localhost:${LOGWEIR_E2E_SASL_PORT:-9097},K8S://${LOGWEIR_K8S_ADVERTISED_HOST:-host.docker.internal}:${LOGWEIR_E2E_K8S_PORT:-9095}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,SASL:SASL_PLAINTEXT,SASLEXT:SASL_PLAINTEXT,K8S:PLAINTEXT
      # SCRAM-SHA-512 and nothing else: `sasl_mechanism: "SCRAM-SHA512"` is the
      # engine's spelling of the same mechanism and `SCRAM-SHA-512` is
      # librdkafka's; both authenticate against this one enabled mechanism.
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      # THE LISTENER-SCOPED JAAS VARIABLE, and its spelling was MEASURED, not
      # read. `kafka.docker.KafkaDockerWrapper` strips `KAFKA_`, lowercases,
      # and then maps `___` -> `-`, `__` -> `_`, `_` -> `.`, so these two
      # variables become, in /opt/kafka/config/server.properties:
      #
      #   listener.name.sasl.scram-sha-512.sasl.jaas.config=…
      #   listener.name.saslext.scram-sha-512.sasl.jaas.config=…
      #
      # read back with `docker compose exec kafka-broker-1 cat
      # /opt/kafka/config/server.properties` — the transcript is in
      # `docs/kubernetes.md`, and it is what closed spec §15's sixth
      # `[UNVERIFIED]` mark.
      #
      # No username/password in the module options: on a listener the broker
      # SERVES, `ScramLoginModule` validates against the broker's own
      # credential store (the one `scram-setup` writes). Inter-broker traffic
      # is PLAINTEXT here, so the broker is never its own SASL client.
      KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LISTENER_NAME_SASLEXT_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1001@kafka-broker-1:9093
      KAFKA_LOG_DIRS: /tmp/kafka-logs
      # MUST carry the KAFKA_ prefix: the apache/kafka entrypoint translates only
      # KAFKA_*-prefixed variables into server.properties, so the unprefixed form
      # is silently ignored and auto-creation stays at its default `true` —
      # which would let `a_restore_into_an_empty_scratch_target_succeeds` pass
      # without `create_topics: true` ever being honoured.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    # A `Running` broker that is not yet serving is the false-pass this project
    # keeps hitting, so health is proved by an actual client round trip on the
    # INTERNAL listener — the one every in-network client uses — rather than by
    # a port probe or a `sleep`. `--list` opens a real Kafka connection and
    # fetches metadata; it fails while the KRaft quorum is still forming.
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka-broker-1:9094", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the SOURCE topics, the MARKER topic and the READER-FIXTURE topic.
  # The marker topic is the v0.1 segregation proof: without it, phase 0 refuses
  # with exit 3.
  topic-setup:
    image: ${KAFKA_CLI_IMAGE:-confluentinc/cp-kafka:7.6.0}
    networks: [kafka-net]
    # The brief's `sleep 10` is a guess about broker startup; the healthcheck
    # above is a measurement of it. Waiting on `service_healthy` is why this
    # command no longer opens with a sleep.
    depends_on:
      kafka-broker-1: { condition: service_healthy }
    restart: on-failure
    profiles: [setup]
    command: >
      bash -c '
      kafka-topics --create --if-not-exists --bootstrap-server kafka-broker-1:9094 --partitions 3 --replication-factor 1 --topic orders &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka-broker-1:9094 --partitions 3 --replication-factor 1 --topic payments &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka-broker-1:9094 --partitions 1 --replication-factor 1 --topic logweir.scratch &&
      kafka-topics --create --if-not-exists --bootstrap-server kafka-broker-1:9094 --partitions 3 --replication-factor 1 --topic test-topic &&
      echo READY'

  # Creates the ONE SCRAM credential the SASL listeners authenticate against.
  #
  # IT MUST HAVE EXITED 0 BEFORE ANY SASL CLIENT AUTHENTICATES. In KRaft there
  # is no ZooKeeper to pre-seed and no `--zookeeper` path: the SCRAM credential
  # is a user config record in the metadata log, so it has to be written by a
  # client after the quorum is serving. `just e2e-up` runs this as a third
  # FOREGROUND step whose exit code `just` checks, after `minio-setup` and
  # `topic-setup`.
  #
  # OVER THE EXISTING PLAINTEXT LISTENER (`kafka-broker-1:9094`), and that is
  # not a convenience. The credential this step creates is the credential a
  # client would need to reach `SASL://kafka-broker-1:9096` — so bootstrapping
  # this over a SASL listener is a circular dependency, and it fails, which is
  # exactly what Task 7's third mutant asserts.
  #
  # `--alter --add-config` is idempotent: a second run overwrites the same
  # credential with the same value and still exits 0, so `just e2e-up` on a
  # stack that is already up is not a failure.
  #
  # THE PASSWORD IS A FIXTURE CONSTANT AND NOT KEY MATERIAL. It is the same
  # literal in `e2e/tests/harness/mod.rs::SCRAM_PASSWORD` and in
  # `e2e/compose/config/backup-scram.yaml`'s `${LOGWEIR_SOURCE_PASSWORD}`
  # expansion; it authenticates to one throwaway broker on one developer
  # machine and to nothing else. No SIGNING key ever appears in this tree.
  #
  # The broker's OWN image, so the binary is `kafka-configs.sh` verbatim as
  # spec §10 writes it; `/opt/kafka/bin` is not on that image's PATH, so the
  # path is absolute for the same reason the healthcheck above spells out
  # `/opt/kafka/bin/kafka-topics.sh`. `entrypoint:` is overridden because the
  # image's own entrypoint is the broker's `run` script, and the argv is a LIST
  # so no shell stands between `kafka-configs.sh` and its exit code.
  scram-setup:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    networks: [kafka-net]
    depends_on:
      kafka-broker-1: { condition: service_healthy }
    profiles: [setup]
    entrypoint: ["/opt/kafka/bin/kafka-configs.sh"]
    command:
      - "--bootstrap-server"
      - "kafka-broker-1:9094"
      - "--alter"
      - "--add-config"
      - "SCRAM-SHA-512=[password=logweir-e2e-not-a-secret]"
      - "--entity-type"
      - "users"
      - "--entity-name"
      - "logweir"

  minio:
    # THE PROJECT'S OWN REBUILD, PINNED BY DIGEST. This stack first pinned the
    # upstream image at quay.io (2026-09-12: Docker Hub refused anonymous pulls
    # of the upstream name). MinIO then withdrew its public images altogether —
    # Docker Hub on 2026-09-11, anonymous quay.io pulls on 2026-09-24 — and CI's
    # `just e2e-up` failed at this pull. The image below is the SAME release,
    # RELEASE.2025-09-07T16-13-09Z, rebuilt from upstream source for amd64 and
    # arm64 under the project's Docker Hub namespace: third_party/minio-mirror/
    # README.md carries the recipe, the provenance, the licence (AGPL-3.0), the
    # publication status and the smoke that shows it behaves as the upstream
    # image did. A stopgap until MinIO is
    # replaced by a maintained S3 server. Pinned by digest so that the stack is
    # the same stack on every host.
    image: docker.io/vladyslavhaina/minio-mirror@sha256:b4c3dc9fb0a82538ac6750eb841b54fb2d4303f4b73fb523ca097918a35c3524
    hostname: minio
    networks: [kafka-net]
    ports:
      - "${LOGWEIR_E2E_S3_PORT:-9000}:9000"
      - "${LOGWEIR_E2E_S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes: [minio-data:/data]
    # MinIO's own readiness probe, the same one its Kubernetes chart uses
    # (httpGet /minio/health/ready on 9000). `mc ready local` is the documented
    # in-image equivalent and needs no curl (which the image does carry).
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-setup:
    # Same mirror and same reason as `minio` above: mc RELEASE.2025-08-13T08-35-41Z,
    # rebuilt from upstream source, byte-identical to upstream's signed binary.
    image: docker.io/vladyslavhaina/mc-mirror@sha256:9c7cbc3f47b092d52b73124fb9ab12f3266534c23c283b2e984d07408c9ff381
    networks: [kafka-net]
    # Same reason as topic-setup: `sleep 5` replaced by MinIO's readiness probe.
    depends_on:
      minio: { condition: service_healthy }
    restart: on-failure
    # Behind a profile for the same reason topic-setup is: it is a one-shot that
    # exits, and `docker compose up -d --wait` fails (exit 1) the moment any
    # container it is waiting on exits, even with status 0. Profiling it keeps
    # the default `up --wait` set to exactly the two long-running services, so
    # `just e2e-up`'s first line means "both servers are actually serving".
    # `docker compose run <svc>` auto-enables the target service's own profiles,
    # so the smoke test and scripts/e2e-seed.sh still reach it with no flag.
    profiles: [setup]
    environment:
      # `docker compose run --rm ... minio-setup` starts a FRESH container every
      # time, and `mc` keeps aliases in the container's own ~/.mc/config.json —
      # so an alias created by one `run` is gone by the next. Both the smoke
      # test and scripts/e2e-seed.sh do exactly that, and would otherwise fail
      # with "Unable to find alias". MC_HOST_<alias> defines the alias from the
      # environment instead, so every container of this service has it.
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: >
      /bin/sh -c "
      mc mb local/kafka-backups --ignore-existing;
      mc mb local/logweir-evidence --ignore-existing;
      echo 'buckets ready';
      "

  # OSO's released engine, PINNED BY DIGEST — never by tag (Global Constraint
  # 7). It seeds the drill archive. Global Constraint 14 forbids Logweir from
  # PUBLISHING its own artifacts under `osodevops/`; pulling upstream's image is
  # not a violation. What the images ship, and what CI's e2e job runs through
  # `logweir`, is Logweir's build of the same source (OD-3, PROD-00.2).
  kafka-backup:
    image: osodevops/kafka-backup@${OSO_DIGEST}
    # Upstream publishes linux/amd64 ONLY — no arm64 manifest exists for any
    # tag. Without this the daemon asks for its own default platform and fails
    # with "no matching manifest for linux/arm64/v8". It is a no-op on an
    # amd64 host, so the pin is safe everywhere and required on Apple Silicon.
    platform: linux/amd64
    networks: [kafka-net]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      RUST_LOG: info
    depends_on:
      kafka-broker-1: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes: ["./config:/config"]
    profiles: [tools]

  # ===========================================================================
  # OPTIONAL PROFILES (PROD-01.5). Nothing below starts unless its profile is
  # named in COMPOSE_PROFILES (`e2e/compose/stack-env.sh --profiles …`), so the
  # default stack above is exactly what it was. Each profile's setup is a
  # dependency of — or is itself — a LONG-RUNNING service with a healthcheck,
  # so `just e2e-up`'s `up -d --wait` brings a profile up ready or fails; a bare
  # one-shot in the up set makes `--wait` exit 1 (measured, compose v5.0.2).
  # Every published port is a LOGWEIR_E2E_*_PORT parameter that a slot moves,
  # and every host-facing advertisement carries the same variable
  # (e2e/tests/stack_params.rs checks both). Profile owners and the extension
  # rule are in e2e/README.md: later tasks EXTEND these services.
  # ===========================================================================

  # --- profile `auth`: PLAIN over TLS, SCRAM-SHA-256 and mTLS listeners -------
  # (PROD-01.3 extends it: SCRAM-SHA-256 also on the TLS listener, the marker
  # topic `logweir.scratch` so a drill can restore into this cluster, and a
  # self-signed `wrong-client` identity for the mTLS refusal row.)
  # A SEPARATE single-node cluster (its own CLUSTER_ID) so the default broker's
  # five listeners, which the whole suite depends on, never change. Clients
  # reach it from the HOST (or through e2e/fixtures/engine-docker.sh, which
  # maps `localhost` to the host gateway): each listener is advertised as
  # `localhost:<published port>`. The TLS material is generated once per
  # project into `.e2e/auth/<project>/` (profiles/auth/gen-certs.sh says what
  # each file is); credentials are the fixture user `logweir` with the fixture
  # password `logweir-e2e-not-a-secret`, as on the SCRAM-SHA-512 listener.
  kafka-auth-certs:
    image: ${KAFKA_CLI_IMAGE:-confluentinc/cp-kafka:7.6.0}
    profiles: [auth]
    networks: [kafka-net]
    # As root: on a Linux host the bind-mounted directory belongs to the host
    # user (`just e2e-up` creates it) or to root (the daemon creates it), and
    # the image's own `appuser` can write to neither. Docker Desktop's file
    # sharing hides this, so only CI saw it. The script hands the files back
    # to the directory's owner.
    user: "0:0"
    entrypoint: ["bash", "/gen-certs.sh"]
    volumes:
      - ./profiles/auth/gen-certs.sh:/gen-certs.sh:ro
      - ../../.e2e/auth/${COMPOSE_PROJECT_NAME}:/certs

  kafka-auth:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    hostname: kafka-auth
    profiles: [auth]
    networks: [kafka-net]
    depends_on:
      kafka-auth-certs: { condition: service_completed_successfully }
    volumes:
      - ../../.e2e/auth/${COMPOSE_PROJECT_NAME}:/certs:ro
    ports:
      - "${LOGWEIR_E2E_AUTH_PLAIN_PORT:-9102}:9102"
      - "${LOGWEIR_E2E_AUTH_SCRAM256_PORT:-9103}:9103"
      - "${LOGWEIR_E2E_AUTH_MTLS_PORT:-9104}:9104"
    # Its CLUSTER_ID, one per stack (PROD-01.5): never in `environment:`, which
    # would override the file. REQUIRED, so a project with no ids of its own
    # fails to start instead of sharing another stack's.
    env_file:
      - path: ./slots/${COMPOSE_PROJECT_NAME:-logweir-e2e}/kafka-auth.env
        required: true
    environment:
      KAFKA_NODE_ID: 2001
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 2001@kafka-auth:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Listener NAMES avoid `SSL://` and `SASL_`: the apache/kafka image's
      # configure script demands its own keystore-credential files when an
      # advertised listener name contains either, and these listeners are
      # configured directly instead.
      KAFKA_LISTENERS: PLAINTEXT://kafka-auth:9094,CONTROLLER://kafka-auth:9093,PLAINTLS://kafka-auth:9102,SCRAM256://kafka-auth:9103,MTLS://kafka-auth:9104
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-auth:9094,PLAINTLS://localhost:${LOGWEIR_E2E_AUTH_PLAIN_PORT:-9102},SCRAM256://localhost:${LOGWEIR_E2E_AUTH_SCRAM256_PORT:-9103},MTLS://localhost:${LOGWEIR_E2E_AUTH_MTLS_PORT:-9104}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTLS:SASL_SSL,SCRAM256:SASL_PLAINTEXT,MTLS:SSL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256
      # PROD-01.3: the SASL_SSL listener serves SCRAM-SHA-256 beside PLAIN, so
      # SCRAM-SHA-256 OVER TLS (what managed services offer) and its wrong-CA
      # refusal run without another published port.
      KAFKA_LISTENER_NAME_PLAINTLS_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256
      KAFKA_LISTENER_NAME_SCRAM256_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_LISTENER_NAME_PLAINTLS_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required user_logweir="logweir-e2e-not-a-secret";'
      KAFKA_LISTENER_NAME_PLAINTLS_SCRAM___SHA___256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LISTENER_NAME_SCRAM256_SCRAM___SHA___256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      # PEM stores (KIP-651): the key+chain file and the test CA, no passwords.
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /certs/broker.keystore.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /certs/ca.pem
      # Client certificates are REQUIRED on the mTLS listener only.
      KAFKA_LISTENER_NAME_MTLS_SSL_CLIENT_AUTH: required
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # One broker: the share-group state topic sized like kafka-broker-1's.
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka-auth:9094", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # SCRAM-SHA-256 credentials are metadata records a client writes once the
  # quorum serves (the same reason `scram-setup` exists), over the in-network
  # PLAINTEXT listener. Long-running with a readiness marker, so `up --wait`
  # waits for the credential and fails if the alter fails.
  kafka-auth-setup:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    profiles: [auth]
    networks: [kafka-net]
    depends_on:
      kafka-auth: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka-auth:9094 --alter
        --add-config 'SCRAM-SHA-256=[password=logweir-e2e-not-a-secret]'
        --entity-type users --entity-name logweir
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-auth:9094 --create
        --if-not-exists --topic orders --partitions 3 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-auth:9094 --create
        --if-not-exists --topic logweir.scratch --partitions 1 --replication-factor 1
        && touch /tmp/ready && exec sleep 2147483647
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      timeout: 5s
      retries: 90

  # --- profile `cluster3`: a three-node KRaft cluster -------------------------
  # Three combined broker+controller nodes, one quorum, replication factor 3 and
  # min.insync.replicas 2 by default: the shape replication-factor, ISR and
  # leader-movement behaviour needs (FX-5, PROD-10.1). Its own CLUSTER_ID,
  # one per stack and shared by the three nodes, loaded like kafka-auth's.
  kafka-c3-1:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    hostname: kafka-c3-1
    profiles: [cluster3]
    networks: [kafka-net]
    ports:
      - "${LOGWEIR_E2E_C3_1_PORT:-9112}:9092"
    env_file: &c3-id
      - path: ./slots/${COMPOSE_PROJECT_NAME:-logweir-e2e}/kafka-c3.env
        required: true
    environment: &c3-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-c3-1:9093,2@kafka-c3-2:9093,3@kafka-c3-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka-c3-1:9094,CONTROLLER://kafka-c3-1:9093,EXTERNAL://kafka-c3-1:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-c3-1:9094,EXTERNAL://localhost:${LOGWEIR_E2E_C3_1_PORT:-9112}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka-c3-1:9094", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-c3-2:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    hostname: kafka-c3-2
    profiles: [cluster3]
    networks: [kafka-net]
    ports:
      - "${LOGWEIR_E2E_C3_2_PORT:-9113}:9092"
    env_file: *c3-id
    environment:
      <<: *c3-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://kafka-c3-2:9094,CONTROLLER://kafka-c3-2:9093,EXTERNAL://kafka-c3-2:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-c3-2:9094,EXTERNAL://localhost:${LOGWEIR_E2E_C3_2_PORT:-9113}
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka-c3-2:9094", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-c3-3:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    hostname: kafka-c3-3
    profiles: [cluster3]
    networks: [kafka-net]
    ports:
      - "${LOGWEIR_E2E_C3_3_PORT:-9114}:9092"
    env_file: *c3-id
    environment:
      <<: *c3-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://kafka-c3-3:9094,CONTROLLER://kafka-c3-3:9093,EXTERNAL://kafka-c3-3:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-c3-3:9094,EXTERNAL://localhost:${LOGWEIR_E2E_C3_3_PORT:-9114}
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka-c3-3:9094", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # --- profile `cluster2`: a second, independent cluster ----------------------
  # Its own CLUSTER_ID, one per stack and loaded like kafka-auth's: the
  # default kafka-broker-1 answers the image's default (5L6g3nShT-eMCtK--X86sw),
  # so without an override the two clusters would be indistinguishable to the
  # cluster-id allowlist. The marker topic exists, so the second cluster can
  # be a `scratch` drill target.
  kafka-cluster2:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    hostname: kafka-cluster2
    profiles: [cluster2]
    networks: [kafka-net]
    ports:
      - "${LOGWEIR_E2E_CLUSTER2_PORT:-9122}:9092"
    env_file:
      - path: ./slots/${COMPOSE_PROJECT_NAME:-logweir-e2e}/kafka-cluster2.env
        required: true
    environment:
      KAFKA_NODE_ID: 3001
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 3001@kafka-cluster2:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka-cluster2:9094,CONTROLLER://kafka-cluster2:9093,EXTERNAL://kafka-cluster2:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-cluster2:9094,EXTERNAL://localhost:${LOGWEIR_E2E_CLUSTER2_PORT:-9122}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # One broker: the share-group state topic sized like kafka-broker-1's.
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka-cluster2:9094", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # --- profile `autocreate`: a cluster that AUTO-CREATES topics ---------------
  # Kafka's own default, `auto.create.topics.enable=true`, which every other
  # broker of this stack turns off: a producer that sends to a name the cluster
  # does not have creates it. PROD-15.1's original-name rows need it twice --
  # a restore into the source cluster refused while a broker auto-creates
  # topics, and a producer that creates a restored name between phase 0's
  # absence check and the creation step (the race, lost by name). Its own
  # CLUSTER_ID per stack, like kafka-cluster2's; no marker topic.
  kafka-autocreate:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    hostname: kafka-autocreate
    profiles: [autocreate]
    networks: [kafka-net]
    ports:
      - "${LOGWEIR_E2E_AUTOCREATE_PORT:-9126}:9092"
    env_file:
      - path: ./slots/${COMPOSE_PROJECT_NAME:-logweir-e2e}/kafka-autocreate.env
        required: true
    environment:
      KAFKA_NODE_ID: 3101
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 3101@kafka-autocreate:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka-autocreate:9094,CONTROLLER://kafka-autocreate:9093,EXTERNAL://kafka-autocreate:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-autocreate:9094,EXTERNAL://localhost:${LOGWEIR_E2E_AUTOCREATE_PORT:-9126}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # One broker: the share-group state topic sized like kafka-broker-1's.
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # THE POINT OF THE PROFILE, stated rather than left to the default so a
      # reader of this file sees it and a default change cannot move it.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka-autocreate:9094", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-cluster2-setup:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    profiles: [cluster2]
    networks: [kafka-net]
    depends_on:
      kafka-cluster2: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-cluster2:9094 --create
        --if-not-exists --topic logweir.scratch --partitions 1 --replication-factor 1
        && touch /tmp/ready && exec sleep 2147483647
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      timeout: 5s
      retries: 90

  # --- profile `acl`: a broker that enforces ACLs (FX-4) ----------------------
  # A single-node cluster running KRaft's StandardAuthorizer, for rows about
  # what a principal may NOT do: a refused DescribeConfigs (FX-4's capture
  # coverage and PROD-04.0's T13), and the ACL rows of PROD-04.x and PROD-05.3.
  # Every PLAINTEXT client — in-network on 9094, host-side on the published
  # EXTERNAL port — is User:ANONYMOUS and a SUPER USER, so setup and the
  # assertions' own reads are unrestricted. The SCRAM-SHA-512 user `logweir`
  # (the stack's fixture credential) on the published SASLEXT port is the
  # RESTRICTED principal a row denies with ACLs; `allow.everyone.if.no.acl.found`
  # keeps every resource without an ACL open to it, so a row restricts exactly
  # the resources it names. SCRAM-SHA-512 because it is the one SASL mechanism
  # Logweir speaks, so a `logweir backup run` or `restore run` can be the
  # restricted client itself.
  # PROD-04.0d: PROD-04.0 §3.9's visibility state — groups the restricted
  # principal cannot see, and a cluster ACL for another principal — is NOT
  # part of this profile's setup, because that cluster ACL takes every
  # cluster operation from `logweir`; `e2e/compose/groups.sh visibility
  # apply` adds it and `remove` takes it away again (e2e/README.md).
  kafka-acl:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    hostname: kafka-acl
    profiles: [acl]
    networks: [kafka-net]
    ports:
      - "${LOGWEIR_E2E_ACL_PORT:-9150}:9092"
      - "${LOGWEIR_E2E_ACL_SASL_PORT:-9151}:9097"
    env_file:
      - path: ./slots/${COMPOSE_PROJECT_NAME:-logweir-e2e}/kafka-acl.env
        required: true
    environment:
      KAFKA_NODE_ID: 4001
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 4001@kafka-acl:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka-acl:9094,CONTROLLER://kafka-acl:9093,EXTERNAL://kafka-acl:9092,SASLEXT://kafka-acl:9097
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-acl:9094,EXTERNAL://localhost:${LOGWEIR_E2E_ACL_PORT:-9150},SASLEXT://localhost:${LOGWEIR_E2E_ACL_SASL_PORT:-9151}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,SASLEXT:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENER_NAME_SASLEXT_SCRAM___SHA___512_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: 'User:ANONYMOUS'
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # One broker: the share-group state topic sized like kafka-broker-1's.
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka-acl:9094", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # The restricted principal's SCRAM-SHA-512 credential and the marker topic,
  # written once the quorum serves; long-running with a readiness marker, like
  # kafka-auth-setup, so `up --wait` waits for both and fails if either fails.
  kafka-acl-setup:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    profiles: [acl]
    networks: [kafka-net]
    depends_on:
      kafka-acl: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka-acl:9094 --alter
        --add-config 'SCRAM-SHA-512=[password=logweir-e2e-not-a-secret]'
        --entity-type users --entity-name logweir
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-acl:9094 --create
        --if-not-exists --topic logweir.scratch --partitions 1 --replication-factor 1
        && touch /tmp/ready && exec sleep 2147483647
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      timeout: 5s
      retries: 90

  # --- profile `streams`: a pinned minimal Kafka Streams application ----------
  # Apache Kafka's own WordCountDemo, from the SAME apache/kafka image as the
  # broker (kafka-streams-examples-<KAFKA_VERSION>.jar), so the application's
  # version is the broker line's. It reads `streams-plaintext-input` and writes
  # word counts to `streams-wordcount-output` on kafka-broker-1, with a
  # consumer group, internal repartition/changelog topics and local state —
  # what PROD-06's application-recovery rows need. Topics are created first
  # because the broker refuses auto-creation.
  streams-topics:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    profiles: [streams]
    networks: [kafka-net]
    depends_on:
      kafka-broker-1: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker-1:9094 --create
        --if-not-exists --topic streams-plaintext-input --partitions 1 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker-1:9094 --create
        --if-not-exists --topic streams-wordcount-output --partitions 1 --replication-factor 1
        --config cleanup.policy=compact

  streams-wordcount:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    profiles: [streams]
    networks: [kafka-net]
    depends_on:
      streams-topics: { condition: service_completed_successfully }
    volumes:
      - ./profiles/streams/wordcount.properties:/streams/wordcount.properties:ro
    entrypoint: ["/opt/kafka/bin/kafka-run-class.sh"]
    command: ["org.apache.kafka.streams.examples.wordcount.WordCountDemo", "/streams/wordcount.properties"]
    healthcheck:
      # RUNNING is not observable from outside without JMX; the application's
      # group being STABLE is — a client that died (the RocksDB failure above
      # left the JVM alive and the group Empty) never gets there. The smoke run
      # proves the counts.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server kafka-broker-1:9094 --describe --group logweir-e2e-wordcount --state | grep -q -w Stable"]
      interval: 10s
      timeout: 20s
      retries: 18
      start_period: 30s

  # --- profile `streams-protocol`: a Streams application on KIP-1071 ---------
  # PROD-04.0d, BESIDE PROD-06.1's `streams` profile, which runs the CLASSIC
  # rebalance protocol and is not changed. Apache Kafka's
  # WordCountProcessorDemo from the broker line's own image with
  # `group.protocol=streams`, so its group is a STREAMS group: `kafka-groups.sh
  # --list` types it Streams, and ListConsumerGroups and DescribeGroups do not
  # report it (PROD-04.0 §3.1). It is also the streams member of the groups
  # fixture (`e2e/compose/groups.sh`), which starts and stops this service.
  #
  # The PROCESSOR demo, not WordCountDemo, on purpose: WordCountDemo's output
  # topic is a constant, `streams-wordcount-output`, which the `streams`
  # profile's application writes; two WordCountDemos on one broker would both
  # write their counts of the shared input there, and the `streams` smoke's
  # stopped-application control could no longer tell its application's counts
  # from the other's. This one writes
  # `streams-wordcount-processor-output`. Both read `streams-plaintext-input`,
  # each with its own group, so the two profiles run together. Its store is
  # in memory (`Stores.inMemoryKeyValueStore`, no RocksDB, see `streams`) and
  # changelog-backed; the topology has no repartition topic.
  #
  # The 4.x lines only (measured on 4.3.1, where the protocol is on by
  # default): a 3.x client refuses `group.protocol=streams`, the application
  # exits, and `up --wait` fails.
  streams-protocol-topics:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    profiles: [streams-protocol]
    networks: [kafka-net]
    depends_on:
      kafka-broker-1: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    # The `streams` profile's streams-topics creates the same input topic and
    # may run at the same moment; with `--if-not-exists` the loser of that
    # race still exits 0 (measured by PROD-04.0d's review on 4.3.1 and 3.7.1:
    # 20 and 10 concurrent creates, every one rc 0; without the flag a loser
    # exits 1).
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker-1:9094 --create
        --if-not-exists --topic streams-plaintext-input --partitions 1 --replication-factor 1
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-broker-1:9094 --create
        --if-not-exists --topic streams-wordcount-processor-output --partitions 1 --replication-factor 1

  streams-protocol-wordcount:
    image: ${KAFKA_IMAGE:-apache/kafka:${KAFKA_VERSION:-3.7.1}}
    profiles: [streams-protocol]
    networks: [kafka-net]
    depends_on:
      streams-protocol-topics: { condition: service_completed_successfully }
    volumes:
      - ./profiles/streams-protocol/wordcount-processor.properties:/streams/wordcount-processor.properties:ro
    entrypoint: ["/opt/kafka/bin/kafka-run-class.sh"]
    command: ["org.apache.kafka.streams.examples.wordcount.WordCountProcessorDemo", "/streams/wordcount-processor.properties"]
    healthcheck:
      # A Streams group is not a consumer group: kafka-consumer-groups.sh does
      # not describe it, kafka-streams-groups.sh does.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-streams-groups.sh --bootstrap-server kafka-broker-1:9094 --describe --group logweir-e2e-streams-protocol --state | grep -q -w Stable"]
      interval: 10s
      timeout: 20s
      retries: 18
      start_period: 30s

  # --- profile `objectstore`: a maintained, lock-capable S3 server -------------
  # SeaweedFS 4.48 (Apache-2.0), the object store PROD-01.5 chose over the
  # archived MinIO: docs/to-do/decisions/PROD-01.5-fixture-profiles.md has the
  # evidence (19/19 protocol checks and Logweir's own store and receipt paths).
  # It runs BESIDE the default MinIO, which stays the stack's default store
  # until REPLACE-MINIO. Buckets: `kafka-backups` and `logweir-evidence` (the
  # names every example uses, so a spec needs only its endpoint changed),
  # `kafka-backups-locked` (Object Lock, hence versioning) and
  # `kafka-backups-2` (a second archive bucket, e.g. a secondary copy).
  # Credentials are the stack's fixture pair; per-prefix identities go in
  # profiles/objectstore/s3.json (`"actions": ["Write:bucket/prefix/*"]`).
  objectstore:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    hostname: objectstore
    profiles: [objectstore]
    networks: [kafka-net]
    command: ["mini", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - objectstore-data:/data
      - ./profiles/objectstore/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "${LOGWEIR_E2E_OBJSTORE_PORT:-9130}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  objectstore-setup:
    image: amazon/aws-cli:2.37.5@sha256:fb7ccfc7b4e3a05017e6c9ded4ba959b99af622130e211fb976c68c2f4d3f224
    profiles: [objectstore]
    networks: [kafka-net]
    depends_on:
      objectstore: { condition: service_healthy }
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        set -e;
        mk() { aws --endpoint-url http://objectstore:8333 s3api head-bucket --bucket "$$1" 2>/dev/null
        || aws --endpoint-url http://objectstore:8333 s3api create-bucket --bucket "$$@"; };
        mk kafka-backups; mk logweir-evidence; mk kafka-backups-2;
        mk kafka-backups-locked --object-lock-enabled-for-bucket;
        aws --endpoint-url http://objectstore:8333 s3api get-object-lock-configuration --bucket kafka-backups-locked;
        touch /tmp/ready; exec sleep 2147483647
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      timeout: 5s
      retries: 90

  # --- profile `registry`: a Confluent-Schema-Registry-compatible service ----
  # Karapace 6.2.3 (Apache-2.0, Aiven), which keeps its schemas in the Kafka
  # topic `_schemas` on kafka-broker-1 exactly as Confluent Schema Registry
  # does — so a backup of the cluster can carry the registry's state, which is
  # what PROD-03's schema rows need. Confluent's own image is not used: its
  # Community License is not OSI-approved. BACKWARD compatibility (the
  # registry default) so an incompatible schema is refused.
  registry:
    image: ghcr.io/aiven-open/karapace:6.2.3@sha256:6d5b1ff1b77c497108be8be8359c9072294847cba5aa0767fc168ec70632d78f
    hostname: registry
    profiles: [registry]
    networks: [kafka-net]
    depends_on:
      kafka-broker-1: { condition: service_healthy }
    entrypoint: ["python3", "-m", "karapace"]
    ports:
      - "${LOGWEIR_E2E_REGISTRY_PORT:-9141}:8081"
    environment:
      KARAPACE_KARAPACE_REGISTRY: "true"
      KARAPACE_ADVERTISED_HOSTNAME: registry
      KARAPACE_BOOTSTRAP_URI: kafka-broker-1:9094
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
      KARAPACE_CLIENT_ID: logweir-e2e-registry
      KARAPACE_GROUP_ID: logweir-e2e-registry
      KARAPACE_MASTER_ELIGIBILITY: "true"
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_COMPATIBILITY: BACKWARD
      KARAPACE_LOG_LEVEL: WARNING
    healthcheck:
      test: ["CMD", "python3", "/opt/karapace/healthcheck.py", "http://localhost:8081/_health"]
      interval: 10s
      timeout: 30s
      retries: 18
      start_period: 20s
