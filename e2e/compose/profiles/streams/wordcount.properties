# Apache Kafka's WordCountDemo (org.apache.kafka.streams.examples.wordcount),
# run by the `streams` profile of e2e/compose/docker-compose.yml (PROD-01.5).
# In-network bootstrap: the application runs on the stack's own network.
application.id=logweir-e2e-wordcount
bootstrap.servers=kafka-broker-1:9094
state.dir=/tmp/kafka-streams
commit.interval.ms=1000
# IN-MEMORY state stores (KIP-954, Kafka 3.7+). The default RocksDB store loads
# a native library that needs libstdc++, which the Alpine-based apache/kafka
# image does not carry — measured: `UnsatisfiedLinkError: ... libstdc++.so.6`,
# and the client shuts down. The state is still changelog-backed, so the
# application keeps a consumer group, a repartition topic and a changelog
# topic; what it lacks is on-disk RocksDB files (a RocksDB variant is a
# PROD-06 extension, not this fixture).
dsl.store.suppliers.class=org.apache.kafka.streams.state.BuiltInDslStoreSuppliers$InMemoryDslStoreSuppliers
