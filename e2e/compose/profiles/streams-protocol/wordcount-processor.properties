# Apache Kafka's WordCountProcessorDemo (org.apache.kafka.streams.examples.wordcount),
# run by the `streams-protocol` profile of e2e/compose/docker-compose.yml
# (PROD-04.0d) on the STREAMS rebalance protocol (KIP-1071). It reads
# `streams-plaintext-input` and writes running word counts (string values) to
# `streams-wordcount-processor-output`; its store is in memory and
# changelog-backed. The `streams` profile's WordCountDemo, on the classic
# protocol, is the same idea under group `logweir-e2e-wordcount`.
application.id=logweir-e2e-streams-protocol
bootstrap.servers=kafka-broker-1:9094
state.dir=/tmp/kafka-streams
commit.interval.ms=1000
# The one line that makes this the protocol variant: the group is a Streams
# group, coordinated by the broker's streams group coordinator. A 3.x client
# rejects the value and the application exits.
group.protocol=streams
