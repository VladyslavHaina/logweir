# A copy of examples/drill.yaml whose source.storage points at a real,
# reachable, but EMPTY archive directory (e2e/fixtures/empty-archive/,
# tracked via .gitkeep), for Task 14b fix round 2's M3 regression test:
# check_storage must FAIL on a reachable archive holding zero backup sets,
# never report `ok`, because `source.backup: latestCompleted` has nothing to
# select and a drill against this configuration fails in phase 1.
source:
  storage:
    backend: filesystem
    path: ../../e2e/fixtures/empty-archive
  backup: latestCompleted
  topics: [orders, payments]

target:
  bootstrap_servers: [localhost:9092]
  marker_topic: logweir.scratch
  topic_mapping_prefix: "drill-"
  default_replication_factor: 1
  teardown: delete

sample:
  window_start: "2026-08-29T00:00:00Z"
  window_end:   "2026-08-30T02:00:00Z"
  records_per_partition: 25
  anchor: random

objectives:
  rto_seconds: 900
  rpo_seconds: 300
  pass_rate: 1.0

evidence:
  backend: s3
  bucket: logweir-evidence
  prefix: logweir/
  region: us-east-1
  endpoint: http://localhost:9000
  path_style: true
  allow_http: true

notifications:
  webhooks: []
