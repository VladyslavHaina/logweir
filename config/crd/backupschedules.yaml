# GENERATED FILE — do not edit by hand.
#
# Rendered by `cargo run -p weirkeeper --example emit_crds -- --out config/crd`
# (`just crds`) from `crates/weirkeeper/src/crds/`. The CI `crd drift` arm
# re-renders into a temporary directory and `diff -u`s these files against it,
# so a hand edit here is a red build rather than a silent divergence — the same
# arrangement the scorecard schema has.
#
# Minimum Kubernetes: 1.29 (CEL validation rules GA). See docs/kubernetes.md.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backupschedules.logweir.dev
spec:
  group: logweir.dev
  names:
    categories: []
    kind: BackupSchedule
    plural: backupschedules
    shortNames: []
    singular: backupschedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: SCHEDULE
      type: string
    - jsonPath: .spec.suspend
      name: SUSPEND
      type: string
    - jsonPath: .status.lastFireTime
      name: LAST
      type: date
    - jsonPath: .status.nextFireTime
      name: NEXT
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A recurring backup of a topic set into an archive. Every spec field is EDITABLE except `sourceRef`, which is sealed by an object-level CEL rule; each created Backup copies the policy and records the revision it ran, so an edit reaches the next run and never a run that exists. Retention REPORTS what it would remove and deletes nothing.
        properties:
          spec:
            description: '`BackupSchedule.spec`. Every field is editable except `sourceRef` — see the module header.'
            properties:
              activeDeadlineSeconds:
                description: The Job deadline copied into every created `Backup`'s `spec.deadlineSeconds`. **Absent means 3600**, the constant an older controller used.
                format: int64
                maximum: 86400
                minimum: 60
                nullable: true
                type: integer
              allUserTopics:
                description: |-
                  Dynamic selection: every user topic the run's principal can see, minus the exclusions. Requires `topics: []` (CEL).

                  Wire-compatible with an older controller by construction: it reads `topics: []`, renders an empty list, and the runner's own empty-list rail exits 3 without contacting the engine.
                nullable: true
                properties:
                  exclude:
                    description: What to leave out.
                    nullable: true
                    properties:
                      prefixes:
                        description: Literal prefixes, never patterns.
                        items:
                          pattern: ^[a-zA-Z0-9._-]{1,249}$
                          type: string
                        maxItems: 32
                        nullable: true
                        type: array
                      topics:
                        description: Exact names.
                        items:
                          pattern: ^[a-zA-Z0-9._-]{1,249}$
                          type: string
                        maxItems: 1000
                        nullable: true
                        type: array
                    type: object
                  incompleteDiscovery:
                    description: What to do about incomplete visibility. Required.
                    enum:
                    - Refuse
                    - BackUpVisibleTopics
                    type: string
                required:
                - incompleteDiscovery
                type: object
              archive:
                description: |-
                  Where the backup is written.

                  With `destinationRef` set this is the sentinel `logweir-destination://<name>` and carries no `secretRef`.
                properties:
                  secretRef:
                    description: A Secret in this namespace carrying the object-store credential. Its keys are read by the Job, never by the controller's own archive handle, which is read-only (Global Constraint 6).
                    nullable: true
                    properties:
                      name:
                        description: The referenced object's `metadata.name`, in this namespace.
                        type: string
                    required:
                    - name
                    type: object
                  url:
                    description: The object-store URL of the archive root.
                    type: string
                required:
                - url
                type: object
              catchUpPolicy:
                description: What to do with a slot that is past its starting deadline. **Absent means `None`** — count it and move on, which is today's behaviour.
                enum:
                - None
                - Latest
                nullable: true
                type: string
              concurrencyPolicy:
                default: Forbid
                description: Whether a due slot may start while an earlier Backup owned by this schedule is unfinished. Omitted means `Forbid`, including on schedules stored before this field was introduced. `Allow` is explicit.
                enum:
                - Forbid
                - Allow
                type: string
              destinationRef:
                description: |-
                  The saved `BackupDestination` every run of this schedule writes to, in this namespace.

                  Optional, additive and sealed like every other field but `suspend`: re-pointing a schedule at a different destination is a different schedule, for the same reason a different location is a different destination.
                nullable: true
                properties:
                  name:
                    description: The referenced object's `metadata.name`, in this namespace.
                    type: string
                required:
                - name
                type: object
              retention:
                description: '`{keepLast, keepDays}` — **reporting only**. Logweir deletes nothing.'
                nullable: true
                properties:
                  keepDays:
                    description: Keep backup sets newer than N days; older sets are REPORTED as removable.
                    format: int64
                    nullable: true
                    type: integer
                  keepLast:
                    description: Keep the most recent N backup sets; older sets are REPORTED as removable.
                    format: int64
                    nullable: true
                    type: integer
                type: object
              retry:
                description: How many times a slot may be retried, and how long after the failure. **Absent means no retries**, which is today's behaviour. Only a retryable failure is retried, only for the latest due slot, and only until the next slot comes due.
                nullable: true
                properties:
                  delaySeconds:
                    description: Seconds between a failed attempt finishing and its retry becoming admissible. Absent means 300.
                    format: int64
                    maximum: 21600
                    minimum: 60
                    nullable: true
                    type: integer
                  maxRetries:
                    description: 'How many retries one slot may have, `0..=3`. Each retry is a new `Backup` with a new execution id: a failed attempt''s partial archive is never appended to.'
                    format: int32
                    maximum: 3
                    minimum: 0
                    type: integer
                required:
                - maxRetries
                type: object
              schedule:
                description: 'A five-field cron expression: minute hour day-of-month month day-of-week. `*`, a literal, a comma list, an `a-b` range and a `*/n` step are accepted, as are `@hourly`, `@daily` and `@weekly`; anything else is refused with a `Ready` condition naming the field, never read as a silent match-all. The fields are read in `timeZone`, which is UTC when absent; the slot identity is always the UTC instant. A slot that comes due more than `startingDeadlineSeconds` before the controller looks is skipped and counted in `status.missedSlots`, unless `catchUpPolicy` is `Latest`.'
                type: string
              sourceRef:
                description: |-
                  The `KafkaCluster` to back up, in this namespace.

                  **The one immutable field on this spec.** A schedule's identity is the cluster it protects; one schedule's history must not mix two clusters, so protecting a different cluster is a different schedule.
                properties:
                  name:
                    description: The referenced object's `metadata.name`, in this namespace.
                    type: string
                required:
                - name
                type: object
              startingDeadlineSeconds:
                description: How long after a slot came due it may still start. **Absent means 3600** — the one-hour horizon an older controller hard-coded.
                format: int64
                maximum: 604800
                minimum: 60
                nullable: true
                type: integer
              suspend:
                default: false
                description: Stop admitting new slots, catch-ups and retries. Runs that already exist are unaffected, and a reservation that was already accepted is still resumed — suspending stops future work, it does not cancel accepted work.
                type: boolean
              timeZone:
                description: |-
                  The IANA zone `schedule`'s fields are read in. **Absent means UTC and reproduces the slots an older controller computed, instant for instant.**

                  The slot identity stays the UTC instant, so names remain unique and monotonic whatever the zone. Every real instant whose local wall time matches fires once; a matching local time that does not exist (a DST gap) fires once at the end of the gap; a fixed local time inside a repeated hour therefore fires at BOTH occurrences, and `status.nextRuns` marks which is which. A name this build's tz database does not have is `Ready=False` with reason `UnknownTimeZone` and admits nothing — never a silent fall back to UTC.
                maxLength: 64
                nullable: true
                pattern: ^[A-Za-z][A-Za-z0-9_+\-]*(/[A-Za-z0-9_+\-]+){0,2}$
                type: string
              topics:
                description: |-
                  NAMED topics, never patterns. Global Constraint 18's first rail and guard **G-GLOB**: a glob metacharacter is refused, and an omitted list is not permitted at all — the one shape that would mean "everything" to the engine. A mandatory allowlist whose absence means "all topics" is not an allowlist.

                  `[]` WITH `allUserTopics` SET is the one other legal shape: dynamic selection, resolved per run. `[]` on its own is refused by the controller before it admits anything.
                items:
                  type: string
                type: array
            required:
            - archive
            - schedule
            - sourceRef
            - topics
            type: object
            x-kubernetes-validations:
            - message: spec.sourceRef is immutable; create a new BackupSchedule to protect a different cluster
              rule: has(self.sourceRef) == has(oldSelf.sourceRef) && (!has(self.sourceRef) || self.sourceRef == oldSelf.sourceRef)
            - message: spec.allUserTopics requires spec.topics to be empty
              rule: '!has(self.allUserTopics) || size(self.topics) == 0'
            - message: with destinationRef, archive.url is exactly logweir-destination://<destinationRef.name> and archive.secretRef is absent; the logweir-destination scheme is otherwise reserved
              rule: 'has(self.destinationRef) ? (self.archive.url == ''logweir-destination://'' + self.destinationRef.name && !has(self.archive.secretRef)) : !self.archive.url.startsWith(''logweir-destination://'')'
          status:
            description: '`BackupSchedule.status`.'
            nullable: true
            properties:
              activeBackupRef:
                description: The `Backup` currently running for this schedule, if any.
                nullable: true
                properties:
                  name:
                    description: The referenced object's `metadata.name`, in this namespace.
                    type: string
                required:
                - name
                type: object
              activeRuns:
                description: |-
                  Every nonterminal schedule-created run, at most ten. `activeBackupRef` mirrors the first entry.

                  An ABSENT list and an EMPTY list are different facts: absent means this controller has not yet taken an inventory of the schedule's runs, and empty means it has and there are none.
                items:
                  description: One schedule-created run that is not terminal (D1 §4.8).
                  properties:
                    attempt:
                      description: '`0` for a scheduled or catch-up run, `1..=3` for a retry.'
                      format: int32
                      type: integer
                    kind:
                      description: '`Scheduled`, `CatchUp` or `Retry`.'
                      type: string
                    name:
                      description: The `Backup`'s name.
                      type: string
                  required:
                  - attempt
                  - kind
                  - name
                  type: object
                nullable: true
                type: array
              conditions:
                description: '`Ready`, and whatever else the controller reports.'
                items:
                  description: 'A `metav1.Condition`: the standard six fields with their standard meanings.'
                  properties:
                    lastTransitionTime:
                      description: When the condition last changed from one status to another.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      description: A human-readable message. Never carries key material or a credential.
                      nullable: true
                      type: string
                    observedGeneration:
                      description: The `.metadata.generation` this condition was computed from.
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: A short, machine-readable CamelCase reason for the current status.
                      nullable: true
                      type: string
                    status:
                      description: '`True`, `False` or `Unknown`.'
                      type: string
                    type:
                      description: The condition type, in CamelCase — `Ready`, `Reachable`, `Loaded`, `Verified`, `Expired`.
                      type: string
                  required:
                  - status
                  - type
                  type: object
                nullable: true
                type: array
              history:
                description: |-
                  What the PLAT-05.2 inventory last found: how much history this schedule has, and how much of it is still owned by the schedule object (D1 §6).

                  An ABSENT block means the inventory has never run, which is what makes the first reconcile after an upgrade take one.
                nullable: true
                properties:
                  estimatedBytes:
                    description: 'D1 §6.6''s estimate of the etcd bytes this history occupies: Σ(serialized `Backup` length + 2048 + 2 × topic name bytes).'
                    format: int64
                    type: integer
                  inventoriedAt:
                    description: When the inventory last ran.
                    format: date-time
                    type: string
                  legacyMigratableRuns:
                    description: How many of `legacy_owned_runs` are terminal, and therefore migratable on the next pass.
                    format: int64
                    type: integer
                  legacyOwnedRuns:
                    description: How many of those runs still carry this schedule's controller ownerReference, so deleting the schedule would still collect them.
                    format: int64
                    type: integer
                  migrationBlocked:
                    description: The runs whose migration PATCH was refused, newest first, at most ten.
                    items:
                      description: |-
                        One `Backup` the §6.2 migration could not detach from its schedule, and why (D1 §6.2 step 4).

                        NAMED IN THE STATUS AND NOT ONLY IN A CONDITION MESSAGE, because the `HistoryRetained` condition is recomputed on EVERY reconcile and only an inventory pass observes a blocked patch. A condition whose message were the only record would lose its names on the next steady pass and then re-acquire them an hour later; a reader would see a schedule flap between "blocked, and here is what" and "blocked, and no idea what".
                      properties:
                        name:
                          description: The `Backup`'s name.
                          type: string
                        reason:
                          description: Why the patch could not be applied — an HTTP status the API server gave (`403`, `422`), or a refusal this controller made for the object's own safety.
                          type: string
                      required:
                      - name
                      - reason
                      type: object
                    nullable: true
                    type: array
                  runCount:
                    description: How many `Backup`s of this schedule UID the last inventory saw, terminal and active alike. A floor when `runCountCapped` is set.
                    format: int64
                    type: integer
                  runCountCapped:
                    description: Whether the inventory stopped at its page cap, so `run_count` and `estimated_bytes` are floors rather than totals.
                    type: boolean
                required:
                - estimatedBytes
                - inventoriedAt
                - legacyMigratableRuns
                - legacyOwnedRuns
                - runCount
                - runCountCapped
                type: object
              lastFireTime:
                description: When this schedule last created a `Backup`.
                format: date-time
                nullable: true
                type: string
              lastMissedSlot:
                description: |-
                  The most recent slot that came due and was NOT fired — the controller was down, or `Forbid` found a previous owned run still active. Recorded because object identity is a pure function of the trigger (guard **G-SLOT**): a missed slot is never silently re-fired under a different name.

                  THE MISSED-SLOT HORIZON IS ONE HOUR. A slot that came due more than one hour before the controller looked is skipped and recorded here, with a `Ready` condition whose reason is `SlotMissed`; a controller restarted after a week therefore fires at most the current slot and never six days of backlog. A concurrency skip uses reason `ConcurrencyBlocked`. The field is written when a slot is skipped and is never cleared afterwards — it is the audit trail of the skip, so a correct implementation is distinguishable from a broken schedule.
                nullable: true
                type: string
              lastSlot:
                description: What happened to the most recent slot that was decided about.
                nullable: true
                properties:
                  attempt:
                    description: Which attempt of it this disposition is about.
                    format: int32
                    type: integer
                  backupRef:
                    description: The `Backup` the disposition is about, when there is one.
                    nullable: true
                    properties:
                      name:
                        description: The referenced object's `metadata.name`, in this namespace.
                        type: string
                    required:
                    - name
                    type: object
                  decidedAt:
                    description: When it was decided.
                    format: date-time
                    type: string
                  disposition:
                    description: One of `Admitted`, `CaughtUp`, `Retried`, `Missed`, `Superseded`, `Blocked`, `NameUnavailable`, `Released`, `Failed`, `Exhausted`.
                    type: string
                  dueAt:
                    description: The instant that name spells.
                    format: date-time
                    type: string
                  reason:
                    description: The `Ready` reason that accompanied the decision.
                    type: string
                  slot:
                    description: The slot, `yyyymmdd-hhmmss` of its UTC instant.
                    type: string
                required:
                - attempt
                - decidedAt
                - disposition
                - dueAt
                - reason
                - slot
                type: object
              missedSlots:
                description: How many slots came due and were not run, with the ten most recent.
                nullable: true
                properties:
                  count:
                    description: How many slots have been skipped since the schedule was created.
                    format: int64
                    type: integer
                  countCapped:
                    description: Whether any single evaluation stopped at its 1000-slot enumeration cap, so `count` is a floor rather than a total.
                    type: boolean
                  lastEvaluatedSlot:
                    description: The newest slot the accounting has already considered. It advances only when a slot receives a FINAL disposition, so a slot that waits and is then superseded is counted exactly once.
                    nullable: true
                    type: string
                  recent:
                    description: The ten most recent skips, newest first.
                    items:
                      description: One slot that came due and was not run (D1 §4.8).
                      properties:
                        reason:
                          description: '`ControllerUnavailable`, `ConcurrencyBlocked`, `Superseded` or `BeforeRevision`.'
                          type: string
                        recordedAt:
                          description: When the controller noticed.
                          format: date-time
                          type: string
                        slot:
                          description: The slot.
                          type: string
                      required:
                      - reason
                      - recordedAt
                      - slot
                      type: object
                    nullable: true
                    type: array
                required:
                - count
                - countCapped
                type: object
              nextFireTime:
                description: When it will next create one, given `schedule` and `suspend`.
                format: date-time
                nullable: true
                type: string
              nextRuns:
                description: The next five firings, computed by the controller. **The browser never evaluates cron**; it renders what this says. Empty while the schedule is suspended or its policy is invalid.
                items:
                  description: One upcoming firing (D1 §4.4).
                  properties:
                    adjustment:
                      description: '`NonexistentLocalTimeShifted`, `RepeatedLocalTimeFirst` or `RepeatedLocalTimeSecond`. Omitted when the instant needed no adjustment, which is every instant outside a DST transition.'
                      nullable: true
                      type: string
                    at:
                      description: The UTC instant.
                      format: date-time
                      type: string
                    localTime:
                      description: The same instant rendered in the schedule's zone, offset included — `2026-10-25T02:30:00+02:00`.
                      type: string
                  required:
                  - at
                  - localTime
                  type: object
                nullable: true
                type: array
              observedGeneration:
                description: The `metadata.generation` the controller has evaluated. A generation ahead of this one is an edit the controller has not seen yet.
                format: int64
                nullable: true
                type: integer
              pendingBackupRef:
                description: A `Forbid` slot atomically admitted in status but whose `Backup` creation has not yet been confirmed. This short-lived reservation closes the controller crash window and is cleared after the child is observed or created.
                nullable: true
                properties:
                  name:
                    description: The referenced object's `metadata.name`, in this namespace.
                    type: string
                required:
                - name
                type: object
              pendingRun:
                description: The reservation, if one is outstanding. `pendingBackupRef` mirrors its name for readers written before this block existed.
                nullable: true
                properties:
                  attempt:
                    description: '`0` for a scheduled or catch-up run, `1..=3` for a retry.'
                    format: int32
                    type: integer
                  generation:
                    description: The `metadata.generation` the reservation was made under, and therefore the generation the created run records.
                    format: int64
                    type: integer
                  kind:
                    description: '`Scheduled`, `CatchUp` or `Retry`.'
                    type: string
                  name:
                    description: The `Backup`'s deterministic name.
                    type: string
                  slot:
                    description: The slot it is for.
                    type: string
                required:
                - attempt
                - generation
                - kind
                - name
                - slot
                type: object
              policy:
                description: The revision that is in force, and the digest of what a run under it does.
                nullable: true
                properties:
                  effectiveSince:
                    description: 'When this revision was first observed. A catch-up never runs a slot older than this: a schedule edited at noon does not retroactively back up the morning under the new policy.'
                    format: date-time
                    type: string
                  evaluatedAt:
                    description: |-
                      When this status last MOVED — not when the controller last looked.

                      The controller re-examines every schedule every 30 s and deliberately writes nothing when the computed status equals the stored one, so this instant standing still means "nothing has changed", not "nobody is watching". The staleness signal is `status.nextRuns[0].at`: a live controller rewrites the previews once their first entry has passed.
                    format: date-time
                    type: string
                  generation:
                    description: The `metadata.generation` this block was computed from.
                    format: int64
                    type: integer
                  runPolicySha256:
                    description: '`sha256:<lowercase hex>` over the run policy of that generation.'
                    type: string
                  timeZone:
                    description: The EFFECTIVE zone — `UTC` when `spec.timeZone` is absent, so a reader never has to know the default to read the status.
                    type: string
                  tzdb:
                    description: Which time-zone database resolved it, so a slot computed by one release can be explained after a tzdata update.
                    type: string
                required:
                - effectiveSince
                - evaluatedAt
                - generation
                - runPolicySha256
                - timeZone
                - tzdb
                type: object
              retentionReport:
                description: What retention WOULD remove. Nothing was deleted — see [`RetentionReport`].
                nullable: true
                properties:
                  awsCli:
                    description: |-
                      The exact removal command for each set above, one per set, in the same order, **in the CLI of that archive's own scheme** — `aws s3 rm` for `s3://`, `gsutil -m rm -r` for `gs://`, `az storage blob delete-batch` for `az://` and `rm -rf` for `file://`. **Reported, never executed.**

                      THE FIELD NAME SAYS `aws` AND THREE OF THE FOUR SCHEMES DO NOT, and the name is deliberately unchanged (Task 24a, plan erratum **E18(b)**): renaming a status field an adopter may already read, to fix a description, would cost more than the description was worth. What was actually broken is what the field CONTAINED — it printed `aws s3 rm 'file:///…'` for a filesystem archive, a string an operator runs and which does nothing — and that is fixed. This sentence is the description catching up with the value.
                    items:
                      type: string
                    nullable: true
                    type: array
                  evaluatedAt:
                    description: When the controller last evaluated retention.
                    format: date-time
                    nullable: true
                    type: string
                  keepDays:
                    description: '`spec.retention.keepDays`, as it was applied.'
                    format: int64
                    nullable: true
                    type: integer
                  keepLast:
                    description: '`spec.retention.keepLast`, **as it was applied**. Absent when no rule was configured, or when the configured value was not a non-negative count and was therefore not applied.'
                    format: int64
                    nullable: true
                    type: integer
                  mcCli:
                    description: The same commands in `mc`'s spelling. Reported, never executed.
                    items:
                      type: string
                    nullable: true
                    type: array
                  note:
                    description: Why the evaluation removed nothing, when the reason is not "there is nothing to remove" — set when no retention rule is configured.
                    nullable: true
                    type: string
                  setsKept:
                    description: The `backupId`s the policy keeps, newest first.
                    items:
                      type: string
                    nullable: true
                    type: array
                  setsThatWouldBeRemoved:
                    description: The sets the policy WOULD remove, newest first. They are still in the archive; Logweir deleted nothing.
                    items:
                      description: One set retention WOULD remove. **It is still in the archive.**
                      properties:
                        backupId:
                          description: The backup set's id — the manifest key's parent directory.
                          type: string
                        days:
                          description: The configured `keepDays`, when `reason` is `OlderThanKeepDays`.
                          format: int64
                          nullable: true
                          type: integer
                        newestRecordAt:
                          description: The set's newest record instant, read from the manifest BODY and never from the key string, which carries no timestamp.
                          format: date-time
                          type: string
                        rank:
                          description: The set's 1-based rank in newest-first order, when `reason` is `BeyondKeepLast`.
                          format: int64
                          nullable: true
                          type: integer
                        reason:
                          description: '`OlderThanKeepDays` or `BeyondKeepLast`. `OlderThanKeepDays` when both rules select the set, because age is the reason an operator acts on.'
                          type: string
                      required:
                      - backupId
                      - newestRecordAt
                      - reason
                      type: object
                    nullable: true
                    type: array
                  skipped:
                    description: 'The manifest keys under the prefix that could not be read, and why. Each was SKIPPED: it is in neither `setsKept` nor `setsThatWouldBeRemoved`, and the rest of the archive was still evaluated. An empty list means every manifest under the prefix was read.'
                    items:
                      description: One manifest key the evaluation could not read. **Task 19 review, F-5.**
                      properties:
                        key:
                          description: The manifest key, exactly as the archive listed it.
                          type: string
                        reason:
                          description: Why it could not be read — `is not a backup manifest` for a sibling JSON object the `/manifest.json` filter picked up, or the storage error's own message.
                          type: string
                      required:
                      - key
                      - reason
                      type: object
                    nullable: true
                    type: array
                type: object
            type: object
        required:
        - spec
        title: BackupSchedule
        type: object
        x-kubernetes-validations:
        - message: a BackupSchedule with retries must be named in 29 characters or fewer; retry Backups are named logweir-backup-<schedule>-<slot>-r<N>
          rule: '!has(self.spec.retry) || self.spec.retry.maxRetries == 0 || size(self.metadata.name) <= 29'
    served: true
    storage: true
    subresources:
      status: {}
