                    nullable: true
                    type: string
                  lastTransitionTime:
                    description: 'When `stage` or `reason` last CHANGED. Not a heartbeat: a reconciler''s own status patch is what wakes it (erratum E11(d)), so a field carrying a fresh clock read on every pass would make every pass a write.'
                    format: date-time
                    nullable: true
                    type: string
                  message:
                    description: A sanitized, bounded explanation.
                    maxLength: 1024
                    nullable: true
                    type: string
                  reason:
                    description: A CamelCase reason, from the same closed vocabulary the `RunnerReady` condition uses.
                    nullable: true
                    type: string
                  runner:
                    description: Facts about the one runner pod.
                    nullable: true
                    properties:
                      containerState:
                        description: '`Waiting`, `Running` or `Terminated`, for the `runner` container.'
                        nullable: true
                        type: string
                      jobName:
                        description: The Job.
                        nullable: true
                        type: string
                      podName:
                        description: The pod.
                        nullable: true
                        type: string
                      podPhase:
                        description: '`Pending`, `Running`, `Succeeded`, `Failed` or `Unknown`.'
                        nullable: true
                        type: string
                      scheduled:
                        description: Whether a node has been chosen. `false` with no diagnostic is the "nothing is wrong yet, it is just queued" case.
                        nullable: true
                        type: boolean
                      startedAt:
                        description: When the runner container started.
                        format: date-time
                        nullable: true
                        type: string
                      waitingReason:
                        description: The kubelet's own waiting reason, verbatim and bounded — `ImagePullBackOff`, `CreateContainerConfigError`. Verbatim because a translated kubelet reason is a reason nobody can search for.
                        maxLength: 64
                        nullable: true
                        type: string
                    type: object
                  runnerPhase:
                    description: The runner's own phase, when it reported one.
                    nullable: true
                    properties:
                      name:
                        description: The phase or step name, from the runner's own closed list.
                        maxLength: 32
                        nullable: true
                        type: string
                      number:
                        description: The phase number, `-1`..`9`. A backup reports `-1` with a step name, because it has steps and not the drill's numbered phases.
                        format: int32
                        maximum: 9
                        minimum: -1
                        nullable: true
                        type: integer
                    type: object
                  stage:
                    description: '`Admission`, `Queued`, `Preparing`, `Running`, `Verifying` or `Finished`.'
                    type: string
                required:
                - stage
                type: object
              queue:
                description: 'Present while a MANUAL run waits for a slot in its namespace''s manual-run pool (`phase: Queued`): the ceiling it is queued behind. No plan, no Job and no execution claim exist for a queued run; it starts in creation order when a slot frees. Absent on every other run, and on anything an older controller wrote.'
                nullable: true
                properties:
                  authorizationExpiresAt:
                    description: 'A queued `Restore`''s approval deadline: the signed `expires_at` of its authorization. The queue does NOT extend it — a restore still queued at this instant is refused `AuthorizationExpired`. Absent on a `Backup`, and for an approval that states no expiry.'
                    format: date-time
                    nullable: true
                    type: string
                  limit:
                    description: 'The ceiling this run is queued behind: the installation policy''s `runs.maxManualBackupsActivePerNamespace` (a `Backup`) or `runs.maxManualRestoresActivePerNamespace` (a `Restore`) when the run was queued.'
                    format: int64
                    type: integer
                required:
                - limit
                type: object
              records:
                description: How many records the run archived.
                format: int64
                nullable: true
                type: integer
              selection:
                description: What the run's topic resolution found, and what it may claim to have covered. Absent on a run frozen before dynamic selection existed.
                nullable: true
                properties:
                  coverage:
                    description: What it may claim to have covered.
                    enum:
                    - NamedTopics
                    - AllUserTopicsAttested
                    - VisibleUserTopicsOnly
                    type: string
                  discoveryObservedAt:
                    description: When discovery observed the cluster.
                    format: date-time
                    nullable: true
                    type: string
                  discoverySha256:
                    description: '`sha256:<lowercase hex>` over the discovery result the run froze.'
                    nullable: true
                    type: string
                  excludedByRuleCount:
                    description: How many the exclusion rules removed.
                    format: int64
                    nullable: true
                    type: integer
                  internalExcludedCount:
                    description: How many internal topics were excluded.
                    format: int64
                    nullable: true
                    type: integer
                  limitedTopicCount:
                    description: How many the broker refused to describe. **Non-zero with coverage `VisibleUserTopicsOnly` is the case this whole block exists to make visible.**
                    format: int64
                    nullable: true
                    type: integer
                  mode:
                    description: Which mode the run used.
                    enum:
                    - SelectedTopics
                    - AllUserTopics
                    type: string
                  resolvedTopicBytes:
                    description: How many bytes those names take, so a reader can see the run approaching the plan-size bound before it hits it.
                    format: int64
                    nullable: true
                    type: integer
                  resolvedTopicCount:
                    description: How many topics the run froze.
                    format: int64
                    type: integer
                  visibility:
                    description: '`unknown`, `limited` or `attestedComplete`, as discovery reported it. **A successful listing alone is `unknown`.**'
                    nullable: true
                    type: string
                required:
                - coverage
                - mode
                - resolvedTopicCount
                type: object
              windowCovered:
                description: The window the archive covers, in epoch milliseconds — interface **I22**.
                nullable: true
                properties:
                  fromMs:
                    description: Inclusive start of the covered window, epoch milliseconds.
                    format: int64
                    type: integer
                  toMs:
                    description: Exclusive end of the covered window, epoch milliseconds.
                    format: int64
                    type: integer
                required:
                - fromMs
                - toMs
                type: object
            type: object
        required:
        - spec
        title: Backup
        type: object
    served: true
    storage: true
    subresources:
      status: {}
