# Default-deny egress on runner pods, with explicit allowances.
#
# ---------------------------------------------------------------------------
# [UNVERIFIED — docker-desktop runs no CNI that enforces NetworkPolicy, so a
# deny is never observed here; only the kind+Calico probe would make this claim
# real, and it is backlogged]
# ---------------------------------------------------------------------------
# This mark stays **in place, in the shipped manifest**, per STANDING RULE 22
# and spec §15 marks 3 and 4. It is not a caveat about wording: on
# docker-desktop this object is accepted by the API server, stored, and
# **enforced by nothing**. "The drill still reached the broker" passes whether
# this policy is right, wrong, or absent, so no gate in this plan can tell you
# which it is. What would verify it: create a `kind` cluster with Calico,
# install this policy, and show a runner pod's connection to an address NOT
# allowed below timing out while the broker connection succeeds.
#
# ---------------------------------------------------------------------------
# THE SELECTOR IS THE JOB LABEL, BECAUSE RUNNER PODS CARRY NO LABEL OF OUR OWN
# ---------------------------------------------------------------------------
# `weirkeeper::job::build` leaves the Job's `PodTemplateSpec.metadata` unset, so
# the only labels a runner pod has are the ones the Job controller adds:
# `batch.kubernetes.io/job-name`, `batch.kubernetes.io/controller-uid` and their
# legacy spellings. `matchExpressions: [{key: batch.kubernetes.io/job-name,
# operator: Exists}]` therefore selects every Job pod in the namespace — which
# is every runner pod, and, in a namespace an adopter also uses for other
# batch work, those pods too. Narrowing it means giving runner pods a label
# first, in `job::build`, which is a code change and not this file's.
#
# ---------------------------------------------------------------------------
# IT ONLY ACTS ON THE NAMESPACE IT IS APPLIED TO
# ---------------------------------------------------------------------------
# A NetworkPolicy is namespaced. `logweir.yaml` installs this one into
# `logweir-system` because that is the file's namespace, and **runner Jobs do
# not run there** — they run in the namespace of the `Backup`, `Restore` or
# `KafkaCluster` object that produced them. Apply it into each of those too —
# dropping this file's own `namespace:` line on the way in, because
# `kubectl apply -n <namespace>` refuses a manifest whose namespace disagrees:
#
#     kubectl --context docker-desktop -n <namespace> \
#       apply -f <(sed '/^  namespace: logweir-system$/d' config/manager/networkpolicy.yaml)
#
# ---------------------------------------------------------------------------
# WHAT IS ALLOWED, AND WHAT AN ADOPTER SHOULD TIGHTEN
# ---------------------------------------------------------------------------
# The shipped rules allow egress **by port and nothing else**: DNS to
# `kube-system`, the five broker listeners of STANDING RULE 15, and 443/9000 for
# the object store. Every other destination and every other port is denied, and
# there is no ingress rule at all, so all inbound traffic to a runner pod is
# denied. A destination CIDR is deliberately NOT shipped: a wrong `ipBlock`
# would be a policy that looks specific and denies the adopter's own broker.
# Tightening is one edit — add `to: [{ipBlock: {cidr: <broker>/32}}]` to the
# broker rule and the object store's own address to the third — and it is the
# step that turns this from a port allowlist into a destination allowlist.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logweir-runner-egress
  namespace: logweir-system
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: Exists
  # Egress only. With no `Ingress` type named, ingress is unaffected by this
  # object; with no ingress rule and `Ingress` not in `policyTypes`, nothing
  # here denies inbound traffic either. Runner pods serve nothing, so the
  # inbound story is the absence of a port and not a policy.
  policyTypes:
    - Egress
  egress:
    # DNS. Without this every other rule below is unreachable by name, and the
    # failure looks like a broker that is down rather than a policy that is on.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The broker. The five listeners of STANDING RULE 15: 9092 EXTERNAL,
    # 9094 PLAINTEXT (inter-broker), 9095 K8S (the one a pod uses), 9096 SASL,
    # 9097 SASLEXT.
    - ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9094
        - protocol: TCP
          port: 9095
        - protocol: TCP
          port: 9096
        - protocol: TCP
          port: 9097
    # The object store: 443 for a real S3-compatible endpoint, 9000 for the
    # MinIO the demo stack runs.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9000
