# The `weirkeeper` Deployment — the control plane itself.
#
# ---------------------------------------------------------------------------
# THIS PodSpec IS THE ONE `automountServiceAccountToken` EXEMPTION
# ---------------------------------------------------------------------------
# Critique B **H14**, spec §9. Every runner PodSpec `job::build` produces
# carries `automountServiceAccountToken: false`, and so does the runner's own
# ServiceAccount, because `logweir backup run` makes zero Kubernetes API calls
# and is the process that holds the signing key. This pod is the opposite: it
# is the ONLY Kubernetes API client in the design
# (`design-operator.md:355-359`), and removing its projected token stops it
# opening a single watch. So it names `serviceAccountName: weirkeeper` and does
# **not** set the field at all.
#
# THE EXEMPTION IS A LITERAL PATH LIST AND NEVER A PATTERN.
# `crates/logweir/tests/manifest_lint.rs`'s
# `runner_pods_do_not_automount_a_token` carries the list; a second exempt
# PodSpec is a diff in that test, reviewed on its own merits, rather than a
# glob that quietly grew.
#
# ---------------------------------------------------------------------------
# ONE REPLICA, `Recreate`, AND NO LEADER ELECTION
# ---------------------------------------------------------------------------
# Global Constraint 30: one controller per cluster. There is no leader-election
# lease in `crates/weirkeeper/` — `main.rs` builds one client and registers six
# `Controller`s — so two running copies would each see the same due schedule
# slot and each `POST` a `Backup`. `RollingUpdate` starts the new pod before the
# old one is gone and would produce exactly that overlap during every upgrade,
# which is why the strategy is `Recreate` and the replica count is 1. Neither is
# a tuning knob.
#
# ---------------------------------------------------------------------------
# NO PROBES, NO PORTS, NO Service — AND THAT IS THE DESIGN
# ---------------------------------------------------------------------------
# Global Constraint 32: tag 1 ships no HTTP surface. This binary serves nothing
# — no `/healthz`, no `/metrics`, no byte-echo route — so an `httpGet` probe
# would fail and a `tcpSocket` probe would have nothing to connect to. The
# liveness signal is the process: `main.rs` returns a non-zero `ExitCode` on
# every fatal path and the kubelet restarts the container. Adding a probe here
# means first adding a listener, which is a tag-2 decision.
#
# ---------------------------------------------------------------------------
# THE IMAGE IS A DIGEST (Task 23), AND IT IS STILL `blocked: images not published`
# ---------------------------------------------------------------------------
# Global Constraint 7 pins by digest and never by tag. The reference below is
# the literal registry namespace of Global Constraint 24 followed by the
# manifest-list digest `docker inspect --format '{{index .RepoDigests 0}}'
# weirkeeper:check` reported for the image `just image-weirkeeper` built on
# 2026-09-11. A TAG here would have made the whole control plane replaceable by
# a `docker build -t ghcr.io/logweir/weirkeeper:v0.1.0` on the node, without
# touching a single Kubernetes object — the same defect
# `examples/cronjob-drill.yaml:78` had for the runner image.
#
# THE DIGEST DOES NOT MAKE THIS PUBLISHABLE, and Global Constraint 37 is
# unchanged by it. "Published" means a PULL from a registry the author does not
# control; this digest names bytes that exist on exactly one laptop, and **no
# such image has been pushed**. Until a git remote exists and `release.yml` has
# run against it, `logweir.yaml`'s digest rows read `blocked: images not published`.
# Applying this file on a cluster with no access to that repository leaves the
# pod in `ImagePullBackOff`, and X-APPLY does not claim otherwise: it proves
# `kubectl apply` exits 0, not that a pod starts (spec §16 clause 1).
#
# MEASURED, NOT ASSUMED (X-DIGEST, `docs/kubernetes.md` §14). On docker-desktop
# v1.34.1 a pod referencing this exact digest string starts **once the image has
# been tagged into that repository name locally**, because the kubelet keys on
# the whole reference and a matching digest alone does not make the repository
# name resolve. And the digest a locally built image reports changes on every
# build — including a fully cached no-op rebuild, because BuildKit re-generates
# the provenance attestation — so this value is not reproducible even here.
#
# For an author-only local run, `config/overlays/local-images` rewrites this
# reference to `weirkeeper:check` with `imagePullPolicy: Never`.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weirkeeper
  namespace: logweir-system
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: logweir
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: weirkeeper
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weirkeeper
          image: ghcr.io/logweir/weirkeeper@sha256:fa0060bdfc6902be32ee28367a08f647cf64505063e1f1f447c6c4c73ee716ea
          imagePullPolicy: IfNotPresent
          # NO ARGUMENTS. `weirkeeper` takes `--version`, `--help`, or nothing
          # at all, and anything else exits 1 naming what it got
          # (`crates/weirkeeper/src/main.rs`). There is no argument parser to
          # pass a flag to.
          args: []
          env:
            # ---------------------------------------------------------------
            # `RUST_LOG`, PINNED — AND THE DEFAULT INSTALL WAS SILENT WITHOUT IT
            # ---------------------------------------------------------------
            # MEASURED during Task 24's Phase B run: `kubectl -n logweir-system
            # logs deploy/weirkeeper` returned **exit 0 and ZERO BYTES** on a
            # controller that had just reconciled six kinds, created two Jobs
            # and verified two signed documents. `main.rs` builds its subscriber
            # with `EnvFilter::from_default_env()`, and with `RUST_LOG` unset
            # that filter enables nothing — including every `error!` the startup
            # path uses to say why it could not build a client or an archive
            # handle. A control plane whose diagnostics are invisible by default
            # is a control plane nobody can debug.
            #
            # `info` IS THE FLOOR AND NOT A PREFERENCE, for the same reason the
            # runner Job pins it (`controllers::backup::runner_job_spec`): below
            # `info` the per-object lines — the exit code, the two evidence
            # keys, the verification verdict and its matched key id — are lost,
            # and those are what correlate an object with the archive it read.
            # Raise it with `kubectl set env deploy/weirkeeper RUST_LOG=debug`.
            - name: RUST_LOG
              value: info
            # THE READ-ONLY ARCHIVE HANDLE, AND THE ONLY OPTIONAL PIECE OF THIS
            # PodSpec. Unset, the controller holds no archive handle at all and
            # writes no `retentionReport` — it logs that it is doing so and the
            # other five reconcilers are unaffected
            # (`weirkeeper::retention::ARCHIVE_URL_ENV`). Set it, and add the
            # `logweir-evidence-ro` credential beside it, to turn retention
            # reporting and the UI's verification display on. Shipped empty so
            # the default install is the one every gate in this plan runs.
            - name: LOGWEIR_ARCHIVE_URL
              value: ""
            # ---------------------------------------------------------------
            # THE FIFTH SECRET — `logweir-evidence-ro`, AND `optional: true`
            # ---------------------------------------------------------------
            # Task 24, spec §9, Global Constraint 6 ("a separate bucket and a
            # separate principal"). This is the controller's READ-ONLY evidence
            # credential: with it, `weirkeeper` fetches the signed receipt or
            # scorecard a run wrote, checks the digest the status recorded and
            # verifies the DSSE sidecar against `TrustRoster.spec.signingKeys`,
            # and `status.evidence.verification` says `Valid` or `Invalid`.
            #
            # IT IS A DIFFERENT PRINCIPAL FROM THE RUNNER'S `logweir-s3`, and
            # it must be read-only. Retention only REPORTS (Task 19, guard
            # G-RET) and the handle is built with the read-only constructor, so
            # no Logweir component in tag 1 holds any delete capability against
            # object storage.
            #
            # THE CONTROLLER READS IT FROM ITS OWN ENVIRONMENT AND NEVER
            # THROUGH THE API. The `weirkeeper` ClusterRole grants no verb on
            # `secrets` (Task 21), and
            # `tests/linkage.rs::the_controller_never_reads_a_secret` keeps it
            # that way — which is why this is an env projection and not a
            # `secretRef` the controller resolves.
            #
            # `optional: true` IS THE DOCUMENTED SWITCH, AND IT IS LOAD-BEARING
            # (spec §9). Without it, a cluster that has not created this Secret
            # gets a pod stuck in `CreateContainerConfigError` — all six
            # reconcilers down for want of a DISPLAY feature. With it, the
            # controller starts, holds no evidence handle, and every
            # verification reads `NotAttempted` with the reason and the
            # `logweir drill verify` command an operator can run instead. That
            # is why `NotAttempted` exists as a verdict distinct from `Invalid`:
            # declining to give the control plane bucket access is a choice,
            # not a bad document.
            # `crates/weirkeeper/tests/verification.rs::the_deployment_marks_the_evidence_secret_optional`
            # asserts both entries carry it.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: logweir-evidence-ro
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: logweir-evidence-ro
                  key: secret-access-key
                  optional: true
            # ---------------------------------------------------------------
            # NO ENDPOINT HERE, AND THAT IS GLOBAL CONSTRAINT 37
            # ---------------------------------------------------------------
            # The Phase B demo reaches the compose stack's MinIO at
            # `http://host.docker.internal:9000` and needs `AWS_ENDPOINT_URL`,
            # `AWS_REGION=us-east-1` and `AWS_ALLOW_HTTP=true` to do it. Those
            # are LAPTOP-SPECIFIC and they are not in this file: a stranger has
            # to be able to apply `logweir.yaml` unedited, and a shipped
            # manifest naming one machine's hostname is not that. The demo
            # patches them in through `config/overlays/k8s-demo`, which is
            # author-only, and `just k8s-demo` applies it.
            #
            # An adopter on MinIO or Ceph sets the same three here, beside the
            # two above. The controller then FORWARDS them to every runner Job
            # it creates (`weirkeeper::controllers::backup::ARCHIVE_ADDRESSING_ENV`),
            # so the endpoint is configured once rather than in two places that
            # can disagree.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
