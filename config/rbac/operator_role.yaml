# `logweir-operator` — create the four operational kinds, and edit a schedule.
#
# ---------------------------------------------------------------------------
# WHAT MAY CHANGE IS CEL, NOT RBAC, AND IT CANNOT BE WRITTEN HERE
# ---------------------------------------------------------------------------
# An RBAC `rules[]` entry is `apiGroups`, `resources`, `verbs` and
# `resourceNames` and nothing else — there is no field in which a CEL
# expression could be written, so "`update` restricted to these fields" is not
# expressible in a ClusterRole and must not be attempted (critique B H13,
# spec §9 amendment 4b, claim C97). An implementer who tries produces either a
# ClusterRole the API server rejects or a key it silently ignores, and the
# second is worse: the install succeeds and the restriction does not exist.
#
# THE RESTRICTION ALREADY EXISTS, IN THE CRD. `config/crd/backupschedules.yaml`
# carries an object-level `x-kubernetes-validations` rule on `.spec` sealing
# `sourceRef` — pinned both for presence and for value — with the message
# `spec.sourceRef is immutable; create a new BackupSchedule to protect a
# different cluster`, plus a rule binding `allUserTopics` to an empty `topics`
# and a root rule bounding a retrying schedule's name. **The API server applies
# them to every subject, cluster-admin included**, which is a stronger
# statement than any ClusterRole could make about any one of them. So the
# grants below are plain verbs, and what they may change is enforced one layer
# up.
#
# BOTH `update` AND `patch` (PLAT-05.1). PLAT-05.1 makes a schedule's policy
# editable, and the two commands an operator actually runs — `kubectl edit` and
# `kubectl apply` — send a PATCH. `update` alone leaves an operator who is told
# the policy is editable unable to edit it. `patch` widens nothing the CRD does
# not already allow: it reaches exactly the fields `update` reaches, and
# `sourceRef` is refused through either verb.
#
# Editing is safe because a RUN is not editable: every `Backup` a schedule
# creates copies the policy and records the revision it ran under, and its
# resolved settings are frozen before any Job exists. An edit reaches the next
# admission and never a run that exists.
#
# SHIPPED UNBOUND. Bind it per namespace:
#
#     kubectl --context docker-desktop create rolebinding logweir-operator \
#       --clusterrole=logweir-operator --user=<user> -n <namespace>
#
# THE THREE D2 KINDS (§7.2): `create`, AND `patch` WITHOUT `update`.
# `BackupDestination`, `TopicDiscovery` and `Preflight` are created by an
# operator and then edited in exactly two ways: a destination's access grants
# and CA reference change (its location and transport are sealed by CEL), and a
# check is CANCELLED by flipping `spec.cancelRequested` false → true, which the
# CRD's own rule is what permits. Both are merge patches, and `kubectl edit`,
# `kubectl apply` and the console all send a PATCH — so `patch` is the verb
# that does the work and `update` would be a grant nobody uses. Same story as
# `backupschedules` above: what may change is the CRD's CEL, not this file.
#
# NO `delete`. A terminal check is collected by the controller's own GC (D2
# §5.8) and a destination is removed by a cluster administrator; an operator
# who could delete a `BackupDestination` could remove the object a running
# Backup froze its location from.
#
# THE THREE D3 KINDS (§9): `create`, PLUS THE EDIT EACH ONE ACTUALLY ALLOWS.
# D3 §9 gives the operator `create` on `protectionpolicies`,
# `rehearsalschedules` and `recoverycatalogs`, and — exactly as with
# `backupschedules` above — what may then CHANGE is the CRD's own CEL rule and
# not a verb here:
#
# * `protectionpolicies` carries NO immutability seal on `.spec`. An objective
#   is policy an operator is expected to tune, so it gets `update` AND `patch`,
#   for the same reason `backupschedules` has both: `kubectl edit` and
#   `kubectl apply` send a PATCH, so `update` alone is a grant nobody can use.
# * `rehearsalschedules` seals every field but `spec.suspend` — "the standing
#   authorization binds a digest of this spec, so an edit would authorize work
#   nobody approved". Suspending is a merge patch, so `patch` WITHOUT `update`:
#   a PUT of the whole object is the shape most likely to carry a second,
#   unnoticed field, and the API server would refuse it for that field alone.
# * `recoverycatalogs` seals everything but `spec.syncRequest` ("a catalog of a
#   different location is a different catalog"). Same shape, same verb.
#
# THE FOURTH D3 KIND IS NOT HERE, AND THAT IS THE DECISION. `retentionpolicies`
# is the only kind in this product whose object can end in a deletion, so its
# write verbs live in `logweir-retention-admin` — a sixth role, bound
# separately, exactly as `logweir-trust-admin` holds the `TrustPolicy` writes.
# An operator who could write a `RetentionPolicy` could move an installation
# from `Report` to `Enforce`, which D3 §12 makes "a separate, later,
# administrator decision with its own credential".
#
# NO `delete` ON ANY OF THE THREE, for the reason the D2 block gives: a
# `RecoveryCatalog` deleted mid-sync loses the view a `RetentionPolicy`
# evaluates against, and a deleted `ProtectionPolicy` silently stops being the
# thing that says whether you can recover.
#
# NO `approvals` HERE. Creating a restore and approving one are different
# people on purpose (`logweir-approver`); an operator who could do both makes
# `self_attested: false` unachievable in this namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-operator
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/component: human-role
rules:
  # Start work: a cluster connection, a schedule, a one-off backup, a restore.
  - apiGroups: ["logweir.dev"]
    resources:
      - backups
      - backupschedules
      - kafkaclusters
      - restores
    verbs: ["create"]
  # Edit a schedule's policy, and suspend or resume it. PLAIN verbs — see this
  # file's header for why they cannot carry the restriction, where the
  # restriction actually is, and why `patch` is needed beside `update`.
  - apiGroups: ["logweir.dev"]
    resources: ["backupschedules"]
    verbs: ["update", "patch"]
  # D2 §7.2 — start a destination, an inventory or a readiness check.
  - apiGroups: ["logweir.dev"]
    resources:
      - backupdestinations
      - preflights
      - topicdiscoveries
    verbs: ["create"]
  # …and edit the two things their CRDs let anybody edit: a destination's
  # access grants and CA, and a check's `cancelRequested`.
  - apiGroups: ["logweir.dev"]
    resources:
      - backupdestinations
      - preflights
      - topicdiscoveries
    verbs: ["patch"]
  # D3 §9 — declare protection, connect an archive, schedule a rehearsal.
  - apiGroups: ["logweir.dev"]
    resources:
      - protectionpolicies
      - recoverycatalogs
      - rehearsalschedules
    verbs: ["create"]
  # A `ProtectionPolicy`'s spec is not sealed: objectives are policy, and both
  # verbs are needed for the same reason `backupschedules` needs both.
  - apiGroups: ["logweir.dev"]
    resources: ["protectionpolicies"]
    verbs: ["update", "patch"]
  # …and the ONE mutable field each of the other two has — `spec.suspend` and
  # `spec.syncRequest` — both merge patches, both bounded by the CRD's own CEL.
  # `patch` WITHOUT `update`. See this file's header.
  - apiGroups: ["logweir.dev"]
    resources:
      - recoverycatalogs
      - rehearsalschedules
    verbs: ["patch"]
