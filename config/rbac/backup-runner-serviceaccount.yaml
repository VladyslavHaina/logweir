# The runner pod's ServiceAccount — a FRAGMENT, and interface I28's first half.
#
# WHY THIS FILE IS A FRAGMENT AND NOT AN INSTALLABLE MANIFEST. The `Backup`
# reconciler (Task 17) creates Jobs whose pods name this ServiceAccount, and
# the ClusterRole/ClusterRoleBinding that make the CONTROLLER able to do that
# are Task 21's `logweir.yaml`, at slot 14. This plan calls that a DECLARED
# late binding rather than a gap: the requesting task writes down exactly what
# it needs, in a file the granting task can diff against, and
# `crates/weirkeeper/tests/backup_controller.rs::the_rbac_fragments_request_pod_logs_the_plan_config_map_and_nothing_more`
# asserts the request. Task 21 closes the pair with
# `weirkeeper_can_read_pod_logs_and_nothing_more`.
#
# Namespace deliberately unset: a fragment is applied into the namespace the
# `Backup` objects live in (`logweir-t<N>` for a task, an adopter's own
# namespace otherwise), and a hard-coded one here would be wrong everywhere.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logweir-runner
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/component: runner
# THE RUNNER HOLDS NO CLUSTER CREDENTIAL, AND THAT IS THE DESIGN, NOT AN
# OVERSIGHT. `logweir backup run` makes ZERO Kubernetes API calls — it reads a
# mounted plan, talks to a broker and an object store, and exits — so a
# projected token would be a credential in a pod that has no use for it. It
# would also be a credential in the one pod that holds the SIGNING KEY, which
# is precisely the component `design-operator.md:355-359` keeps away from the
# cluster API.
#
# `job::build` sets `automountServiceAccountToken: false` on the pod as well,
# so the refusal holds even if this account is later granted something. Two
# statements of one property, because the pod spec is what kubelet reads and
# this line is what an operator reads.
automountServiceAccountToken: false
# NO ClusterRoleBinding AND NO RoleBinding IN THIS FILE. There is nothing to
# bind: this account is granted no verb on any resource. A binding to an empty
# role would be a line an operator has to audit for no benefit.
