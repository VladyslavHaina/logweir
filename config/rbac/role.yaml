# The `weirkeeper` ClusterRole — interface **I28**, the grant half.
#
# THE REQUEST HALF IS `backup-reconciler-rbac-request.yaml`, BESIDE THIS FILE,
# AND IT STAYS THERE. Task 17 wrote down what the `Backup` reconciler needs, in
# the shape a grant takes, so that this file could be a DIFF rather than an
# interpretation; `crates/weirkeeper/tests/backup_controller.rs`'s
# `the_rbac_fragments_request_pod_logs_the_plan_config_map_and_nothing_more` asserts the request and
# `crates/logweir/tests/manifest_lint.rs`'s
# `weirkeeper_can_read_pod_logs_and_nothing_more` asserts this grant. Two files,
# two tests, one closed interface. The request is NOT installed by anything and
# `config/rbac/kustomization.yaml` deliberately does not list it.
#
# ---------------------------------------------------------------------------
# THE RULE THIS FILE IS WRITTEN BY: EVERY GRANTED VERB HAS A CALLER
# ---------------------------------------------------------------------------
# Critique B **M18**. A verb nobody calls is a capability nobody audits, and it
# is discovered by an attacker before it is discovered by a reviewer. Every
# `verbs:` entry below is named by at least one `Api::` call under
# `crates/weirkeeper/src/`, `crates/logweir/tests/manifest_lint.rs`'s
# `every_granted_verb_has_a_caller` keeps that true, and the call site is named
# in the comment above each rule.
#
# AND THE CONVERSE, WHICH COST A P0: EVERY CALL HAS A GRANT. The rule above,
# read alone, is silent about a call whose verb is granted NOWHERE, and one
# shipped: the `BackupSchedule` reconciler reserved a `Forbid` slot with
# `Api::replace_status`, a `PUT`, authorised as `update` on
# `backupschedules/status` — which this file grants on nothing. Every due slot
# of every schedule 403'd and no scheduled Backup was ever created, while the
# route-table tests, which answer whatever they are asked for, stayed green.
# `manifest_lint.rs`'s `every_call_site_has_a_grant` is the other direction:
# it derives each `Api<T>` method called under `crates/weirkeeper/src/` and
# requires a matching (resource, verb) here, in `logweir.yaml`, and in every
# rendered chart copy. Status writes are merge `PATCH`es carrying
# `metadata.resourceVersion` as the API server's update precondition — that is
# how the reservation keeps its compare-and-set with `patch` alone.
#
# WHERE SPEC §9's ENGLISH AND THE RBAC VERB SET DISAGREE, THE CALLERS DECIDE.
# §9 says "`update` on their `/status` only" and "Job CRUD"; the load-bearing
# words are **only** (the status subresource and not the whole object) and
# **Job** (and not pods). The RBAC verbs that implement them are what the code
# calls: every status write in this crate is `Api::patch_status` — a merge
# patch, so an absent key means "leave it alone" — and no reconciler anywhere
# calls `Api::replace`, so a literal `update` would be a granted verb with no
# caller, which is the exact defect M18 names. `delete` is the same story: "Job
# CRUD"'s D is done by the API server's TTL controller after this controller
# patches `ttlSecondsAfterFinished`, and by ownerReference garbage collection
# for the plan ConfigMap and the probe Job. **`delete` appears in no rule in
# this file, on any resource.** Where §9 instead names an RBAC-shaped triple —
# `get/list/watch` on Pods, `get` on `pods/log`, no verb on Secrets — it is
# taken literally and verbatim.
#
# ---------------------------------------------------------------------------
# NO VERB ON `secrets`, AT ALL, ANYWHERE IN THIS FILE
# ---------------------------------------------------------------------------
# Spec §9 and `design-operator.md:278-281`. The runner Job mounts
# `logweir-signing-key`, `logweir-approval-bundle` and the per-cluster SCRAM
# credential, and it reads the object-store credential from `secretKeyRef` env
# — every one of those is projected by the **kubelet** from a reference this
# controller writes into a PodSpec. Writing a reference is not reading a value,
# so the controller never needs, and never gets, a verb on `secrets`.
#
# THIS BOUNDS READS AND NOT CAPABILITY, AND SAYING SO IS PART OF THE GRANT.
# Global Constraint 27, O1/O0 default (a): Job create in a namespace holding
# the signing key is equivalent to holding the key, because this controller can
# create a pod that mounts it. The narrow claim — the controller cannot READ the
# Secret — is true and is the one made here; the broader one is withdrawn and is
# not restated on any surface.
#
# ---------------------------------------------------------------------------
# TWO GAPS THE PLAN'S OWN SOURCES HAD, CLOSED HERE, EACH WITH ITS CALLER
# ---------------------------------------------------------------------------
# 1. **`create` on `backups`.** The `BackupSchedule` reconciler is what turns a
#    schedule into a run: `controllers/backup_schedule.rs` builds a `Backup` and
#    `POST`s it (`api.create(&PostParams::default(), &backup)`). No source for
#    this task listed that verb. Without it every slot a schedule fires 403s and
#    the schedule silently never produces a backup.
# 2. **`patch` on `jobs`.** Every runner Job is patched with
#    `ttlSecondsAfterFinished` AFTER the status write carrying its exit code —
#    the ordering that keeps the pod (and therefore the exit code and the
#    evidence keys) alive until they have been read. Three reconcilers do it.
#    Without it the TTL is never set and finished Jobs accumulate forever.
#
# ---------------------------------------------------------------------------
# `pods/log` IS A SUBRESOURCE (critique B H8, spec §9 amendment 4a, C96)
# ---------------------------------------------------------------------------
# `{apiGroups: [""], resources: ["pods"], verbs: ["get"]}` authorises the pod
# OBJECT. A `GET /api/v1/namespaces/<ns>/pods/<p>/log` is authorised against the
# resource string `pods/log`, which has to be named in a rule of its own. There
# is exactly ONE such rule below, its verb list is exactly `["get"]`, and no
# rule anywhere in this file names `pods/exec` or `pods/attach` — both would let
# this controller start a process inside the pod holding the signing key, which
# is strictly more than reading that pod's stdout.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: weirkeeper
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/component: control-plane
rules:
  # THE SIX KINDS. `list` and `watch` are what `Controller::new(api, …)` opens
  # in all six of `controllers/{approval,backup,backup_schedule,kafka_cluster,
  # restore,trust_roster}.rs`; `get` is the referent read —
  # `controllers/backup.rs` and `controllers/restore.rs` `get_opt` the
  # `KafkaCluster` a spec names, `controllers/restore.rs` `get_opt`s the
  # `Approval`, `controllers/approval.rs` `get`s the `Backup` or `Restore` an
  # approval points at, and `controllers::approval::load_roster` `get`s the
  # cluster-scoped `TrustRoster` named `default` (interface I16).
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals
      - backups
      - backupschedules
      - kafkaclusters
      - restores
      - trustrosters
    verbs: ["get", "list", "watch"]
  # THE SEVENTH KIND, IN ITS OWN RULE AND NOT ADDED TO THE LIST ABOVE — D2 W7,
  # PLAT-08.1. `list` and `watch` are `Controller::new(api, …)` in
  # `controllers/backup_destination.rs`; `get` is the referent read —
  # `destination::resolve_ref` `get_opt`s the `BackupDestination` a
  # `destinationRef` names, in the referring object's OWN namespace and in no
  # other.
  #
  # A SEPARATE RULE ON PURPOSE. The six-kind list above is the set the
  # `logweir-viewer` role also names, verb for verb; folding a seventh kind
  # into it would silently widen a human role in a diff that reads as a
  # controller change. It also keeps the grant next to the reason it exists, so
  # a reviewer sees the caller and the verb together.
  #
  # NOTE FOR W11 (D2 §13.2): these two rules are W11's to own. They are here
  # because the reverse lint `every_call_site_has_a_grant` fails the moment
  # `Api<BackupDestination>` appears under `crates/weirkeeper/src/`, and a call
  # with no grant 403s in production while every route-table test stays green.
  # W11 folds them into its own RBAC pass together with `topicdiscoveries` and
  # `preflights`.
  - apiGroups: ["logweir.dev"]
    resources: ["backupdestinations"]
    verbs: ["get", "list", "watch"]
  # THE EIGHTH KIND — D2 W8, PLAT-09.1. `list` and `watch` are
  # `Controller::new(api, …)` in `controllers/topic_discovery.rs`, and that is
  # the WHOLE of it.
  #
  # NO `get`, AND THAT IS NOT AN OVERSIGHT. D2 §7.1 sketches
  # `get/list/watch` for all three new kinds; this controller calls
  # `Api::<TopicDiscovery>::get_opt` NOWHERE — a discovery's spec is immutable
  # and the reconciler is handed the object by the watch, so there is nothing
  # to re-read. `every_granted_verb_has_a_caller` is this file's governing rule
  # (critique B M18), and a `get` here would be a granted verb with no caller.
  # The callers D2 §7.1 anticipated are the console API's ServiceAccount
  # (§7.3), which is a DIFFERENT role, and `gc.rs` — see the `delete` note in
  # this file's header.
  #
  # NOTE FOR W11 (D2 §13.2): these two rules are W11's to own. They are here
  # because the reverse lint `every_call_site_has_a_grant` fails the moment
  # `Api<TopicDiscovery>` appears under `crates/weirkeeper/src/`, and a call
  # with no grant 403s in production while every route-table test stays green.
  # W11 folds them into its own RBAC pass together with `backupdestinations`
  # and `preflights`, and adds `events: [list]` — which
  # `controllers/topic_discovery.rs` deliberately does not use yet, passing the
  # waiting classifier an EMPTY fact slice rather than building an `Api<Event>`
  # this role cannot authorise.
  - apiGroups: ["logweir.dev"]
    resources: ["topicdiscoveries"]
    verbs: ["list", "watch"]
  # THE NINTH KIND, IN ITS OWN RULE — D3 W8, PLAT-15.1. `list` and `watch` are
  # `Controller::new(api, …)` in `controllers/recovery_catalog.rs`, and they are
  # the WHOLE grant: `get` is NOT here, because that reconciler never reads a
  # `RecoveryCatalog` by name — the watcher hands it the object and it patches
  # that object's `/status`. Every granted verb has a caller (critique B M18),
  # and this is the first kind for which the uniform `get/list/watch` shape
  # would have been a grant with none — the same call this file already makes
  # for `topicdiscoveries` just above.
  #
  # NOTE FOR W13 (D3 §14): these two rules are W13's to own. They are here
  # because the reverse lint `every_call_site_has_a_grant` fails the moment
  # `Api<RecoveryCatalog>` appears under `crates/weirkeeper/src/`, and a call
  # with no grant 403s in production while every route-table test stays green.
  # W13 folds them into its own RBAC pass together with `protectionpolicies`,
  # `rehearsalschedules`, `retentionpolicies` and `trustpolicies`, and adds the
  # matching human-role rows (viewer get/list/watch; operator create plus the
  # CEL-narrowed `syncRequest` patch). **NO `delete` ANYWHERE**: the view is
  # collected by the sync Job's TTL and by ownerReference garbage collection,
  # which is the whole reason the pages are owned by the Job (D3 §5.3).
  #
  # `get` WAS ADDED BY D3 W6 (PLAT-14.2), AND IT IS FOLDED INTO THIS RULE
  # RATHER THAN GIVEN ONE OF ITS OWN. `controllers/protection_policy.rs`
  # `get_opt`s the ONE `RecoveryCatalog` a `ProtectionPolicy` names in
  # `spec.protects.catalogRef`, to learn whether the materialised view is still
  # current and which page `ConfigMap`s carry its entries. One rule per
  # resource is how every other kind in this file reads, and two rules naming
  # `recoverycatalogs` would invite a later edit to widen one of them without
  # the other being looked at. The alternative to this verb is `list` on
  # `configmaps` cluster-wide — which the ConfigMap rule below refuses by name,
  # and which is strictly wider than one `get` on one named object of one kind.
  - apiGroups: ["logweir.dev"]
    resources: ["recoverycatalogs"]
    verbs: ["get", "list", "watch"]
  # THE TENTH KIND — D2 W9, PLAT-03.1 / PLAT-03.2. `list` and `watch` are
  # `Controller::new(api, …)` in `controllers/preflight.rs`, and that is the
  # whole of it.
  #
  # NO `get`, FOR THE SAME REASON AS THE EIGHTH AND ONE MORE. Nothing in this
  # crate calls `Api<Preflight>::get`: a `Preflight` reaches its reconciler
  # from that controller's own watcher and from nowhere else, because NO OTHER
  # OBJECT REFERENCES ONE — D2 §6.8's whole point is that no execution path may
  # look one up, and `preflight_controller::no_execution_path_reads_preflight_or_discovery`
  # is the source scan that keeps it true. A `get` here would be a granted verb
  # with no caller (critique B M18).
  #
  # NOTE FOR W11 (D2 §13.2): these two rules are W11's to own, with the
  # `events` rule below. W11 folds all three into its own RBAC pass together
  # with `backupdestinations`, `topicdiscoveries` and `recoverycatalogs`.
  - apiGroups: ["logweir.dev"]
    resources: ["preflights"]
    verbs: ["list", "watch"]
  # THE TWO WRITES TO A CUSTOM RESOURCE THAT ARE NOT A STATUS, AND THEIR
  # CALLERS.
  #
  # `create` — `controllers/backup_schedule.rs` creates one `Backup` per due
  # slot. A schedule that could not create a backup is a schedule that does
  # nothing.
  #
  # `patch` — D1 §6.8, PLAT-05.2. `controllers/schedule_history.rs`'s migration
  # detaches a run from its schedule with ONE JSON merge patch per object:
  # `metadata.ownerReferences` rewritten to everything except the schedule's own
  # entry, plus the `logweir.dev/schedule-uid` label and the
  # `logweir.dev/history-retained-from-owner` annotation that membership rule 3
  # reads. Before it, deleting a schedule handed every run, plan ConfigMap and
  # Job to the garbage collector.
  #
  # WHAT THIS VERB CANNOT DO, which is the security note D1 §6.8 asks for.
  # `patch` on the MAIN resource does not authorise `backups/status` — that is a
  # separate resource string with its own rule below — and it cannot change a
  # sealed `spec`: `Backup.spec` carries the CEL immutability rules, which the
  # API server evaluates on every update however it is spelled. The caller
  # writes `metadata.ownerReferences`, one label and one annotation, always with
  # `metadata.resourceVersion` in the body as the update precondition. There is
  # still NO `update`, NO `delete` and no `deletecollection` on `backups`, here
  # or anywhere in this file.
  - apiGroups: ["logweir.dev"]
    resources: ["backups"]
    verbs: ["create", "patch"]
  # THE STATUS SUBRESOURCES, AND NOTHING ELSE OF THE OBJECT. `patch` because
  # every writer in this crate goes through `conditions::apply_merge_patch` and
  # `Api::patch_status` with `Patch::Merge`; NOT `update`, which no reconciler
  # calls. Six entries and not a wildcard, so adding a seventh kind is a visible
  # diff in this file.
  #
  # A COMPARE-AND-SET NEEDS NO `update`. The `BackupSchedule` slot reservation
  # and every final status write carry `metadata.resourceVersion` in the PATCH
  # BODY, which the API server applies as an update precondition and answers
  # `409 Conflict` on a mismatch. A reservation written as `replace_status`
  # instead is a `PUT`, is authorised as `update`, and 403s here — see the
  # header note. If a future reconciler needs `update`, the call is wrong
  # before the grant is.
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals/status
      - backups/status
      - backupschedules/status
      - kafkaclusters/status
      - restores/status
      - trustrosters/status
    verbs: ["patch"]
  # AND ITS STATUS SUBRESOURCE, `patch` and nothing else — seam S7.
  # `controllers/backup_destination.rs` writes its `Valid` condition, its
  # `canonicalUrl` and its two digests with `Api::patch_status` and a
  # `Patch::Merge`; there is no `replace_status` anywhere in this crate, and a
  # literal `update` here would be a granted verb with no caller.
  - apiGroups: ["logweir.dev"]
    resources: ["backupdestinations/status"]
    verbs: ["patch"]
  # AND THE EIGHTH KIND'S STATUS SUBRESOURCE, `patch` and nothing else — seam
  # S7. `controllers/topic_discovery.rs` writes every phase, the binding, the
  # chunk index and the completeness verdict with `Api::patch_status` and a
  # `Patch::Merge` whose BODY carries `metadata.resourceVersion` as the update
  # precondition. There is no `replace_status` anywhere in this crate, so a
  # literal `update` here would be a granted verb with no caller.
  - apiGroups: ["logweir.dev"]
    resources: ["topicdiscoveries/status"]
    verbs: ["patch"]
  # AND ITS STATUS SUBRESOURCE, `patch` and nothing else — seam S7.
  # `controllers/recovery_catalog.rs` writes the generation, the counts, the
  # histogram, the signer summary, the page list and the fence pointer with
  # `Api::patch_status` and a `Patch::Merge` carrying `metadata.resourceVersion`
  # as the update precondition. NOTE FOR W13, as above.
  - apiGroups: ["logweir.dev"]
    resources: ["recoverycatalogs/status"]
    verbs: ["patch"]
  # AND THE TENTH KIND'S STATUS SUBRESOURCE, `patch` and nothing else — seam
  # S7. `controllers/preflight.rs` writes every phase, the binding it recorded
  # before the Job existed, and the aggregated verdict with `Api::patch_status`
  # and a `Patch::Merge` whose BODY carries `metadata.resourceVersion` as the
  # update precondition.
  - apiGroups: ["logweir.dev"]
    resources: ["preflights/status"]
    verbs: ["patch"]
  # THE RUNNER JOBS. `create` in `controllers/{backup,kafka_cluster,restore}.rs`
  # (`jobs.create(&PostParams::default(), &job::build(&spec))`); `get` is each
  # later pass deciding whether its Job already exists (`jobs.get_opt`); `list`
  # and `watch` are `.owns(jobs, watcher::Config::default())` on all three
  # controllers; `patch` is `ttlSecondsAfterFinished`, written after the status
  # patch carrying the exit code.
  #
  # NO `delete`. The TTL controller removes a finished Job, and the probe Job
  # and plan ConfigMap are removed by ownerReference garbage collection. No
  # `Api::delete` exists anywhere under `crates/weirkeeper/src/`.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch"]
  # THE POD A JOB PRODUCED. `list` with a label selector is how it is found —
  # `batch.kubernetes.io/job-name`, falling back to the legacy `job-name` —
  # because a Job's pod name is generated and the controller never knows it in
  # advance.
  #
  # `list` AND NOTHING ELSE, narrowed in Task 22 (Task 21 review, LOW-1). Spec
  # §9's shape for "a controller that reads pod status" is `get/list/watch` and
  # Task 21 carried it verbatim; at (resource, verb) granularity two of those
  # three had no caller. `Api<Pod>` appears at exactly six sites under
  # `crates/weirkeeper/src/` — `backup.rs`, `kafka_cluster.rs` and `restore.rs`,
  # twice each — and every one is `.list(&ListParams…)` or `.logs(…)`: there is
  # no `Api::<Pod>::get`/`get_opt` anywhere, and no `Controller`/`watcher` over
  # Pods (the three `.owns(jobs, …)` watch JOBS). The security delta of dropping
  # them is nil — `list` already returns whole Pod objects — and that is the
  # point: this file's governing rule, set out in capitals in its header, is
  # that EVERY GRANTED VERB HAS A CALLER, and it was not true of these two.
  # `every_granted_verb_has_a_caller` is now (resource, verb)-granular so the
  # test can see what the prose promised.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # THE SUBRESOURCE, NAMED SEPARATELY, `get` AND NOTHING ELSE. This is the only
  # rule in this file that names `pods/log`, and it is the only way the exit
  # code's evidence keys (interface I7) and `refusal-reason=` reach the
  # controller: `Api::<Pod>::logs` in `controllers/{backup,kafka_cluster,
  # restore}.rs`. Nothing is written and no process is started, so there is no
  # `create`, and there is no rule anywhere naming `pods/exec` or `pods/attach`.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # THE EVENTS BEHIND A CHECK POD THAT NEVER STARTED — D2 §7.1, §4.3's waiting
  # table, added by W9 and USED by `controllers/preflight.rs`.
  # `controllers/topic_discovery.rs` still passes the classifier an empty fact
  # slice; W11 may switch it over now that the grant exists.
  #
  # `FailedCreate` on the Job says the ServiceAccount does not exist;
  # `FailedMount` on the pod says the signing key volume did not mount. Neither
  # fact is anywhere else, and without them `runner.pod` could report only two
  # of its four refusals and `signer.privateKeyUsable` could never report
  # `SigningKeyMissing` at all.
  #
  # `list` AND NOTHING ELSE, and every call carries an
  # `involvedObject.uid=<uid>` field selector for a Job or pod this check owns:
  # `FailedCreate` is a common event in a namespace with a ResourceQuota, and a
  # classifier handed somebody else's event would CANCEL a healthy check Job.
  # A field selector is not an RBAC boundary and this comment does not claim it
  # is; the grant is namespace-wide `list` on a resource that carries no
  # credential. REVIEWER QUESTION Q2, recorded for W11: whether a
  # namespace-scoped `Role` per watched namespace is wanted instead.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # THE PLAN ConfigMap THE RUNNER MOUNTS AT `/plan` — plan erratum **E5a**.
  # `create` writes it, before the Job and in the same reconcile pass
  # (`controllers/backup.rs`, `controllers/restore.rs`: `maps.create(…)`);
  # `get` is how a 409 is decided, by reading the existing object's owner
  # reference (`maps.get_opt(…)`). NOT `patch`, NOT `update`, NOT `delete`: the
  # plan is rendered once from a CEL-immutable spec, and a second pass that
  # could rewrite it is a pass that could change a document a running pod
  # already mounted. `list` and `watch` are not here either — nothing watches
  # ConfigMaps, and a controller that could list every ConfigMap in the cluster
  # for no caller is critique B M18 in miniature.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get"]
  # PLAT-19.1 — THE `TrustPolicy` RECONCILER'S OWN ROWS, AND NOTHING MORE.
  #
  # Added here by the wave-1 trust worker because `manifest_lint.rs`'s
  # `every_call_site_has_a_grant` is a hard failure otherwise: the reconciler
  # calls `Api<TrustPolicy>::list` and `::patch_status`, and `Controller::new`
  # over the same handle LISTs and WATCHes. The rest of PLAT-19.1's RBAC — the
  # viewer and operator reads, and the new `logweir-trust-admin` ClusterRole
  # that is the only holder of `update` on `trustpolicies` — belongs to the
  # D3 wave-4 RBAC/chart/docs worker and is deliberately NOT here.
  #
  # A SEPARATE RULE RATHER THAN A SEVENTH ENTRY IN THE SIX-KINDS RULE ABOVE,
  # for two reasons. The six-kinds list is shared, verbatim, with
  # `viewer_role.yaml`, and whether an ordinary viewer may read a trust policy
  # is a decision for the worker that owns both files. And `get` is absent
  # here: nothing in this crate calls `Api<TrustPolicy>::get` — a namespace
  # never names its own trust (D3 §7.1), so there is no name to get and the
  # conflict rule needs the whole set anyway. A granted `get` would be a verb
  # with no caller, which is the defect critique B M18 names.
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies"]
    verbs: ["list", "watch"]
  # The status subresource, `patch` only, exactly like the six above: every
  # write is `Api::patch_status` with `Patch::Merge`, and no reconciler calls
  # `Api::replace`.
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies/status"]
    verbs: ["patch"]
  # PLAT-14.2 / decision D3 §3 — THE `ProtectionPolicy` RECONCILER'S OWN ROWS,
  # AND NOTHING MORE.
  #
  # Added here by the D3 wave-2 protection worker for the reason PLAT-19.1's
  # trust worker recorded above: `manifest_lint.rs`'s
  # `every_call_site_has_a_grant` is a HARD failure otherwise, and a call with
  # no grant 403s in production while every route-table test stays green.
  #
  # `list` and `watch` are `Controller::new(api, …)` in
  # `controllers/protection_policy.rs`. NO `get`: the reconciler never re-reads
  # a policy — the watcher hands it the object and the verdict is computed from
  # that object plus the runs it names — so a granted `get` would be a verb
  # with no caller, which is the defect critique B M18 names.
  #
  # A SEPARATE RULE AND NOT A TENTH ENTRY IN THE SIX-KINDS LIST, for the reason
  # every kind since the seventh has had its own: that list is shared verbatim
  # with `viewer_role.yaml`, and whether an ordinary viewer may read a
  # protection objective is the wave-4 RBAC worker's decision, not this one's.
  - apiGroups: ["logweir.dev"]
    resources: ["protectionpolicies"]
    verbs: ["list", "watch"]
  # The status subresource, `patch` and nothing else — seam S7. Every write is
  # `Api::patch_status` with a `Patch::Merge` whose BODY carries
  # `metadata.resourceVersion` as the API server's update precondition; there
  # is no `replace_status` anywhere in this crate, so a literal `update` here
  # would be a granted verb with no caller.
  #
  # AND THIS IS THE ONLY CUSTOM-RESOURCE STATUS THE PROTECTION PATH WRITES.
  # D3 §3.4: "notification failure never rewrites a backup result". This
  # controller holds `patch` on `protectionpolicies/status` and on nothing
  # else new; `backups` stays `get/list/watch` + `create`, which is what the
  # schedule path already had.
  - apiGroups: ["logweir.dev"]
    resources: ["protectionpolicies/status"]
    verbs: ["patch"]
  # PLAT-14.3 / decision D3 §4 — THE `RehearsalSchedule` RECONCILER'S OWN ROWS.
  #
  # Added here by the D3 wave-2 rehearsal worker for the reason every worker
  # since PLAT-19.1 has recorded: `manifest_lint.rs`'s
  # `every_call_site_has_a_grant` is a HARD failure otherwise, and a call with
  # no grant 403s in production while every route-table test stays green. NOTE
  # FOR W13 (D3 §14): these rows are W13's to fold into its own RBAC pass,
  # together with the human-role rows (viewer get/list/watch; operator create
  # plus a `suspend`-only patch, which is the only mutable field).
  #
  # `list` and `watch` are `Controller::new(api, …)` in
  # `controllers/rehearsal_schedule.rs`. `get` IS here, and it has a caller that
  # the other new kinds do not have: `controllers/approval.rs` `get`s the
  # `RehearsalSchedule` an `Approval` names, because D3 §4.3 makes that
  # approval bind a digest RECOMPUTED from the referent's own sealed spec.
  #
  # NO `delete`, AND NO `update` ON THE KIND. The reconciler writes its own
  # `/status` and creates `Restore`s; it never edits a schedule's spec — which
  # is sealed except `suspend` — and it never deletes one. It also holds no verb
  # on `secrets`: the standing authorization's envelope, its sidecar and the
  # approver's PUBLIC key all come from an `Approval` and from the namespace's
  # resolved `TrustPolicy`, and no private material exists on this path.
  - apiGroups: ["logweir.dev"]
    resources: ["rehearsalschedules"]
    verbs: ["get", "list", "watch"]
  # The status subresource, `patch` and nothing else — seam S7. The reservation
  # (`pendingRestoreRef`), the slot, the skip reason, the cleanup list and the
  # three conditions are all one `Api::patch_status` with a `Patch::Merge` whose
  # BODY carries `metadata.resourceVersion` as the API server's update
  # precondition. A reservation written as `replace_status` instead is a `PUT`,
  # is authorised as `update`, and 403s here — which is the point.
  - apiGroups: ["logweir.dev"]
    resources: ["rehearsalschedules/status"]
    verbs: ["patch"]
  # THE SECOND WRITE TO A CUSTOM RESOURCE THAT IS NOT A STATUS, AND ITS CALLER.
  # `controllers/rehearsal_schedule.rs` creates ONE `Restore` per due slot, with
  # a name that is a pure function of the schedule and the slot so a duplicate
  # reconcile is a 409 and not a second rehearsal. `create` ONLY: nothing in
  # this crate updates, replaces or deletes a `Restore` object, and a rehearsal
  # that could edit its own child's spec after creating it would be able to
  # change the plan an approver's scope was proved against.
  - apiGroups: ["logweir.dev"]
    resources: ["restores"]
    verbs: ["create"]
