# `logweir-viewer` — read the fourteen kinds, and nothing else.
#
# FOURTEEN, IN TWO RULES. The first is the original six (ADR 0008 Amendment A)
# and is shared VERBATIM with the `weirkeeper` ClusterRole's own first rule;
# the second is the eight kinds Amendments F and G added —
# `backupdestinations`, `topicdiscoveries`, `preflights` (D2 §7.2),
# `protectionpolicies`, `rehearsalschedules`, `recoverycatalogs`,
# `retentionpolicies` and `trustpolicies` (D3 §9). They are a SEPARATE rule so
# the six-kind list stays byte-identical to the controller's, which is what
# makes a widening of it visible in a diff.
#
# READ IS THE WHOLE OF IT. No `create`, no `patch`, no `delete` — and no verb
# on `configmaps` or `secrets`, which is why browsing a topic INVENTORY (whose
# pages are ConfigMaps) needs the console API and not this role. A kubectl
# viewer sees the summary every one of these kinds publishes on its status.
#
# `trustpolicies` IS CLUSTER-SCOPED, so a `RoleBinding` of this ClusterRole in
# one namespace does NOT convey it: a viewer who should also read trust needs a
# `ClusterRoleBinding`, which is a separate, visible decision. The rule is here
# so that binding is possible without inventing a second role.
#
# NO `/status` RESOURCE IS NAMED IN THIS FILE, AND THAT IS NOT AN OMISSION.
# `get` on `backups` returns the WHOLE object, `status` included: the status
# subresource exists so a WRITER can be authorised separately, not so a reader
# can be denied. Naming `backups/status` here would grant nothing a viewer does
# not already have and would read, to an auditor, as though this role could
# write one. Spec §9: "`logweir-viewer`: `get/list/watch` on all kinds, no
# `/status`."
#
# SHIPPED UNBOUND. Bind it per namespace:
#
#     kubectl --context docker-desktop create rolebinding logweir-viewer \
#       --clusterrole=logweir-viewer --user=<user> -n <namespace>
#
# **RBAC BOUNDS THE VIEWER, NOT THE PAGE** (spec §9, §8). The UI is a static
# bundle served by `kubectl proxy --www=`; it renders whatever the viewer's own
# credential can read and hides nothing on its own. A page that shows less than
# this role allows is a convenience, never a control.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-viewer
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals
      - backups
      - backupschedules
      - kafkaclusters
      - restores
      - trustrosters
    verbs: ["get", "list", "watch"]
  # THE EIGHT KINDS Amendment F (D2) AND Amendment G (D3) ADDED. Read only,
  # in ONE rule, in the plural order `config/crd/` lists them.
  - apiGroups: ["logweir.dev"]
    resources:
      - backupdestinations
      - preflights
      - protectionpolicies
      - recoverycatalogs
      - rehearsalschedules
      - retentionpolicies
      - topicdiscoveries
      - trustpolicies
    verbs: ["get", "list", "watch"]
