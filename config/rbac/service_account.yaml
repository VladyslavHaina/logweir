# The control plane's own ServiceAccount.
#
# THE ONE ACCOUNT IN THIS INSTALL THAT HOLDS A CLUSTER CREDENTIAL, AND IT IS
# THE ONE COMPONENT THAT TALKS TO THE API SERVER (`design-operator.md:355-359`).
# The runner's account — `logweir-runner`, in
# `config/rbac/backup-runner-serviceaccount.yaml` — is granted nothing and
# automounts nothing, because `logweir backup run` makes zero Kubernetes API
# calls and is the process that holds the signing key.
#
# `automountServiceAccountToken` IS DELIBERATELY UNSET HERE. It is set to
# `false` on the runner account and on every runner PodSpec; setting it on this
# one would remove the controller's own credential and it could not start a
# watch. The exemption is a literal list of two files —
# `config/rbac/service_account.yaml` and `config/manager/deployment.yaml` —
# never a pattern; `crates/logweir/tests/manifest_lint.rs`'s
# `runner_pods_do_not_automount_a_token` carries that list.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weirkeeper
  namespace: logweir-system
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/component: control-plane
