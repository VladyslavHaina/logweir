# `logweir-approver` — `create` on `approvals`, READ on `preflights`, nothing else.
#
# TWO RULES SINCE D2 §7.2, AND THE SECOND ONE IS APPROVAL CONTEXT. An approver
# is asked to authorise a restore; `get`/`list` on `preflights` is how they can
# see whether the readiness check for that plan said `ready`, `notReady` or
# `unknown` before signing. It is READ ONLY, and it is deliberately not
# `logweir-viewer`: this role still cannot read a `Restore`, a `Backup` or a
# `KafkaCluster`, and an approver who should also read those gets
# `logweir-viewer` as a second, visible binding.
#
# A `Preflight` IS SAFE TO SHOW. Its status is redacted by construction (D2
# §6.5 — no credential value, no broker error body, no URL carrying userinfo),
# it references no Secret, and a `ready` verdict authorizes nothing on its own
# (D2 §6.8: the execution-time guards are what decide). Reading one cannot
# approve anything.
#
# THE `approvals` RULE IS UNCHANGED: one resource, one verb
# (`design-operator.md:402-405`, spec §9). "This person may hand in a signed
# approval". It carries no `get`, no `list`, no `update`, no `patch` and no
# `delete` on approvals:
#
# * An approval is a signed document. `update` on one would let the approver
#   swap the bytes under a `Verified` status that was computed from different
#   bytes, and the controller re-checks on its own schedule, not on every write.
# * `delete` would let an approver retract an authorisation a `Restore` already
#   ran against, erasing the audit trail rather than the permission.
# * `get`/`list` are not needed to approve; an approver who should also READ the
#   objects gets `logweir-viewer` as well, as a second, visible binding.
#
# SHIPPED UNBOUND. Bind it per namespace, to somebody who is not the operator:
#
#     kubectl --context docker-desktop create rolebinding logweir-approver \
#       --clusterrole=logweir-approver --user=<user> -n <namespace>
#
# `self_attested: false` MEANS ONLY "TWO DIFFERENT KEYS"
# (`design-operator.md:169-181`). One person holding both keypairs satisfies it.
# This role is what makes separation possible; it does not make it true.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-approver
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["approvals"]
    verbs: ["create"]
  # D2 §7.2 — approval context, read only.
  - apiGroups: ["logweir.dev"]
    resources: ["preflights"]
    verbs: ["get", "list"]
