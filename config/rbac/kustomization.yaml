# The RBAC base: one ServiceAccount, four ClusterRoles, one ClusterRoleBinding.
#
# ---------------------------------------------------------------------------
# TWO FILES IN THIS DIRECTORY ARE DELIBERATELY NOT LISTED
# ---------------------------------------------------------------------------
# * `backup-reconciler-rbac-request.yaml` — Task 17's REQUEST. It is a
#   ClusterRole named `weirkeeper-backup-request` that nothing is bound to;
#   installing it would put a second, unbound role in every cluster for no
#   benefit. It stays beside `role.yaml` as the record of why each rule there
#   exists, and the pair of tests
#   (`backup_controller.rs::the_rbac_fragments_request_pod_logs_the_plan_config_map_and_nothing_more`
#   over the request, `manifest_lint.rs::weirkeeper_can_read_pod_logs_and_nothing_more`
#   over the grant) is what closes interface **I28**.
# * `backup-runner-serviceaccount.yaml` — the `logweir-runner` ServiceAccount.
#   It carries no namespace on purpose: runner Jobs run in the namespace of the
#   `Backup`, `Restore` or `KafkaCluster` object that produced them
#   (`controllers::backup::RUNNER_SERVICE_ACCOUNT`), which is an adopter's
#   namespace and never `logweir-system`. Rendering it into `logweir.yaml` would
#   create it in exactly the one namespace no runner ever runs in. It is applied
#   per namespace, at install step 1 — see `docs/kubernetes.md` §13.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service_account.yaml
  - role.yaml
  - role_binding.yaml
  - viewer_role.yaml
  - operator_role.yaml
  - approver_role.yaml
