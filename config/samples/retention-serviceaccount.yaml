# The retention enforcement pod's ServiceAccount, for a namespace the chart does
# not manage, exactly as `backup-runner-serviceaccount.yaml` beside it is.
# Enforcement Jobs run in the namespace of the `RetentionPolicy` that produced
# them, so the namespace is deliberately unset.
#
# On the Helm path this is `retention.enabled`, which renders the account in the
# release namespace — do not apply this file over that Helm-owned object.
# Elsewhere, apply it once in the install's namespace (`docs/install.md`
# step 4).
#
# WITHOUT IT, ENFORCEMENT FAILS CLOSED AND SILENTLY. The Job names
# `serviceAccountName: logweir-retention`; if the account is absent the pod is
# never admitted, no exit code is produced, and nothing in the
# `RetentionPolicy`'s status says which of the four gates was the one that was
# shut.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logweir-retention
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/component: retention
# THE RETENTION WORKER HOLDS NO CLUSTER CREDENTIAL, AND THAT IS THE DESIGN.
# `logweir-retention` makes ZERO Kubernetes API calls: it reads a mounted plan,
# talks to an object store and exits. A projected token would be a cluster
# credential in the one pod in this installation that mounts a DELETE-CAPABLE
# storage credential, which is the last pod that should also be able to reach
# the API server.
#
# `job::build` sets `automountServiceAccountToken: false` on the PodSpec as
# well, so the refusal holds even if this account is later granted something.
automountServiceAccountToken: false
# NO Role, NO ClusterRole AND NO BINDING IN THIS FILE. There is nothing to
# bind, and that is the whole statement: the capability that makes retention
# irreversible is an OBJECT-STORE credential scoped to the policy's own prefix
# and never `logweir/`. No Kubernetes verb widens or narrows it, so a binding
# here would be a line an operator has to audit for no benefit.
#
# SO WHY A SEPARATE ACCOUNT FROM `logweir-runner`, WHICH IS ALSO GRANTED
# NOTHING? Because a ServiceAccount is what an audit trail, a NetworkPolicy
# `podSelector` and a `kubectl get pods -o wide` can name. `logweir-runner` runs
# backups, restores, checks, catalog syncs and notification deliveries;
# `logweir-retention` runs the one thing that removes data. "What has run as the
# deleter" should have an answer.
