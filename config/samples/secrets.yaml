# Credential shapes for low-level/manual provisioning and dry-run validation.
# On the supported Helm path, the chart creates `logweir-signing-key` through a
# short-lived bootstrap hook; do not apply this file or mint a signer locally.
# The other three operator credentials remain explicit. The old namespace-wide
# approval bundle is described only for legacy Jobs and standalone manifests.
#
# ---------------------------------------------------------------------------
# EVERY DOCUMENT IN THIS FILE IS COMMENTED OUT, AND THAT IS THE POINT
# ---------------------------------------------------------------------------
# A sample Secret with placeholder values is a file somebody applies. The
# result is not "nothing happened": it is a signing Secret holding bytes that
# are not a key, a `logweir-s3` holding credentials that are not
# credentials, and an install that fails later and elsewhere. Worse, an empty
# or absent signing key is the ONE failure this product must not have —
# `SigningKey::load_or_generate` MINTS A NEW KEY when the path is absent
# (`crates/logweir-evidence/src/keys.rs:81-92`: `if path.exists()` at `:82`,
# then `let key = Self::generate_p256();` at `:85`), so a run against an empty
# Secret produces evidence signed by a key nothing attests, and it does it
# SILENTLY.
#
# So this file carries commands as comments and applyable placeholder shapes
# only for server-side dry runs. Managed Helm users create the three workload
# credentials and let bootstrap own the signer. The signer command below is
# optional low-level/external/recovery guidance, never default ceremony.
#
#     openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out approver.pem \
#       && openssl pkey -in approver.pem -pubout -out approver.pub.pem
#
# ---------------------------------------------------------------------------
# 1. logweir-signing-key — HELM-MANAGED; low-level/external/recovery only
# ---------------------------------------------------------------------------
# THE KEY NAME INSIDE THE SECRET IS `signing.pem`, NOT `key.pem`.
# `weirkeeper::controllers::backup::SIGNING_KEY_SECRET_KEY` is `"signing.pem"`
# and the Job projects it to the FILE `key.pem` under `/signing`
# (`SIGNING_KEY_FILE`). A Secret whose data key is `key.pem` leaves the mounted
# directory without the file the runner was told to read.
#
# Supported Helm: set `identity.authorizedRunnerNamespaces` and the chart
# distributes the same installation identity. Never mint a separate signer in
# another namespace. Low-level `logweir.yaml` users must use their protected
# secret-distribution system to place the established same key under this name.
#
# ---------------------------------------------------------------------------
# Legacy/standalone only: logweir-approval-bundle
# ---------------------------------------------------------------------------
# DO NOT create this Secret for a new controller-managed Restore. Weirkeeper
# creates immutable `<restore>-approval-bundle` public inputs and pins every
# member's hash in the Job. Keep this Secret only while an older Job still
# exists, or for a standalone manifest that explicitly mounts it. Delete it
# only after those consumers finish.
#
# The legacy creation command, when that narrow compatibility case applies:
#
#     kubectl --context docker-desktop -n <namespace> create secret generic \
#       logweir-approval-bundle \
#       --from-file=approval.json=approval.json \
#       --from-file=approval.sig=approval.sig \
#       --from-file=approver.pub.pem=approver.pub.pem \
#       --from-file=allowed-clusters.json=allowed-clusters.json
#
# NO PRIVATE KEY REACHES A RUNNER POD ON THIS PATH. `approver.pub.pem` is the
# public half; `approver.pem` never leaves the approver's machine.
#
# The legacy Secret projects all four keys at `/approval`, read-only. New
# Restore Jobs do not reference it.
#
# `approval.json` carries `subject_kind` INSIDE the signed bytes; mint it with
# `logweir drill approve --subject-kind <Restore|Backup>` (default `Restore`).
# `--approver-key-ids` on `logweir restore run` pins which approver key ids the
# run accepts; the operator projects one flag per unexpired `TrustRoster`
# approver key, and an approval outside the set is refused with exit 3 before
# phase 0 dials anything.
#
# None of this stops a cluster-admin — docs/stability.md, O0.
#
# ---------------------------------------------------------------------------
# 2. the per-cluster SCRAM credential — named by KafkaCluster.spec.auth.secretRef
# ---------------------------------------------------------------------------
# The data key is `password`
# (`weirkeeper::controllers::restore::TARGET_PASSWORD_SECRET_KEY`) and the
# username is `KafkaCluster.spec.auth.username`, in the object, not in here.
#
#     kubectl --context docker-desktop -n <namespace> create secret generic \
#       kafka-scram --from-literal=password="$KAFKA_PASSWORD"
#
# ---------------------------------------------------------------------------
# 3. logweir-s3 — the archive credential the runner already needs
# ---------------------------------------------------------------------------
#     kubectl --context docker-desktop -n <namespace> create secret generic \
#       logweir-s3 \
#       --from-literal=access-key-id="$AWS_ACCESS_KEY_ID" \
#       --from-literal=secret-access-key="$AWS_SECRET_ACCESS_KEY"
#
# ---------------------------------------------------------------------------
# 4. logweir-evidence-ro — the CONTROLLER's read-only evidence credential
# ---------------------------------------------------------------------------
# The only Secret in this list the controller's own pod consumes, and the only
# one created in `logweir-system`. It is a DIFFERENT PRINCIPAL from the
# runner's archive credential and it must be read-only: GC6 leaves no Logweir
# component any object-store delete capability.
#
#     kubectl --context docker-desktop -n logweir-system create secret generic \
#       logweir-evidence-ro \
#       --from-literal=access-key-id="$EVIDENCE_RO_ACCESS_KEY_ID" \
#       --from-literal=secret-access-key="$EVIDENCE_RO_SECRET_ACCESS_KEY"
#
# ---------------------------------------------------------------------------
# CHECK BEFORE YOU CREATE A CUSTOM RESOURCE, NOT AFTER
# ---------------------------------------------------------------------------
#     just check-secrets <namespace>
#
# exits 1 naming the first required Secret that is absent. On Helm, run it only
# after bootstrap has succeeded; on the low-level path, provision the signer
# first. It is
# deliberately NOT part of `just apply-install`: X-APPLY is defined against a
# clean cluster that has no Secrets at all, and folding the check into the
# install would make the install refuse in exactly the state it is specified
# to succeed in.
#
# ===========================================================================
# AND NOW THE APPLYABLE HALF — Task 24, plan erratum E16(c)
# ===========================================================================
#
# WHAT CHANGED, AND WHY THE ARGUMENT ABOVE STILL STANDS. Task 21 shipped this
# file as comments only, on the reasoning at the top: a sample Secret with
# placeholder values is a file somebody applies, and an EMPTY signing key is
# the one failure this product must not have. Task 22's acceptance line —
#
#     kubectl --context docker-desktop apply --server-side --dry-run=server \
#       -f config/samples/secrets.yaml; echo "rc=$?"
#
# — has no object to send at a file with no documents in it, so it exits 1 on
# a correct tree. The review ruled the acceptance line right and the sample
# wrong (erratum E16c), and this is the fix.
#
# THE FOUR DOCUMENTS BELOW ARE SHAPES, NOT VALUES. Every value is the literal
# string `REPLACE-ME`, and every document carries the comment that says what
# belongs there. `--dry-run=server` validates the SHAPE against the API server
# — the four names, their keys, their namespaces — and creates nothing.
#
# APPLYING THIS FILE FOR REAL IS STILL THE MISTAKE THE HEADER DESCRIBES. The
# guard against it is not the absence of documents, which only made the file
# unusable as a reference; it is `just check-secrets <namespace>`, which reads
# the cluster and refuses when one of the four is missing — and which would
# equally pass over a `logweir-signing-key` holding the word `REPLACE-ME`.
# **So the operator-credential commands at the top remain the way to create
# those credentials; Helm bootstrap remains the way to create the signer.**
# These documents exist so key names are checkable and `--dry-run=server` has
# something to check. They are not the managed installation procedure.
#
# THE KEY NAMES ARE THE CODE'S, and that is the property worth having in a
# file a tool can read:
#
#   logweir-signing-key      signing.pem
#                            (`controllers::backup::SIGNING_KEY_SECRET_KEY`;
#                             mounted as the FILE key.pem under /signing)
#   kafka-scram              password
#                            (`controllers::restore::TARGET_PASSWORD_SECRET_KEY`;
#                             the USERNAME is KafkaCluster.spec.auth.username)
#   logweir-s3               access-key-id, secret-access-key
#                            (`controllers::backup::{ARCHIVE_ACCESS_KEY,
#                             ARCHIVE_SECRET_KEY}`)
#   logweir-evidence-ro      access-key-id, secret-access-key
#                            (`config/manager/deployment.yaml`'s env block)
#
# `stringData` AND NOT `data`. `stringData` is write-only sugar the API server
# base64-encodes for you, so these documents are readable and a hand-edited
# value cannot be a base64 mistake. Nothing here is a real credential.
#
# NO NAMESPACE ON THE FIRST THREE. They live in the namespace of the `Backup`,
# `Restore` and `KafkaCluster` objects — whichever that is — so `kubectl apply
# -n <namespace>` decides. `logweir-evidence-ro` is the exception and names
# `logweir-system`, because it is the CONTROLLER's credential and the control
# plane's namespace is fixed by `logweir.yaml`.
---
apiVersion: v1
kind: Secret
metadata:
  name: logweir-signing-key
  labels:
    app.kubernetes.io/name: logweir
type: Opaque
stringData:
  # Placeholder shape only. Managed Helm fills this atomically without putting
  # bytes in release state. Low-level/external paths supply the SAME established
  # P-256 or Ed25519 PKCS#8 PEM through protected secret distribution; its public
  # half and key id belong in the installation trust record and TrustRoster.
  signing.pem: REPLACE-ME
---
apiVersion: v1
kind: Secret
metadata:
  # NAMED BY `KafkaCluster.spec.auth.secretRef.name` — this is the sample's
  # name, not a constant. The data key `password` IS a constant.
  name: kafka-scram
  labels:
    app.kubernetes.io/name: logweir
type: Opaque
stringData:
  password: REPLACE-ME
---
apiVersion: v1
kind: Secret
metadata:
  # NAMED BY `Backup.spec.archive.secretRef.name` / the restore plan's own
  # storage block. The two data keys are constants.
  name: logweir-s3
  labels:
    app.kubernetes.io/name: logweir
type: Opaque
stringData:
  access-key-id: REPLACE-ME
  secret-access-key: REPLACE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: logweir-evidence-ro
  # ---------------------------------------------------------------------
  # THIS ONE GOES IN `logweir-system`, AND THE FIELD IS STILL NOT SET HERE
  # ---------------------------------------------------------------------
  # It is the only one of the four the CONTROLLER's own pod consumes, and the
  # control plane's namespace is fixed by `logweir.yaml` — so it belongs in
  # `logweir-system` and nowhere else:
  #
  #     kubectl --context docker-desktop -n logweir-system create secret generic \
  #       logweir-evidence-ro --from-literal=access-key-id=... \
  #       --from-literal=secret-access-key=...
  #
  # A hard-coded `namespace:` here would make this FILE undryrunnable on a
  # cluster that has not been installed yet — measured:
  # `kubectl apply --server-side --dry-run=server -f config/samples/secrets.yaml`
  # exits 1 with `namespaces "logweir-system" not found`, which is the exact
  # acceptance line erratum E16(c) exists to make pass. The four documents here
  # are SHAPES; `-n` decides where any of them would go, and the commands at the
  # top of this file are how they are really created.
  labels:
    app.kubernetes.io/name: logweir
type: Opaque
stringData:
  # A DIFFERENT PRINCIPAL FROM `logweir-s3`, AND READ-ONLY (spec §9, Global
  # Constraint 6). It needs `s3:GetObject` on the evidence prefix and nothing
  # else: `weirkeeper` fetches the signed receipt or scorecard a run wrote and
  # verifies it. Retention only reports, so no Logweir component holds any
  # delete capability against object storage.
  #
  # OMITTING THIS SECRET ENTIRELY IS SUPPORTED. `config/manager/deployment.yaml`
  # projects both keys with `optional: true`, so the controller starts without
  # it and every `status.evidence.verification` reads `NotAttempted` with the
  # `logweir drill verify` command to run instead.
  access-key-id: REPLACE-ME
  secret-access-key: REPLACE-ME
