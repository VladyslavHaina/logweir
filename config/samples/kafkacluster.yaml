# A `KafkaCluster` — the connection every backup and restore names.
#
#     kubectl --context docker-desktop -n <namespace> \
#       apply -f config/samples/kafkacluster.yaml
#
# NO NAMESPACE IS SET IN THIS FILE, ON PURPOSE. Apply it with `-n`; a sample
# that hard-coded `logweir-system` would put an adopter's custom resources in
# the control plane's own namespace, where the NetworkPolicy and the RBAC are
# written for a controller and not for runners.
#
# `role` IS `source` OR `target` AND IT IS NOT ADVISORY: a restore refuses a
# target whose observed `cluster_id` equals the source's (GC18(c) rail 4).
#
# THE CONTROLLER PROBES THIS OBJECT BY RUNNING A JOB. The `KafkaCluster`
# reconciler runs `logweir cluster-probe` as a runner Job — same ServiceAccount
# (`logweir-runner`), same image, same `automountServiceAccountToken: false` —
# and reads two lines from its pod log to set `status.reachable`. So the runner
# ServiceAccount must exist in THIS namespace before this object is useful:
#
#     kubectl --context docker-desktop -n <namespace> \
#       apply -f config/rbac/backup-runner-serviceaccount.yaml
---
apiVersion: logweir.dev/v1alpha1
kind: KafkaCluster
metadata:
  name: source
  labels:
    app.kubernetes.io/name: logweir
spec:
  role: source
  bootstrapServers:
    # The compose stack's published in-cluster listener (STANDING RULE 15). A
    # pod cannot reach `localhost:9092`; `host.docker.internal:9095` is the one
    # address that works from inside docker-desktop.
    - host.docker.internal:9095
  auth:
    # `plaintext` or `scramSha512`. For `scramSha512`, set `username` and a
    # `secretRef` naming a Secret with a `password` key — the controller
    # projects it as a `secretKeyRef` and never reads it.
    #
    # SAVED-CONNECTION CONTRACT v1 (docs/kubernetes.md §20) adds two optional
    # fields, both REFERENCES into THIS namespace and never values:
    #
    #   auth:
    #     mode: scramSha512
    #     username: logweir
    #     secretRef:
    #       name: kafka-sasl
    #       # The data key holding the password. Absent means `password`, which
    #       # is the only key releases before contract v1 projected — so an
    #       # object written without this field resolves exactly as it did.
    #       passwordKey: sasl-password
    #     # `tls` IS THE ONLY SWITCH THAT TURNS TLS ON. `tlsCa` only adds trust
    #     # material to a transport that is already TLS, which is what makes a
    #     # rollback fail closed instead of dialling in the clear: an older
    #     # controller ignores `tlsCa`, still reads `tls`, and simply fails to
    #     # verify the broker certificate.
    #     tls: true
    #     # EXACTLY ONE OF secretKeyRef / configMapKeyRef, holding PEM CA
    #     # certificate(s). A CA certificate is public, so a ConfigMap is an
    #     # ordinary home for it; a CA PRIVATE KEY belongs in neither and is
    #     # not part of this contract. The key is projected read-only into the
    #     # runner pod and its PATH — never the text — reaches both of the
    #     # runner's TLS clients.
    #     tlsCa:
    #       configMapKeyRef: { name: kafka-ca, key: ca.crt }
    #
    # `tlsCa` without `tls: true` is REFUSED, at admission by a CEL rule and
    # again by the controller — a trust anchor beside a clear dial is the
    # silent downgrade the refusal exists to prevent.
    mode: plaintext
    tls: false
