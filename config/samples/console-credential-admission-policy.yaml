# The ValidatingAdmissionPolicy that fences the console API's `create` on
# Secrets — D2 §7.3, the kustomize copy of
# `charts/logweir/templates/admission-policy.yaml`.
#
# ---------------------------------------------------------------------------
# [UNVERIFIED — needs a 1.30+ cluster, and has not been applied to one]
# ---------------------------------------------------------------------------
# This mark stays here, in the shipped text, with the sentence that would
# verify it (spec §15 mark 7, STANDING RULE 22). **Minimum Kubernetes for
# Logweir is 1.29** (Global Constraint 25), and `admissionregistration.k8s.io/v1`
# ValidatingAdmissionPolicy is 1.30+. What would verify it: on a 1.30+ cluster,
# apply both documents, then AS THE CONSOLE ServiceAccount create (a) a Secret
# of type `logweir.dev/object-store-credential` carrying
# `app.kubernetes.io/managed-by: logweir` — which must be ACCEPTED — and (b) a
# Secret of type `kubernetes.io/service-account-token` — which must be REJECTED
# with the message below — and then show (b) succeeding once the binding is
# deleted. Neither half has been run; D2 W14 owns that evidence.
#
# WHY IT IS NOT IN `logweir.yaml`. `config/kustomization.yaml` does not list
# `config/samples/`, and a `ValidatingAdmissionPolicy` document applied to a
# 1.29 cluster is rejected with `no matches for kind` — so a `logweir.yaml`
# carrying one would fail X-APPLY on the stated floor (spec §16 clause 1).
# Apply it by hand, on 1.30+:
#
#     kubectl --context <ctx> apply -f config/samples/console-credential-admission-policy.yaml
#
# EDIT THE PRINCIPAL FIRST. `system:serviceaccount:logweir-system:logweir-api`
# below is the console API ServiceAccount of a default-namespace install. The
# Helm chart derives it from `.Release.Namespace` and
# `admissionPolicy.consoleServiceAccountName`; here it is a literal, and a
# literal naming an account that does not exist fences nothing at all.
#
# WHAT IT CLOSES, AND WHAT IT DOES NOT. `logweir-api` holds `create` on
# `secrets` and no read verb. `create` alone could still mint a
# `kubernetes.io/service-account-token` Secret for any ServiceAccount in a
# namespace the console is bound in. This policy requires one of the two
# Logweir credential types AND the owner label both builders stamp. A cluster
# administrator can delete the policy (O0, default (a), spec §9); it raises the
# cost of a mistake and of a compromised console, not of a deliberate
# administrator.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: logweir-console-credentials-only
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/component: admission
spec:
  # SAFE TO FAIL CLOSED because `matchConditions` below skips every other
  # subject in the cluster: an administrator, the controller and a CSI driver
  # are never evaluated by this policy at all.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: console-service-account
      expression: request.userInfo.username in ["system:serviceaccount:logweir-system:logweir-api"]
  validations:
    - expression: >-
        has(object.type) && (object.type == 'logweir.dev/object-store-credential' ||
        object.type == 'logweir.dev/kafka-sasl-password')
      message: >-
        the Logweir console may create only its own credential Secrets: type must be
        logweir.dev/object-store-credential or logweir.dev/kafka-sasl-password
      reason: Forbidden
    - expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/managed-by' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'logweir'
      message: >-
        the Logweir console may create only Secrets it owns: the
        app.kubernetes.io/managed-by=logweir label is required
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: logweir-console-credentials-only
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/component: admission
spec:
  policyName: logweir-console-credentials-only
  validationActions: ["Deny"]
