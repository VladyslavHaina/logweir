                    items:
                      type: string
                    nullable: true
                    type: array
                  note:
                    description: Why the evaluation removed nothing, when the reason is not "there is nothing to remove" — set when no retention rule is configured.
                    nullable: true
                    type: string
                  setsKept:
                    description: The `backupId`s the policy keeps, newest first.
