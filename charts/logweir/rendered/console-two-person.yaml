# Source: logweir/templates/identity.yaml
# PROD-16.1: THE FRESH INSTALL'S TRUST, AND ONLY FOR THE INSTALL. In the one run
# that GENERATES the installation identity and the console key, the hook reads
# which trust the cluster already has (`list` TrustPolicy, `get` the one roster
# name) and, when it has none at all, creates ONE default TrustPolicy trusting
# the installation signer and that console key. `create` cannot be narrowed by
# resourceName in RBAC, so this grant must not outlive the install (security
# review of 428a481a; fix round of 2026-10-08): it is rendered only under
# `$freshTrust`, only on Helm 3.19+ (the `fail` above), as a `post-install` hook
# — never upgrade or rollback — weighted before the Job that spends it, and
# deleted by Helm when the install's post-install hooks have run, succeeded or
# failed (`hook-succeeded`, `hook-failed`; Helm 3.19.0 and v4.0.1
# `pkg/action/hooks.go` `execHook` delete every earlier `hook-succeeded` hook
# when a later one fails; 3.12–3.18 do not, hence the floor). The hook ALSO
# deletes this binding itself after its trust step, on every exit path the
# binary controls (`delete` on this one binding name). What neither covers: a
# failed `Create` of a later hook, or a Helm client killed mid-hook — the next
# hook run, or the recovery command in docs/install.md, removes it. The
# installer already holds cluster-admin for the CRDs and ClusterRoles of this
# chart; for those seconds, whoever can run a pod as
# `<release>-identity-bootstrap` in the release namespace could create a
# TrustPolicy — the residual docs/kubernetes.md §8 states.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-identity-trust
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/instance: logweir
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: logweir-0.1.0
    app.kubernetes.io/component: identity-bootstrap
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies"]
    verbs: ["list", "create"]
  - apiGroups: ["logweir.dev"]
    resources: ["trustrosters"]
    resourceNames: ["default"]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: ["logweir-identity-trust"]
    verbs: ["delete"]
