# Source: logweir/templates/identity.yaml
# The private object is intentionally rendered EMPTY. The hook Job generates or
# adopts a key through an optimistic API patch; Helm never renders key material.
# `keep` makes uninstall/reinstall fail-safe: losing a Helm release record must
# not silently rotate the signer used by old archives.
apiVersion: v1
kind: Secret
metadata:
  name: logweir-signing-key
  namespace: logweir-system
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/resource-policy: keep
    logweir.dev/identity-state: uninitialized
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/instance: logweir
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: logweir-0.1.0
    app.kubernetes.io/component: signing-identity
type: Opaque
data: {}
