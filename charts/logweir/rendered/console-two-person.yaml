# The installation policy, read by name from the release namespace: `get` on
# this one ConfigMap and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weirkeeper-installation-policy
  namespace: logweir-system
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/instance: logweir
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: logweir-0.1.0
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    # And the public identity ConfigMap, for the fresh-install marker.
    resourceNames: ["weirkeeper-policy", "logweir-signing-trust"]
    verbs: ["get"]
