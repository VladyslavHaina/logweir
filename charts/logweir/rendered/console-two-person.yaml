# Source: logweir/templates/identity.yaml
# PROD-16.1: THE FRESH INSTALL'S TRUST, AND ONLY FOR THE INSTALL. In the run
# that generates the installation identity and the console key, the hook reads
# which trust the cluster has and, when it has none, creates one default
# TrustPolicy trusting those two keys. `create` cannot be narrowed by
# resourceName, so this grant must not outlive the install: it renders only
# under `$freshTrust`, only on Helm 3.19+ (`_validate.tpl`), as a `post-install`
# hook weighted before the Job that spends it, deleted by Helm when the
# post-install hooks have run, succeeded or failed, and deleted by the hook
# itself after its trust step. A failed `Create` of a later hook or a Helm
# client killed mid-hook leaves it for the next hook run or the recovery
# command in docs/install.md. For those seconds, whoever can run a pod as
# `<release>-identity-bootstrap` could create a TrustPolicy (docs/kubernetes.md
# §8).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-identity-trust
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/instance: logweir
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: logweir-0.1.0
    app.kubernetes.io/component: identity-bootstrap
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies"]
    verbs: ["list", "create"]
  - apiGroups: ["logweir.dev"]
    resources: ["trustrosters"]
    resourceNames: ["default"]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: ["logweir-identity-trust"]
    verbs: ["delete"]
