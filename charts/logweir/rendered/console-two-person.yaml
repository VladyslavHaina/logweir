    app.kubernetes.io/component: identity-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - logweir-signing-key
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["logweir-signing-key"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["logweir-signing-trust"]
    verbs: ["get", "patch"]
