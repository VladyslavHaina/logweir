    metadata:
      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/instance: logweir
    spec:
      serviceAccountName: weirkeeper
      nodeSelector:
        nodepool: kafka
        workload: kafka
      tolerations:
      - effect: NoSchedule
        key: kafka
        value: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weirkeeper
          image: docker.io/vladyslavhaina/weirkeeper:latest
          imagePullPolicy: Always
          args: []
          env:
            - name: RUST_LOG
              value: "info"
            - name: LOGWEIR_RUNNER_IMAGE
              value: "docker.io/vladyslavhaina/logweir:latest"
            - name: LOGWEIR_RUNNER_PULL_POLICY
              value: "Always"
            - name: LOGWEIR_ARCHIVE_URL
              value: "s3://kafka-backups/logweir"
            - name: AWS_ENDPOINT_URL
              value: "http://logweir-minio.kafka.svc:9000"
            - name: AWS_ALLOW_HTTP
              value: "true"
            - name: AWS_VIRTUAL_HOSTED_STYLE_REQUEST
              value: "false"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: logweir-evidence-ro
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: logweir-evidence-ro
                  key: secret-access-key
                  optional: true
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
