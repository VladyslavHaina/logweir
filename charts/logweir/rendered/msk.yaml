# Source: logweir/templates/minio/minio.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: logweir-minio-seed
  namespace: logweir-system
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/instance: logweir
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: logweir-0.1.0
    logweir.dev/environment: "dev"
    app.kubernetes.io/component: minio-seed
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/instance: logweir
        app.kubernetes.io/component: minio-seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        nodepool: kafka
        workload: kafka
      tolerations:
      - effect: NoSchedule
        key: kafka
        value: "true"
      imagePullSecrets:
      - name: regcred
      containers:
        - name: mc
          image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: logweir-minio-root
          env:
            - name: MINIO_HOST
              value: "logweir-minio.logweir-system.svc"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export MC_HOST_local="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@${MINIO_HOST}:9000"
              i=0
              while [ "$i" -lt 90 ]; do
                if mc ready local >/dev/null 2>&1; then break; fi
                echo "waiting for MinIO at ${MINIO_HOST}:9000 ($i/90)"
                i=$((i + 1))
                sleep 2
              done
              mc ready local
              mc mb --ignore-existing local/kafka-backups
              mc mb --ignore-existing local/logweir-evidence
              echo 'buckets ready: kafka-backups logweir-evidence'
