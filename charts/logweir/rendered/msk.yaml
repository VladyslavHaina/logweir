    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'A Kafka cluster Logweir connects to (saved-connection contract v1): bootstrap servers, auth mode and username, the TLS switch and an optional private CA reference, role, and the marker topic that proves a scratch target. The password lives in a Secret and the CA in a Secret or ConfigMap, both in this namespace and both referenced, never copied; `status.clusterId` is read from the broker and never from this spec. `spec` is immutable.'
