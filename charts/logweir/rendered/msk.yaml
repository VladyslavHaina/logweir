    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: READY
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A recurring backup of a named topic set into an archive. `spec.suspend` is the only mutable field; every other field is sealed by an object-level CEL rule. Retention REPORTS what it would remove and deletes nothing.
        properties:
          spec:
            description: '`BackupSchedule.spec`. Only `suspend` is mutable — see the module header.'
            properties:
              archive:
                description: |-
                  Where the backup is written.

                  With `destinationRef` set this is the sentinel `logweir-destination://<name>` and carries no `secretRef`.
                properties:
                  secretRef:
                    description: A Secret in this namespace carrying the object-store credential. Its keys are read by the Job, never by the controller's own archive handle, which is read-only (Global Constraint 6).
                    nullable: true
                    properties:
                      name:
                        description: The referenced object's `metadata.name`, in this namespace.
                        type: string
                    required:
                    - name
                    type: object
                  url:
                    description: The object-store URL of the archive root.
                    type: string
                required:
                - url
                type: object
              concurrencyPolicy:
                default: Forbid
                description: Whether a due slot may start while an earlier Backup owned by this schedule is unfinished. Omitted means `Forbid`, including on schedules stored before this field was introduced. `Allow` is explicit.
                enum:
                - Forbid
                - Allow
                type: string
              destinationRef:
                description: |-
                  The saved `BackupDestination` every run of this schedule writes to, in this namespace.

                  Optional, additive and sealed like every other field but `suspend`: re-pointing a schedule at a different destination is a different schedule, for the same reason a different location is a different destination.
                nullable: true
                properties:
                  name:
                    description: The referenced object's `metadata.name`, in this namespace.
                    type: string
                required:
                - name
                type: object
              retention:
                description: '`{keepLast, keepDays}` — **reporting only**. Logweir deletes nothing.'
                nullable: true
                properties:
                  keepDays:
                    description: Keep backup sets newer than N days; older sets are REPORTED as removable.
                    format: int64
                    nullable: true
                    type: integer
                  keepLast:
                    description: Keep the most recent N backup sets; older sets are REPORTED as removable.
                    format: int64
                    nullable: true
                    type: integer
                type: object
              schedule:
                description: 'A five-field cron expression, in UTC: minute hour day-of-month month day-of-week. `*`, a literal, a comma list, an `a-b` range and a `*/n` step are accepted, as are `@hourly`, `@daily` and `@weekly`; anything else is refused with a `Ready` condition naming the field, never read as a silent match-all. A slot that comes due more than the ONE-HOUR missed-slot horizon before the controller looks is skipped and recorded in `status.lastMissedSlot`.'
                type: string
              sourceRef:
                description: The `KafkaCluster` to back up, in this namespace.
                properties:
                  name:
                    description: The referenced object's `metadata.name`, in this namespace.
                    type: string
                required:
                - name
                type: object
              suspend:
                default: false
                description: Stop firing new `Backup`s. **The only mutable field on this spec**, and the only `.spec` write the controller performs on any kind in tag 1.
                type: boolean
              topics:
                description: 'NAMED topics, never patterns. Global Constraint 18''s first rail and guard **G-GLOB**: a glob metacharacter is refused, and an omitted list is not permitted at all — the one shape that would mean "everything" to the engine. A mandatory allowlist whose absence means "all topics" is not an allowlist.'
                items:
                  type: string
                type: array
            required:
            - archive
            - schedule
            - sourceRef
            - topics
            type: object
            x-kubernetes-validations:
            - message: only spec.suspend is mutable; create a new BackupSchedule instead
              rule: has(self.schedule) == has(oldSelf.schedule) && (!has(self.schedule) || self.schedule == oldSelf.schedule) && has(self.sourceRef) == has(oldSelf.sourceRef) && (!has(self.sourceRef) || self.sourceRef == oldSelf.sourceRef) && has(self.topics) == has(oldSelf.topics) && (!has(self.topics) || self.topics == oldSelf.topics) && has(self.archive) == has(oldSelf.archive) && (!has(self.archive) || self.archive == oldSelf.archive) && has(self.destinationRef) == has(oldSelf.destinationRef) && (!has(self.destinationRef) || self.destinationRef == oldSelf.destinationRef) && has(self.concurrencyPolicy) == has(oldSelf.concurrencyPolicy) && (!has(self.concurrencyPolicy) || self.concurrencyPolicy == oldSelf.concurrencyPolicy) && has(self.retention) == has(oldSelf.retention) && (!has(self.retention) || self.retention == oldSelf.retention)
            - message: with destinationRef, archive.url is exactly logweir-destination://<destinationRef.name> and archive.secretRef is absent; the logweir-destination scheme is otherwise reserved
              rule: 'has(self.destinationRef) ? (self.archive.url == ''logweir-destination://'' + self.destinationRef.name && !has(self.archive.secretRef)) : !self.archive.url.startsWith(''logweir-destination://'')'
          status:
            description: '`BackupSchedule.status`.'
            nullable: true
            properties:
              activeBackupRef:
                description: The `Backup` currently running for this schedule, if any.
                nullable: true
                properties:
                  name:
                    description: The referenced object's `metadata.name`, in this namespace.
                    type: string
                required:
                - name
                type: object
              conditions:
                description: '`Ready`, and whatever else the controller reports.'
                items:
                  description: 'A `metav1.Condition`: the standard six fields with their standard meanings.'
                  properties:
                    lastTransitionTime:
                      description: When the condition last changed from one status to another.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      description: A human-readable message. Never carries key material or a credential.
                      nullable: true
                      type: string
                    observedGeneration:
                      description: The `.metadata.generation` this condition was computed from.
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      description: A short, machine-readable CamelCase reason for the current status.
                      nullable: true
                      type: string
                    status:
                      description: '`True`, `False` or `Unknown`.'
                      type: string
                    type:
                      description: The condition type, in CamelCase — `Ready`, `Reachable`, `Loaded`, `Verified`, `Expired`.
                      type: string
                  required:
                  - status
                  - type
                  type: object
                nullable: true
                type: array
              lastFireTime:
                description: When this schedule last created a `Backup`.
                format: date-time
                nullable: true
                type: string
              lastMissedSlot:
                description: |-
                  The most recent slot that came due and was NOT fired — the controller was down, or `Forbid` found a previous owned run still active. Recorded because object identity is a pure function of the trigger (guard **G-SLOT**): a missed slot is never silently re-fired under a different name.

                  THE MISSED-SLOT HORIZON IS ONE HOUR. A slot that came due more than one hour before the controller looked is skipped and recorded here, with a `Ready` condition whose reason is `SlotMissed`; a controller restarted after a week therefore fires at most the current slot and never six days of backlog. A concurrency skip uses reason `ConcurrencyBlocked`. The field is written when a slot is skipped and is never cleared afterwards — it is the audit trail of the skip, so a correct implementation is distinguishable from a broken schedule.
                nullable: true
                type: string
              nextFireTime:
                description: When it will next create one, given `schedule` and `suspend`.
                format: date-time
                nullable: true
                type: string
              pendingBackupRef:
                description: A `Forbid` slot atomically admitted in status but whose `Backup` creation has not yet been confirmed. This short-lived reservation closes the controller crash window and is cleared after the child is observed or created.
                nullable: true
                properties:
                  name:
                    description: The referenced object's `metadata.name`, in this namespace.
                    type: string
                required:
                - name
                type: object
              retentionReport:
                description: What retention WOULD remove. Nothing was deleted — see [`RetentionReport`].
                nullable: true
                properties:
                  awsCli:
                    description: |-
                      The exact removal command for each set above, one per set, in the same order, **in the CLI of that archive's own scheme** — `aws s3 rm` for `s3://`, `gsutil -m rm -r` for `gs://`, `az storage blob delete-batch` for `az://` and `rm -rf` for `file://`. **Reported, never executed.**

                      THE FIELD NAME SAYS `aws` AND THREE OF THE FOUR SCHEMES DO NOT, and the name is deliberately unchanged (Task 24a, plan erratum **E18(b)**): renaming a status field an adopter may already read, to fix a description, would cost more than the description was worth. What was actually broken is what the field CONTAINED — it printed `aws s3 rm 'file:///…'` for a filesystem archive, a string an operator runs and which does nothing — and that is fixed. This sentence is the description catching up with the value.
                    items:
                      type: string
                    nullable: true
                    type: array
                  evaluatedAt:
                    description: When the controller last evaluated retention.
                    format: date-time
                    nullable: true
                    type: string
                  keepDays:
                    description: '`spec.retention.keepDays`, as it was applied.'
                    format: int64
                    nullable: true
                    type: integer
                  keepLast:
                    description: '`spec.retention.keepLast`, **as it was applied**. Absent when no rule was configured, or when the configured value was not a non-negative count and was therefore not applied.'
                    format: int64
                    nullable: true
                    type: integer
                  mcCli:
                    description: The same commands in `mc`'s spelling. Reported, never executed.
                    items:
                      type: string
                    nullable: true
                    type: array
                  note:
                    description: Why the evaluation removed nothing, when the reason is not "there is nothing to remove" — set when no retention rule is configured.
                    nullable: true
                    type: string
                  setsKept:
                    description: The `backupId`s the policy keeps, newest first.
                    items:
                      type: string
                    nullable: true
                    type: array
                  setsThatWouldBeRemoved:
                    description: The sets the policy WOULD remove, newest first. They are still in the archive; Logweir deleted nothing.
                    items:
                      description: One set retention WOULD remove. **It is still in the archive.**
                      properties:
                        backupId:
                          description: The backup set's id — the manifest key's parent directory.
                          type: string
                        days:
                          description: The configured `keepDays`, when `reason` is `OlderThanKeepDays`.
                          format: int64
                          nullable: true
                          type: integer
                        newestRecordAt:
                          description: The set's newest record instant, read from the manifest BODY and never from the key string, which carries no timestamp.
                          format: date-time
                          type: string
                        rank:
                          description: The set's 1-based rank in newest-first order, when `reason` is `BeyondKeepLast`.
                          format: int64
                          nullable: true
                          type: integer
                        reason:
                          description: '`OlderThanKeepDays` or `BeyondKeepLast`. `OlderThanKeepDays` when both rules select the set, because age is the reason an operator acts on.'
                          type: string
                      required:
                      - backupId
                      - newestRecordAt
                      - reason
                      type: object
                    nullable: true
                    type: array
                  skipped:
                    description: 'The manifest keys under the prefix that could not be read, and why. Each was SKIPPED: it is in neither `setsKept` nor `setsThatWouldBeRemoved`, and the rest of the archive was still evaluated. An empty list means every manifest under the prefix was read.'
                    items:
                      description: One manifest key the evaluation could not read. **Task 19 review, F-5.**
                      properties:
                        key:
                          description: The manifest key, exactly as the archive listed it.
                          type: string
                        reason:
                          description: Why it could not be read — `is not a backup manifest` for a sibling JSON object the `/manifest.json` filter picked up, or the storage error's own message.
                          type: string
                      required:
                      - key
                      - reason
                      type: object
                    nullable: true
                    type: array
                type: object
            type: object
        required:
        - spec
        title: BackupSchedule
        type: object
    served: true
    storage: true
    subresources:
      status: {}

