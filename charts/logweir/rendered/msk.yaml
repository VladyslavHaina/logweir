      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/instance: logweir
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: logweir-ui
      nodeSelector:
        nodepool: kafka
        workload: kafka
      tolerations:
      - effect: NoSchedule
        key: kafka
        value: "true"
      # THE ONE POD OF THE OPTIONAL COMPONENTS THAT NEEDS ITS TOKEN: it is the
      # credential `kubectl proxy` attaches to every request it forwards.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: registry.k8s.io/kubectl@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
          imagePullPolicy: IfNotPresent
          args:
            - proxy
            - --www=/ui
            - --www-prefix=/ui/
            - --address=0.0.0.0
            - --port=8001
            - '--accept-hosts=.*'
            - '--accept-paths=^/(ui/|apis/logweir\.dev/v1alpha1/)'
          env:
            - name: HOME
              value: /tmp
            - name: KUBECACHEDIR
              value: /tmp/kube-cache
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /ui/
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ui
              mountPath: /ui
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ui
          configMap:
            name: logweir-ui
            items:
              - key: api.js
                path: api.js
              - key: app.js
                path: app.js
              - key: index.html
                path: index.html
              - key: pages__approvals.js
                path: pages/approvals.js
              - key: pages__backups.js
                path: pages/backups.js
              - key: pages__clusters.js
                path: pages/clusters.js
              - key: pages__history.js
                path: pages/history.js
              - key: pages__index.html
                path: pages/index.html
              - key: pages__keys.js
                path: pages/keys.js
              - key: pages__restore-wizard.js
                path: pages/restore-wizard.js
              - key: pages__schedules.js
