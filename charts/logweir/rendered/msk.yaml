            }
          }
        }
      }
      return epochMs(((backup || {}).metadata || {}).creationTimestamp);
    }
  
    function newestSucceeded(state) {
      const candidates = succeededBackups(state);
      let best = null;
      for (const backup of candidates) {
        if (best === null) {
          best = backup;
          continue;
