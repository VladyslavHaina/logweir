# Source: logweir/templates/identity.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: logweir-identity-bootstrap
  namespace: logweir-system
  annotations:
    helm.sh/hook: post-install,post-upgrade,post-rollback
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-10"
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/instance: logweir
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: logweir-0.1.0
    logweir.dev/environment: "dev"
    app.kubernetes.io/component: identity-bootstrap
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/instance: logweir
        app.kubernetes.io/component: identity-bootstrap
        logweir.dev/identity-authority: bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: logweir-identity-bootstrap
      automountServiceAccountToken: true
      nodeSelector:
        nodepool: kafka
        workload: kafka
      tolerations:
      - effect: NoSchedule
        key: kafka
        value: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/vladyslavhaina/logweir@sha256:8c5a76556236b3ff22d8618c1e2f141816eb60f6b1a476519b3b618efde348f6
          imagePullPolicy: IfNotPresent
          args:
            - identity
            - bootstrap
            - --namespace
            - logweir-system
            - --public-configmap-name
            - logweir-signing-trust
            - --revoke-trust-binding
            - logweir-identity-trust
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Source: logweir/templates/minio/minio.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: logweir-minio-seed
  namespace: logweir-system
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/instance: logweir
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: logweir-0.1.0
    logweir.dev/environment: "dev"
    app.kubernetes.io/component: minio-seed
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/instance: logweir
        app.kubernetes.io/component: minio-seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        nodepool: kafka
        workload: kafka
      tolerations:
      - effect: NoSchedule
        key: kafka
        value: "true"
      imagePullSecrets:
      - name: regcred
      containers:
        - name: mc
          image: docker.io/vladyslavhaina/mc-mirror@sha256:9c7cbc3f47b092d52b73124fb9ab12f3266534c23c283b2e984d07408c9ff381
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: logweir-minio-root
          env:
            - name: MINIO_HOST
              value: "logweir-minio.logweir-system.svc"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export MC_HOST_local="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@${MINIO_HOST}:9000"
              i=0
              while [ "$i" -lt 90 ]; do
                if mc ready local >/dev/null 2>&1; then break; fi
                echo "waiting for MinIO at ${MINIO_HOST}:9000 ($i/90)"
                i=$((i + 1))
                sleep 2
              done
              mc ready local
              mc mb --ignore-existing local/kafka-backups
              mc mb --ignore-existing local/logweir-evidence
              echo 'buckets ready: kafka-backups logweir-evidence'
