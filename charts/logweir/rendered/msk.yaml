                type: boolean
              reason:
                description: |-
                  **Why `reachable` says what it says** — `Reachable`, `ProbeReportedUnreachable`, `ProbeOutputUnreadable`, `ProbeRunning`, `NoExitCode`, `PodUnschedulable`, `DisruptedMidDrill` or `NameTooLong`: the `Reachable` condition's own `reason`, promoted to a scalar. Added by Task 15c.

                  WHY A SCALAR BESIDE THE CONDITION. `reachable` is a tri-state in practice — `true`, `false`, and ABSENT — and the absent case has five causes an operator has to tell apart: the probe pod printed no parseable contract line, the Job finished with no exit code at all, the pod never scheduled, the node went away mid-probe, or a probe is simply in flight. With no scalar all of those read identically through `-o jsonpath` and through any `custom-columns` view, and the specific state exists only inside `status.conditions` — which is review finding **M2** on the `Restore` path, reached here from the other direction.

