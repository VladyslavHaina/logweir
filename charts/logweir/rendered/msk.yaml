                    default: false
                    description: 'Whether the transport is TLS — the only switch that turns TLS on. Independent of `mode`; in connection contract v1 TLS is supported with `scramSha512` (SASL_SSL), and `plaintext` with `tls: true` is refused rather than dialled without TLS.'
