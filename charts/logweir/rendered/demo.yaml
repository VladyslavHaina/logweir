      - key: demo.logweir.dev/example
        operator: Exists
      # THE ONE POD OF THE OPTIONAL COMPONENTS THAT NEEDS ITS TOKEN: it is the
      # credential `kubectl proxy` attaches to every request it forwards.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: docker.io/vladyslavhaina/logweir-ui:latest
          imagePullPolicy: Always
          args:
            - proxy
            - --www=/ui
            - --www-prefix=/ui/
            - --address=0.0.0.0
            - --port=8001
            - '--accept-hosts=.*'
            - '--accept-paths=^/(ui/|apis/logweir\.dev/v1alpha1/)'
          env:
            - name: HOME
              value: /tmp
            - name: KUBECACHEDIR
              value: /tmp/kube-cache
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /ui/
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # `/ui` remains the image's read-only page. This single mounted file
          # replaces its empty standalone context with Helm's non-secret one;
          # it is not a page copy.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime
              mountPath: /ui/runtime.js
              subPath: runtime.js
              readOnly: true
      volumes:
        # `tmp` is the only writable volume. `runtime` is a read-only
        # ConfigMap containing only the namespace context, never page assets.
        - name: tmp
          emptyDir: {}
        - name: runtime
          configMap:
            name: logweir-ui-runtime-050a1aeb70
            items:
              - key: runtime.js
                path: runtime.js
