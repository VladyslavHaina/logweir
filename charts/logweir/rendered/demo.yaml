apiVersion: apps/v1
kind: Deployment
metadata:
  name: weirkeeper
  namespace: logweir-system
  labels:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/instance: logweir
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: logweir-0.1.0
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: logweir
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/instance: logweir
    spec:
      serviceAccountName: weirkeeper
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: demo.logweir.dev/example
        operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weirkeeper
          image: docker.io/vladyslavhaina/weirkeeper:latest
          imagePullPolicy: Always
          args: []
          env:
            - name: RUST_LOG
              value: "info"
            - name: LOGWEIR_RUNNER_IMAGE
              value: "docker.io/vladyslavhaina/logweir:latest"
            - name: LOGWEIR_RUNNER_PULL_POLICY
              value: "Always"
            - name: LOGWEIR_ARCHIVE_URL
              value: "s3://kafka-backups/logweir"
            # D2 §4.4 — the installation policy. The override ships empty and
            # the namespace comes from the pod; `templates/policy.yaml` renders
            # `weirkeeper-policy` into exactly that namespace.
            - name: LOGWEIR_POLICY_CONFIGMAP
              value: ""
            - name: LOGWEIR_INSTALLATION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AWS_ENDPOINT_URL
              value: "http://logweir-minio.logweir-system.svc:9000"
            - name: AWS_ALLOW_HTTP
              value: "true"
            - name: AWS_VIRTUAL_HOSTED_STYLE_REQUEST
              value: "false"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: logweir-evidence-ro
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: logweir-evidence-ro
                  key: secret-access-key
                  optional: true
          livenessProbe:
            exec:
              command: ["/usr/local/bin/weirkeeper", "--probe", "live"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/usr/local/bin/weirkeeper", "--probe", "ready"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
