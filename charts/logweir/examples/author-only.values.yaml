# author-only.values.yaml — images you BUILT AND LOADED yourself. Global
# Constraint 37: this is path (b) of docs/install.md, it is author-only
# everywhere it appears, and it is NOT EVIDENCE OF PUBLICATION — an install
# proven with it proves that the manifests are right and the binaries run, and
# says nothing about whether a stranger can install Logweir.
#
#     just image && just image-weirkeeper          # builds and LOADS the two tags
#     helm install logweir charts/logweir -n logweir-system --create-namespace \
#       -f charts/logweir/examples/author-only.values.yaml
#
# On a `kind` cluster the two tags are `kind load`ed first
# (.github/workflows/helm-demo.yml does exactly that).
#
# TAGS, NOT DIGESTS, AND THAT IS MEASURED: a locally built image's digest
# changes on every build (plan erratum E19(a)), so a digest here would be
# stale after the next `just image`. `imagePullPolicy: Never` is what keeps
# the tag honest — nothing is pulled, so nothing mutable is fetched from
# anywhere. These tags are LOCAL NAMES, not the chart's `:latest` defaults:
# `weirkeeper:check` and `logweir:check` exist only in this node's image store,
# which is why `Never` is right for them and `Always` — the chart's default,
# for a registry tag — would fail on a node with no registry to reach.
# `runnerImage` is handed to the controller as LOGWEIR_RUNNER_IMAGE (Task 33)
# and every runner Job it creates names it. scripts/check-chart.sh's
# every-image-is-a-digest arm exempts this one rendered file BY NAME, for this
# reason.
controllerImage: weirkeeper:check
runnerImage: logweir:check
imagePullPolicy: Never
# AND THE RUNNER JOBS' POLICY, WHICH IS NOW ITS OWN VALUE (Task 37) BECAUSE THE
# CHART'S DEFAULT IS `Always`. `LOGWEIR_RUNNER_PULL_POLICY: Never` is what makes
# a runner Job naming `logweir:check` start from the image you loaded rather
# than try to pull a tag no registry holds — and a wrong reference then fails as
# `ErrImageNeverPull`, naming the whole reference, instead of as a pull error
# naming a registry. Set it beside `runnerImage`, always: the image and its pull
# policy are two halves of one decision.
runnerImagePullPolicy: Never
# AND THE PAGE'S IMAGE, for the same reason (Task 39 moved the page out of a
# ConfigMap and into `logweir-ui`). `just image-ui` builds and loads this tag;
# without it the chart's default names a repository this branch cannot pull,
# and `helm install --wait` times out on a Deployment that never becomes Ready.
ui:
  imagePullPolicy: Never
  image: logweir-ui:check
