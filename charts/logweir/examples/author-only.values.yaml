# author-only.values.yaml — images you BUILT AND LOADED yourself. Global
# Constraint 37: this is path (b) of docs/install.md, it is author-only
# everywhere it appears, and it is NOT EVIDENCE OF PUBLICATION — an install
# proven with it proves that the manifests are right and the binaries run, and
# says nothing about whether a stranger can install Logweir.
#
#     just image && just image-weirkeeper          # builds and LOADS the two tags
#     helm install logweir charts/logweir -n logweir-system --create-namespace \
#       -f charts/logweir/examples/author-only.values.yaml
#
# On a `kind` cluster the two tags are `kind load`ed first
# (.github/workflows/helm-demo.yml does exactly that).
#
# TAGS, NOT DIGESTS, AND THAT IS MEASURED: a locally built image's digest
# changes on every build (plan erratum E19(a)), so a digest here would be
# stale after the next `just image`. `imagePullPolicy: Never` is what keeps
# the tag honest — nothing is pulled, so nothing mutable is fetched from
# anywhere. `runnerImage` is handed to the controller as LOGWEIR_RUNNER_IMAGE
# (Task 33) and every runner Job it creates names it; runner Jobs always pull
# with `Never`. scripts/check-chart.sh's every-image-is-a-digest arm exempts
# this one rendered file BY NAME, for this reason.
controllerImage: weirkeeper:check
runnerImage: logweir:check
imagePullPolicy: Never
