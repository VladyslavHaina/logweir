# console-shared.values.yaml — THE SSO CONSOLE, WITH EVERYTHING D0 REQUIRES OF
# IT. Substitute your own issuer, client, host, certificate and groups.
#
# READ `console.values.yaml` FIRST. That is the IN-CLUSTER ADMINISTRATOR MODE
# and it is a different thing: a loopback listener with no Service at all,
# reached only with `kubectl port-forward deploy/<release>-api`, one configured
# administrator, no identity provider and no Ingress. `shared` is the only mode
# that may be exposed through a Service or an Ingress, and the difference
# between the two is every value below.
#
# ---------------------------------------------------------------------------
# WHAT AN INSTALLATION MUST CREATE BEFORE THIS INSTALLS
# ---------------------------------------------------------------------------
# Three Secrets, none of them generated by this chart, because D0 requires the
# key material to be persistent and adopted explicitly and because a rendered
# manifest must never carry a credential:
#
#   # the session and cursor keys — two lines each, `version:` and `key:`
#   printf 'version: 1\nkey: "%s"\n' "$(openssl rand -base64 32)" > session.key
#   printf 'version: 1\nkey: "%s"\n' "$(openssl rand -base64 32)" > cursor.key
#   kubectl -n logweir-system create secret generic logweir-console-keys \
#     --from-file=session.key --from-file=cursor.key
#
#   # the OIDC client secret, under the exact key `clientSecret`
#   kubectl -n logweir-system create secret generic logweir-console-oidc \
#     --from-literal=clientSecret='…'
#
#   # the TLS certificate for the host below
#   kubectl -n logweir-system create secret tls logweir-console-tls \
#     --cert=tls.crt --key=tls.key
#
# `keyVersion` and the `version:` line in each key file MUST agree. Bumping both
# is a deliberate rotation that ends every live session; bumping neither while
# the file changes underneath means the file changed behind the service's back,
# and startup refuses it (exit 2, naming the field).
#
# ---------------------------------------------------------------------------
# WHAT THIS EXAMPLE DOES NOT AND CANNOT PROVE
# ---------------------------------------------------------------------------
# The NetworkPolicy is rendered and is structurally correct; Docker Desktop
# commonly has no enforcing CNI, so a local install proves the objects are
# well-formed and NOTHING about deny behaviour (D0 says so by name). The Ingress
# has no effect without a controller, and controller behaviour varies — HSTS in
# particular is the controller's annotation to set, which is why it is written
# below with a controller-specific key rather than as a chart field.
#
# `networkPolicy.oidcCIDRs` must be the identity provider's actual endpoint
# addresses. NetworkPolicy has no FQDN concept: left empty under an enforcing
# CNI, this policy BLOCKS OIDC discovery and the console starts NotReady. That
# is the honest failure and not a reason to widen the rule to 0.0.0.0/0.
# ---------------------------------------------------------------------------
# D0 STAGE 5: THE CONTROLLER IS SCOPED AWAY FROM THE CONSOLE'S KEYS
# ---------------------------------------------------------------------------
# The keys above live in the RELEASE namespace. `controller.watchNamespaces`
# replaces the controller's cluster-wide binding with one RoleBinding per
# execution namespace, so the controller can create Jobs — which can mount any
# Secret in their namespace — in team-a and team-b and NOT in the release
# namespace. Shared mode refuses to render without this list, and refuses a list
# that includes the release namespace. Each execution namespace still needs the
# runner ServiceAccount and the signing identity (docs/install.md step 4,
# `identity.authorizedRunnerNamespaces`).
#
# `requireTrustedProxy` makes the console refuse (421) every request whose
# socket peer is not a trusted proxy, or that the proxy did not mark HTTPS.
# `trustedProxyService` names the ingress controller's Service: the console
# trusts the addresses of its SERVING pods, re-read every five seconds, so the
# trust follows an ingress pod that is recreated on a new address (chart gap
# G6) and never covers a neighbouring pod. `trustedProxyCidrs` is the static
# alternative; it tells the ingress from a pod that dialled the Service
# directly ONLY when that range is the ingress controller's own and contains no
# other pod. Either is defence in depth beside the NetworkPolicy below, not a
# replacement for an enforcing CNI.
#
# THE INGRESS CONTROLLER IS A MAINTAINED ONE. This example uses Traefik; the
# Kubernetes project retired ingress-nginx in March 2026 (no releases or
# security fixes since), so no example here names it. HSTS is Traefik's to set,
# as a `headers` Middleware on the `websecure` entry point or per Ingress with
# the `traefik.ingress.kubernetes.io/router.middlewares` annotation below.
#
# `oidc.caBundle` is for an issuer whose certificate a PRIVATE CA issued (a
# corporate PKI): the ConfigMap holds that CA's PUBLIC certificate under
# `ca.crt`, and the console trusts it IN ADDITION to the system roots (chart
# gap G1). Drop it for an issuer with a publicly trusted certificate.
controller:
  watchNamespaces: [team-a, team-b]
kubernetes:
  namespace: team-a
api:
  enabled: true
  namespaces: [team-a, team-b]
  console:
    enabled: true
    mode: shared
    replicas: 2
    keySecret: logweir-console-keys
    keyVersion: 1
    publicBaseUrl: https://console.example.com
    sessionMaxAgeSeconds: 900
    # PLACEHOLDER (192.0.2.0/24 is a documentation range): the ingress
    # controller's OWN pod range and nothing wider. The gate below tells the
    # ingress from other pods only when this range contains no other pod; with
    # requireTrustedProxy the chart and the binary refuse anything wider than
    # /16. An enforcing NetworkPolicy remains the network boundary.
    trustedProxyCidrs: ["192.0.2.0/24"]
    trustedProxyService: { namespace: traefik, name: traefik }
    requireTrustedProxy: true
    oidc:
      issuer: https://idp.example.com/realms/logweir
      clientId: logweir-console
      clientSecret: logweir-console-oidc
      caBundle: { configMap: corporate-ca, key: ca.crt }
    roles:
      revision: "2026-09-21.1"
      bindings:
        - role: viewer
          namespace: team-a
          groups: ["logweir-team-a-viewers"]
        - role: operator
          namespace: team-a
          groups: ["logweir-team-a-operators"]
        - role: approver
          namespace: team-a
          groups: ["logweir-team-a-approvers"]
        - role: administrator
          namespace: team-b
          groups: ["logweir-platform-admins"]
    ingress:
      enabled: true
      className: traefik
      host: console.example.com
      tlsSecretName: logweir-console-tls
      annotations:
        # A `headers` Middleware (stsSeconds: 31536000) in THIS namespace.
        traefik.ingress.kubernetes.io/router.middlewares: logweir-system-hsts@kubernetescrd
    networkPolicy:
      enabled: true
      ingressNamespace: traefik
      ingressPodLabels:
        app.kubernetes.io/name: traefik
      oidcCIDRs: ["203.0.113.10/32"]
