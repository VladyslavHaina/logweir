# demo.values.yaml — everything on: the chart's own MinIO, two throwaway Kafka
# clusters, the console (localAdmin) and two workspaces, with the archive
# pointed at the chart's MinIO. The five-minute path:
#
#     just image && just image-weirkeeper && just image-console
#     kubectl create namespace logweir-system
#     head -c 32 /dev/urandom > cursor.key
#     kubectl -n logweir-system create secret generic logweir-console-keys \
#       --from-file=cursor.key && rm cursor.key
#     helm install logweir charts/logweir -n logweir-system \
#       -f charts/logweir/examples/demo.values.yaml \
#       -f charts/logweir/examples/author-only.values.yaml \
#       --set identity.installationTrust.enabled=false --wait --timeout 10m
#     bash scripts/helm-demo.sh
#
# (The walk administers trust with its own TrustRoster; a fresh install's
# default TrustPolicy would supersede it, hence installationTrust off.)
#
# (`--wait` returns only when both brokers and MinIO are Ready and the two
# seed Jobs have succeeded — they are Helm hooks.) The path above uses locally
# built images, hence author-only.values.yaml. With the published images the
# chart's pinned bootstrap digest needs no extra file; to use local images
# without this example file, combine them directly:
#
#     helm install … -f charts/logweir/examples/author-only.values.yaml \
#       --set demoKafka.enabled=true --set minio.enabled=true
#
# THE TWO KafkaCluster OBJECTS the demo creates name these bootstrap servers
# (the ClusterIP Service each broker advertises; substitute your release name
# and namespace):
#
#     source: logweir-kafka-source.logweir-system.svc.cluster.local:9092
#     target: logweir-kafka-target.logweir-system.svc.cluster.local:9092
#
# `archive.*` is left empty on purpose: with minio.enabled it defaults to
# s3://kafka-backups/<release> at http://<release>-minio.<namespace>.svc:9000,
# us-east-1, allowHttp, path-style — the chart's own backend.

# Everything lives in the release namespace. The walk works in workspace
# `default` (the first, which labels the chart's logweir-s3) and checks that
# `other` can neither run with nor read `default`'s objects.
workspaces: [default, other]

# THE `kubernetes:` BLOCK BELOW IS DELIBERATELY SCHEDULABLE ANYWHERE (Task 38).
# `kubernetes.io/os: linux` is a label the kubelet sets on every Linux node, so
# it constrains nothing on kind or docker-desktop, and a toleration for a taint
# nobody applies permits without restricting. It is here so the DEMO render —
# the only one that carries demo brokers — shows placement reaching a broker
# pod and a seed Job, which `chart_lint.rs` reads. Replace both with your own
# on a real cluster; `examples/msk.values.yaml` shows what that looks like.
kubernetes:
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: demo.logweir.dev/example
      operator: Exists
minio:
  enabled: true
  persistence:
    # emptyDir — a demo's archive vanishes with the pod, and so does its
    # evidence. Flip to true for anything that should outlive a restart.
    enabled: false
demoKafka:
  enabled: true
# D3 W13. `retention` is RBAC-only: it renders the ServiceAccount an enforcement
# Job names (granted no verb; it deletes nothing on its own). `api` renders the
# console/API principal's account and roles, and `api.console` the console in
# its loopback administrator mode, reached with `kubectl port-forward
# deploy/<release>-api 8484:8484` (`scripts/helm-demo.sh` step 9). Its key
# Secret is the operator's, created before the install (above).
retention:
  enabled: true
api:
  enabled: true
  console:
    enabled: true
    mode: localAdmin
    keySecret: logweir-console-keys
