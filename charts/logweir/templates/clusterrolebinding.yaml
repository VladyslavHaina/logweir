{{- /*
Binds the `weirkeeper` ClusterRole cluster-wide (`TrustRoster` is
cluster-scoped and read with `Api::all`). Rendered only for an unscoped
controller: with `controller.watchNamespaces` set, `controller-scope.yaml` binds
the namespaced rules per execution namespace instead.
*/ -}}
{{- if not .Values.controller.watchNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: weirkeeper
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: weirkeeper
subjects:
  - kind: ServiceAccount
    name: weirkeeper
    namespace: {{ .Release.Namespace }}
{{- end }}
