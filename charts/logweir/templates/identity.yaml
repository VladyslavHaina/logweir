{{- if .Values.identity.enabled }}
{{- $publicName := .Values.identity.publicConfigMapName }}
{{- $bootstrapImage := .Values.identity.bootstrapImage }}
{{- $externalName := .Values.identity.externalSecret.name | default "" }}
{{- $externalKey := .Values.identity.externalSecret.key | default "" }}
{{- /*
What renders once (the empty placeholders, the fresh-install trust grant) is
decided by `lookup`, which returns nothing outside a connected Helm (helm
template, helm lint, --dry-run=client, Argo CD): such a render looks like a
fresh install every time. `identity.renderedOffline=true` renders no
placeholder and no grant (the retained objects are created by hand); `false`
renders what `helm install` would, for a preview. `_validate.tpl` refuses the
render when it is unset and `lookup` cannot see the cluster.
*/ -}}
{{- $offline := eq (toString .Values.identity.renderedOffline) "true" }}
{{- $existingSecret := or $offline (lookup "v1" "Secret" .Release.Namespace "logweir-signing-key") }}
{{- $existingPublic := or $offline (lookup "v1" "ConfigMap" .Release.Namespace $publicName) }}
{{- /*
The console's ConsoleConfirmation key is managed like the installation
identity: empty retained placeholders the hook fills once, never rendered again
once they exist. Only when the chart manages the key (`logweir.consoleKey.managed`).
*/ -}}
{{- $consoleManaged := include "logweir.consoleKey.managed" . }}
{{- $consoleSecret := include "logweir.consoleKey.managedName" . }}
{{- $consolePublic := include "logweir.consoleKey.publicName" . }}
{{- $existingConsoleSecret := or $offline (lookup "v1" "Secret" .Release.Namespace $consoleSecret) }}
{{- $existingConsolePublic := or $offline (lookup "v1" "ConfigMap" .Release.Namespace $consolePublic) }}
{{- $trust := .Values.identity.installationTrust }}
{{- /*
The fresh install's trust step (`logweir.identity.freshTrust`): a first install
(`helm upgrade --install` of a new release is one too) into a namespace with no
established signing Secret, with the managed console key and no external
identity. An upgrade, a rollback (Helm replays the stored revision's hooks, and
this grant is `post-install` only), a reinstall over a retained identity and an
offline render (nothing outside Helm deletes the grant) render neither the
grant nor the arguments that spend it.
*/ -}}
{{- $freshTrust := include "logweir.identity.freshTrust" . }}
{{- $trustGrant := printf "%s-identity-trust" .Release.Name }}
{{- $allowedTargets := $trust.allowedTargetClusterIds | default list }}
{{- if .Values.demoKafka.enabled }}
{{- $allowedTargets = append $allowedTargets .Values.demoKafka.clusterIds.target }}
{{- end }}
{{- $allowedTargets = uniq $allowedTargets }}
{{- $singletonName := "logweir-identity-singleton" }}
{{- if not (lookup "rbac.authorization.k8s.io/v1" "ClusterRole" "" $singletonName) }}
# A fixed, authority-free cluster-scoped marker makes the current singleton
# contract explicit. It contains no key material and grants no permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $singletonName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/resource-policy: keep
    logweir.dev/release-name: {{ .Release.Name | quote }}
    logweir.dev/release-namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: signing-identity
rules: []
---
{{- end }}
{{- if not $existingSecret }}
# The private object is intentionally rendered EMPTY. The hook Job generates or
# adopts a key through an optimistic API patch; Helm never renders key material.
# `keep` makes uninstall/reinstall fail-safe: losing a Helm release record must
# not silently rotate the signer used by old archives.
apiVersion: v1
kind: Secret
metadata:
  name: logweir-signing-key
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/resource-policy: keep
    logweir.dev/identity-state: uninitialized
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: signing-identity
type: Opaque
data: {}
---
{{- end }}
{{- if not $existingPublic }}
# Public verification material only: key-id, algorithm, SPKI PEM and the exact
# current TrustRoster field that consumes it. Retained with the private object
# so an absent private key is detected as loss, never treated as a fresh install.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $publicName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/resource-policy: keep
    logweir.dev/identity-state: uninitialized
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: signing-trust
data: {}
---
{{- end }}
{{- if and $consoleManaged (not $existingConsoleSecret) }}
# The console's ConsoleConfirmation key, rendered EMPTY like the signing key
# above; the hook generates an Ed25519 key into it once (or adopts the key a
# hand-made Secret of this name holds), and `keep` makes it survive uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $consoleSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/resource-policy: keep
    logweir.dev/identity-state: uninitialized
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-confirmation
type: Opaque
data: {}
---
{{- end }}
{{- if and $consoleManaged (not $existingConsolePublic) }}
# The console key's PUBLIC half: key-id, algorithm, PEM and the one usage it
# may be trusted for. A publication record, not authorization.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $consolePublic }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/resource-policy: keep
    logweir.dev/identity-state: uninitialized
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: console-confirmation-trust
data: {}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-identity-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-bootstrap
automountServiceAccountToken: false
{{- with (include "logweir.imagePullSecrets" .) }}
{{ . }}
{{- end }}
---
# The bootstrap account cannot list Secrets and cannot read arbitrary names.
# The external source, when configured, is get-only; only the fixed managed
# Secret and public ConfigMap can be patched.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-identity-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - logweir-signing-key
      {{- with $externalName }}
      - {{ . }}
      {{- end }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["logweir-signing-key"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $publicName | quote }}]
    verbs: ["get", "patch"]
  {{- if $consoleManaged }}
  # The console key's two retained objects, by name, and nothing else.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $consoleSecret | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $consolePublic | quote }}]
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-identity-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-identity-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-identity-bootstrap
    namespace: {{ .Release.Namespace }}
---
{{- if $freshTrust }}
# PROD-16.1: THE FRESH INSTALL'S TRUST, AND ONLY FOR THE INSTALL. In the run
# that generates the installation identity and the console key, the hook reads
# which trust the cluster has and, when it has none, creates one default
# TrustPolicy trusting those two keys. `create` cannot be narrowed by
# resourceName, so this grant must not outlive the install: it renders only
# under `$freshTrust`, only on Helm 3.19+ (`_validate.tpl`), as a `post-install`
# hook weighted before the Job that spends it, deleted by Helm when the
# post-install hooks have run, succeeded or failed, and deleted by the hook
# itself after its trust step. A failed `Create` of a later hook or a Helm
# client killed mid-hook leaves it for the next hook run or the recovery
# command in docs/install.md. For those seconds, whoever can run a pod as
# `<release>-identity-bootstrap` could create a TrustPolicy (docs/kubernetes.md
# §8).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $trustGrant }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-bootstrap
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies"]
    verbs: ["list", "create"]
  - apiGroups: ["logweir.dev"]
    resources: ["trustrosters"]
    resourceNames: ["default"]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    resourceNames: [{{ $trustGrant | quote }}]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $trustGrant }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $trustGrant }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-identity-bootstrap
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-identity-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade,post-rollback
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-10"
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-bootstrap
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: identity-bootstrap
        logweir.dev/identity-authority: bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-identity-bootstrap
      automountServiceAccountToken: true
      {{- with (include "logweir.placement" (dict "root" $ "over" dict)) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ $bootstrapImage }}
          imagePullPolicy: {{ .Values.identity.bootstrapImagePullPolicy }}
          args:
            - identity
            - bootstrap
            - --namespace
            - {{ .Release.Namespace }}
            - --public-configmap-name
            - {{ $publicName }}
            {{- with $externalName }}
            - --external-secret-name
            - {{ . }}
            - --external-secret-key
            - {{ $externalKey }}
            {{- end }}
            {{- if $consoleManaged }}
            - --console-secret-name
            - {{ $consoleSecret }}
            - --console-public-configmap-name
            - {{ $consolePublic }}
            {{- end }}
            {{- if $freshTrust }}
            - --installation-trust-policy
            - {{ $trust.policyName }}
            {{- range $id := $allowedTargets }}
            - --allowed-target-cluster-id
            - {{ $id | quote }}
            {{- end }}
            {{- if include "logweir.freshInstallConfirm" . }}
            - --mark-fresh-install-confirm
            {{- end }}
            {{- end }}
            {{- if and $trust.enabled (include "logweir.bootstrap.consoleKey" .) }}
            {{- /* On every run of an image that knows the flag: revoke the install's
            trust grant if it is still bound. 403 or 404: nothing held. */}}
            - --revoke-trust-binding
            - {{ $trustGrant }}
            {{- end }}
          resources:
            {{- toYaml .Values.identity.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
