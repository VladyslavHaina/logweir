{{- /*
The `weirkeeper` ClusterRole — `config/rbac/role.yaml`, rule for rule. Every
granted verb has a caller (`manifest_lint.rs::every_granted_verb_has_a_caller`
over the source manifest; `chart_lint.rs::chart_lint_default_render_agrees_with_the_install_file`
holds this copy to it as a set of rules). No verb on `secrets`; `delete` on
EXACTLY the two transient check kinds and nothing else (D2 §4.3 `gc.rs`, §5.8
retention — the whole reasoning is in `config/rbac/role.yaml`'s header); one
rule naming `pods/log` with `get`; nothing naming `pods/exec` or `pods/attach`.
The reasoning is in the source file and is not repeated here.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: weirkeeper
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals
      - backups
      - backupschedules
      - kafkaclusters
      - restores
      - trustrosters
    verbs: ["get", "list", "watch"]
  # D2 W7 (PLAT-08.1): the seventh kind, in its own rule so the six-kind list
  # the `logweir-viewer` role shares is untouched. See `config/rbac/role.yaml`.
  - apiGroups: ["logweir.dev"]
    resources: ["backupdestinations"]
    verbs: ["get", "list", "watch"]
  # D2 W8 (PLAT-09.1): the eighth kind. `list`/`watch` only — the reconciler
  # never re-reads a discovery, and every granted verb here has a caller. See
  # `config/rbac/role.yaml`.
  - apiGroups: ["logweir.dev"]
    resources: ["topicdiscoveries"]
    verbs: ["list", "watch"]
  # D3 W8 (PLAT-15.1): the ninth kind, `list`/`watch` for the catalog
  # reconciler's own watch, plus the `get` D3 W6 needs to read the ONE catalog a
  # `ProtectionPolicy` names. See `config/rbac/role.yaml`.
  - apiGroups: ["logweir.dev"]
    resources: ["recoverycatalogs"]
    verbs: ["get", "list", "watch"]
  # D2 W9 (PLAT-03.1 / PLAT-03.2): the tenth kind, likewise in its own rules.
  # No `get`: nothing calls `Api<Preflight>::get`, and no execution path may
  # look one up (D2 §6.8). See `config/rbac/role.yaml` for the NOTE FOR W11.
  - apiGroups: ["logweir.dev"]
    resources: ["preflights"]
    verbs: ["list", "watch"]
  # `create` is one `Backup` per due slot; `patch` is PLAT-05.2's history
  # migration (D1 §6.8) — a metadata-only merge patch that removes the
  # schedule's ownerReference from a terminal run. No `update`, no `delete`.
  # See `config/rbac/role.yaml`.
  - apiGroups: ["logweir.dev"]
    resources: ["backups"]
    verbs: ["create", "patch"]
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals/status
      - backups/status
      - backupschedules/status
      - kafkaclusters/status
      - restores/status
      - trustrosters/status
    verbs: ["patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["backupdestinations/status"]
    verbs: ["patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["topicdiscoveries/status"]
    verbs: ["patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["recoverycatalogs/status"]
    verbs: ["patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["preflights/status"]
    verbs: ["patch"]
  # D2 W11 (§4.3 `gc.rs`, §5.8): the ONE `delete` rule, on the two TRANSIENT
  # check kinds and nothing else. `collect_expired` in each of the two
  # reconcilers, with `DeleteParams { preconditions: { uid } }` and a
  # per-pass cap. See `config/rbac/role.yaml`.
  - apiGroups: ["logweir.dev"]
    resources: ["topicdiscoveries", "preflights"]
    verbs: ["delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # D2 §7.1: `FailedCreate` and `FailedMount` for the check Jobs and pods the
  # preflight controller owns, by `involvedObject.uid`. `list` and nothing else.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get"]
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies/status"]
    verbs: ["patch"]
  # PLAT-14.2 (D3 W6): the `ProtectionPolicy` reconciler's `Controller::new`
  # watch and its `Api::patch_status`. No `get` on the kind and no `update`
  # anywhere. See `config/rbac/role.yaml`.
  - apiGroups: ["logweir.dev"]
    resources: ["protectionpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["logweir.dev"]
    resources: ["protectionpolicies/status"]
    verbs: ["patch"]
  # PLAT-14.3 (D3 W7): the `RehearsalSchedule` reconciler's watch, its referent
  # `get` from `controllers/approval.rs`, its `Api::patch_status`, and the ONE
  # `Restore` it creates per due slot. No `delete`, no `update`, no verb on
  # `secrets`. See `config/rbac/role.yaml`.
  - apiGroups: ["logweir.dev"]
    resources: ["rehearsalschedules"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["logweir.dev"]
    resources: ["rehearsalschedules/status"]
    verbs: ["patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["restores"]
    verbs: ["create"]
  # PLAT-16.1 / PLAT-16.2 (D3 W9): the `RetentionPolicy` reconciler's
  # `Controller::new` watch, its namespace-wide `list` for the two-policies-one-
  # destination conflict check, and its `Api::patch_status`. No `get` on the
  # kind, no `update` anywhere, and no `delete` on anything: the controller
  # creates the retention Job and does not link the code that deletes. See
  # `config/rbac/role.yaml`.
  - apiGroups: ["logweir.dev"]
    resources: ["retentionpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["logweir.dev"]
    resources: ["retentionpolicies/status"]
    verbs: ["patch"]
