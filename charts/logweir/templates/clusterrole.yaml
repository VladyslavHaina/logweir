{{- /*
The `weirkeeper` ClusterRole. Every granted verb has a caller and every call
has a grant: `manifest_lint.rs` (`every_granted_verb_has_a_caller`,
`every_call_site_has_a_grant`) reads this role out of every rendered variant
and the `Api<T>` calls out of `crates/weirkeeper/src/`. No verb on `secrets`;
`delete` on exactly the two transient check kinds; one rule naming `pods/log`
with `get`; nothing naming `pods/exec` or `pods/attach`.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: weirkeeper
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals
      - backups
      - backupschedules
      - kafkaclusters
      - restores
      - trustrosters
    verbs: ["get", "list", "watch"]
  # In its own rule so the six-kind list `logweir-viewer` shares is untouched.
  - apiGroups: ["logweir.dev"]
    resources: ["backupdestinations"]
    verbs: ["get", "list", "watch"]
  # `list`/`watch` only: the reconciler never re-reads a discovery.
  - apiGroups: ["logweir.dev"]
    resources: ["topicdiscoveries"]
    verbs: ["list", "watch"]
  # `get` reads the one catalog a `ProtectionPolicy` names.
  - apiGroups: ["logweir.dev"]
    resources: ["recoverycatalogs"]
    verbs: ["get", "list", "watch"]
  # No `get`: nothing calls `Api<Preflight>::get`, and no execution path may
  # look one up.
  - apiGroups: ["logweir.dev"]
    resources: ["preflights"]
    verbs: ["list", "watch"]
  # `create` is one `Backup` per due slot; `patch` removes the schedule's
  # ownerReference from a terminal run (history migration). No `update`, no
  # `delete`.
  - apiGroups: ["logweir.dev"]
    resources: ["backups"]
    verbs: ["create", "patch"]
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals/status
      - backups/status
      - backupschedules/status
      - kafkaclusters/status
      - restores/status
      - trustrosters/status
    verbs: ["patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["backupdestinations/status"]
    verbs: ["patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["topicdiscoveries/status"]
    verbs: ["patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["recoverycatalogs/status"]
    verbs: ["patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["preflights/status"]
    verbs: ["patch"]
  # The one `delete` rule, on the two transient check kinds: each reconciler's
  # garbage collection, with a UID precondition and a per-pass cap.
  - apiGroups: ["logweir.dev"]
    resources: ["topicdiscoveries", "preflights"]
    verbs: ["delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # `FailedCreate` and `FailedMount` for the Jobs and pods the controller owns,
  # by `involvedObject.uid`, while a pod has not started.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get"]
  # `patch` on the object is the compromise-revocation finalizer and nothing
  # else.
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies"]
    verbs: ["list", "watch", "patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies/status"]
    verbs: ["patch"]
  # The `ProtectionPolicy` reconciler's watch and `patch_status`. No `get`, no
  # `update`.
  - apiGroups: ["logweir.dev"]
    resources: ["protectionpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["logweir.dev"]
    resources: ["protectionpolicies/status"]
    verbs: ["patch"]
  # The `RetentionPolicy` reconciler's watch, its namespace-wide `list` for the
  # two-policies-one-destination check, and `patch_status`. No `get`, no
  # `update`, no `delete` on anything: the controller creates the retention Job
  # and does not link the code that deletes.
  - apiGroups: ["logweir.dev"]
    resources: ["retentionpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["logweir.dev"]
    resources: ["retentionpolicies/status"]
    verbs: ["patch"]
  # PROD-04.2: the `Switchover` reconciler's watch, its namespace-wide `list`
  # (one switchover per restore at a time), the `Approval` reconciler's `get`
  # of a switchover subject, and `patch_status`. No `update`, no `delete`.
  - apiGroups: ["logweir.dev"]
    resources: ["switchovers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["logweir.dev"]
    resources: ["switchovers/status"]
    verbs: ["patch"]
