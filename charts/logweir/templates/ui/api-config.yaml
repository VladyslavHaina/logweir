{{/*
`api.console.enabled` — THE CONSOLE'S CONFIGURATION FILE, AND THE REFUSALS.

READ `api-rbac.yaml`'s HEADER FIRST. That file renders the console PRINCIPAL —
a ServiceAccount, two ClusterRoles and one RoleBinding per configured namespace
— and its last paragraph says what this file is the answer to: "There is no
Deployment, no Service, no image and no Ingress here. The console's image and
its deployment are PLAT-17.1's own stage." This is that stage. Turning
`api.enabled` on still creates an account with no pod; turning
`api.console.enabled` on as well is what runs something as it.

TWO SWITCHES AND NOT ONE, WHICH IS D0'S ROLLOUT ORDER AND NOT AN EXTRA KNOB.
D0's migration says: "deploy console disabled; configure persistent session and
confirmation identity, OIDC, exact role/namespace bindings, TLS ingress, and
policy digests; enable read-only console". An installation therefore has a real
state in which the identity exists, is reviewable with `kubectl auth can-i`, and
runs nothing — which is exactly what `api.enabled` alone means and what it has
meant since D3 W13. Collapsing the two would have made `api.enabled` change from
"an account" to "a public-facing HTTP service" under installations that already
set it.

  api.enabled:          the principal.      No pod. (api-rbac.yaml)
  api.console.enabled:  the workload.       Requires api.enabled. (this file,
                        api-deployment.yaml, api-ingress.yaml, api-networkpolicy.yaml)

`console` IS D0'S OWN WORD, NESTED UNDER THE CHART'S. D0 stage 7 names
`console.*` values; the crate, the binary, the image and the landed RBAC values
block are `logweir-api` / `api.*`. `api.console.*` is both names in the place
where the reader needs both, and `charts/logweir/README.md` says so in prose.

---------------------------------------------------------------------------
WHY THE CONFIGURATION IS A ConfigMap AND WHAT MAY NEVER BE IN IT
---------------------------------------------------------------------------
`logweir-api` takes `--config <file>` and refuses to start without one (exit 2,
before any socket or Kubernetes client). Putting that file here rather than in
the image means the MODE, the listen address, the granted namespaces and the
role bindings are all readable from `helm template` and `kubectl get cm` — the
same argument `ui.yaml` makes about `kubectl proxy`'s `--accept-paths`.

AND IT CARRIES NO CREDENTIAL. Not the OIDC client secret, not the session key,
not the cursor MAC key: every one of the three is a PATH into a mounted Secret
volume, and the Secret is the operator's, named by `api.console.keySecret` and
`api.console.oidc.clientSecret`. A ConfigMap is world-readable to anything with
`get configmaps` in the namespace, it appears in `helm get manifest`, and it is
in the rendered files checked into `charts/logweir/rendered/`. Global Constraint
28 and D0's "never log … Secret values" both land here.
`crates/logweir/tests/chart_lint.rs` reads every rendered ConfigMap of this
component and refuses a value under any credential-shaped key.

---------------------------------------------------------------------------
THE ConfigMap IS IMMUTABLE AND CONTENT-ADDRESSED
---------------------------------------------------------------------------
The same shape `ui.yaml` uses for its runtime context: the name carries the
first ten characters of the document's sha256, and `immutable: true` means the
API server refuses a write to it. An upgrade that changes one binding therefore
creates a NEW object and rolls the pod onto it; nobody with `patch configmaps`
can change the role table under a running console, and a console that is up is
running the configuration its Deployment names. The old object is left behind by
Helm's three-way merge only until the release's next upgrade removes it.
*/}}

{{- /*
THE ONE NAME. Deployment, Service, ConfigMap, Ingress, NetworkPolicy and the
ServiceAccount they run as are all `<release>-api`, from the helper
`api-rbac.yaml` and `admission-policy.yaml` already share (review finding F3).
A console whose pod ran as an account with a different name would be a pod with
no grants at all.
*/ -}}
{{- define "logweir.api.consoleName" -}}
{{- include "logweir.api.serviceAccountName" . -}}
{{- end -}}

{{- /*
WHERE THE THREE SECRET-BACKED FILES ARE MOUNTED. One place, so the config
document below and the PodSpec in `api-deployment.yaml` cannot disagree about a
path — which would be a console that starts, reads a key that is not there and
exits 2 with a field name nobody can act on.
*/ -}}
{{- define "logweir.api.keyDir" -}}/var/run/logweir/keys{{- end -}}
{{- define "logweir.api.oidcDir" -}}/var/run/logweir/oidc{{- end -}}

{{- /*
EVERY REFUSAL THIS COMPONENT HAS, IN ONE PLACE, EVALUATED BEFORE ANYTHING
RENDERS. `fail` stops `helm template`, `helm lint`, `helm install` and
`helm upgrade` alike, so each of these is a chart that does not install rather
than an installation that comes up wrong. D0: "A console that comes up on plain
HTTP, or with a key someone rewrote underneath it, is worse than one that does
not come up at all, because the first two look like they are working."

The service itself refuses the same things at startup (exit 2, `config.rs`), and
that is not a duplication to remove: this arm refuses at RENDER time, where the
operator is still holding the values file, and it refuses in `helm lint` on a
laptop with no cluster.
*/ -}}
{{- define "logweir.api.consoleChecks" -}}
{{- $c := .Values.api.console -}}
{{- if not .Values.api.enabled -}}
{{- fail "api.console.enabled requires api.enabled: the console runs AS the principal `api.enabled` renders (its ServiceAccount, its two ClusterRoles and its per-namespace RoleBindings). A pod without them holds no grant on any Logweir kind and every route would 403. Set api.enabled=true." -}}
{{- end -}}
{{- if not $c.image -}}
{{- fail "api.console.image is empty. It must name the logweir-console image (Dockerfile.console): `logweir-api` plus the twenty-two page files it serves at /ui/." -}}
{{- end -}}
{{- if not $c.keySecret -}}
{{- fail "api.console.keySecret is empty. The console needs a cursor MAC key of at least 32 bytes (and, in shared mode, a session key), and this chart DELIBERATELY does not generate one: a Helm-generated key changes on every render, which would make the rendered fixtures unstable and the key unrecoverable on upgrade. D0 requires these to be persistent, versioned Secrets created or adopted EXPLICITLY. Create one and name it here; charts/logweir/README.md carries the command." -}}
{{- end -}}
{{- if lt (int $c.replicas) 1 -}}
{{- fail "api.console.replicas must be at least 1." -}}
{{- end -}}
{{- if not $c.mode -}}
{{- fail "api.console.mode is empty, and there is no default. The two modes are `localAdmin` — THE IN-CLUSTER ADMINISTRATOR MODE: a loopback listener with no Service at all, reached only with `kubectl port-forward deploy/<release>-api`, one configured administrator, no identity provider, the narrowly bound <release>-api ServiceAccount, and readiness not gated on OIDC — and `shared`, the SSO console, which is the ONLY mode that may be exposed through a Service or an Ingress. `crates/logweir-api/src/config.rs` refuses a configuration file that forgets to name a mode rather than reading it as the more permissive one; this chart refuses the same way and for the same reason. Name one." -}}
{{- end -}}
{{- if eq $c.mode "localAdmin" -}}
{{- if not $c.localAdminSubject -}}
{{- fail "api.console.localAdminSubject is empty. localAdmin mode has no identity provider: every request is attributed to this one configured administrator, so the name it is recorded under is not optional." -}}
{{- end -}}
{{- if $c.requireTrustedProxy -}}
{{- fail "api.console.requireTrustedProxy belongs to api.console.mode=shared. The in-cluster administrator mode binds loopback and is reached only through kubectl port-forward; there is no proxy in front of it to trust." -}}
{{- end -}}
{{- if $c.ingress.enabled -}}
{{- fail "api.console.ingress.enabled with api.console.mode=localAdmin is refused. D0: the local administrator path \"must not bind 0.0.0.0, get an Ingress, or be described as shared-console mode\" — it authenticates nobody, so an Ingress in front of it is an unauthenticated shared console. Set api.console.mode=shared and configure OIDC and TLS, or reach localAdmin mode with `kubectl port-forward`." -}}
{{- end -}}
{{- else if eq $c.mode "shared" -}}
{{- if not (hasPrefix "https://" $c.publicBaseUrl) -}}
{{- fail (printf "api.console.publicBaseUrl is %q. Shared mode requires the EXACT https:// URL the browser uses — TLS at the shared entry point is required, not recommended (D0). The OIDC redirect URI is this value plus /auth/callback, so a value that is wrong here is a login that cannot complete." $c.publicBaseUrl) -}}
{{- end -}}
{{- if or (hasSuffix "/" $c.publicBaseUrl) (contains "@" $c.publicBaseUrl) -}}
{{- fail (printf "api.console.publicBaseUrl is %q. It carries no path, no trailing slash and no userinfo: the redirect URI registered with the provider is this value plus /auth/callback." $c.publicBaseUrl) -}}
{{- end -}}
{{- if not $c.oidc.issuer -}}
{{- fail "api.console.oidc.issuer is empty. Shared mode is SSO: the issuer is compared for exact equality with the ID token's `iss`, so there is no default and no discovery from the public URL." -}}
{{- end -}}
{{- if not $c.oidc.clientId -}}
{{- fail "api.console.oidc.clientId is empty. It is also the expected audience of every ID token." -}}
{{- end -}}
{{- if not $c.oidc.clientSecret -}}
{{- fail "api.console.oidc.clientSecret is empty. It is the NAME of a Secret in the release namespace holding the client secret under the key `clientSecret` — never the secret itself: a literal here would be a credential in a rendered manifest, in `helm get manifest` and in charts/logweir/rendered/." -}}
{{- end -}}
{{- if not $c.roles.revision -}}
{{- fail "api.console.roles.revision is empty. It is the provenance of every authorization decision in the audit log; a role table with no revision is a decision nobody can trace to the values file that made it." -}}
{{- end -}}
{{- if not $c.roles.bindings -}}
{{- fail "api.console.roles.bindings is empty. Shared mode has no default namespace and no implicit grant: with no binding every authenticated user is authorized for nothing, which is a console that installs and serves 403." -}}
{{- end -}}
{{- /*
D0 STAGE 5 — SHARED MODE IS NOT RENDERED INSIDE THE CONTROLLER'S JOB-CREATE
AUTHORITY. The console's session and cursor keys live in the release namespace
(`api.console.keySecret`). Under the default cluster-wide ClusterRoleBinding the
controller may create a Job there, and a Job can mount that Secret — residual
O1 extended to the console, which D0 says must not be declared secure. So
shared mode requires the scoped controller (`controller.watchNamespaces`), and
refuses a list that includes the release namespace, because that list is where
the controller may create Jobs.
*/ -}}
{{- $watch := .Values.controller.watchNamespaces | default list -}}
{{- if not $watch -}}
{{- fail (printf "api.console.mode=shared requires controller.watchNamespaces (D0 stage 5). The console's session and cursor keys live in the release namespace %q, and with the default cluster-wide ClusterRoleBinding the controller may create a Job there that mounts them — the signing-oracle residual O1 extended to the console's keys, which D0 says must not be declared secure. List the namespaces Backups and Restores run in; the controller then holds Job-create authority there and nowhere else. charts/logweir/README.md §controller.watchNamespaces has the migration." .Release.Namespace) -}}
{{- end -}}
{{- if has .Release.Namespace $watch -}}
{{- fail (printf "controller.watchNamespaces includes the release namespace %q, which holds the shared console's keys (api.console.keySecret). The controller may create Jobs in every listed namespace, so this list would put the keys back inside its Job-create authority (D0 stage 5). Run Backups and Restores in other namespaces and remove %q from the list." .Release.Namespace .Release.Namespace) -}}
{{- end -}}
{{- /*
THE LEGACY PROXY IS NOT RENDERED BESIDE THE SHARED CONSOLE. `ui.enabled` is the
`kubectl proxy` ClusterIP: anyone who reaches it acts as its ServiceAccount, with
no login and no per-user authorization. Next to a shared console it is a second,
unauthenticated way to the same objects, and PLAT-17.2 says to remove or
isolate it. The laptop `kubectl proxy --address=127.0.0.1` path is unaffected.
*/ -}}
{{- if .Values.ui.enabled -}}
{{- fail "api.console.mode=shared with ui.enabled=true is refused. ui.enabled renders the legacy `kubectl proxy` Service, which acts as its own ServiceAccount for anyone in the cluster who reaches it — no sign-in, no per-user role — so beside a shared console it is an unauthenticated second path to the same objects (PLAT-17.2: remove or isolate the legacy proxy). Set ui.enabled=false; an administrator keeps the laptop `kubectl proxy --www=./ui --address=127.0.0.1` path, or api.console.mode=localAdmin through port-forward." -}}
{{- end -}}
{{- if and $c.requireTrustedProxy (not $c.trustedProxyCidrs) -}}
{{- fail "api.console.requireTrustedProxy needs api.console.trustedProxyCidrs: with no range to trust, the entry point would refuse every request (421) and the console would look like an outage. Name the ingress controller's pod or node ranges." -}}
{{- end -}}
{{- if $c.requireTrustedProxy -}}
{{- range $cidr := $c.trustedProxyCidrs -}}
{{- $prefix := int (last (splitList "/" (toString $cidr))) -}}
{{- $floor := ternary 48 16 (contains ":" (toString $cidr)) -}}
{{- if lt $prefix $floor -}}
{{- fail (printf "api.console.trustedProxyCidrs names %q, wider than /%d. With requireTrustedProxy a range this wide trusts the pods the gate exists to refuse: on most clusters every pod is inside 10.0.0.0/8 and can dial the console Service directly and send the proxy's header itself. Name the ingress controller's own pod range (the binary refuses the same)." (toString $cidr) $floor) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $granted := (include "logweir.api.namespaces" . | fromJsonArray) -}}
{{- range $b := $c.roles.bindings -}}
{{- if not (has $b.namespace $granted) -}}
{{- fail (printf "api.console.roles.bindings names namespace %q, which is not one the console is bound in (%s). The RoleBindings come from api.namespaces and kubernetes.namespace; a product binding for a namespace the ServiceAccount cannot read is a role that grants a 403." $b.namespace (join ", " $granted)) -}}
{{- end -}}
{{- if or (contains "*" (toString (concat ($b.groups | default list) ($b.subjects | default list)))) (contains "?" (toString (concat ($b.groups | default list) ($b.subjects | default list)))) -}}
{{- fail (printf "api.console.roles.bindings for role %q in namespace %q contains `*` or `?`. Bindings are EXACT strings: there is no regex, no wildcard and no email-domain inference, and a `*` is refused by name rather than silently matching nothing." $b.role $b.namespace) -}}
{{- end -}}
{{- if not (has $b.namespace $watch) -}}
{{- fail (printf "api.console.roles.bindings names namespace %q, which is not in controller.watchNamespaces (%s). The console would create Backups, Restores and checks there that no controller reconciles. Add it to controller.watchNamespaces, or remove the binding." $b.namespace (join ", " $watch)) -}}
{{- end -}}
{{- end -}}
{{- if $c.ingress.enabled -}}
{{- if not $c.ingress.host -}}
{{- fail "api.console.ingress.host is empty. The Ingress rule needs the exact host the browser uses, and it must be publicBaseUrl's own authority." -}}
{{- end -}}
{{- if not $c.ingress.tlsSecretName -}}
{{- fail "api.console.ingress.tlsSecretName is empty. An Ingress for the shared console without a TLS block is a console published over plain HTTP: the session cookie is `__Host-`/`Secure` and would never be sent, and the OIDC redirect URI is https. TLS at the shared entry point is required, not recommended (D0)." -}}
{{- end -}}
{{- if ne $c.ingress.host (trimPrefix "https://" $c.publicBaseUrl) -}}
{{- fail (printf "api.console.ingress.host is %q but api.console.publicBaseUrl is %q. They must name the SAME authority. The OIDC redirect URI is publicBaseUrl plus /auth/callback, and the service answers 421 misdirected_request to any Host it does not serve — so a mismatched pair renders, lints and installs clean, and then refuses every browser that arrives through the Ingress it just published. Every other way to get this wrong is refused here by name; so is this one." $c.ingress.host $c.publicBaseUrl) -}}
{{- end -}}
{{- end -}}
{{- else -}}
{{- fail (printf "api.console.mode is %q. The two modes are `localAdmin` (a loopback listener reached with kubectl port-forward, one configured administrator, no identity provider) and `shared` (SSO: OIDC, an encrypted session cookie, exact role bindings and TLS). There is no default: a file that forgets to say which it wants is refused rather than read as the more permissive one." $c.mode) -}}
{{- end -}}
{{- /*
PLAT-19.2: a namespace this console serves that is bound to an approval policy
needs the console's ConsoleConfirmation key -- both modes carry its signature --
and `logweir-api` refuses to start without it. Refused here first, by name.
*/ -}}
{{- $served := (include "logweir.api.namespaces" . | fromJsonArray) -}}
{{- range $ns, $policy := (.Values.approvalPolicy.namespaces | default dict) -}}
{{- if and (has $ns $served) (not $.Values.approvalPolicy.confirmationKeySecret) -}}
{{- fail (printf "approvalPolicy.namespaces binds %s, which the console serves, to policy %q and approvalPolicy.confirmationKeySecret is empty. Both ordinary and governed requests carry the console's ConsoleConfirmation signature (D0): create a Secret with key `confirmation.key` (a PKCS#8 PEM private key whose PUBLIC half is on the namespace's TrustPolicy with usage ConsoleConfirmation) and name it, or unbind the namespace." $ns $policy) -}}
{{- end -}}
{{- end -}}
{{- if and $c.networkPolicy.enabled (eq $c.mode "shared") -}}
{{- if or (not $c.networkPolicy.ingressNamespace) (not $c.networkPolicy.ingressPodLabels) -}}
{{- fail "api.console.networkPolicy.enabled in shared mode needs both networkPolicy.ingressNamespace and networkPolicy.ingressPodLabels. An ingress rule with no `from` selector admits nothing at all, which would be a console nobody can reach; one with an empty podSelector admits every pod in the controller's namespace, which is not what `only the configured ingress controller` means. (In the in-cluster administrator mode there is no ingress rule to write: nothing may dial this pod, so the policy denies ingress outright and neither selector is read.)" -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /*
THE CONFIGURATION DOCUMENT ITSELF. Three things about it are decisions and not
formatting, and they are here rather than inside the document because a comment
emitted into a rendered ConfigMap is a comment an operator has to scroll past on
every `kubectl get cm -o yaml`.

1. THE IN-CLUSTER ADMINISTRATOR MODE (`localAdmin`) BINDS LOOPBACK AND HAS NO
   Service. `config.rs` refuses any non-loopback listener in that mode by name
   (`0.0.0.0`, `[::]` and any routable address), so `127.0.0.1` is not a choice
   this template makes; it is the only one the binary accepts — and this chart
   then renders no Service, no Ingress and no ingress NetworkPolicy rule to go
   with it, so there is nothing in the cluster that a monitor or another pod
   could dial. The legacy `kubectl proxy` (`ui.yaml`) is reachable by anything
   in the cluster and acts with its own ServiceAccount for whoever reached it;
   this pod is reachable only through the API server's portforward subresource.
   Reach it that way:

       kubectl --context docker-desktop -n <ns> port-forward deploy/<release>-api 8484:8484
       open http://127.0.0.1:8484/ui/

   A DEPLOYMENT TARGET AND NOT A Service, because in this mode there IS no
   Service: `api-deployment.yaml` renders one only in `shared` mode. `kubectl
   port-forward` takes a Deployment directly, so nothing is lost, and what is
   gained is that this chart renders no object any monitor or any other pod
   could dial.

   `publicOrigin` must carry the listen port (`config.rs` refuses a mismatch),
   so the local side of that port-forward is the same number.

   Shared mode binds the Pod IP, because TLS terminates at the Ingress in front
   of it and the ClusterIP is inside the boundary `api-networkpolicy.yaml`
   draws. `publicBaseUrl` is an EXACT administrator value: nothing in this
   service derives an origin, a redirect URI or an authorization decision from
   `Host`, `Forwarded` or `X-Forwarded-*`.

2. `kubernetes.source: inCluster`, ALWAYS, AND THERE IS NO CHART VALUE FOR THE
   OTHER SOURCE. D0: the console "uses a narrowly bound Kubernetes
   ServiceAccount". A pod that read a kubeconfig would act with whatever
   identity that file carries — which on a developer's laptop is routinely
   cluster-admin — and the whole `auth can-i` argument in `api-rbac.yaml` would
   be about an account nothing runs as. The token is the projected, time-bound
   one the kubelet mounts (BoundServiceAccountTokenVolume, the default since
   Kubernetes 1.21), which is what D0 means by "projected token".

3. THE TWO MODES ARE DIFFERENT DOCUMENTS, not one document with optional
   halves, because `config.rs` parses with `deny_unknown_fields` and refuses the
   wrong mode's fields BY NAME: `publicOrigin` in shared mode,
   `oidc`/`roles`/`sessionKey` in localAdmin mode, `cursorKeyFile` versus
   `cursorKey` in either. That refusal is a feature and this template must not
   defeat it by emitting both.
*/ -}}
{{- define "logweir.api.config" -}}
{{- $c := .Values.api.console -}}
{{- $ns := (include "logweir.api.namespaces" . | fromJsonArray) -}}
{{- $keys := include "logweir.api.keyDir" . -}}
mode: {{ $c.mode }}
{{- if eq $c.mode "localAdmin" }}
listen: "127.0.0.1:{{ $c.port }}"
publicOrigin: "http://127.0.0.1:{{ $c.port }}"
{{- else }}
listen: "0.0.0.0:{{ $c.port }}"
publicBaseUrl: {{ $c.publicBaseUrl | quote }}
{{- end }}
uiDirectory: /ui
{{- if eq $c.mode "localAdmin" }}
localAdmin:
  subject: {{ $c.localAdminSubject | quote }}
{{- else }}
oidc:
  issuer: {{ $c.oidc.issuer | quote }}
  clientId: {{ $c.oidc.clientId | quote }}
  clientSecretFile: {{ printf "%s/clientSecret" (include "logweir.api.oidcDir" .) }}
roles:
  revision: {{ $c.roles.revision | quote }}
  bindings:
{{ toYaml $c.roles.bindings | indent 4 }}
sessionKey:
  file: {{ printf "%s/session.key" $keys }}
  expectedVersion: {{ int $c.keyVersion }}
sessionMaxAgeSeconds: {{ int $c.sessionMaxAgeSeconds }}
{{- with $c.trustedProxyCidrs }}
trustedProxyCidrs:
{{ toYaml . | indent 2 }}
{{- end }}
{{- if $c.requireTrustedProxy }}
requireTrustedProxy: true
{{- end }}
{{- end }}
namespaces:
{{ toYaml $ns | indent 2 }}
kubernetes:
  source: inCluster
  principal: {{ printf "system:serviceaccount:%s:%s" .Release.Namespace (include "logweir.api.consoleName" .) | quote }}
{{- if eq $c.mode "localAdmin" }}
cursorKeyFile: {{ printf "%s/cursor.key" $keys }}
{{- else }}
cursorKey:
  file: {{ printf "%s/cursor.key" $keys }}
  expectedVersion: {{ int $c.keyVersion }}
{{- end }}
{{- /*
PLAT-19.2 — the SAME approval-policy document the controller mounts, and the
console's ConsoleConfirmation key (a PATH into a mounted Secret, never the key:
this ConfigMap carries no credential). Both rendered only when configured.
*/ -}}
{{- if include "logweir.approvalPolicy.configured" . }}
approvalPolicyFile: {{ include "logweir.approvalPolicy.file" . }}
{{- end }}
{{- if .Values.approvalPolicy.confirmationKeySecret }}
confirmationKeyFile: {{ printf "%s/confirmation.key" (include "logweir.approvalPolicy.confirmationDir" .) }}
{{- end }}
{{- end -}}

{{/*
THE GUARD IS `api.console.enabled` ALONE, AND NOT `and api.enabled …`, WHICH IS
A REFUSAL RATHER THAN A CONDITION. `api.console.enabled` with `api.enabled`
still false used to render NOTHING: the operator asked for a console, `helm
install` exited 0, and no pod, Service or ConfigMap existed to look for. A
missing principal is a configuration error and is answered as one below —
`logweir.api.consoleChecks` fails naming both flags — so the workload's absence
can never be silent. `scripts/check-chart.sh` arm 8 runs exactly that case.
*/}}
{{- if .Values.api.console.enabled }}
{{- include "logweir.api.consoleChecks" . }}
{{- $name := include "logweir.api.consoleName" . }}
{{- $config := include "logweir.api.config" . }}
{{- $hash := $config | sha256sum }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config-%s" $name (trunc 10 $hash) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
immutable: true
data:
  config.yaml: |
{{ $config | indent 4 }}
{{- end }}
