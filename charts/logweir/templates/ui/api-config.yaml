{{/*
`api.console.enabled` — THE CONSOLE'S CONFIGURATION FILE. Its refusals are in
`_validate.tpl`.

READ `api-rbac.yaml`'s HEADER FIRST. That file renders the console PRINCIPAL —
a ServiceAccount, two ClusterRoles and one RoleBinding per configured namespace
— and its last paragraph says what this file is the answer to: "There is no
Deployment, no Service, no image and no Ingress here. The console's image and
its deployment are PLAT-17.1's own stage." This is that stage. Turning
`api.enabled` on still creates an account with no pod; turning
`api.console.enabled` on as well is what runs something as it.

TWO SWITCHES AND NOT ONE, WHICH IS D0'S ROLLOUT ORDER AND NOT AN EXTRA KNOB.
D0's migration says: "deploy console disabled; configure persistent session and
confirmation identity, OIDC, exact role/namespace bindings, TLS ingress, and
policy digests; enable read-only console". An installation therefore has a real
state in which the identity exists, is reviewable with `kubectl auth can-i`, and
runs nothing — which is exactly what `api.enabled` alone means and what it has
meant since D3 W13. Collapsing the two would have made `api.enabled` change from
"an account" to "a public-facing HTTP service" under installations that already
set it.

  api.enabled:          the principal.      No pod. (api-rbac.yaml)
  api.console.enabled:  the workload.       Requires api.enabled. (this file,
                        api-deployment.yaml, api-ingress.yaml, api-networkpolicy.yaml)

`console` IS D0'S OWN WORD, NESTED UNDER THE CHART'S. D0 stage 7 names
`console.*` values; the crate, the binary, the image and the landed RBAC values
block are `logweir-api` / `api.*`. `api.console.*` is both names in the place
where the reader needs both, and `charts/logweir/README.md` says so in prose.

---------------------------------------------------------------------------
WHY THE CONFIGURATION IS A ConfigMap AND WHAT MAY NEVER BE IN IT
---------------------------------------------------------------------------
`logweir-api` takes `--config <file>` and refuses to start without one (exit 2,
before any socket or Kubernetes client). Putting that file here rather than in
the image means the MODE, the listen address, the granted namespaces and the
role bindings are all readable from `helm template` and `kubectl get cm`.

AND IT CARRIES NO CREDENTIAL. Not the OIDC client secret, not the session key,
not the cursor MAC key: every one of the three is a PATH into a mounted Secret
volume, and the Secret is the operator's, named by `api.console.keySecret` and
`api.console.oidc.clientSecret`. A ConfigMap is world-readable to anything with
`get configmaps` in the namespace, it appears in `helm get manifest`, and it is
in the rendered files checked into `charts/logweir/rendered/`. Global Constraint
28 and D0's "never log … Secret values" both land here.
`crates/logweir/tests/chart_lint.rs` reads every rendered ConfigMap of this
component and refuses a value under any credential-shaped key.

---------------------------------------------------------------------------
THE ConfigMap IS IMMUTABLE AND CONTENT-ADDRESSED
---------------------------------------------------------------------------
The name carries the
first ten characters of the document's sha256, and `immutable: true` means the
API server refuses a write to it. An upgrade that changes one binding therefore
creates a NEW object and rolls the pod onto it; nobody with `patch configmaps`
can change the role table under a running console, and a console that is up is
running the configuration its Deployment names. The old object is left behind by
Helm's three-way merge only until the release's next upgrade removes it.
*/}}

{{- /*
THE ONE NAME. Deployment, Service, ConfigMap, Ingress, NetworkPolicy and the
ServiceAccount they run as are all `<release>-api`, from the helper
`api-rbac.yaml` and `admission-policy.yaml` already share (review finding F3).
A console whose pod ran as an account with a different name would be a pod with
no grants at all.
*/ -}}
{{- define "logweir.api.consoleName" -}}
{{- include "logweir.api.serviceAccountName" . -}}
{{- end -}}

{{- /*
WHERE THE THREE SECRET-BACKED FILES ARE MOUNTED. One place, so the config
document below and the PodSpec in `api-deployment.yaml` cannot disagree about a
path — which would be a console that starts, reads a key that is not there and
exits 2 with a field name nobody can act on.
*/ -}}
{{- define "logweir.api.keyDir" -}}/var/run/logweir/keys{{- end -}}
{{- define "logweir.api.oidcDir" -}}/var/run/logweir/oidc{{- end -}}
{{- /*
CHART GAP G1: the issuer's PRIVATE CA, mounted from the ConfigMap or Secret
`api.console.oidc.caBundle` names. Public certificates only — `logweir-api`
refuses a bundle carrying anything else — and the chart never takes PEM
inline, so no certificate text is in a values file, a rendered manifest or
Helm's release history. Empty when no bundle is configured.
*/ -}}
{{- define "logweir.api.oidcCaDir" -}}/var/run/logweir/oidc-ca{{- end -}}
{{- define "logweir.api.oidcCaConfigured" -}}
{{- $b := .Values.api.console.oidc.caBundle | default dict -}}
{{- if or $b.configMap $b.secret }}true{{ end -}}
{{- end -}}
{{- /*
CHART GAP G6: the ingress controller's Service, when both halves are named.
*/ -}}
{{- define "logweir.api.proxyServiceConfigured" -}}
{{- $s := .Values.api.console.trustedProxyService | default dict -}}
{{- if and (eq .Values.api.console.mode "shared") $s.name $s.namespace }}true{{ end -}}
{{- end -}}


{{- /*
THE CONFIGURATION DOCUMENT ITSELF. Three things about it are decisions and not
formatting, and they are here rather than inside the document because a comment
emitted into a rendered ConfigMap is a comment an operator has to scroll past on
every `kubectl get cm -o yaml`.

1. THE IN-CLUSTER ADMINISTRATOR MODE (`localAdmin`) BINDS LOOPBACK AND HAS NO
   Service. `config.rs` refuses any non-loopback listener in that mode by name
   (`0.0.0.0`, `[::]` and any routable address), so `127.0.0.1` is not a choice
   this template makes; it is the only one the binary accepts — and this chart
   then renders no Service, no Ingress and no ingress NetworkPolicy rule to go
   with it, so there is nothing in the cluster that a monitor or another pod
   could dial. This pod is reachable only through the API server's portforward
   subresource.
   Reach it that way:

       kubectl --context docker-desktop -n <ns> port-forward deploy/<release>-api 8484:8484
       open http://127.0.0.1:8484/ui/

   A DEPLOYMENT TARGET AND NOT A Service, because in this mode there IS no
   Service: `api-deployment.yaml` renders one only in `shared` mode. `kubectl
   port-forward` takes a Deployment directly, so nothing is lost, and what is
   gained is that this chart renders no object any monitor or any other pod
   could dial.

   `publicOrigin` must carry the listen port (`config.rs` refuses a mismatch),
   so the local side of that port-forward is the same number.

   Shared mode binds the Pod IP, because TLS terminates at the Ingress in front
   of it and the ClusterIP is inside the boundary `api-networkpolicy.yaml`
   draws. `publicBaseUrl` is an EXACT administrator value: nothing in this
   service derives an origin, a redirect URI or an authorization decision from
   `Host`, `Forwarded` or `X-Forwarded-*`.

2. `kubernetes.source: inCluster`, ALWAYS, AND THERE IS NO CHART VALUE FOR THE
   OTHER SOURCE. D0: the console "uses a narrowly bound Kubernetes
   ServiceAccount". A pod that read a kubeconfig would act with whatever
   identity that file carries — which on a developer's laptop is routinely
   cluster-admin — and the whole `auth can-i` argument in `api-rbac.yaml` would
   be about an account nothing runs as. The token is the projected, time-bound
   one the kubelet mounts (BoundServiceAccountTokenVolume, the default since
   Kubernetes 1.21), which is what D0 means by "projected token".

3. THE TWO MODES ARE DIFFERENT DOCUMENTS, not one document with optional
   halves, because `config.rs` parses with `deny_unknown_fields` and refuses the
   wrong mode's fields BY NAME: `publicOrigin` in shared mode,
   `oidc`/`roles`/`sessionKey` in localAdmin mode, `cursorKeyFile` versus
   `cursorKey` in either. That refusal is a feature and this template must not
   defeat it by emitting both.
*/ -}}
{{- define "logweir.api.config" -}}
{{- $c := .Values.api.console -}}
{{- $ns := (include "logweir.api.namespaces" . | fromJsonArray) -}}
{{- $keys := include "logweir.api.keyDir" . -}}
mode: {{ $c.mode }}
{{- if eq $c.mode "localAdmin" }}
listen: "127.0.0.1:{{ $c.port }}"
publicOrigin: "http://127.0.0.1:{{ $c.port }}"
{{- else }}
listen: "0.0.0.0:{{ $c.port }}"
publicBaseUrl: {{ $c.publicBaseUrl | quote }}
{{- end }}
uiDirectory: /ui
{{- if eq $c.mode "localAdmin" }}
localAdmin:
  subject: {{ $c.localAdminSubject | quote }}
{{- else }}
oidc:
  issuer: {{ $c.oidc.issuer | quote }}
  clientId: {{ $c.oidc.clientId | quote }}
  clientSecretFile: {{ printf "%s/clientSecret" (include "logweir.api.oidcDir" .) }}
{{- if include "logweir.api.oidcCaConfigured" . }}
  caBundleFile: {{ printf "%s/%s" (include "logweir.api.oidcCaDir" .) $c.oidc.caBundle.key }}
{{- end }}
{{- if eq (toString $c.oidc.systemRoots) "false" }}
  systemRoots: false
{{- end }}
roles:
  revision: {{ $c.roles.revision | quote }}
  bindings:
{{ toYaml $c.roles.bindings | indent 4 }}
sessionKey:
  file: {{ printf "%s/session.key" $keys }}
  expectedVersion: {{ int $c.keyVersion }}
sessionMaxAgeSeconds: {{ int $c.sessionMaxAgeSeconds }}
{{- with $c.trustedProxyCidrs }}
trustedProxyCidrs:
{{ toYaml . | indent 2 }}
{{- end }}
{{- if include "logweir.api.proxyServiceConfigured" . }}
trustedProxyService:
  namespace: {{ $c.trustedProxyService.namespace | quote }}
  name: {{ $c.trustedProxyService.name | quote }}
{{- end }}
{{- if $c.requireTrustedProxy }}
requireTrustedProxy: true
{{- end }}
{{- end }}
{{- /*
P10: the manual-run create ceilings, per person, per namespace, per minute —
BOTH modes — RENDERED ONLY WHEN THEY DIFFER FROM THE BINARY'S DEFAULTS (review
L2). `10` and `5` are `logweir_api::routes::RunRateLimits::default()`, pinned by
`logweir-api/tests/chart_config.rs`. `config.rs` parses this file with
`deny_unknown_fields`, so a console image older than the key refuses a file
that carries it (exit 2); a default install therefore carries none and an
image-only rollback keeps starting. A non-default value rolls back with the
chart.
*/}}
{{- $rlBackups := int $c.rateLimits.manualBackupsPerMinute }}
{{- $rlRestores := int $c.rateLimits.manualRestoresPerMinute }}
{{- if or (ne $rlBackups 10) (ne $rlRestores 5) }}
rateLimits:
  manualBackupsPerMinute: {{ $rlBackups }}
  manualRestoresPerMinute: {{ $rlRestores }}
{{- end }}
namespaces:
{{ toYaml $ns | indent 2 }}
kubernetes:
  source: inCluster
  principal: {{ printf "system:serviceaccount:%s:%s" .Release.Namespace (include "logweir.api.consoleName" .) | quote }}
{{- if eq $c.mode "localAdmin" }}
cursorKeyFile: {{ printf "%s/cursor.key" $keys }}
{{- else }}
cursorKey:
  file: {{ printf "%s/cursor.key" $keys }}
  expectedVersion: {{ int $c.keyVersion }}
{{- end }}
{{- /*
PLAT-19.2 — the SAME approval-policy document the controller mounts, and the
console's ConsoleConfirmation key (a PATH into a mounted Secret, never the key:
this ConfigMap carries no credential). Both rendered only when configured.
*/ -}}
{{- if include "logweir.approvalPolicy.configured" . }}
approvalPolicyFile: {{ include "logweir.approvalPolicy.file" . }}
{{- end }}
{{- if include "logweir.consoleKey.secret" . }}
confirmationKeyFile: {{ printf "%s/confirmation.key" (include "logweir.approvalPolicy.confirmationDir" .) }}
{{- end }}
{{- /*
PROD-16.1 fix round (review L5): the key file is the identity hook's MANAGED
key, which the kubelet projects only after the post-install hook wrote it, so
the console may start before it exists. An operator-named key is mounted
non-optional and its absence stays a refusal to start.
*/ -}}
{{- if include "logweir.consoleKey.managed" . }}
confirmationKeyManaged: true
{{- end }}
{{- /*
PROD-16.1 — where the fresh-install marker is read: the public identity
ConfigMap, by name, in the release namespace (`<release>-api-installation`
grants `get` on that one object). Only where the hook can ever write one: the
managed identity with the managed console key (`logweir.freshInstallConfirm`).
*/ -}}
{{- if include "logweir.freshInstallConfirm" . }}
installationIdentity:
  namespace: {{ .Release.Namespace }}
  publicConfigMap: {{ .Values.identity.publicConfigMapName }}
{{- end }}
{{- end -}}

{{/*
THE GUARD IS `api.console.enabled` ALONE, AND NOT `and api.enabled …`, WHICH IS
A REFUSAL RATHER THAN A CONDITION. `api.console.enabled` with `api.enabled`
still false used to render NOTHING: the operator asked for a console, `helm
install` exited 0, and no pod, Service or ConfigMap existed to look for. A
missing principal is a configuration error and is answered as one below —
`_validate.tpl` fails naming both flags — so the workload's absence
can never be silent. `scripts/check-chart.sh` arm 8 runs exactly that case.
*/}}
{{- if .Values.api.console.enabled }}
{{- $name := include "logweir.api.consoleName" . }}
{{- $config := include "logweir.api.config" . }}
{{- $hash := $config | sha256sum }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config-%s" $name (trunc 10 $hash) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
immutable: true
data:
  config.yaml: |
{{ $config | indent 4 }}
{{- end }}
