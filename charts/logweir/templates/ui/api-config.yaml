{{/*
`api.console.enabled`: the console's configuration file. Its refusals are in
`_validate.tpl`.

Two switches, because the rollout is "deploy the console disabled, configure
the identity, OIDC, bindings and TLS, then enable it": `api.enabled` is the
principal and no pod (`api-rbac.yaml`); `api.console.enabled` runs the workload
as it (this file, `api-deployment.yaml`, `api-ingress.yaml`,
`api-networkpolicy.yaml`). `api.console.*` nests the design's `console.*` under
the crate's name, `api`.

`logweir-api --config <file>` refuses to start without the file, so the mode,
listen address, namespaces and role bindings are readable from `helm template`
and `kubectl get cm`. It carries no credential: the OIDC client secret, the
session key and the cursor key are paths into mounted Secrets the operator
names, because a ConfigMap is readable with `get configmaps`, appears in
`helm get manifest` and is checked into `charts/logweir/rendered/`
(`chart_lint.rs` refuses a value under any credential-shaped key).

The ConfigMap is immutable and named by the first ten characters of the
document's sha256: a changed binding is a new object and a rolled pod, and
nobody with `patch configmaps` can change the role table under a running
console.
*/}}

{{- /*
Every console object, and the ServiceAccount it runs as, is `<release>-api`,
from the helper the admission policy uses too: a pod running as another name
would hold no grant.
*/ -}}
{{- define "logweir.api.consoleName" -}}
{{- include "logweir.api.serviceAccountName" . -}}
{{- end -}}

{{- /*
Where the three Secret-backed files are mounted, in one place, so the config
document and the PodSpec cannot disagree about a path.
*/ -}}
{{- define "logweir.api.keyDir" -}}/var/run/logweir/keys{{- end -}}
{{- define "logweir.api.oidcDir" -}}/var/run/logweir/oidc{{- end -}}
{{- /*
The issuer's private CA, from the ConfigMap or Secret `api.console.oidc.caBundle`
names. Public certificates only (`logweir-api` refuses anything else); the chart
never takes PEM inline, so no certificate text reaches values, a manifest or
Helm's release history.
*/ -}}
{{- define "logweir.api.oidcCaDir" -}}/var/run/logweir/oidc-ca{{- end -}}
{{- define "logweir.api.oidcCaConfigured" -}}
{{- $b := .Values.api.console.oidc.caBundle | default dict -}}
{{- if or $b.configMap $b.secret }}true{{ end -}}
{{- end -}}
{{- /* The ingress controller's Service, when both halves are named. */ -}}
{{- define "logweir.api.proxyServiceConfigured" -}}
{{- $s := .Values.api.console.trustedProxyService | default dict -}}
{{- if and (eq .Values.api.console.mode "shared") $s.name $s.namespace }}true{{ end -}}
{{- end -}}


{{- /*
The configuration document. Three decisions, kept out of the document itself
because a comment in a ConfigMap is one an operator scrolls past forever:

1. `localAdmin` binds loopback and has no Service: `config.rs` refuses any
   other listener in that mode, and the chart renders no Service, Ingress or
   ingress NetworkPolicy rule, so nothing in the cluster can dial it. It is
   reached through the API server's portforward subresource:

       kubectl --context docker-desktop -n <ns> port-forward deploy/<release>-api 8484:8484
       open http://127.0.0.1:8484/ui/

   `publicOrigin` must carry the listen port (`config.rs` refuses a mismatch).
   Shared mode binds the pod IP behind the TLS Ingress; `publicBaseUrl` is an
   exact administrator value, and nothing derives an origin, a redirect URI or
   an authorization decision from `Host` or `X-Forwarded-*`.

2. `kubernetes.source: inCluster`, always, with no chart value for the other
   source: a pod reading a kubeconfig would act as whatever that file carries
   (often cluster-admin), and `api-rbac.yaml`'s grants would bound an account
   nothing runs as. The token is the kubelet's projected, time-bound one.

3. The two modes are different documents, because `config.rs` parses with
   `deny_unknown_fields` and refuses the other mode's fields by name
   (`publicOrigin` in shared mode, `oidc`/`roles`/`sessionKey` in localAdmin,
   `cursorKeyFile` versus `cursorKey`); emitting both would defeat that.
*/ -}}
{{- define "logweir.api.config" -}}
{{- $c := .Values.api.console -}}
{{- $ns := (include "logweir.api.namespaces" . | fromJsonArray) -}}
{{- $keys := include "logweir.api.keyDir" . -}}
mode: {{ $c.mode }}
{{- if eq $c.mode "localAdmin" }}
listen: "127.0.0.1:{{ $c.port }}"
publicOrigin: "http://127.0.0.1:{{ $c.port }}"
{{- else }}
listen: "0.0.0.0:{{ $c.port }}"
publicBaseUrl: {{ $c.publicBaseUrl | quote }}
{{- end }}
uiDirectory: /ui
{{- if eq $c.mode "localAdmin" }}
localAdmin:
  subject: {{ $c.localAdminSubject | quote }}
{{- else }}
oidc:
  issuer: {{ $c.oidc.issuer | quote }}
  clientId: {{ $c.oidc.clientId | quote }}
  clientSecretFile: {{ printf "%s/clientSecret" (include "logweir.api.oidcDir" .) }}
{{- if include "logweir.api.oidcCaConfigured" . }}
  caBundleFile: {{ printf "%s/%s" (include "logweir.api.oidcCaDir" .) $c.oidc.caBundle.key }}
{{- end }}
{{- if eq (toString $c.oidc.systemRoots) "false" }}
  systemRoots: false
{{- end }}
roles:
  revision: {{ $c.roles.revision | quote }}
  bindings:
{{ toYaml $c.roles.bindings | indent 4 }}
sessionKey:
  file: {{ printf "%s/session.key" $keys }}
  expectedVersion: {{ int $c.keyVersion }}
sessionMaxAgeSeconds: {{ int $c.sessionMaxAgeSeconds }}
{{- with $c.trustedProxyCidrs }}
trustedProxyCidrs:
{{ toYaml . | indent 2 }}
{{- end }}
{{- if include "logweir.api.proxyServiceConfigured" . }}
trustedProxyService:
  namespace: {{ $c.trustedProxyService.namespace | quote }}
  name: {{ $c.trustedProxyService.name | quote }}
{{- end }}
{{- if $c.requireTrustedProxy }}
requireTrustedProxy: true
{{- end }}
{{- end }}
{{- /*
The manual-run ceilings (per person, per namespace, per minute, both modes)
render only away from `RunRateLimits::default()` (10, 5, pinned by
`logweir-api/tests/chart_config.rs`): an older console refuses the unknown key
at start, so a default install carries none and an image-only rollback keeps
starting.
*/}}
{{- $rlBackups := int $c.rateLimits.manualBackupsPerMinute }}
{{- $rlRestores := int $c.rateLimits.manualRestoresPerMinute }}
{{- if or (ne $rlBackups 10) (ne $rlRestores 5) }}
rateLimits:
  manualBackupsPerMinute: {{ $rlBackups }}
  manualRestoresPerMinute: {{ $rlRestores }}
{{- end }}
namespaces:
{{ toYaml $ns | indent 2 }}
kubernetes:
  source: inCluster
  principal: {{ printf "system:serviceaccount:%s:%s" .Release.Namespace (include "logweir.api.consoleName" .) | quote }}
{{- if eq $c.mode "localAdmin" }}
cursorKeyFile: {{ printf "%s/cursor.key" $keys }}
{{- else }}
cursorKey:
  file: {{ printf "%s/cursor.key" $keys }}
  expectedVersion: {{ int $c.keyVersion }}
{{- end }}
{{- /*
The approval-policy document the controller mounts too, and the path of the
console's ConsoleConfirmation key (never the key). Each only when configured.
*/ -}}
{{- if include "logweir.approvalPolicy.configured" . }}
approvalPolicyFile: {{ include "logweir.approvalPolicy.file" . }}
{{- end }}
{{- if include "logweir.consoleKey.secret" . }}
confirmationKeyFile: {{ printf "%s/confirmation.key" (include "logweir.approvalPolicy.confirmationDir" .) }}
{{- end }}
{{- /*
The managed key is projected only after the post-install hook writes it, so the
console may start before it exists. An operator-named key is mounted
non-optional and its absence stays a refusal to start.
*/ -}}
{{- if include "logweir.consoleKey.managed" . }}
confirmationKeyManaged: true
{{- end }}
{{- /*
Where the fresh-install marker is read: the public identity ConfigMap, by name
(`<release>-api-installation` grants `get` on it), only where the hook can write
one (`logweir.freshInstallConfirm`).
*/ -}}
{{- if include "logweir.freshInstallConfirm" . }}
installationIdentity:
  namespace: {{ .Release.Namespace }}
  publicConfigMap: {{ .Values.identity.publicConfigMapName }}
{{- end }}
{{- end -}}

{{/*
Guarded by `api.console.enabled` alone: with `api.enabled` false the console is
refused (`_validate.tpl`), never silently not rendered.
*/}}
{{- if .Values.api.console.enabled }}
{{- $name := include "logweir.api.consoleName" . }}
{{- $config := include "logweir.api.config" . }}
{{- $hash := $config | sha256sum }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config-%s" $name (trunc 10 $hash) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
immutable: true
data:
  config.yaml: |
{{ $config | indent 4 }}
{{- end }}
