{{/*
`api.console.ingress.enabled`: the shared console's only public entry point.
Shared mode only and TLS required, both refused otherwise in `_validate.tpl`;
`logweir-api` refuses a non-`https://` `publicBaseUrl` at start too.

An Ingress does nothing without a controller, and controllers differ: this
chart renders the object and the TLS reference, cannot check the Secret's
certificate, and cannot make a controller honour annotations. HSTS is the
controller's (its own key in `api.console.ingress.annotations`); the API sets
CSP, `X-Content-Type-Options`, `Referrer-Policy` and Permissions-Policy itself.

One host, one prefix, one backend: the console is one origin (`/ui/`,
`/api/v1`, `/auth/*`, health), and splitting it would break its same-origin
cookie and CSRF model.
*/}}
{{- if and .Values.api.console.enabled .Values.api.console.ingress.enabled }}
{{- $c := .Values.api.console }}
{{- $name := include "logweir.api.consoleName" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with $c.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $c.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ $c.ingress.host | quote }}
      secretName: {{ $c.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ $c.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
