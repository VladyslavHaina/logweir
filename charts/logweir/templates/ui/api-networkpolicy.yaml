{{/*
`api.console.networkPolicy.enabled`: what may reach the console, and what it
may reach. Same shape as `templates/networkpolicy.yaml`, a different argument:
that policy lets runner Jobs reach brokers and object storage, this one keeps
the console from both. Docker Desktop commonly has no enforcing CNI, so a local
install proves the objects' shape, not deny behaviour; the rendered object
carries the `[UNVERIFIED]` mark `scripts/check-unverified-labels.sh` reads.

Ingress: in `shared` mode the configured ingress controller only (both
selectors are required, `_validate.tpl`). In `localAdmin` the `ingress:` list is
empty, which with `Ingress` in policyTypes is deny; `kubectl port-forward`
arrives through the API server and the kubelet, not the pod network.

Egress: DNS, the Kubernetes API, the identity provider; never the broker ports
or 9000, which `logweir-api` has no client for. The API is named the way
`templates/networkpolicy.yaml` names it (ClusterIP, endpoint addresses,
`identity.kubernetesApiCIDRs`), because pre- and post-DNAT matching differs by
CNI; `lookup` returns nothing under `helm template`, so the rendered fixtures
carry only the configured CIDRs. NetworkPolicy has no FQDN, so the provider is
`networkPolicy.oidcCIDRs` on 443, or, for a provider inside the cluster,
`networkPolicy.oidcPeers` (namespace, pod labels, the POD port): an enforcing
CNI matches egress after the Service's DNAT, so a ClusterIP `ipBlock` matches
nothing there. Left empty in shared mode, OIDC discovery is blocked and the
console starts NotReady: the honest failure.
*/}}
{{- if and .Values.api.console.enabled .Values.api.console.networkPolicy.enabled }}
{{- $c := .Values.api.console }}
{{- $name := include "logweir.api.consoleName" . }}
{{- $apiCIDRs := list }}
{{- range $cidr := .Values.identity.kubernetesApiCIDRs }}
{{- $apiCIDRs = append $apiCIDRs $cidr }}
{{- end }}
{{- $apiService := lookup "v1" "Service" "default" "kubernetes" }}
{{- if and $apiService $apiService.spec.clusterIP (ne $apiService.spec.clusterIP "None") }}
{{- $mask := ternary "128" "32" (contains ":" $apiService.spec.clusterIP) }}
{{- $apiCIDRs = append $apiCIDRs (printf "%s/%s" $apiService.spec.clusterIP $mask) }}
{{- end }}
{{- /* EndpointSlice, not v1 Endpoints: the latter warns on every install from 1.33. */}}
{{- $apiSlice := lookup "discovery.k8s.io/v1" "EndpointSlice" "default" "kubernetes" }}
{{- if $apiSlice }}
{{- range $endpoint := $apiSlice.endpoints }}
{{- range $address := $endpoint.addresses }}
{{- $mask := ternary "128" "32" (contains ":" $address) }}
{{- $apiCIDRs = append $apiCIDRs (printf "%s/%s" $address $mask) }}
{{- end }}
{{- end }}
{{- end }}
{{- $apiCIDRs = uniq $apiCIDRs }}
# [UNVERIFIED — enforcement: Docker Desktop may accept this object without a
# NetworkPolicy-enforcing CNI. Validate deny/allow behavior on the production
# CNI; Service ClusterIP versus post-DNAT endpoint matching is provider-specific.]
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: logweir
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  {{- if eq $c.mode "shared" }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $c.networkPolicy.ingressNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml $c.networkPolicy.ingressPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ int $c.port }}
  {{- else }}
  # The in-cluster administrator mode admits nothing: an empty list with
  # `Ingress` in policyTypes is deny. There is no Service to reach either.
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              component: kube-apiserver
        {{- range $cidr := $apiCIDRs }}
        - ipBlock:
            cidr: {{ $cidr }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
  {{- with $c.networkPolicy.oidcCIDRs }}
    - to:
        {{- range $cidr := . }}
        - ipBlock:
            cidr: {{ $cidr }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
  {{- end }}
  {{- range $peer := ($c.networkPolicy.oidcPeers | default list) }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $peer.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $peer.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ int $peer.port }}
  {{- end }}
{{- end }}
