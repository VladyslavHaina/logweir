{{/*
`api.console.enabled`: the console pod, its Service and its disruption budget.

The Service renders in `shared` mode only. `localAdmin` binds loopback, so a
Service there would have endpoints that refuse every connection (an outage to
every monitor); `kubectl port-forward` takes the Deployment directly. In that
mode nothing in the cluster can dial the pod, and `create pods/portforward` in
this namespace IS full console-administrator authority over every bound
namespace: grant it as such. The Service is ClusterIP only, with no value to
change it; the Ingress is the one public path.

Probes in `shared` mode only: `/healthz` (liveness, consults nothing) and
`/readyz` (Kubernetes answers for this identity). A kubelet probes the pod IP,
which a loopback listener refuses, so in `localAdmin` a probe would hold the pod
NotReady or kill a working console; there a refused configuration shows as
CrashLoopBackOff with a one-line refusal naming the field.

The token is mounted (the service makes its own Kubernetes calls through one
sealed adapter) and is the kubelet's projected, time-bound one.
`readOnlyRootFilesystem` with one writable `/tmp`; the page files are read
into memory at start and every audit record goes to stdout.
*/}}
{{- if .Values.api.console.enabled }}
{{- $c := .Values.api.console }}
{{- $name := include "logweir.api.consoleName" . }}
{{- $configHash := include "logweir.api.config" . | sha256sum }}
{{- $configName := printf "%s-config-%s" $name (trunc 10 $configHash) }}
{{- $keys := include "logweir.api.keyDir" . }}
{{- if eq $c.mode "shared" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ int $c.port }}
      targetPort: http
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ int $c.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: logweir
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        {{- /*
        The ConfigMap's name already changes with its content; this digest is
        for the reader and `kubectl rollout status`.
        */}}
        checksum/logweir-api-config: {{ $configHash }}
      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ $name }}
      {{- with (include "logweir.placement" (dict "root" $ "over" $c)) }}
      {{- . | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: true
      {{- /*
      Where the issuer's public name does not resolve to a reachable address
      inside the cluster (split-horizon DNS, `*.localtest.me`). It changes where
      a name resolves, not what is trusted: TLS still verifies the name and the
      ID token's `iss` is compared exactly. That holds only when the target is
      an endpoint just the IdP's owner can route; a shared ingress fails it
      (charts/logweir/README.md, *The identity provider inside the cluster*).
      */}}
      {{- with $c.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        {{- /*
        The kubelet writes Secret volumes owned by root; with `fsGroup` it
        chgrps them to 65532, and 0440 below is the narrowest mode this
        non-root process can read (0400 alone gave `Permission denied` on a
        live install; `chart_lint.rs` reads the mode and the UID together).
        */}}
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ $c.image }}
          imagePullPolicy: {{ $c.imagePullPolicy }}
          args:
            - --config
            - /etc/logweir/api/config.yaml
          ports:
            - name: http
              containerPort: {{ int $c.port }}
          {{- if eq $c.mode "shared" }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          {{- end }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/logweir/api
              readOnly: true
            - name: keys
              mountPath: {{ $keys }}
              readOnly: true
            {{- if eq $c.mode "shared" }}
            - name: oidc
              mountPath: {{ include "logweir.api.oidcDir" . }}
              readOnly: true
            {{- if include "logweir.api.oidcCaConfigured" . }}
            - name: oidc-ca
              mountPath: {{ include "logweir.api.oidcCaDir" . }}
              readOnly: true
            {{- end }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if include "logweir.approvalPolicy.configured" . }}
            - name: approval-policy
              mountPath: {{ include "logweir.approvalPolicy.dir" . }}
              readOnly: true
            {{- end }}
            {{- if include "logweir.consoleKey.secret" . }}
            - name: confirmation
              mountPath: {{ include "logweir.approvalPolicy.confirmationDir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $configName }}
            items:
              - key: config.yaml
                path: config.yaml
        {{- /*
        No `optional`: a missing Secret holds the pod in ContainerCreating with
        an event naming it, better than a console minting cursors with a key it
        invented.
        */}}
        - name: keys
          secret:
            secretName: {{ $c.keySecret }}
            {{- /* Group-readable for `fsGroup: 65532`, world bit off. */}}
            defaultMode: 0440
        {{- if eq $c.mode "shared" }}
        - name: oidc
          secret:
            secretName: {{ $c.oidc.clientSecret }}
            defaultMode: 0440
            items:
              - key: clientSecret
                path: clientSecret
        {{- /*
        The issuer's CA bundle (public certificates), one key, no `optional`: a
        missing bundle holds the pod, an unreadable one stops `logweir-api`;
        neither ends in a console that quietly trusts the system roots alone.
        */}}
        {{- if include "logweir.api.oidcCaConfigured" . }}
        - name: oidc-ca
          {{- if $c.oidc.caBundle.configMap }}
          configMap:
            name: {{ $c.oidc.caBundle.configMap }}
          {{- else }}
          secret:
            secretName: {{ $c.oidc.caBundle.secret }}
          {{- end }}
            defaultMode: 0444
            items:
              - key: {{ $c.oidc.caBundle.key }}
                path: {{ $c.oidc.caBundle.key }}
        {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- /* The same immutable policy document the controller mounts. */}}
        {{- if include "logweir.approvalPolicy.configured" . }}
        - name: approval-policy
          configMap:
            name: {{ include "logweir.approvalPolicy.name" . }}
        {{- end }}
        {{- /*
        The ConsoleConfirmation private key, `confirmation.key` only, 0440. An
        operator-named Secret has no `optional`: a console bound to a policy
        with no key must not start. The managed key's Secret is `optional`: the
        identity hook fills it after this pod starts, the kubelet projects it
        without a restart, and `logweir-api` refuses a confirmation until then.
        */}}
        {{- if include "logweir.consoleKey.secret" . }}
        - name: confirmation
          secret:
            secretName: {{ include "logweir.consoleKey.secret" . }}
            defaultMode: 0440
            {{- if include "logweir.consoleKey.managed" . }}
            optional: true
            {{- end }}
            items:
              - key: confirmation.key
                path: confirmation.key
        {{- end }}
{{- if gt (int $c.replicas) 1 }}
---
{{- /*
Only above one replica: a PDB over a single replica blocks `kubectl drain`
forever on that node. With two or more, `maxUnavailable: 1`.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logweir
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
{{- end }}
{{- end }}
