{{- $_ := include "logweir.validate" . -}}
{{/*
`api.enabled`: the console/API principal's grants, and only its grants. No pod:
`api.console.enabled` runs the console as this account.

`<release>-api` acts for the console service, which authenticates and
authorizes every request itself (`crates/logweir-api/src/authz.rs`); its
Kubernetes grants are the union of what every route may need. Every call goes
through one sealed adapter, `crates/logweir-api/src/kube.rs` (`ProductResource`,
`ClusterResource`, `CancellableCheck`), which calls `list`, `get`, `create` and
`patch`, and `linkage.rs` pins each `(verb, resource)` pair. Every rule below
is that pin: `scripts/check-chart.sh` re-derives the seal from `kube.rs` and
refuses a disagreement either way, and `chart_lint.rs` holds the rendered role
to it verb for verb.

* No `watch`: the event stream polls; a `watch` would be a verb with no caller
  and a long-lived connection per browser tab.
* No `delete`: no route deletes; the controller collects transient checks.
* No read verb on `secrets`, only `create`, so a console-written credential is
  write-only. `create` cannot name a `resourceNames`, which is why its shape is
  fenced by the admission policy (`admissionPolicy.enabled`).
* `get` on `configmaps` and nothing else (a check result, a catalog page); no
  `list`, which would be an inventory of somebody else's configuration.
* Trust writes are not here: `TrustPolicy` is `get`/`list` only, and trust is
  administered with `kubectl` under `logweir-trust-admin`. The read is
  cluster-wide by construction (the kind is cluster-scoped); the service shows
  each actor only the namespaces it administers (`routes/trust.rs`).
* `get` on `trustrosters/default` and no other name: a readiness verdict whose
  referent the service cannot read is reported `unverifiable`, never fresh.
  `TrustRoster` is not in `ClusterResource` (that would list every roster's
  keys). No `/status` subresource is named: `get` already returns status, and
  naming it would read, to an auditor, like a write.
*/}}
{{- if .Values.api.enabled }}
{{- $name := include "logweir.api.serviceAccountName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- with (include "logweir.imagePullSecrets" .) }}
{{ . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  # `ProductResource`, the whole sealed set: every projection the API serves is
  # a `list` or a `get` on one of these eight.
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals
      - backupdestinations
      - backups
      - backupschedules
      - kafkaclusters
      - preflights
      - restores
      - topicdiscoveries
    verbs: ["get", "list"]
  # `create`: all eight. An Approval is what a confirmation or an approval
  # creates; no update, patch or delete: its spec is immutable and a refused
  # one stays as the audit trail.
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals
      - backupdestinations
      - backups
      - backupschedules
      - kafkaclusters
      - preflights
      - restores
      - topicdiscoveries
    verbs: ["create"]
  # `patch`: the merge patches `linkage.rs` pins (`backupschedules`
  # suspension/policy, `backupdestinations` access) and `spec.cancelRequested`
  # on the two `CancellableCheck` kinds. `Backup` and `Restore` have no cancel.
  - apiGroups: ["logweir.dev"]
    resources:
      - backupdestinations
      - backupschedules
      - preflights
      - topicdiscoveries
    verbs: ["patch"]
  # Read only.
  - apiGroups: ["logweir.dev"]
    resources:
      - protectionpolicies
      - recoverycatalogs
      - retentionpolicies
    verbs: ["get", "list"]
  # The one write here: connecting an existing archive. No `patch`: a catalog
  # sync has no route, and approving a retention plan is left to `kubectl`.
  - apiGroups: ["logweir.dev"]
    resources: ["recoverycatalogs"]
    verbs: ["create"]
  # The two core objects, one verb each. See this file's header.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
{{/*
The cluster-scoped half: `TrustPolicy`, read-only; no RoleBinding can convey a
cluster-scoped read.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-trustpolicies
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-trustpolicies
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-trustpolicies
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
{{/*
The one roster, by name, read only; a role of its own so each object's rules
stay one shape an auditor reads at a glance.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-trustroster
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["trustrosters"]
    resourceNames: ["default"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-trustroster
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-trustroster
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- range $ns := (include "logweir.api.namespaces" . | fromJsonArray) }}
---
{{/*
One RoleBinding per namespace, never a ClusterRoleBinding of the namespaced
role: a defect in the console's own namespace check then reaches only the
configured namespaces (`logweir.api.namespaces`).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "logweir.labels" $ | nindent 4 }}
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if include "logweir.freshInstallConfirm" . }}
---
{{/*
The fresh-install marker read (`logweir.freshInstallConfirm`): `get` on the one
public identity ConfigMap, by name. It carries a key id, an algorithm and a
public key, no credential; its claim is honoured only beside the TrustPolicy it
names.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-installation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.identity.publicConfigMapName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-installation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-installation
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.api.console.enabled (include "logweir.api.proxyServiceConfigured" .) }}
{{- $svc := .Values.api.console.trustedProxyService }}
---
{{/*
The one read outside the product's namespaces: `list` on
`discovery.k8s.io/endpointslices` in the ingress controller's namespace, to
trust the serving endpoints of `api.console.trustedProxyService`
(`crates/logweir-api/src/trusted_proxy.rs`). EndpointSlice names are
generated, so it is a label-selected `list` and cannot name `resourceNames`; it
exposes that namespace's endpoint addresses (pod IPs, no credential). No
`watch` (the console polls), no write, and a Role, so the grant ends there.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-trusted-proxy
  namespace: {{ $svc.namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-trusted-proxy
  namespace: {{ $svc.namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-trusted-proxy
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
