{{/*
`ui.enabled` — THE UI IN-CLUSTER, WITH ITS AUTHORITY STATED.

One Deployment running `kubectl proxy`, which serves the twenty-six shipped UI
files out of the `logweir-ui` IMAGE at `/ui` (Task 39: `ui.image`, built by
`Dockerfile.ui`, whose served bytes `scripts/check-image-ui.sh` hashes against
the tree's `ui/`) AND proxies the Kubernetes API on the same origin, attaching
the pod's ServiceAccount credential to every request it forwards, server side.

THE PAGE USED TO BE A ConfigMap this chart built from its own copy of `ui/`,
and both are gone: `charts/logweir/ui/` (fourteen duplicated files) and the
ConfigMap, its volume and its mount. What replaced the `cmp` loop that kept the
copy honest is stronger than it was — the image gate compares the bytes the
BROWSER receives with the bytes in `ui/`, where the chart gate could only
compare two directories in this repository. Nothing else in this file changed:
the args, the ServiceAccount, both ClusterRoles, the bindings and the Service
are what they were.

That is the model, in one paragraph:
ANYONE WHO CAN REACH THE SERVICE ACTS WITH THE `<release>-ui` ServiceAccount's
AUTHORITY. The page holds no credential and asks for none (Global Constraint
28: no key material in the page, none in the image that serves it); the path
filter admits only what the page uses, MEASURED from `ui/api.js` and
`ui/pages/*.js`: `/ui/` and `/apis/logweir.dev/v1alpha1/` — the page reads
the six kinds, creates approvals, kafkaclusters, backupschedules and restores,
and merge-patches `spec.suspend` on a backupschedule; it touches no `/api/v1`
path at all. The ClusterRole below carries exactly those verbs and nothing
more; `--disable-filter` is never passed; there is no Ingress. Reach it with
`kubectl port-forward svc/<release>-ui 8001:8001` and open
`http://127.0.0.1:8001/ui/`.

`--accept-hosts=.*`: the proxy answers whatever Host header reaches it —
the kubelet's readiness probe, a port-forward, a Service-local client — which
is right for a Service whose reachability IS the authorisation boundary. The
image is Logweir's own `logweir-ui` at `:latest` (Task 37's tag ruling, the
same shape the controller and runner images carry here); it is kubectl at the
cluster's minor version — from the Kubernetes project's own registry, pinned by
digest in `Dockerfile.ui` — with the twenty-six shipped files copied in at `/ui`
and nothing else. Nothing in this file renders unless the flag is on.
*/}}
{{- if .Values.ui.enabled }}
{{- $name := printf "%s-ui" .Release.Name }}
{{- $namespaces := (include "logweir.ui.namespaces" . | fromJsonArray) }}
{{- $selected := "" }}
{{- if eq (len $namespaces) 1 }}
{{- $selected = index $namespaces 0 }}
{{- end }}
{{- $runtimeContext := dict "allowed" $namespaces "selected" $selected }}
{{- $runtimeHash := $runtimeContext | toJson | sha256sum }}
{{- $runtimeName := printf "%s-runtime-%s" $name ($runtimeHash | trunc 10) }}
{{/*
This is configuration, not a second copy of the UI. `index.html` always asks
for this same-origin file before app.js; the volume below makes the configured
namespace set available to the actual browser runtime. `toJson` produces a JS
string literal safely even when Helm values contain punctuation. The RoleBinding
loop uses the exact same helper output, so the picker cannot name a namespace
the ServiceAccount was not bound in. No Namespace list permission is added.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $runtimeName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
immutable: true
data:
  runtime.js: |
    window.LOGWEIR_NAMESPACE_CONTEXT = Object.freeze({"allowed": {{ $namespaces | toJson }}, "selected": {{ $selected | toJson }}});
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- with (include "logweir.imagePullSecrets" .) }}
{{ . }}
{{- end }}
---
{{/*
THE PAGE'S ROLE, VERB FOR VERB. Not `logweir-viewer` plus `logweir-operator`:
the page never watches, the page PATCHES a backupschedule (RBAC's `patch`,
which `logweir-operator`'s `update` does not grant), and it creates
approvals, which `logweir-operator` deliberately excludes. Binding the shipped
roles would have granted `watch` and `update` the page never issues and
refused the `patch` it does.

D2 §7.4 — THE THREE NEW KINDS, `get`/`list` AND NOTHING ELSE. A legacy page
that could not see a `BackupDestination` would render a destination-backed
schedule as though its archive were unconfigured, and a `Preflight` summary is
what makes a restore's readiness legible. **No `create`, no `patch`, no
`delete`**: `ui/api.js`'s `WRITABLE_PLURALS` is unchanged, the page has no
form for any of the three, and the new flows are console-only (D0: this proxy
is `legacyLocalAdminProxy`, it gets no Ingress, and it is not shared-console
mode). A read verb on a summary is the most this identity ever needs, because
anyone who reaches the Service holds it.

AND NO VERB ON `configmaps`, so the page cannot page through an inventory: the
chunk documents a `TopicDiscovery` owns are ConfigMaps, and reading them is
the console API's job with its own owner-UID/immutability/digest checks (D2
§5.6). The page sees `status.counts` and stops there.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
rules:
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals
      - backups
      - backupschedules
      - kafkaclusters
      - restores
    verbs: ["get", "list"]
  # D2 §7.4: the three kinds Amendment F added, READ ONLY. Summaries; no
  # create, no patch. See this file's header.
  - apiGroups: ["logweir.dev"]
    resources:
      - backupdestinations
      - preflights
      - topicdiscoveries
    verbs: ["get", "list"]
  # D1 §8.5/§8.6 (PLAT-06.2) — `backups` JOINS THE CREATE SET, AND NOTHING
  # ELSE DOES. "Back up now" is the one flow the legacy page could render and
  # not perform: it held `get`/`list` on `backups` and no `create`, so the
  # button either had to be hidden or had to send a request this identity was
  # refused. A manual `Backup` is an ORDINARY object (D1 §8.1) — the same one
  # `kubectl create -f config/samples/backup-manual.yaml` makes — so the grant
  # is the ordinary `create` verb and the object the page builds is the object
  # the product API builds, down to the deterministic name.
  #
  # STILL NO `patch` AND NO `delete` ON `backups`. A run is immutable once it
  # exists (PLAT-06.1 freezes its inputs) and "do not mutate an existing
  # execution to retry it" is the task's own migration rule; a second run is a
  # second object. `chart_lint_the_legacy_page_creates_a_backup_and_never_edits_one`
  # pins the verb set for `backups` to exactly {get, list, create} and fails on
  # a planted extra verb.
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals
      - backups
      - backupschedules
      - kafkaclusters
      - restores
    verbs: ["create"]
  - apiGroups: ["logweir.dev"]
    resources: ["backupschedules"]
    verbs: ["patch"]
---
{{/*
The cluster-scoped half: the keys page LISTS the `TrustRoster` (public key
material, read-only, cluster-scoped), which no RoleBinding can grant.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-trustrosters
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["trustrosters"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-trustrosters
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-trustrosters
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- range $ns := (include "logweir.ui.namespaces" . | fromJsonArray) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "logweir.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: logweir
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logweir
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      annotations:
        # The immutable, content-addressed context changes name on upgrade;
        # this rolls the pod to the newly selected namespace set.
        checksum/logweir-ui-runtime: {{ $runtimeHash }}
      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ui
    spec:
      serviceAccountName: {{ $name }}
      {{- with (include "logweir.placement" (dict "root" $ "over" .Values.ui)) }}
      {{- . | nindent 6 }}
      {{- end }}
      # THE ONE POD OF THE OPTIONAL COMPONENTS THAT NEEDS ITS TOKEN: it is the
      # credential `kubectl proxy` attaches to every request it forwards.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: {{ .Values.ui.image }}
          imagePullPolicy: {{ .Values.ui.imagePullPolicy }}
          args:
            - proxy
            - --www=/ui
            - --www-prefix=/ui/
            - --address=0.0.0.0
            - --port=8001
            - '--accept-hosts=.*'
            - '--accept-paths=^/(ui/|apis/logweir\.dev/v1alpha1/)'
          env:
            - name: HOME
              value: /tmp
            - name: KUBECACHEDIR
              value: /tmp/kube-cache
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /ui/
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # `/ui` remains the image's read-only page. This single mounted file
          # replaces its empty standalone context with Helm's non-secret one;
          # it is not a page copy.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime
              mountPath: /ui/runtime.js
              subPath: runtime.js
              readOnly: true
      volumes:
        # `tmp` is the only writable volume. `runtime` is a read-only
        # ConfigMap containing only the namespace context, never page assets.
        - name: tmp
          emptyDir: {}
        - name: runtime
          configMap:
            name: {{ $runtimeName }}
            items:
              - key: runtime.js
                path: runtime.js
{{- end }}
