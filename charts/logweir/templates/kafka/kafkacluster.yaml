{{- /*
`kafka.enabled`: the operator's own clusters, as `KafkaCluster` objects the
controller reconciles and probes. The flat values (`bootstrapServers`,
`security.*`, `username`, `secretRef`) map onto the CRD's `auth` in
`_helpers.tpl`; the refusals are in `_validate.tpl`. The objects land in the
release namespace, in the first workspace. The README says what the Secret must hold;
Logweir never reads it into a status, a log line or a rendered document.
*/ -}}
{{- if .Values.kafka.enabled }}
{{- $source := .Values.kafka }}
apiVersion: logweir.dev/v1alpha1
kind: KafkaCluster
metadata:
  name: {{ $source.name | default "source" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    {{- include "logweir.workspaceLabel" . | nindent 4 }}
    app.kubernetes.io/component: kafka
    logweir.dev/kafka-role: source
spec:
  role: source
  bootstrapServers:
    {{- include "logweir.kafka.bootstrapServers" (dict "servers" $source.bootstrapServers) | nindent 4 }}
  auth:
    {{- include "logweir.kafka.auth" (dict "cluster" $source) | nindent 4 }}
{{- with .Values.kafka.target }}
{{- if .bootstrapServers }}
{{- /*
The target is optional and renders only with an address: a restore needs one,
a backup does not. Without `markerTopic` a `mode: scratch` restore against it
is refused. This comment does not chomp forward: the `---` must stay on its own
line (`---apiVersion:` passes `helm template` and fails `helm lint`).
*/}}
---
apiVersion: logweir.dev/v1alpha1
kind: KafkaCluster
metadata:
  name: {{ .name | default "target" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "logweir.labels" $ | nindent 4 }}
    {{- include "logweir.workspaceLabel" $ | nindent 4 }}
    app.kubernetes.io/component: kafka
    logweir.dev/kafka-role: target
spec:
  role: target
  bootstrapServers:
    {{- include "logweir.kafka.bootstrapServers" (dict "servers" .bootstrapServers) | nindent 4 }}
  auth:
    {{- include "logweir.kafka.auth" (dict "cluster" .) | nindent 4 }}
  {{- with .markerTopic }}
  markerTopic: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
