{{/*
`retention.enabled`: the enforcement Job's identity and nothing else.

One ServiceAccount, `logweir-retention`, the name
`weirkeeper::controllers::retention_policy::SERVICE_ACCOUNT` puts on every
`mode: Enforce` Job; without it that Job's pod is never admitted. No Role and no
binding: the retention worker makes no Kubernetes API call, and its delete
capability is an object-store credential scoped to the policy's prefix, which
no Kubernetes verb widens or narrows. No token, on the account and on the
PodSpec `weirkeeper::job::build` writes. A separate account so an audit trail
and a NetworkPolicy can name "what ran as the deleter", with its own
`imagePullSecrets`. It deletes nothing by itself: `charts/logweir/README.md`
lists the other gates.

Rendered in the release namespace, where the Job runs.
*/}}
{{- if .Values.retention.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logweir-retention
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: retention
automountServiceAccountToken: false
{{- with (include "logweir.imagePullSecrets" .) }}
{{ . }}
{{- end }}
{{- end }}
