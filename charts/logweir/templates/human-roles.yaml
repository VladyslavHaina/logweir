{{- /*
The five human roles —
`config/rbac/{viewer,operator,approver,trust_admin,retention_admin}_role.yaml`,
rule for rule, SHIPPED UNBOUND exactly as `logweir.yaml` ships them. Who may
view, operate, approve, administer trust or administer retention in which
namespace is your decision:

    kubectl create rolebinding logweir-approver \
      --clusterrole=logweir-approver --user=<someone-else> -n <namespace>

`logweir-approver` is `create` on `approvals` and nothing else; bind it to
somebody who is not the operator (`self_attested: false` means only "two
different keys"). `logweir-operator`'s `update` and `patch` on
`backupschedules` are plain verbs because what may change is the CRD's own CEL
rule — `spec.sourceRef` is immutable and everything else is editable policy —
applied to every subject, cluster-admin included. `patch` is there because
`kubectl edit` and `kubectl apply` send one, so `update` alone cannot edit a
schedule at all.

D2 W11 added the fourteen-kind read (two rules, the original six kept byte-
identical to the controller's so a widening of that list is visible), the
operator's `create`/`patch` on the three D2 check kinds, the approver's
read-only `preflights` rule (approval context; a `Preflight` status is redacted
by construction and authorizes nothing on its own), and a FOURTH role.

`logweir-trust-admin` IS CLUSTER-SCOPED AND NEEDS A ClusterRoleBinding. It is
the only holder of a write verb on `TrustPolicy`, which is what decides whose
keys may sign an approval; bind it to somebody who does NOT hold
`logweir-operator`, or `self_attested: false` buys nothing. It carries no
`delete`: deleting a policy sends every namespace it bound back to the legacy
roster, which is a widening dressed as a cleanup.

D3 W13 added the operator's three D3 kinds (`create` on `protectionpolicies`,
`recoverycatalogs` and `rehearsalschedules`; `update`/`patch` on the first,
whose spec is not sealed, and `patch` on the other two, whose CRDs leave
exactly one field mutable each) and a FIFTH role.

`logweir-retention-admin` IS NAMESPACED and needs a RoleBinding per namespace.
It is the only holder of a write verb on `RetentionPolicy` — the one kind whose
object can end in a deletion — and `spec.mode` is the field that moves an
installation from reporting to deleting. Bind it to somebody who does NOT hold
`logweir-operator`. It carries no `delete` either, for a reason of its own:
turning enforcement off is `mode: Report`, and deleting the object while an
enforcement Job holds its lease takes the lease record the restore-side hold
reads. Holding the role deletes nothing on its own — see
`config/rbac/retention_admin_role.yaml` for the other three gates.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-viewer
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals
      - backups
      - backupschedules
      - kafkaclusters
      - restores
      - trustrosters
    verbs: ["get", "list", "watch"]
  # The eight kinds Amendments F and G added. Read only. See
  # `config/rbac/viewer_role.yaml`.
  - apiGroups: ["logweir.dev"]
    resources:
      - backupdestinations
      - preflights
      - protectionpolicies
      - recoverycatalogs
      - rehearsalschedules
      - retentionpolicies
      - topicdiscoveries
      - trustpolicies
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-operator
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources:
      - backups
      - backupschedules
      - kafkaclusters
      - restores
    verbs: ["create"]
  - apiGroups: ["logweir.dev"]
    resources: ["backupschedules"]
    verbs: ["update", "patch"]
  # D2 §7.2. `patch` and NOT `update`: a destination's access grants and a
  # check's `cancelRequested` are merge patches, and what may change is the
  # CRD's own CEL rule.
  - apiGroups: ["logweir.dev"]
    resources:
      - backupdestinations
      - preflights
      - topicdiscoveries
    verbs: ["create"]
  - apiGroups: ["logweir.dev"]
    resources:
      - backupdestinations
      - preflights
      - topicdiscoveries
    verbs: ["patch"]
  # D3 §9 — declare protection, connect an archive, schedule a rehearsal…
  - apiGroups: ["logweir.dev"]
    resources:
      - protectionpolicies
      - recoverycatalogs
      - rehearsalschedules
    verbs: ["create"]
  # …tune an objective (no seal on that spec)…
  - apiGroups: ["logweir.dev"]
    resources: ["protectionpolicies"]
    verbs: ["update", "patch"]
  # …and flip the ONE field each of the other two leaves mutable:
  # `spec.suspend` and `spec.syncRequest`. `patch` without `update`. See
  # `config/rbac/operator_role.yaml`. `retentionpolicies` is NOT here — its
  # writes are `logweir-retention-admin`'s.
  - apiGroups: ["logweir.dev"]
    resources:
      - recoverycatalogs
      - rehearsalschedules
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-approver
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["approvals"]
    verbs: ["create"]
  # D2 §7.2 — approval context, read only.
  - apiGroups: ["logweir.dev"]
    resources: ["preflights"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-trust-admin
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-retention-admin
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["retentionpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
