{{- /*
The five human roles, shipped UNBOUND. Who may view, operate, approve,
administer trust or administer retention in which namespace is your decision:

    kubectl create rolebinding logweir-approver \
      --clusterrole=logweir-approver --user=<someone-else> -n <namespace>

`logweir-approver` is `create` on `approvals` (and a read of `preflights` for
context); bind it to somebody who is not the operator (`self_attested: false`
means only "two different keys"). What `logweir-operator` may change in a
`backupschedules` object is the CRD's own CEL rule (`spec.sourceRef` is
immutable), applied to every subject: an RBAC rule has no field in which a CEL
expression could be written, so the restriction lives in
`charts/logweir/crds/backupschedules.yaml`. `patch` is granted because
`kubectl edit` and `apply` send one.

`logweir-trust-admin` is cluster-scoped (a ClusterRoleBinding) and the only
holder of a write verb on `TrustPolicy`, which decides whose keys may sign an
approval; bind it to somebody who does not hold `logweir-operator`. No
`delete`: deleting a policy sends its namespaces back to the legacy roster, a
widening dressed as a cleanup.

`logweir-retention-admin` is namespaced and the only holder of a write verb on
`RetentionPolicy`, whose `spec.mode` moves an installation from reporting to
deleting; bind it to somebody who does not hold `logweir-operator`. No
`delete`: enforcement is turned off with `mode: Report`, and deleting the object
while an enforcement Job holds its lease takes the lease record the restore-side
hold reads. `charts/logweir/README.md` (`retention.enabled`) lists the other
gates a deletion passes.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-viewer
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals
      - backups
      - backupschedules
      - kafkaclusters
      - restores
      - trustrosters
    verbs: ["get", "list", "watch"]
  # Read only.
  - apiGroups: ["logweir.dev"]
    resources:
      - backupdestinations
      - preflights
      - protectionpolicies
      - recoverycatalogs
      - retentionpolicies
      - topicdiscoveries
      - trustpolicies
    verbs: ["get", "list", "watch"]
  # PROD-04.2: a switchover's groups, outcomes and record key. Read only.
  - apiGroups: ["logweir.dev"]
    resources: ["switchovers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-operator
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources:
      - backups
      - backupschedules
      - kafkaclusters
      - restores
    verbs: ["create"]
  - apiGroups: ["logweir.dev"]
    resources: ["backupschedules"]
    verbs: ["update", "patch"]
  # `patch` and not `update`: a destination's access grants and a check's
  # `cancelRequested` are merge patches; what may change is the CRD's CEL rule.
  - apiGroups: ["logweir.dev"]
    resources:
      - backupdestinations
      - preflights
      - topicdiscoveries
    verbs: ["create"]
  - apiGroups: ["logweir.dev"]
    resources:
      - backupdestinations
      - preflights
      - topicdiscoveries
    verbs: ["patch"]
  # Declare protection, connect an archive…
  - apiGroups: ["logweir.dev"]
    resources:
      - protectionpolicies
      - recoverycatalogs
    verbs: ["create"]
  # …tune an objective (no seal on that spec)…
  - apiGroups: ["logweir.dev"]
    resources: ["protectionpolicies"]
    verbs: ["update", "patch"]
  # …and flip the ONE field a catalog leaves mutable, `spec.syncRequest`.
  # `patch` without `update`.
  # `retentionpolicies` is NOT here — its writes are
  # `logweir-retention-admin`'s.
  - apiGroups: ["logweir.dev"]
    resources:
      - recoverycatalogs
    verbs: ["patch"]
  # PROD-04.2: request a switchover. It runs only under its own Approval
  # (subject kind `Switchover`), which `logweir-approver` creates.
  - apiGroups: ["logweir.dev"]
    resources: ["switchovers"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-approver
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["approvals"]
    verbs: ["create"]
  # Approval context, read only.
  - apiGroups: ["logweir.dev"]
    resources: ["preflights"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-trust-admin
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-retention-admin
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["retentionpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
