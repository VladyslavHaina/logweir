{{- /*
The two human roles, shipped UNBOUND (PROD-19.1 §4.4). People use the console,
whose role bindings are per workspace; Kubernetes RBAC stops at the namespace
and cannot see workspaces.

`logweir-viewer` is a Role in the release namespace: it reads every Logweir
kind in EVERY workspace, and no Secret. It is the one role to hand out for
`kubectl`:

    kubectl create rolebinding logweir-viewer \
      --role=logweir-viewer --user=<someone> -n <release namespace>

`logweir-trust-admin` is cluster-scoped (a ClusterRoleBinding) and the only
holder of a write verb on `TrustPolicy`, which decides whose keys may sign an
approval. No `delete`: deleting a policy sends its namespaces back to the
legacy roster, a widening dressed as a cleanup.

There is no write role for the namespace. Whoever may create a Logweir object
there may create it in any workspace, and one that names a Secret mounts that
Secret into a runner Job: give that access only to the people you would make
administrators of every workspace (Kubernetes' own `admin`).
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logweir-viewer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources:
      - approvals
      - backupdestinations
      - backups
      - backupschedules
      - kafkaclusters
      - preflights
      - protectionpolicies
      - recoverycatalogs
      - restores
      - retentionpolicies
      - switchovers
      - topicdiscoveries
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logweir-trust-admin
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: human-role
rules:
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
