{{- /*
Rendered in the release namespace and every authorized runner namespace. The
runner policy permits broker and object-store destinations by port; the
identity bootstrap and distribution pods are excluded from it and get DNS plus
the Kubernetes API only. Service DNAT matching differs by CNI, so the API is
named three ways: the `kubernetes.default` ClusterIP, its endpoint addresses,
and `identity.kubernetesApiCIDRs`. Docker Desktop commonly has no enforcing
CNI: local traffic proves the objects' shape, not deny behaviour.
*/ -}}
{{- $root := . }}
{{- $namespaces := prepend .Values.identity.authorizedRunnerNamespaces .Release.Namespace | uniq }}
{{- $apiCIDRs := list }}
{{- range $cidr := .Values.identity.kubernetesApiCIDRs }}
{{- $apiCIDRs = append $apiCIDRs $cidr }}
{{- end }}
{{- $apiService := lookup "v1" "Service" "default" "kubernetes" }}
{{- if and $apiService $apiService.spec.clusterIP (ne $apiService.spec.clusterIP "None") }}
{{- $mask := ternary "128" "32" (contains ":" $apiService.spec.clusterIP) }}
{{- $apiCIDRs = append $apiCIDRs (printf "%s/%s" $apiService.spec.clusterIP $mask) }}
{{- end }}
{{- $apiEndpoints := lookup "v1" "Endpoints" "default" "kubernetes" }}
{{- if $apiEndpoints }}
{{- range $subset := $apiEndpoints.subsets }}
{{- range $address := $subset.addresses }}
{{- $mask := ternary "128" "32" (contains ":" $address.ip) }}
{{- $apiCIDRs = append $apiCIDRs (printf "%s/%s" $address.ip $mask) }}
{{- end }}
{{- end }}
{{- end }}
{{- $apiCIDRs = uniq $apiCIDRs }}
{{- range $namespace := $namespaces }}
---
# [UNVERIFIED — enforcement: Docker Desktop may accept this object without a
# NetworkPolicy-enforcing CNI. Validate deny/allow behavior on the production
# CNI; Service ClusterIP versus post-DNAT endpoint matching is provider-specific.]
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logweir-runner-egress
  namespace: {{ $namespace }}
  labels:
    {{- include "logweir.labels" $root | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: Exists
      - key: logweir.dev/identity-authority
        operator: DoesNotExist
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9094
        - protocol: TCP
          port: 9095
        - protocol: TCP
          port: 9096
        - protocol: TCP
          port: 9097
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 9000
{{- if $root.Values.identity.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: logweir-identity-kubernetes-api-egress
  namespace: {{ $namespace }}
  labels:
    {{- include "logweir.labels" $root | nindent 4 }}
    app.kubernetes.io/component: identity-bootstrap
spec:
  podSelector:
    matchLabels:
      logweir.dev/identity-authority: bootstrap
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              component: kube-apiserver
        {{- range $cidr := $apiCIDRs }}
        - ipBlock:
            cidr: {{ $cidr }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
{{- end }}
{{- end }}
