{{- /*
The `weirkeeper` Deployment. `runnerImage` and `runnerImagePullPolicy` reach
every Job the controller creates and are set together: a `latest` tag under a
policy that never pulls is a Job no kubelet can start. The archive addressing
env renders only when a value or `minio.enabled` supplies one; pull secrets are
on the ServiceAccount.

The one PodSpec that mounts a token (the only Kubernetes API client), one
replica with `Recreate` and no leader election (one controller per cluster), no
ports, and `logweir-evidence-ro` projected `optional: true`, so a cluster
without it runs a controller whose verifications read `NotAttempted`.
*/ -}}
{{- $endpoint := include "logweir.archive.endpoint" . -}}
{{- $region := include "logweir.archive.region" . -}}
{{- $explicit := ne .Values.archive.s3.endpoint "" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weirkeeper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: logweir
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: weirkeeper
      {{- with (include "logweir.placement" (dict "root" $ "over" .Values.controller)) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weirkeeper
          image: {{ .Values.controllerImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: []
          env:
            - name: RUST_LOG
              value: {{ .Values.controller.logLevel | quote }}
            - name: LOGWEIR_RUNNER_IMAGE
              value: {{ .Values.runnerImage | quote }}
            - name: LOGWEIR_RUNNER_PULL_POLICY
              value: {{ .Values.runnerImagePullPolicy | quote }}
            - name: LOGWEIR_ARCHIVE_URL
              value: {{ include "logweir.archive.url" . | quote }}
            # The override ships empty and the namespace comes from the pod, which
            # is where `templates/policy.yaml` renders `weirkeeper-policy`.
            - name: LOGWEIR_POLICY_CONFIGMAP
              value: ""
            # The one namespace the controller watches, and the workspaces in it.
            - name: LOGWEIR_INSTALLATION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOGWEIR_WORKSPACES
              value: {{ join "," .Values.workspaces | quote }}
            {{- /*
            Each rendered only when configured. `""` is the controller's own
            default, not zero: `failFastSeconds: 0` is FAIL_FAST_NEVER, so
            `ne (toString …) ""` keeps a configured zero while an unset value
            renders nothing. The floors (60, 3600) are the controller's; it
            clamps a value up and logs it, which beats failing an upgrade over
            a typo.
            */ -}}
            {{- /* PROD-05.1a: exactly the namespaces `strimzi-topics.yaml` grants. */ -}}
            {{- if and (.Values.strimzi).readKafkaTopics (.Values.strimzi).namespaces }}
            - name: LOGWEIR_STRIMZI_NAMESPACES
              value: {{ join "," .Values.strimzi.namespaces | quote }}
            {{- end }}
            {{- if ne (toString .Values.controller.failFastSeconds) "" }}
            - name: LOGWEIR_FAIL_FAST_SECONDS
              value: {{ .Values.controller.failFastSeconds | toString | quote }}
            {{- end }}
            {{- if ne (toString .Values.controller.jobTtlSeconds) "" }}
            - name: LOGWEIR_JOB_TTL_SECONDS
              value: {{ .Values.controller.jobTtlSeconds | toString | quote }}
            {{- end }}
            {{- /* The approval-policy ConfigMap the console mounts too; absent means
            every workspace on `legacy-governed-v1`. */ -}}
            {{- if include "logweir.approvalPolicy.configured" . }}
            - name: LOGWEIR_APPROVAL_POLICY_FILE
              value: {{ include "logweir.approvalPolicy.file" . | quote }}
            {{- end }}
            {{- /* The fresh-install marker, read only with a console and the managed
            identity (`logweir.freshInstallConfirm`). */ -}}
            {{- if include "logweir.freshInstallConfirm" . }}
            - name: LOGWEIR_IDENTITY_PUBLIC_CONFIGMAP
              value: {{ .Values.identity.publicConfigMapName | quote }}
            {{- end }}
            {{- if $endpoint }}
            - name: AWS_ENDPOINT_URL
              value: {{ $endpoint | quote }}
            - name: AWS_ALLOW_HTTP
              value: {{ ternary .Values.archive.s3.allowHttp true $explicit | toString | quote }}
            - name: AWS_VIRTUAL_HOSTED_STYLE_REQUEST
              value: {{ ternary .Values.archive.s3.virtualHostedStyle false $explicit | toString | quote }}
            {{- end }}
            {{- if $region }}
            - name: AWS_REGION
              value: {{ $region | quote }}
            {{- end }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: logweir-evidence-ro
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: logweir-evidence-ro
                  key: secret-access-key
                  optional: true
          {{- /* Exec probes against the controller's loopback health listener. */}}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/weirkeeper", "--probe", "live"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/usr/local/bin/weirkeeper", "--probe", "ready"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if include "logweir.approvalPolicy.configured" . }}
          volumeMounts:
            - name: approval-policy
              mountPath: {{ include "logweir.approvalPolicy.dir" . }}
              readOnly: true
          {{- end }}
      {{- if include "logweir.approvalPolicy.configured" . }}
      volumes:
        - name: approval-policy
          configMap:
            name: {{ include "logweir.approvalPolicy.name" . }}
      {{- end }}
