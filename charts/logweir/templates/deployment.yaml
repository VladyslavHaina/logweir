{{- /*
The `weirkeeper` Deployment — `config/manager/deployment.yaml`, with three
things parameterised and nothing else changed: the image and its pull policy
(`controllerImage`, `imagePullPolicy`), the runner image AND the runner pull
policy the controller hands every Job (`runnerImage`, `runnerImagePullPolicy`
— the TWO envs this chart renders that `logweir.yaml` does not,
`LOGWEIR_RUNNER_IMAGE` from Task 33 and `LOGWEIR_RUNNER_PULL_POLICY` from Task
37; they are set TOGETHER because the chart's `runnerImage` default names a
`latest` tag and a tag under a policy that never pulls is a Job no kubelet can
start), and the archive addressing env the `config/overlays/k8s-demo` patch
sets (`archive.*`, rendered only when a value or `minio.enabled` supplies one).

W13 adds `notify.allowInsecureSinks`, which renders
`LOGWEIR_NOTIFY_ALLOW_INSECURE_SINKS=1` and ONLY when the value is true — the
default render is unchanged, and the controller forwards it into every
delivery Job as `NOTIFY_ALLOW_INSECURE_SINKS=1` (NOTIFY-INSECURE-SINK-UNEXPOSED:
`logweir notify deliver` refuses a non-`https://` sink before it dials, and
nothing set the documented hatch).

Task 38 adds node placement (`kubernetes.nodeSelector`/`tolerations`/`affinity`,
overridable by `controller.*`) — which renders NOTHING when nothing is set, so
the shipped default render is byte-identical to what it was. The controller's
pull secrets are on its ServiceAccount, not here.

Everything the source manifest says about this PodSpec still holds: it is the
ONE `automountServiceAccountToken` exemption (the only Kubernetes API client
in the design), one replica with `Recreate` and no leader election (Global
Constraint 30), no probes and no ports (Global Constraint 32 — no HTTP surface),
`RUST_LOG` pinned at `info` as the floor, and the `logweir-evidence-ro` Secret
projected `optional: true` so a cluster that has not created it still gets a
running controller whose verifications read `NotAttempted`.
`chart_lint.rs::chart_lint_default_render_agrees_with_the_install_file` holds
this copy to `logweir.yaml`: args, every other env name and value, both
security contexts, the resources and the ServiceAccount. It permits exactly
four differences, all of them the image ruling `values.yaml` records: the
controller image (the SAME repository, at `:latest` rather than at the install
file's digest), `imagePullPolicy` (`Always` rather than `IfNotPresent`) and the
two runner envs.
*/ -}}
{{- $endpoint := include "logweir.archive.endpoint" . -}}
{{- $region := include "logweir.archive.region" . -}}
{{- $explicit := ne .Values.archive.s3.endpoint "" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weirkeeper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: logweir
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logweir
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: weirkeeper
      {{- with (include "logweir.placement" (dict "root" $ "over" .Values.controller)) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weirkeeper
          image: {{ .Values.controllerImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: []
          env:
            - name: RUST_LOG
              value: {{ .Values.controller.logLevel | quote }}
            - name: LOGWEIR_RUNNER_IMAGE
              value: {{ .Values.runnerImage | quote }}
            - name: LOGWEIR_RUNNER_PULL_POLICY
              value: {{ .Values.runnerImagePullPolicy | quote }}
            - name: LOGWEIR_ARCHIVE_URL
              value: {{ include "logweir.archive.url" . | quote }}
            # D2 §4.4 — the installation policy. The override ships empty and
            # the namespace comes from the pod; `templates/policy.yaml` renders
            # `weirkeeper-policy` into exactly that namespace. See
            # `config/manager/deployment.yaml` for the whole reasoning.
            - name: LOGWEIR_POLICY_CONFIGMAP
              value: ""
            - name: LOGWEIR_INSTALLATION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- /*
            The delivery Jobs' one installation setting, and RENDERED ONLY WHEN
            TRUE so the default install is byte-identical to `logweir.yaml`
            (`chart_lint_default_render_agrees_with_the_install_file` permits
            exactly four differences and this is not a fifth). `1` is the only
            value `weirkeeper`'s predicate and `logweir notify deliver` both
            read as yes, so a rendered `"false"` could never be mistaken for
            one. A `ProtectionPolicy` cannot set this: it is the cluster
            administrator's switch, on the Deployment only.
            */ -}}
            {{- if .Values.notify.allowInsecureSinks }}
            - name: LOGWEIR_NOTIFY_ALLOW_INSECURE_SINKS
              value: "1"
            {{- end }}
            {{- /*
            D3 §2.3 and §2.7's two controller-wide windows, RENDERED ONLY WHEN
            CONFIGURED for the same reason the line above is: an install that
            sets neither is byte-identical to `logweir.yaml`, and
            `chart_lint_default_render_agrees_with_the_install_file` permits
            four differences, not six.

            THE EMPTY STRING IS "THE BUILD'S OWN DEFAULT", NOT ZERO, and the
            distinction is load-bearing exactly once: `failFastSeconds: 0` is
            `weirkeeper::diagnostics::FAIL_FAST_NEVER` — fail-fast disabled, so
            every Job runs to its own `activeDeadlineSeconds` — which is the
            lever for a cluster whose external secrets controller materialises
            a Secret a few minutes behind the Job. `""` must therefore NOT
            render `0`, and `ne (toString …) ""` is what keeps a configured
            zero reaching the controller while an unset value renders nothing
            at all.

            THE FLOORS ARE THE CONTROLLER'S AND ARE NOT REPEATED HERE. A value
            below `FAIL_FAST_SECONDS_MIN` (60) or `JOB_TTL_SECONDS_MIN` (3600)
            is clamped UP by `weirkeeper::diagnostics::bounded`, which logs
            what it used; an unparseable one is the default. A chart-side
            `fail` would turn a typo into a failed upgrade of the whole
            release, and the controller's answer is the safer one.
            */ -}}
            {{- /*
            D0 STAGE 5: THE NAMESPACES THIS CONTROLLER WATCHES AND ACTS IN,
            RENDERED ONLY WHEN SCOPED so the default install stays byte-identical
            to `logweir.yaml`. It must be exactly the list the RoleBindings in
            `controller-scope.yaml` grant: a namespace named here and not bound
            is a watch the API server refuses, and one bound and not named is a
            namespace nobody reconciles. Both come from the one value.
            */ -}}
            {{- with .Values.controller.watchNamespaces }}
            - name: LOGWEIR_WATCH_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if ne (toString .Values.controller.failFastSeconds) "" }}
            - name: LOGWEIR_FAIL_FAST_SECONDS
              value: {{ .Values.controller.failFastSeconds | toString | quote }}
            {{- end }}
            {{- if ne (toString .Values.controller.jobTtlSeconds) "" }}
            - name: LOGWEIR_JOB_TTL_SECONDS
              value: {{ .Values.controller.jobTtlSeconds | toString | quote }}
            {{- end }}
            {{- /*
            PLAT-19.2 — the installation's approval policies, RENDERED ONLY WHEN
            CONFIGURED (the default install stays byte-identical to
            `logweir.yaml`). See `templates/approval-policy.yaml`: the same
            immutable, content-addressed ConfigMap is mounted into the console,
            and absent means every namespace on `legacy-governed-v1`.
            */ -}}
            {{- if include "logweir.approvalPolicy.configured" . }}
            - name: LOGWEIR_APPROVAL_POLICY_FILE
              value: {{ include "logweir.approvalPolicy.file" . | quote }}
            {{- end }}
            {{- if $endpoint }}
            - name: AWS_ENDPOINT_URL
              value: {{ $endpoint | quote }}
            - name: AWS_ALLOW_HTTP
              value: {{ ternary .Values.archive.s3.allowHttp true $explicit | toString | quote }}
            - name: AWS_VIRTUAL_HOSTED_STYLE_REQUEST
              value: {{ ternary .Values.archive.s3.virtualHostedStyle false $explicit | toString | quote }}
            {{- end }}
            {{- if $region }}
            - name: AWS_REGION
              value: {{ $region | quote }}
            {{- end }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: logweir-evidence-ro
                  key: access-key-id
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: logweir-evidence-ro
                  key: secret-access-key
                  optional: true
          {{- /*
          CHART GAP G5: exec probes against the controller's loopback health
          listener — `config/manager/deployment.yaml` carries the argument and
          the same two blocks, so the default render stays the install file.
          */}}
          livenessProbe:
            exec:
              command: ["/usr/local/bin/weirkeeper", "--probe", "live"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/usr/local/bin/weirkeeper", "--probe", "ready"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if include "logweir.approvalPolicy.configured" . }}
          volumeMounts:
            - name: approval-policy
              mountPath: {{ include "logweir.approvalPolicy.dir" . }}
              readOnly: true
          {{- end }}
      {{- if include "logweir.approvalPolicy.configured" . }}
      volumes:
        - name: approval-policy
          configMap:
            name: {{ include "logweir.approvalPolicy.name" . }}
      {{- end }}
