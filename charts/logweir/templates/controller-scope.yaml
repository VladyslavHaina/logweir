{{- /*
The controller's authority, scoped to the execution namespaces. A Job can
mount any Secret in its namespace, so Job-create authority there is every
Secret there (residual O1, `docs/kubernetes.md` §15.4), and the default
cluster-wide binding would put the release namespace, where the shared
console's keys live, inside it. RBAC is additive, so the only narrowing is not
to grant it; with `controller.watchNamespaces` set this file replaces the
ClusterRoleBinding with:

* one RoleBinding per listed namespace to the same `weirkeeper` ClusterRole
  (under a RoleBinding its namespaced rules apply there only, its
  cluster-scoped rules nowhere);
* `weirkeeper-cluster-scope`, bound cluster-wide, holding the two
  cluster-scoped trust kinds and nothing else;
* a Role in the release namespace for the installation policy ConfigMap, by
  name.

`deployment.yaml` renders `LOGWEIR_WATCH_NAMESPACES` from the same value.
`charts/logweir/README.md` §`controller.watchNamespaces` has the matrix.
*/ -}}
{{- with .Values.controller.watchNamespaces }}
{{- range $ns := . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weirkeeper
  namespace: {{ $ns }}
  labels:
    {{- include "logweir.labels" $ | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: weirkeeper
subjects:
  - kind: ServiceAccount
    name: weirkeeper
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: weirkeeper-cluster-scope
  labels:
    {{- include "logweir.labels" $ | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  # The two cluster-scoped kinds, with exactly the verbs `clusterrole.yaml`
  # grants on them. The one `patch` on a TrustPolicy itself places and releases
  # the compromise-revocation finalizer.
  - apiGroups: ["logweir.dev"]
    resources: ["trustrosters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["logweir.dev"]
    resources: ["trustrosters/status"]
    verbs: ["patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies"]
    verbs: ["list", "watch", "patch"]
  - apiGroups: ["logweir.dev"]
    resources: ["trustpolicies/status"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: weirkeeper-cluster-scope
  labels:
    {{- include "logweir.labels" $ | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: weirkeeper-cluster-scope
subjects:
  - kind: ServiceAccount
    name: weirkeeper
    namespace: {{ $.Release.Namespace }}
---
# The installation policy, read by name from the release namespace: `get` on
# this one ConfigMap and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weirkeeper-installation-policy
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "logweir.labels" $ | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    {{- if include "logweir.freshInstallConfirm" $ }}
    # And the public identity ConfigMap, for the fresh-install marker.
    resourceNames: ["weirkeeper-policy", {{ $.Values.identity.publicConfigMapName | quote }}]
    {{- else }}
    resourceNames: ["weirkeeper-policy"]
    {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weirkeeper-installation-policy
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "logweir.labels" $ | nindent 4 }}
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: weirkeeper-installation-policy
subjects:
  - kind: ServiceAccount
    name: weirkeeper
    namespace: {{ $.Release.Namespace }}
{{- end }}
