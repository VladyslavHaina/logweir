{{/*
`approvalPolicy` — PLAT-19.2: ORDINARY CONFIRMATION VERSUS GOVERNED APPROVAL.

ONE DOCUMENT, TWO READERS, ONE DIGEST. Decision D0 says the API and the
controller "consume the same content hash". This template renders the
installation's approval policies and namespace bindings ONCE, into an immutable
ConfigMap whose name carries the first ten characters of the document's sha256,
and the SAME object is mounted into the `weirkeeper` Deployment
(`LOGWEIR_APPROVAL_POLICY_FILE`) and into the console
(`approvalPolicyFile`). Both processes log `approval_policy_digest` at start and
`GET /api/v1/namespaces/{ns}/approval-policy` publishes it, so an operator can
see they agree.

A CHANGED POLICY IS A ROLLOUT, NOT AN EDIT. D0: "Selecting a different policy is
an explicit installation-admin rollout and audit event, not a namespace
operator edit." The content-addressed name changes with every edit, so both pod
templates change and both Deployments roll; nobody with `patch configmaps` can
change the policy under a running controller, because the object is immutable.
A signed document names the policy's snapshot DIGEST, so a Restore confirmed
under the old policy and not yet admitted is refused `ApprovalPolicyMismatch`
after the rollout — re-confirmation, which is D0's rule.

NOTHING IS RENDERED WHEN NOTHING IS CONFIGURED. An install with no policies and
no bindings renders no ConfigMap, no env and no mount, so the default render is
byte-identical to what it was, and every namespace resolves to
`legacy-governed-v1` — today's governed approval, unchanged.

PROD-16.1 — THE THREE MODES THE OPERATOR SEES, AND THE UNBOUND DEFAULT.
`approvalPolicy.policies[].mode` is `confirm`, `two-person` or `strict` (the
canonical spelling); the older `Ordinary` and `Governed` (and `Governed` with
`approverSignature: Console`) are aliases rendering the same bytes. This
template RENDERS THE INTERNAL NAMES (`logweir.approvalPolicy.internalMode`,
the chart's half of `logweir_core::approval_policy::ApprovalRoute`), so an
image-only rollback reads the same document it always did. `approvalPolicy.default`
(`confirm` | `strict` | empty; `two-person` is not a default) is rendered
as `defaultMode` ONLY when set: empty leaves the decision to the fresh-install
marker, which the identity hook writes only on a fresh install with a console
(`logweir.freshInstallConfirm`), so an upgraded install's unbound namespaces
stay `legacy-governed-v1`. A set `default` is a field an older binary refuses
at start — fail closed on rollback.

PROD-16.2 — TWO-PERSON APPROVAL IN THE CONSOLE. A policy written
`mode: two-person` (or `mode: Governed` with `approverSignature: Console`) is
RENDERED as `mode: Governed` and `approverSignature: Console`: a second person
signs in to the shared console and clicks Approve, and the console signs the
approval. The setting is inside the policy's snapshot digest, so a request made
under it is never approved under a personal key or the reverse. An older
controller or console refuses a document that carries `approverSignature` at
start (an unknown field: fail closed on rollback), so the key is rendered ONLY
for such a policy and every other document is byte for byte what it was.

IT RENDERS ONLY WITH A SHARED CONSOLE (`api.console.enabled` and
`api.console.mode=shared`). The second person is a second identity the
identity provider vouches for; the in-cluster administrator console has one
identity, and an install with no console has nobody to click. Anywhere else
the chart FAILS (`_validate.tpl`), by name, before anything installs — a chart-only refusal:
the document itself is one the binary reads, and the binary's own refusals
(the administrator console neither requests nor approves under such a policy)
stand behind it.

THE REFUSALS (`_validate.tpl`) ARE THE BINARY'S, MADE EARLIER. `logweir_core::approval_policy`
refuses the same documents at controller and console start, and a document the
binary refuses stops the WHOLE controller -- every reconciler, backups included
-- so the chart must refuse every one of them in `helm template`, where the
operator is still holding the values file. The cases live ONCE, in
`scripts/approval-policy-refusals/*.values.yaml`: `scripts/check-chart.sh` renders
each and requires a refusal, and `crates/logweir/tests/chart_lint.rs` feeds each
document to `ApprovalPolicySet::parse` and requires a refusal there too, so a
rule added to one side and not the other is a red row.
*/}}
{{- define "logweir.approvalPolicy.configured" -}}
{{- if or .Values.approvalPolicy.policies .Values.approvalPolicy.namespaces .Values.approvalPolicy.default -}}true{{- end -}}
{{- end -}}

{{- /* PROD-16.1: an operator mode name, or an internal one, as the internal one.
       PROD-16.2: `two-person` is Governed, with the console as the approver's
       signature (`logweir.approvalPolicy.console`). */ -}}
{{- define "logweir.approvalPolicy.internalMode" -}}
{{- $m := . | default "" -}}
{{- if or (eq $m "confirm") (eq $m "Ordinary") -}}Ordinary
{{- else if or (eq $m "strict") (eq $m "Governed") -}}Governed
{{- else if eq $m "two-person" -}}Governed
{{- else -}}{{ $m }}
{{- end -}}
{{- end -}}

{{- /* PROD-16.2: whether ONE policy takes its approval from the console: it is
       written `mode: two-person`, or carries `approverSignature: Console`. */ -}}
{{- define "logweir.approvalPolicy.console" -}}
{{- if or (eq (.mode | default "") "two-person") (eq (.approverSignature | default "") "Console") -}}true{{- end -}}
{{- end -}}

{{- /* PROD-16.2: whether ANY declared policy does. */ -}}
{{- define "logweir.approvalPolicy.anyConsole" -}}
{{- $any := "" -}}
{{- range $policy := (.Values.approvalPolicy.policies | default list) -}}
{{- if include "logweir.approvalPolicy.console" $policy -}}{{- $any = "true" -}}{{- end -}}
{{- end -}}
{{- $any -}}
{{- end -}}

{{- define "logweir.approvalPolicy.document" -}}
allowOrdinaryConfirmation: {{ .Values.approvalPolicy.allowOrdinaryConfirmation }}
{{- with .Values.approvalPolicy.default }}
defaultMode: {{ . }}
{{- end }}
{{- $policies := list -}}
{{- range $policy := (.Values.approvalPolicy.policies | default list) -}}
{{- $rendered := merge (dict "mode" (include "logweir.approvalPolicy.internalMode" $policy.mode)) (omit $policy "mode" "approverSignature") -}}
{{- /* PROD-16.2: the one spelling the binary's document has, and only for a
       policy that says so, so every other document is what it was. */ -}}
{{- if include "logweir.approvalPolicy.console" $policy -}}
{{- $rendered = merge (dict "approverSignature" "Console") $rendered -}}
{{- end -}}
{{- $policies = append $policies $rendered -}}
{{- end }}
policies:
{{ toYaml $policies | indent 2 }}
namespaces:
{{ toYaml (.Values.approvalPolicy.namespaces | default dict) | indent 2 }}
{{- end -}}

{{- /*
PROD-16.1 fix round: THE BOOTSTRAP IMAGE'S FEATURES. `identity.bootstrapImage`
is pinned by digest and published separately from this chart, so the chart
passes the hook the PROD-16.1 flags (`--console-*`, `--installation-trust-policy`,
`--allowed-target-cluster-id`, `--mark-fresh-install-confirm`,
`--revoke-trust-binding`) — and renders every object they manage — ONLY while
`identity.bootstrapFeatures.consoleKey` says the pinned image runs them. It is
flipped in the SAME commit that re-pins the image (docs/install.md, *Release
coordinator: re-pin bootstrap bytes*); until then the chart installs and
upgrades exactly as before PROD-16.1, with the pinned image it names.
*/ -}}
{{- define "logweir.bootstrap.consoleKey" -}}
{{- if and .Values.identity.enabled .Values.identity.bootstrapFeatures.consoleKey -}}true{{- end -}}
{{- end -}}
{{- /*
PROD-16.1: the console's ConsoleConfirmation key the identity hook manages —
when the bootstrap image runs it (above), a console runs, and the operator
named no other Secret (`approvalPolicy.confirmationKeySecret` empty, or the
managed name itself, which is how every PLAT-19.2 install named the Secret it
made by hand: the hook ADOPTS that key). With the feature off, an empty name is
no key and the managed name is an operator-named key, as before PROD-16.1.
*/ -}}
{{- define "logweir.consoleKey.managedName" -}}logweir-console-confirmation{{- end -}}
{{- define "logweir.consoleKey.publicName" -}}logweir-console-trust{{- end -}}
{{- define "logweir.consoleKey.managed" -}}
{{- $named := .Values.approvalPolicy.confirmationKeySecret | default "" -}}
{{- if and (include "logweir.bootstrap.consoleKey" .) .Values.api.console.enabled (or (eq $named "") (eq $named (include "logweir.consoleKey.managedName" .))) -}}true{{- end -}}
{{- end -}}
{{- /* The Secret the console reads its key from, managed or named; empty: none. */ -}}
{{- define "logweir.consoleKey.secret" -}}
{{- if include "logweir.consoleKey.managed" . -}}{{ include "logweir.consoleKey.managedName" . }}
{{- else -}}{{ .Values.approvalPolicy.confirmationKeySecret | default "" }}
{{- end -}}
{{- end -}}
{{- /*
PROD-16.1: a fresh install of THIS release starts in `confirm` only when a
console runs (without one, nothing could confirm) with the key the identity
hook manages (the marker lives on the managed identity, and the trust names
that key). The identity hook marks the installation only in the run that
GENERATES the identity, so an upgrade never reaches it. The readers (the
controller's env and Role, the console's `installationIdentity` and its Role)
render under this same condition.
*/ -}}
{{- define "logweir.freshInstallConfirm" -}}
{{- if and .Values.api.enabled (include "logweir.consoleKey.managed" .) -}}true{{- end -}}
{{- end -}}
{{- /*
Whether this render is the fresh install that gets the install-only trust grant:
a first install into a namespace with no established signing Secret (the same
`lookup` that decides the identity placeholder; `identity.renderedOffline=true`
counts as established), with the managed console key and no external identity.
*/ -}}
{{- define "logweir.identity.freshTrust" -}}
{{- $existingSecret := or (eq (toString .Values.identity.renderedOffline) "true") (lookup "v1" "Secret" .Release.Namespace "logweir-signing-key") -}}
{{- if and .Values.identity.installationTrust.enabled .Release.IsInstall (not $existingSecret) (not (.Values.identity.externalSecret.name | default "")) (include "logweir.freshInstallConfirm" .) -}}true{{- end -}}
{{- end -}}

{{- define "logweir.approvalPolicy.name" -}}
{{- printf "%s-approval-policy-%s" .Release.Name (trunc 10 (include "logweir.approvalPolicy.document" . | sha256sum)) -}}
{{- end -}}

{{- /* Where both readers mount it. */ -}}
{{- define "logweir.approvalPolicy.dir" -}}/etc/logweir/approval-policy{{- end -}}
{{- define "logweir.approvalPolicy.file" -}}{{ include "logweir.approvalPolicy.dir" . }}/approval-policy.yaml{{- end -}}
{{- define "logweir.approvalPolicy.confirmationDir" -}}/var/run/logweir/confirmation{{- end -}}


{{- if include "logweir.approvalPolicy.configured" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logweir.approvalPolicy.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: approval-policy
immutable: true
data:
  approval-policy.yaml: |
{{ include "logweir.approvalPolicy.document" . | indent 4 }}
{{- end }}
