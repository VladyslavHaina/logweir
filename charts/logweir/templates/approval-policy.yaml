{{/*
`approvalPolicy`: ordinary confirmation versus governed approval.

One document, two readers, one digest. The policies and workspace bindings
render once, into an immutable ConfigMap named by the first ten characters of
the document's sha256, mounted into both `weirkeeper`
(`LOGWEIR_APPROVAL_POLICY_FILE`) and the console (`approvalPolicyFile`); both
log `approval_policy_digest` at start and the API publishes it.

A changed policy is a rollout, not an edit: the name changes, both Deployments
roll, and nobody with `patch configmaps` can change it under a running pod. A
signed request names the policy's snapshot digest, so one confirmed under the
old policy and not yet admitted is refused `ApprovalPolicyMismatch` after the
rollout.

Nothing renders when nothing is configured, and every workspace then resolves
to `legacy-governed-v1`.

Modes: the operator writes `confirm`, `two-person` or `strict` (`Ordinary` and
`Governed`, with or without `approverSignature: Console`, are aliases); the
document carries the internal names (`logweir.approvalPolicy.internalMode`), so
an image-only rollback reads what it always did. `default` renders as
`defaultMode` only when set; empty leaves it to the fresh-install marker. An
older binary refuses `defaultMode` and `approverSignature` at start (unknown
fields), so each is rendered only when asked for: fail closed on rollback.

`two-person` renders as `mode: Governed` plus `approverSignature: Console`, and
needs the shared console: a second identity the provider vouches for. The
refusals are in `_validate.tpl`; they are the binary's, made at render time,
and `scripts/approval-policy-refusals/` holds each case once for both.
*/}}
{{- define "logweir.approvalPolicy.configured" -}}
{{- if or .Values.approvalPolicy.policies .Values.approvalPolicy.workspaces .Values.approvalPolicy.default -}}true{{- end -}}
{{- end -}}

{{- /* An operator mode name, or an internal one, as the internal one. */ -}}
{{- define "logweir.approvalPolicy.internalMode" -}}
{{- $m := . | default "" -}}
{{- if or (eq $m "confirm") (eq $m "Ordinary") -}}Ordinary
{{- else if or (eq $m "strict") (eq $m "Governed") -}}Governed
{{- else if eq $m "two-person" -}}Governed
{{- else -}}{{ $m }}
{{- end -}}
{{- end -}}

{{- /* Whether a policy is approved in the console: `mode: two-person`, or
       `approverSignature: Console`. */ -}}
{{- define "logweir.approvalPolicy.console" -}}
{{- if or (eq (.mode | default "") "two-person") (eq (.approverSignature | default "") "Console") -}}true{{- end -}}
{{- end -}}

{{- define "logweir.approvalPolicy.document" -}}
allowOrdinaryConfirmation: {{ .Values.approvalPolicy.allowOrdinaryConfirmation }}
{{- with .Values.approvalPolicy.default }}
defaultMode: {{ . }}
{{- end }}
{{- $policies := list -}}
{{- range $policy := (.Values.approvalPolicy.policies | default list) -}}
{{- $rendered := merge (dict "mode" (include "logweir.approvalPolicy.internalMode" $policy.mode)) (omit $policy "mode" "approverSignature") -}}
{{- /* The binary's one spelling, and only for a policy that asks for it. */ -}}
{{- if include "logweir.approvalPolicy.console" $policy -}}
{{- $rendered = merge (dict "approverSignature" "Console") $rendered -}}
{{- end -}}
{{- $policies = append $policies $rendered -}}
{{- end }}
policies:
{{ toYaml $policies | indent 2 }}
workspaces:
{{ toYaml (.Values.approvalPolicy.workspaces | default dict) | indent 2 }}
{{- end -}}

{{- /*
Whether the pinned `identity.bootstrapImage` runs the console-key flags
(`--console-*`, `--installation-trust-policy`, `--allowed-target-cluster-id`,
`--mark-fresh-install-confirm`, `--revoke-trust-binding`). The image is pinned
by digest and published apart from the chart, so the chart passes those flags,
and renders what they manage, only while `identity.bootstrapFeatures.consoleKey`
says so; it is flipped in the commit that re-pins the image.
*/ -}}
{{- define "logweir.bootstrap.consoleKey" -}}
{{- if and .Values.identity.enabled .Values.identity.bootstrapFeatures.consoleKey -}}true{{- end -}}
{{- end -}}
{{- /*
The console's ConsoleConfirmation key, managed by the identity hook when the
bootstrap image runs it, a console runs, and `approvalPolicy.confirmationKeySecret`
is empty or the managed name itself (the hook adopts a hand-made key of that
name). With the feature off the managed name is an operator-named key.
*/ -}}
{{- define "logweir.consoleKey.managedName" -}}logweir-console-confirmation{{- end -}}
{{- define "logweir.consoleKey.publicName" -}}logweir-console-trust{{- end -}}
{{- define "logweir.consoleKey.managed" -}}
{{- $named := .Values.approvalPolicy.confirmationKeySecret | default "" -}}
{{- if and (include "logweir.bootstrap.consoleKey" .) .Values.api.console.enabled (or (eq $named "") (eq $named (include "logweir.consoleKey.managedName" .))) -}}true{{- end -}}
{{- end -}}
{{- /* The Secret the console reads its key from, managed or named; empty: none. */ -}}
{{- define "logweir.consoleKey.secret" -}}
{{- if include "logweir.consoleKey.managed" . -}}{{ include "logweir.consoleKey.managedName" . }}
{{- else -}}{{ .Values.approvalPolicy.confirmationKeySecret | default "" }}
{{- end -}}
{{- end -}}
{{- /*
A fresh install starts in `confirm` only with a console (nothing else could
confirm) and the managed key (the marker lives on the managed identity, and the
trust names that key). The hook marks the install only in the run that
generates the identity, so an upgrade never reaches it. Everything that reads
the marker renders under this same condition.
*/ -}}
{{- define "logweir.freshInstallConfirm" -}}
{{- if and .Values.api.enabled (include "logweir.consoleKey.managed" .) -}}true{{- end -}}
{{- end -}}
{{- /*
Whether this render is the fresh install that gets the install-only trust grant:
a first install into a namespace with no established signing Secret (the same
`lookup` that decides the identity placeholder; `identity.renderedOffline=true`
counts as established), with the managed console key and no external identity.
*/ -}}
{{- define "logweir.identity.freshTrust" -}}
{{- $existingSecret := or (eq (toString .Values.identity.renderedOffline) "true") (lookup "v1" "Secret" .Release.Namespace "logweir-signing-key") -}}
{{- if and .Values.identity.installationTrust.enabled .Release.IsInstall (not $existingSecret) (not (.Values.identity.externalSecret.name | default "")) (include "logweir.freshInstallConfirm" .) -}}true{{- end -}}
{{- end -}}

{{- define "logweir.approvalPolicy.name" -}}
{{- printf "%s-approval-policy-%s" .Release.Name (trunc 10 (include "logweir.approvalPolicy.document" . | sha256sum)) -}}
{{- end -}}

{{- /* Where both readers mount it. */ -}}
{{- define "logweir.approvalPolicy.dir" -}}/etc/logweir/approval-policy{{- end -}}
{{- define "logweir.approvalPolicy.file" -}}{{ include "logweir.approvalPolicy.dir" . }}/approval-policy.yaml{{- end -}}
{{- define "logweir.approvalPolicy.confirmationDir" -}}/var/run/logweir/confirmation{{- end -}}


{{- if include "logweir.approvalPolicy.configured" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logweir.approvalPolicy.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: approval-policy
immutable: true
data:
  approval-policy.yaml: |
{{ include "logweir.approvalPolicy.document" . | indent 4 }}
{{- end }}
