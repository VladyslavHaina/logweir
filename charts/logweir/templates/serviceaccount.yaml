{{- /*
The control plane's own ServiceAccount — `config/rbac/service_account.yaml`.
The ONE account in this install that holds a cluster credential, and the one
component that talks to the API server. `automountServiceAccountToken` is
deliberately unset here (the runner's account, below in
runner-serviceaccount.yaml, sets it to false).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weirkeeper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
