{{- /*
The control plane's ServiceAccount, the one account here that talks to the API
server (`automountServiceAccountToken` left unset). `imagePullSecrets` live on
the account, so every pod that runs as it inherits them.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weirkeeper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
{{- with (include "logweir.imagePullSecrets" .) }}
{{ . }}
{{- end }}
