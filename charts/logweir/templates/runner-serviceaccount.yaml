{{- /*
The runner ServiceAccount for every Job, all in the release namespace.
Granted no verb: the runner makes no API call and holds the signing key. Runner
Jobs are the operator's objects, so a pull secret reaches them only through
this account's `imagePullSecrets`; node placement does not reach them.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logweir-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
automountServiceAccountToken: false
{{- with (include "logweir.imagePullSecrets" .) }}
{{ . }}
{{- end }}
