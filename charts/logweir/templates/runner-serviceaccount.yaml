{{- /*
The runner pod's ServiceAccount — `config/rbac/backup-runner-serviceaccount.yaml`,
rendered into the RELEASE namespace. Runner Jobs run in the namespace of the
`Backup`, `Restore` or `KafkaCluster` that produced them and every one names
`logweir-runner`; this copy serves objects created in the release namespace,
and every OTHER namespace that runs Jobs still applies the fragment itself
(`docs/install.md` step 4 — `scripts/helm-demo.sh` does it for its demo
namespace). Granted no verb on anything; the runner makes zero API calls and
is the process that holds the signing key.

AND THIS IS HOW A RUNNER JOB PULLS FROM A PRIVATE REGISTRY (Task 38, ruling 6).
The Jobs are the OPERATOR's objects, not this chart's, so the chart cannot put a
pull secret on their PodSpecs — but a pod inherits its ServiceAccount's
`imagePullSecrets`, and every runner Job names this account. One list here and
every Job created in this namespace can pull. (Node placement for runner Jobs
has no such path and is NOT implemented — `README.md` names that gap.)
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logweir-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
automountServiceAccountToken: false
{{- with (include "logweir.imagePullSecrets" .) }}
{{ . }}
{{- end }}
