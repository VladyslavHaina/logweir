{{- /*
The installation policy ConfigMap, read by `weirkeeper::check::policy`.

It is in the release namespace because write access to it is what makes a
visibility attestation an administrator's statement: a namespace operator
(`logweir-operator` names no `configmaps`) cannot write it. Every value comes
from `values.yaml` and none is a secret.

The parser uses `deny_unknown_fields` and range checks, and a document it
refuses fails closed almost silently (no attestations, no evidence allowlist,
one advisory row). So `values.schema.json` requires every field read here and
`_validate.tpl` refuses the one cross-field rule the schema cannot state.

`legacyArchiveAddressing` is the same `archive.s3.*` addressing
`deployment.yaml` renders as env, from the same helpers. It carries a
plaintext `allowHttp` only when an endpoint exists: an install on plain Amazon
S3 must never publish an HTTP fact nobody configured.
*/ -}}
{{- /*
`defaultMaxTopics` and `defaultTimeoutSeconds` are fixed compatibility values,
never read from values: no request ever lacks its own (the CRDs default them),
so the two knobs were withdrawn; the schema still accepts them and NOTES.txt
says a set one is ignored. A controller older than the withdrawal requires both
keys in range and fails closed without them, so a default install keeps them
for an image-only rollback. `weirkeeper/tests/chart_policy.rs` pins both
numbers to the parser's constants.
*/ -}}
{{- $compatMaxTopics := min 20000 (int .Values.checks.discovery.hardMaxTopics) -}}
{{- $endpoint := include "logweir.archive.endpoint" . -}}
{{- $region := include "logweir.archive.region" . -}}
{{- $explicit := ne .Values.archive.s3.endpoint "" -}}
{{- $legacy := dict "endpoint" "" "region" $region "allowHttp" false "virtualHostedStyle" false -}}
{{- if $endpoint -}}
{{- $legacy = dict
      "endpoint" $endpoint
      "region" $region
      "allowHttp" (ternary .Values.archive.s3.allowHttp true $explicit)
      "virtualHostedStyle" (ternary .Values.archive.s3.virtualHostedStyle false $explicit) -}}
{{- end -}}
{{- $discovery := dict
      "freshSeconds" (.Values.checks.discovery.freshSeconds | int)
      "retentionSeconds" (.Values.checks.discovery.retentionSeconds | int)
      "keepPerConnection" (.Values.checks.discovery.keepPerConnection | int)
      "defaultMaxTopics" $compatMaxTopics
      "hardMaxTopics" (.Values.checks.discovery.hardMaxTopics | int)
      "visibilityAttestations" .Values.checks.discovery.visibilityAttestations -}}
{{- $policy := dict
      "version" 1
      "checks" (dict
        "maxActivePerNamespace" (.Values.checks.maxActivePerNamespace | int)
        "maxActiveTotal" (.Values.checks.maxActiveTotal | int)
        "maxActiveDiscoveriesPerConnection" (.Values.checks.maxActiveDiscoveriesPerConnection | int)
        "maxEvidenceFetchActivePerNamespace" (.Values.checks.maxEvidenceFetchActivePerNamespace | int))
      "discovery" $discovery
      "preflight" (dict
        "defaultTimeoutSeconds" 120
        "retentionSeconds" (.Values.checks.preflight.retentionSeconds | int))
      "engine" (dict "allowUnverifiedCustomCa" .Values.engine.allowUnverifiedCustomCa)
      "evidence" (dict "controllerIdentityLocations" .Values.evidence.controllerIdentityLocations)
      "legacyArchiveAddressing" $legacy -}}
{{- /*
`runs` renders only away from `RunsPolicy::default()` (4, 2, pinned by
`weirkeeper/tests/chart_policy.rs`): an older controller refuses the whole
document for an unknown block, so a default install must not carry it. A
non-default value rolls back with the chart, never with the image alone.
*/ -}}
{{- $runsBackups := int .Values.runs.maxManualBackupsActivePerNamespace -}}
{{- $runsRestores := int .Values.runs.maxManualRestoresActivePerNamespace -}}
{{- if or (ne $runsBackups 4) (ne $runsRestores 2) -}}
{{- $_ := set $policy "runs" (dict
      "maxManualBackupsActivePerNamespace" $runsBackups
      "maxManualRestoresActivePerNamespace" $runsRestores) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: weirkeeper-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
data:
  policy.json: |-
{{ $policy | toPrettyJson | indent 4 }}
