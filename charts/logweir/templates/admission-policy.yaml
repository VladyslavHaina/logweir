{{- if .Values.admissionPolicy.enabled }}
{{- /*
The ValidatingAdmissionPolicy that fences the console API's `create` on Secrets.
`logweir-api` holds `create` and no read verb on `secrets`, and `create` cannot
be narrowed by name: in a namespace it could mint a
`kubernetes.io/service-account-token` for any ServiceAccount. The console's
credential builders stamp their own `type` (`logweir.dev/object-store-credential`,
`logweir.dev/kafka-sasl-password`, `logweir.dev/kafka-client-certificate`) and
the `app.kubernetes.io/managed-by: logweir` label so this policy can require
both. A cluster administrator can delete it; it bounds a mistake or a
compromised console, not a deliberate administrator.

`matchConditions` selects the console's own subject, so every other principal
is skipped, which is why `failurePolicy: Fail` is safe: a Fail-closed policy
that matched every subject would break service-account-token creation
cluster-wide. Off by default only because ValidatingAdmissionPolicy is
Kubernetes 1.30+ and the chart's floor is 1.29. A kustomize install applies
`config/samples/console-credential-admission-policy.yaml` by hand.

[UNVERIFIED — not applied to a live API server]. What would verify it: on a
1.30+ cluster, apply both documents, then as the console ServiceAccount create
(a) a Secret of type `logweir.dev/object-store-credential` carrying the
managed-by label — ACCEPTED — and (b) a Secret of type
`kubernetes.io/service-account-token` — REJECTED with the message below — and
show (b) succeeding once the binding is deleted.
*/ -}}
{{- $name := .Values.admissionPolicy.consoleServiceAccountName -}}
{{- $sa := printf "system:serviceaccount:%s:%s" .Release.Namespace $name -}}
{{- $principals := prepend .Values.admissionPolicy.extraPrincipals $sa | uniq -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: logweir-console-credentials-only
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    # THE SUBJECT TEST. Nothing outside this list is evaluated at all.
    - name: console-service-account
      expression: request.userInfo.username in {{ $principals | toJson }}
  validations:
    - expression: >-
        has(object.type) && (object.type == 'logweir.dev/object-store-credential' ||
        object.type == 'logweir.dev/kafka-sasl-password' ||
        object.type == 'logweir.dev/kafka-client-certificate')
      message: >-
        the Logweir console may create only its own credential Secrets: type must be
        logweir.dev/object-store-credential, logweir.dev/kafka-sasl-password or
        logweir.dev/kafka-client-certificate
      reason: Forbidden
    - expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/managed-by' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'logweir'
      message: >-
        the Logweir console may create only Secrets it owns: the
        app.kubernetes.io/managed-by=logweir label is required
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: logweir-console-credentials-only
  labels:
    {{- include "logweir.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
spec:
  policyName: logweir-console-credentials-only
  # DENY, not Warn or Audit: a policy that only warned would leave the grant
  # exactly as wide as it is today and read, on an audit surface, as though it
  # did not.
  validationActions: ["Deny"]
  # CLUSTER-WIDE. `matchResources` is omitted, so every namespace the console
  # is bound in is covered; an adopter who wants it narrower adds a
  # `namespaceSelector` here.
{{- end }}
