                        nullable: true
                        type: string
                      presence:
                        description: 'What the relay said about the two objects: `Complete`, `PayloadWithoutSidecar`, `Absent` (the store answered NotFound for the signed document) or `Unknown` (anything else, including a denial). Absent until a relay was read.'
                        nullable: true
                        type: string
