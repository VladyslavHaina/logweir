                              **`Historical` is a pass, not a downgrade**: the key was valid when it signed and has since been retired, which is what key rotation is supposed to look like. The console renders it as "verified against retired key `<id>` (signed before retirement)" and never as a warning.

                              **`Unverified` is not a verdict at all**: the status was written by a controller that predates `signedAt`, so the key's validity window has not been compared to anything yet and the controller owes this object one bounded re-read of its own receipt. It is written only beside `result: NotAttempted`, it is never green, and it disappears as soon as the read supplies a real `signedAt`. See `docs/kubernetes.md` §15.2c.
                            nullable: true
                            type: string
                          keyState:
                            description: '`Active`, `Retired`, `Expired`, `Revoked` or `Unknown` — the signing key''s state at the moment the verdict was reached.'
                            nullable: true
                            type: string
                          policy:
                            description: Which `TrustPolicy` answered, with the revision that answered.
                            nullable: true
                            properties:
                              generation:
                                description: Its `metadata.generation`. A generation change is what makes the controller re-run the verdict over STORED fields, with no storage read and no change to `phase`, `exitCode` or `outcome`.
                                format: int64
                                nullable: true
                                type: integer
                              name:
                                description: Its name.
                                nullable: true
                                type: string
                              uid:
                                description: Its UID — a same-named replacement is a different policy.
                                nullable: true
                                type: string
                            type: object
                          retryAfter:
                            description: |-
                              **The controller will not re-read this run's document before this instant** — the bounded backoff behind `docs/kubernetes.md` §15.2c.

                              A terminal object reconciles every `REQUEUE_SECS`, so "one bounded re-read" needed something on the object to be bounded BY: without it a document the archive cannot answer for costs one `Store::get` every 15 seconds, for ever, for a verdict that cannot change. Written only when an attempt learned nothing — the archive did not answer, or there was no reader — and cleared the moment a read succeeds.
                            format: date-time
                            nullable: true
                            type: string
                          signingTimeRead:
                            description: |-
                              `absent` once the bounded re-read COMPLETED and the document itself carried no signing time.

                              **THE PERMANENT SETTLE, AND IT IS A FACT ABOUT THE DOCUMENT.** A block with no `signedAt` and no `basis` that compared one is re-read, because nothing on the status says whether the absence is this installation's or the document's. Once a read has answered, it IS the document's, and asking the archive again can only get the same answer — so this records the answer instead of the question. It is never written for a read that failed, and never beside a `signedAt`.
                            nullable: true
                            type: string
                        type: object
                      verifiedAt:
                        description: |-
                          When the controller performed the verification.

                          **WHEN THIS VERDICT WAS REACHED, not when it was last re-confirmed.** A reconciler's own status patch is what wakes it (plan erratum **E11(d)**), so a field carrying a fresh clock read on every pass would make every pass a write and every write a wake-up. A change in `result`, `matchedKeyId`, `payloadType` or `detail` is a new verdict and takes a new instant; anything else keeps the stored one, and the second status patch is then a no-op that is never sent.
                        format: date-time
                        nullable: true
                        type: string
                    type: object
                type: object
              exitCode:
                description: 'The runner''s exit code (Global Constraint 11). `2` is the most valuable result the tool produces: the drill ran, it was measured, and the backup did not meet its objective — a scorecard WAS written and signed.'
                format: int32
