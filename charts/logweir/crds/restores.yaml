                          NEVER KEY MATERIAL AND NEVER A CREDENTIAL. It is an error's `Display` and a fixed sentence, both of which name objects and key IDs only.
                        nullable: true
                        type: string
                      matchedKeyId:
                        description: The `keyId` of the `TrustRoster` signing key whose public key verified the signature.
                        nullable: true
                        type: string
                      payloadType:
                        description: The DSSE `payloadType` that was verified.
                        nullable: true
                        type: string
                      result:
                        description: |-
                          `Valid`, `Invalid`, `Untrusted`, `NotAttempted` or `Pending`. An empty `TrustRoster.spec.signingKeys` is `NotAttempted` naming itself, never a silent `Invalid`.

                          `Pending` (additive, D2 §3.9 step 3) is written only while an evidence-fetch check Job is reading this run's evidence with the destination's `evidenceRead` grant, or is waiting for a slot to start; `evidence.observation` names that Job. It is not `Valid`, so every surface renders it unverified, and it is replaced by a reached verdict or by an honest `NotAttempted` naming why the fetch did not finish.
                        nullable: true
                        type: string
                      signedAt:
                        description: |-
                          The signing time the verdict was reached AGAINST: the document's own latest pre-signature timestamp (`logweir_core::trust::claimed_signing_time`).

                          **ATTACKER-CONTROLLED FOR A COMPROMISED KEY**, which is why it is recorded rather than trusted. For a retired or expired key it is what distinguishes "signed while valid" from "signed afterwards"; for a key revoked as `KeyCompromise` it is deliberately NOT accepted as evidence of when the document was signed, and only a controller-written observation ([`EvidenceVerification::verified_at`] from an earlier reconcile) counts.
                        format: date-time
                        nullable: true
                        type: string
                      trust:
                        description: Which trust policy said so, and on what basis.
                        nullable: true
                        properties:
                          basis:
