# The Logweir Helm chart — ONE chart that installs the control plane and,
# optionally, the console, its own object-store backend and two throwaway Kafka
# clusters. Task 35 (post-plan).
#
# `version` and `appVersion` are a checkout's. `scripts/ci-images.sh
# chart-package` sets both when it publishes: `<version>-sha-<commit>` for a
# `main` publication, `<semver>` for a `v<semver>` release tag. It also
# rewrites the three Logweir image defaults from `:latest` to that
# publication's tag, and for a release to `:<tag>@sha256:…`.
#
# `kubeVersion` is Global Constraint 25's floor: the thirteen CRDs use CEL
# validation rules, GA at 1.29. Helm refuses an older cluster before anything
# installs (`helm install`, `upgrade` and `template` alike). The other
# constraints, Helm 3.19+ or 4.x and linux/amd64 or linux/arm64 nodes, are in
# `description` and on README.md's first screen.
#
# `crds/` holds the CustomResourceDefinitions, the one checked-in copy, which
# `just crds` writes and `just crds-check` holds to the Rust emitter.
# Helm installs the contents of `crds/` ONCE, on `helm install`, and NEVER
# upgrades or deletes them (Helm's own rule for that directory) — see the
# README for how to upgrade them by hand.
apiVersion: v2
name: logweir
description: >-
  Logweir — a Kafka backup-and-restore drill runner with a Kubernetes control
  plane (weirkeeper), a signed scorecard, and a web console. This chart
  installs the control plane; optionally the console, an in-cluster MinIO
  backend and two demo Kafka clusters. Needs Kubernetes 1.29+, Helm 3.19+ or
  4.x, and linux/amd64 or linux/arm64 nodes.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.29.0-0"
keywords:
  - kafka
  - backup
  - restore
  - disaster-recovery
sources:
  - https://github.com/VladyslavHaina/logweir
