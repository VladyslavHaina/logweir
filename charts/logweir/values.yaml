# Logweir chart values — every option the chart has, with its default.
# What they mean, what they cost, and how to install: charts/logweir/README.md.

# --------------------------------------------------------------- identity
environment: ""                 # a label on every object; switches nothing

# ------------------------------------- placement, for every pod rendered
# Runner Jobs are the operator's: imagePullSecrets reach them through the
# runner ServiceAccount, node placement does not (not implemented).
kubernetes:
  namespace: ""                 # feeds ui.namespaces and api.namespaces; `-n` decides the install
  connectionsNamespace: ""      # kafka.enabled's KafkaClusters + minio's logweir-s3; "" = release ns. Must be watched
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ----------------------------------------------------------------- images
controllerImage: docker.io/vladyslavhaina/weirkeeper:latest
# `runnerImage` is ALSO the retention enforcement image: there is no separate
# `retentionImage`, because the image below carries both binaries. The
# controller renders enforcement Jobs from this value and overrides only the
# container's command (`logweir-retention`, beside the `logweir` entrypoint the
# backup, restore and check Jobs run). Point this at an image built from a tree
# whose Dockerfile does not build `-p logweir-retention` and `mode: Enforce`
# Jobs die at the kubelet with exitCode 127.
runnerImage: docker.io/vladyslavhaina/logweir:latest
imagePullPolicy: Always         # controller container: Always | IfNotPresent | Never
runnerImagePullPolicy: Always   # runner Jobs; Never only for images loaded onto the node
imagePullSecrets: []            # [{name: regcred}] — on both ServiceAccounts and every pod

# --------------------------------------- persistent installation signing identity
# A post-install/post-upgrade hook in the signer-capable runner image initializes
# retained objects once. It never renders private material into a Helm manifest.
identity:
  enabled: true
  bootstrapImage: docker.io/vladyslavhaina/logweir@sha256:2d20f4bdb2bd8b9f2fb9fa298371740eb9a368d42cf031a7ebe1272542477e19 # rev 4956785, amd64
  bootstrapImagePullPolicy: IfNotPresent
  allowMutableBootstrapImageForDevelopment: false
  publicConfigMapName: logweir-signing-trust
  authorizedRunnerNamespaces: [] # release namespace implicit; same signer copied to each
  kubernetesApiCIDRs: []          # exact API /32 or /128 endpoints; TCP 443/6443 only
  externalSecret:
    name: ""                    # explicit adoption: pre-existing Secret in the release namespace
    key: signing.pem            # P-256 or Ed25519 PKCS#8 PEM; never copied to chart output/logs
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# ------------------------------------------------------------- controller
controller:
  logLevel: info                # RUST_LOG; below info the per-object lines are lost
  failFastSeconds: ""           # D3: patience for a stuck run. "" = 300s; 0 = never; floor 60
  jobTtlSeconds: ""             # D3: how long a finished Job is kept. "" = 604800s; floor 3600
  watchNamespaces: []           # D0 stage 5: [] = every namespace (ClusterRoleBinding). A list = RoleBindings
                                # there only; required by api.console.mode=shared, release namespace excluded
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  nodeSelector: {}              # each component may override kubernetes.* for its own pods
  tolerations: []
  affinity: {}
notify:                         # what the controller tells its delivery Jobs
  allowInsecureSinks: false     # DEV ONLY: lets one POST to an http:// sink. Production: false

# ------------------------------ the installation policy (D2 §4.4), rendered
# as the `weirkeeper-policy` ConfigMap in the release namespace. Only someone
# who can write that ConfigMap can change it, which is what makes an
# attestation an ADMINISTRATOR statement; a namespace operator cannot.
checks:
  maxActivePerNamespace: 4      # check Jobs running at once in one namespace
  maxActiveTotal: 20            # and across the whole installation
  maxActiveDiscoveriesPerConnection: 1
  maxEvidenceFetchActivePerNamespace: 4  # a separate pool: verification is never starved
  discovery:
    freshSeconds: 900           # past this an inventory reads stale, never wrong
    retentionSeconds: 86400     # a terminal TopicDiscovery is collected after this
    keepPerConnection: 5        # and never more than this many per connection
    defaultMaxTopics: 20000
    hardMaxTopics: 50000
    visibilityAttestations: []  # [{id,namespace,kafkaCluster,clusterId,principal,attestedBy,attestedAt,expiresAt,statement}]
  preflight:
    defaultTimeoutSeconds: 120
    retentionSeconds: 3600      # a terminal Preflight is collected after this
runs: { maxManualBackupsActivePerNamespace: 4, maxManualRestoresActivePerNamespace: 2 }  # P10: manual runs active per namespace; the rest wait Queued
engine:
  allowUnverifiedCustomCa: false  # a destination CA the archive engine cannot verify
evidence:
  controllerIdentityLocations: [] # [{endpoint, region, bucket}] the controller may read evidence from

# ------------- admissionPolicy — fence the console's `create secrets` (D2 §7.3)
# OFF by default ONLY because `admissionregistration.k8s.io/v1`
# ValidatingAdmissionPolicy is Kubernetes 1.30+ and this chart's floor is 1.29.
# Turn it on wherever the API server has the kind.
admissionPolicy:
  enabled: false
  consoleServiceAccountName: logweir-api  # in the release namespace
  extraPrincipals: []           # more `system:serviceaccount:<ns>:<name>` subjects

# ----------------------------------- the archive the controller reads from
# Empty with minio.enabled:true defaults to the chart's own MinIO.
archive:
  url: ""                       # s3://bucket/prefix
  s3:
    endpoint: ""                # S3-compatible endpoint; empty for Amazon S3
    region: ""
    allowHttp: false            # both rendered only when endpoint is set
    virtualHostedStyle: false   # false is path-style, which MinIO wants

# ------------------------------- kafka.enabled — YOUR clusters, as objects
# Renders KafkaCluster custom resources. secretRef names a Secret in the
# release namespace holding the SASL password under secretKey; Logweir never
# reads it. Mutually exclusive with demoKafka.enabled.
kafka:
  enabled: false
  name: source
  bootstrapServers: ""          # "h1:9096,h2:9096" or a list
  security: { protocol: PLAINTEXT, mechanism: "" }  # PLAINTEXT | SASL_SSL | SASL_PLAINTEXT + SCRAM-SHA-512
  username: ""
  secretRef: ""
  secretKey: password           # the only key the operator projects
  target:                       # optional restore target, same keys
    name: target
    bootstrapServers: ""
    security: { protocol: PLAINTEXT, mechanism: "" }
    username: ""
    secretRef: ""
    secretKey: password
    markerTopic: logweir.scratch  # what proves a target is scratch

# ---------------------------------- minio.enabled — an in-cluster archive
# Demo-only: the root credential below also mints the runner's logweir-s3.
minio:
  enabled: false
  image: docker.io/vladyslavhaina/minio-mirror@sha256:b4c3dc9fb0a82538ac6750eb841b54fb2d4303f4b73fb523ca097918a35c3524
  mcImage: docker.io/vladyslavhaina/mc-mirror@sha256:9c7cbc3f47b092d52b73124fb9ab12f3266534c23c283b2e984d07408c9ff381
  rootUser: minioadmin
  rootPassword: minioadmin
  persistence:
    enabled: true               # false uses an emptyDir: the archive dies with the pod
    size: 5Gi
    storageClassName: ""        # empty is the cluster's default StorageClass
  resources:
    requests: { cpu: 50m, memory: 256Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -------------------------- demoKafka.enabled — two throwaway KRaft brokers
# PLAINTEXT, emptyDir storage, seeded with two topics. A demo, not a cluster.
demoKafka:
  enabled: false
  image: apache/kafka@sha256:ed74d7d115968d5e8b00ba6822ac6a384cbaaf54ca38991828647000d7089b68
  clusterIds:                   # must differ: equal ids are one cluster to phase 0
    source: EdaYkCkyT2ONrlUc3uKpSw
    target: tQmDMMCERvy6yIB-vuOZCQ
  seed:
    recordsPerTopic: 200
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------- retention.enabled — the enforcement Job's identity (D3)
# Renders ONE ServiceAccount, `logweir-retention`, granted no Kubernetes verb.
# It deletes nothing by itself; see charts/logweir/README.md for the other gates.
retention:
  enabled: false

# ------------- approvalPolicy (PLAT-19.2) — empty = legacy-governed-v1 everywhere
approvalPolicy:
  allowOrdinaryConfirmation: false  # D0's floor: an Ordinary policy is refused without it
  policies: []                      # [{name, mode: Governed|Ordinary, maxAgeSeconds, requireDistinctPrincipal}]
  namespaces: {}                    # {<namespace>: <policy name>}; unbound = legacy-governed-v1
  confirmationKeySecret: ""         # console: Secret with `confirmation.key` (PKCS#8, ConsoleConfirmation)

# ------------------------- api.enabled — the console/API principal's RBAC (D3)
# ServiceAccount + roles only. api.console.enabled additionally runs the pod.
api:
  enabled: false
  namespaces: []                # extra namespaces to bind in; defaults to kubernetes.namespace
  # --------- api.console — D0's `console.*`: the logweir-console workload (D0 §7)
  # localAdmin binds loopback and is reached with port-forward; shared is SSO.
  console:
    enabled: false              # needs api.enabled; D0 installs the identity first
    image: docker.io/vladyslavhaina/logweir-console:latest  # logweir-api + the page
    imagePullPolicy: Always     # use Never for locally loaded images
    mode: ""                    # REQUIRED: localAdmin | shared. There is no default
    replicas: 1                 # above 1 also renders a PodDisruptionBudget
    port: 8484                  # container port and ClusterIP Service port
    localAdminSubject: admin    # localAdmin: the one actor every request is recorded as
    keySecret: ""               # REQUIRED Secret: cursor.key, plus session.key when shared
    keyVersion: 1               # the `version:` those key files must declare
    publicBaseUrl: ""           # shared: EXACT https:// URL, no path, no trailing slash
    sessionMaxAgeSeconds: 900   # shared: 60..900; a stateless session cannot be revoked
    trustedProxyCidrs: []       # shared: the ingress's ranges; never an identity
    trustedProxyService: { namespace: "", name: "" }  # shared: the ingress controller's Service; its serving pods
    requireTrustedProxy: false  # shared: refuse (421) any request not from those proxies over HTTPS
    rateLimits: { manualBackupsPerMinute: 10, manualRestoresPerMinute: 5 }  # P10: starts per person, per namespace, per minute; then 429
    hostAliases: []             # [{ip, hostnames}]: e.g. the issuer's public name -> the in-cluster ingress
    oidc:
      issuer: ""                # EXACT, as the discovery document states it
      clientId: ""              # EXACT; also the expected audience
      clientSecret: ""          # the NAME of a Secret with key `clientSecret`
      caBundle: { configMap: "", secret: "", key: ca.crt }  # a PRIVATE issuer CA, added to the system roots
      systemRoots: true         # false: trust caBundle alone
    roles:
      revision: ""              # shared: recorded in every audit line
      bindings: []              # [{role, namespace, groups, subjects}] — EXACT strings
    ingress:
      enabled: false            # shared only; refused in localAdmin mode
      className: ""
      host: ""                  # publicBaseUrl's own authority
      tlsSecretName: ""         # REQUIRED when enabled: there is no plain-HTTP console
      annotations: {}           # HSTS belongs here, with the controller's own key
    networkPolicy:
      enabled: false            # Docker Desktop may accept these without enforcing them
      ingressNamespace: ""      # the ingress controller's namespace
      ingressPodLabels: {}      # and its pod labels; both required when enabled
      oidcCIDRs: []             # exact IdP /32 or /128 endpoints; TCP 443 only
      oidcPeers: []             # [{namespace, podLabels, port}]: an in-cluster IdP path, by selector
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 256Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

# ------------------------------------------- ui.enabled — the page, in-cluster
# `kubectl proxy` with the ServiceAccount's own authority: anyone who reaches
# the Service acts as it. No Ingress; reach it with kubectl port-forward.
ui:
  enabled: false
  image: docker.io/vladyslavhaina/logweir-ui:latest  # kubectl + the twenty-six page files
  imagePullPolicy: Always      # use Never for locally loaded images
  namespaces: []                # extra namespaces to bind in; defaults to kubernetes.namespace
  nodeSelector: {}
  tolerations: []
  affinity: {}
