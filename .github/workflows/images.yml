name: images
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      promote_latest:
        default: false
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      runner_digest:
        value: ${{ jobs.promote.outputs.runner_digest }}
      controller_digest:
        value: ${{ jobs.promote.outputs.controller_digest }}
      ui_digest:
        value: ${{ jobs.promote.outputs.ui_digest }}
      console_digest:
        value: ${{ jobs.promote.outputs.console_digest }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      NS: ${{ vars.DOCKERHUB_NAMESPACE || 'vladyslavhaina' }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.weirkeeper
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: weirkeeper:check
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=controller-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=controller-${{ matrix.arch }}
      - name: Build UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: logweir-ui:check
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ui-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ui-${{ matrix.arch }}
      - name: Build console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.console
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: logweir-console:check
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=console-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=console-${{ matrix.arch }}
      - name: Build runner
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: logweir:check
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runner-amd64
          cache-to: type=gha,mode=max,scope=runner-amd64
      # DEFECT RET-NOIMAGE, AND THE ONE CHECK THAT WOULD HAVE CAUGHT IT.
      #
      # The controller creates every retention enforcement Job with
      # `command: ["logweir-retention"]` out of its runner image. That binary
      # shipped in no published image until 2026-09-18, so `mode: Enforce`
      # produced a Job the kubelet killed with exitCode 127,
      # `exec: "logweir-retention": executable file not found in $PATH` — and
      # every image gate stayed green, because none of them looked for a second
      # binary.
      #
      # `--entrypoint logweir-retention` USES THE BARE NAME ON PURPOSE. A path
      # would prove the file exists; the bare name makes the container runtime
      # resolve it through `$PATH`, which is exactly what the kubelet does with
      # the container's `command`. This step fails the same way the cluster did.
      # It runs the binary rather than listing it, so a copied-but-unrunnable
      # file (wrong architecture, missing shared library) fails here too.
      #
      # AND IT INSPECTS THE OUTPUT, BECAUSE EXIT 0 IS NOT IDENTITY (review
      # finding L1). Changing one token in the Dockerfile — `COPY …
      # release/logweir /usr/local/bin/logweir-retention` — produced an image
      # on which this step's earlier, exit-code-only form printed
      # `logweir 0.1.0` and passed, i.e. an image whose enforcement Job runs the
      # everyday binary under the enforcement binary's name. `case` on the
      # version string, no pipe, so docker's own status is still read.
      #
      # THIS IS DELIBERATELY THE SMALL, FAST-FAILING HALF. The full assertion —
      # including the mis-copy in the other direction and the two versions
      # having to agree — is `scripts/check-image.sh` check 7, which
      # `bash scripts/ci-images.sh check` runs below on this same tag and
      # `… candidates` runs again on the digest the registry returns. This step
      # earns its place by failing in seconds, before the login step, and by
      # naming the defect; drop it if the duplication ever costs more than that.
      - name: The runner image carries the enforcement binary
        if: matrix.arch == 'amd64'
        run: |
          version="$(docker run --rm --platform linux/amd64 \
            --entrypoint logweir-retention logweir:check --version)"
          case "$version" in
            "logweir-retention "*) echo "ok: $version" ;;
            *)
              echo "the image's /usr/local/bin/logweir-retention is not the" >&2
              echo "enforcement binary; --version printed: $version" >&2
              exit 1
              ;;
          esac
      # THE SAME FAST-FAILING HALF, FOR THE CONSOLE — D0 stage 7.
      #
      # `Dockerfile.console` COMPILES, so the ways it can produce a wrong image
      # are the ways `Dockerfile` and `Dockerfile.weirkeeper` can: a `COPY`
      # whose SOURCE is the wrong binary, a stale cached layer carrying an older
      # build, an architecture that cannot execute on this runner. The step above
      # names the first of those three for the retention binary and says why exit
      # 0 is not identity (review finding L1); this one is that step for
      # `logweir-api`.
      #
      # `--entrypoint logweir-api` USES THE BARE NAME for the same reason: the
      # chart's PodSpec runs the image's own ENTRYPOINT, and resolving through
      # $PATH here fails the way the kubelet would. `--version` contacts no API
      # server, reads no configuration and binds no socket, so it is safe to run
      # in a build job — which is the whole point of putting it before the login
      # step.
      #
      # THE FULL ASSERTION IS `scripts/check-image-api.sh`, which the next step
      # runs on this same tag and `… candidates` runs again on the digest the
      # registry returns: the twenty-six page files hashed against ui/, the three
      # licences, the three absences, USER 65532, no key-shaped path anywhere,
      # and the version held to the workspace's. This step earns its place by
      # failing in seconds and by naming the defect.
      - name: The console image carries the API binary
        run: |
          version="$(docker run --rm --platform linux/${{ matrix.arch }}             --entrypoint logweir-api logweir-console:check --version)"
          case "$version" in
            "logweir-api "*) echo "ok: $version" ;;
            *)
              echo "the image's /usr/local/bin/logweir-api is not the product" >&2
              echo "API binary; --version printed: $version" >&2
              exit 1
              ;;
          esac
      - name: Test local images
        run: bash scripts/ci-images.sh check
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested candidates and verify registry digests
        run: bash scripts/ci-images.sh candidates
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ matrix.arch }}
          path: image-digests/*.json
          if-no-files-found: error
          retention-days: 7
  promote:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: logweir-image-promotion
      cancel-in-progress: false
    env:
      NS: ${{ vars.DOCKERHUB_NAMESPACE || 'vladyslavhaina' }}
      TAG: ${{ inputs.tag }}
      PROMOTE_LATEST: ${{ inputs.promote_latest }}
    outputs:
      runner_digest: ${{ steps.promote.outputs.runner_digest }}
      controller_digest: ${{ steps.promote.outputs.controller_digest }}
      ui_digest: ${{ steps.promote.outputs.ui_digest }}
      console_digest: ${{ steps.promote.outputs.console_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digests-*
          path: image-digests
          merge-multiple: true
      - name: Publish complete image set
        id: promote
        run: bash scripts/ci-images.sh promote
