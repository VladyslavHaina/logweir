name: images
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      promote_latest:
        default: false
        type: boolean
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      runner_digest:
        value: ${{ jobs.promote.outputs.runner_digest }}
      controller_digest:
        value: ${{ jobs.promote.outputs.controller_digest }}
      ui_digest:
        value: ${{ jobs.promote.outputs.ui_digest }}
      console_digest:
        value: ${{ jobs.promote.outputs.console_digest }}
      chart_version:
        value: ${{ jobs.promote.outputs.chart_version }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      NS: ${{ vars.DOCKERHUB_NAMESPACE || 'vladyslavhaina' }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.weirkeeper
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: weirkeeper:check
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=controller-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=controller-${{ matrix.arch }}
      - name: Build UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: logweir-ui:check
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ui-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ui-${{ matrix.arch }}
      - name: Build console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.console
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: logweir-console:check
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=console-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=console-${{ matrix.arch }}
      # BOTH ARCHITECTURES SINCE PROD-00.2. The engine is Logweir's build of the
      # vendored OSO source (the Dockerfile's `engine-logweir` stage), compiled
      # natively on each runner, where OSO's own image is linux/amd64 only.
      - name: Build runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: logweir:check
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runner-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.arch }}
      # DEFECT RET-NOIMAGE, AND THE ONE CHECK THAT WOULD HAVE CAUGHT IT.
      #
      # The controller creates every retention enforcement Job with
      # `command: ["logweir-retention"]` out of its runner image. That binary
      # shipped in no published image until 2026-09-18, so `mode: Enforce`
      # produced a Job the kubelet killed with exitCode 127,
      # `exec: "logweir-retention": executable file not found in $PATH` — and
      # every image gate stayed green, because none of them looked for a second
      # binary.
      #
      # `--entrypoint logweir-retention` USES THE BARE NAME ON PURPOSE. A path
      # would prove the file exists; the bare name makes the container runtime
      # resolve it through `$PATH`, which is exactly what the kubelet does with
      # the container's `command`. This step fails the same way the cluster did.
      # It runs the binary rather than listing it, so a copied-but-unrunnable
      # file (wrong architecture, missing shared library) fails here too.
      #
      # AND IT INSPECTS THE OUTPUT, BECAUSE EXIT 0 IS NOT IDENTITY (review
      # finding L1). Changing one token in the Dockerfile — `COPY …
      # release/logweir /usr/local/bin/logweir-retention` — produced an image
      # on which this step's earlier, exit-code-only form printed
      # `logweir 0.1.0` and passed, i.e. an image whose enforcement Job runs the
      # everyday binary under the enforcement binary's name. `case` on the
      # version string, no pipe, so docker's own status is still read.
      #
      # THIS IS DELIBERATELY THE SMALL, FAST-FAILING HALF. The full assertion —
      # including the mis-copy in the other direction and the two versions
      # having to agree — is `scripts/check-image.sh` check 7, which
      # `bash scripts/ci-images.sh check` runs below on this same tag and
      # `… candidates` runs again on the digest the registry returns. This step
      # earns its place by failing in seconds, before the login step, and by
      # naming the defect; drop it if the duplication ever costs more than that.
      - name: The runner image carries the enforcement binary
        run: |
          version="$(docker run --rm --platform linux/${{ matrix.arch }} \
            --entrypoint logweir-retention logweir:check --version)"
          case "$version" in
            "logweir-retention "*) echo "ok: $version" ;;
            *)
              echo "the image's /usr/local/bin/logweir-retention is not the" >&2
              echo "enforcement binary; --version printed: $version" >&2
              exit 1
              ;;
          esac
      # THE SAME FAST-FAILING HALF, FOR THE CONSOLE — D0 stage 7.
      #
      # `Dockerfile.console` COMPILES, so the ways it can produce a wrong image
      # are the ways `Dockerfile` and `Dockerfile.weirkeeper` can: a `COPY`
      # whose SOURCE is the wrong binary, a stale cached layer carrying an older
      # build, an architecture that cannot execute on this runner. The step above
      # names the first of those three for the retention binary and says why exit
      # 0 is not identity (review finding L1); this one is that step for
      # `logweir-api`.
      #
      # `--entrypoint logweir-api` USES THE BARE NAME for the same reason: the
      # chart's PodSpec runs the image's own ENTRYPOINT, and resolving through
      # $PATH here fails the way the kubelet would. `--version` contacts no API
      # server, reads no configuration and binds no socket, so it is safe to run
      # in a build job — which is the whole point of putting it before the login
      # step.
      #
      # THE FULL ASSERTION IS `scripts/check-image-api.sh`, which the next step
      # runs on this same tag and `… candidates` runs again on the digest the
      # registry returns: the twenty-six page files hashed against ui/, the three
      # licences, the three absences, USER 65532, no key-shaped path anywhere,
      # and the version held to the workspace's. This step earns its place by
      # failing in seconds and by naming the defect.
      - name: The console image carries the API binary
        run: |
          version="$(docker run --rm --platform linux/${{ matrix.arch }}             --entrypoint logweir-api logweir-console:check --version)"
          case "$version" in
            "logweir-api "*) echo "ok: $version" ;;
            *)
              echo "the image's /usr/local/bin/logweir-api is not the product" >&2
              echo "API binary; --version printed: $version" >&2
              exit 1
              ;;
          esac
      - name: Test local images
        run: bash scripts/ci-images.sh check
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested candidates and verify registry digests
        run: bash scripts/ci-images.sh candidates
      # THE RUNNER'S SBOM (PROD-00.2), read from the exact candidate digest the
      # registry returned, never from the local tag: an SPDX document of both
      # binaries, the engine's crates included, and the Debian packages. The
      # `sign` job attests it to that digest with the workflow's identity.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - name: SBOM of the runner candidate
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: bash scripts/ci-images.sh sbom
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests-${{ matrix.arch }}
          path: |
            image-digests/*.json
            image-digests/*.spdx.json
          if-no-files-found: error
          retention-days: 7
  promote:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: logweir-image-promotion
      cancel-in-progress: false
    env:
      NS: ${{ vars.DOCKERHUB_NAMESPACE || 'vladyslavhaina' }}
      TAG: ${{ inputs.tag }}
      PROMOTE_LATEST: ${{ inputs.promote_latest }}
    outputs:
      runner_digest: ${{ steps.promote.outputs.runner_digest }}
      controller_digest: ${{ steps.promote.outputs.controller_digest }}
      ui_digest: ${{ steps.promote.outputs.ui_digest }}
      console_digest: ${{ steps.promote.outputs.console_digest }}
      chart_version: ${{ steps.chart.outputs.chart_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digests-*
          path: image-digests
          merge-multiple: true
      - name: Publish complete image set
        id: promote
        run: bash scripts/ci-images.sh promote
      # CHART GAP G4 — THE CHART, PUBLISHED BESIDE THE IMAGES IT NAMES, and
      # only after they are public under TAG: `ci-images.sh chart` checks all
      # four first. It is versioned WITH them (appVersion = TAG; version
      # `<Chart.yaml version>-sha-<commit>` on main, `<semver>` on a release
      # tag), its four image defaults are rewritten to `:TAG`, it is pushed to
      # oci://registry-1.docker.io/$NS/logweir-chart with the same Docker Hub
      # credentials the login above used, and the bytes the registry serves back
      # are compared with the bytes pushed. The Helm version is the one CI's
      # `check` job renders the chart with. PINNED BY COMMIT, not by tag: this
      # job holds the Docker Hub credentials when it runs, and the Helm it
      # installs receives the token (v4.3.1 = 1a275c3b…).
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: v4.0.1 }
      - name: Publish the chart beside the images
        id: chart
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/ci-images.sh chart

  # SIGNATURES, THE SBOM AND SIGNED PROVENANCE (PROD-00.2) for the four images
  # `promote` published, keyless: cosign and GitHub's attestation action take a
  # short-lived certificate for THIS workflow run from Sigstore's Fulcio via
  # GitHub's OIDC token, and log every signature in Rekor. No private key exists
  # anywhere, in the repository or in a secret. A job of its own, after
  # `promote`, so a Sigstore outage leaves the publication unsigned and this job
  # red rather than the publication half done.
  #
  #   * `cosign sign --recursive`: the multi-platform index and each platform's
  #     manifest, for all four images;
  #   * `cosign attest --type spdxjson`: the runner's SBOM, per platform, to the
  #     candidate digest it was read from;
  #   * `actions/attest-build-provenance`: SLSA provenance for each index,
  #     pushed to the registry beside it.
  #
  # Verification is `scripts/ci-images.sh verify-signatures` (docs/install.md,
  # "Verify the images"): the exact identity (images.yml on main), and the
  # CALLER pinned — this repository, main, a push — because a reusable
  # workflow's certificate names the called file whoever called it. Every
  # action here is pinned by commit: the job holds the Docker Hub token and the
  # OIDC token.
  # images.yml is a reusable workflow because ci.yml's `publish` job, its one
  # caller, invokes it with `uses:`; nothing else may sign. In a run another
  # repository starts by calling this file, `github.repository`, `ref` and
  # `event_name` are the CALLER's, so this job does not run there.
  sign:
    needs: promote
    if: github.repository == 'VladyslavHaina/logweir' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      NS: ${{ vars.DOCKERHUB_NAMESPACE || 'vladyslavhaina' }}
      RUNNER_DIGEST: ${{ needs.promote.outputs.runner_digest }}
      CONTROLLER_DIGEST: ${{ needs.promote.outputs.controller_digest }}
      UI_DIGEST: ${{ needs.promote.outputs.ui_digest }}
      CONSOLE_DIGEST: ${{ needs.promote.outputs.console_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digests-*
          path: image-digests
          merge-multiple: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign the four images and attest the runner's SBOM
        run: bash scripts/ci-images.sh sign
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: index.docker.io/${{ env.NS }}/logweir
          subject-digest: ${{ env.RUNNER_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: index.docker.io/${{ env.NS }}/weirkeeper
          subject-digest: ${{ env.CONTROLLER_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: index.docker.io/${{ env.NS }}/logweir-ui
          subject-digest: ${{ env.UI_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: index.docker.io/${{ env.NS }}/logweir-console
          subject-digest: ${{ env.CONSOLE_DIGEST }}
          push-to-registry: true
      - name: Verify what was just signed, as an adopter would
        run: bash scripts/ci-images.sh verify-signatures
