name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-deny@0.20.2' }
      - uses: azure/setup-helm@v4
        with: { version: v4.0.1 }
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-dev libsasl2-dev libssl-dev zlib1g-dev libcurl4-openssl-dev
      - run: pip install cryptography pytest
      - run: bash scripts/ci-check.sh
  e2e:
    timeout-minutes: 35
    env:
      AWS_EC2_METADATA_DISABLED: "true"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: free disk space (MinIO refuses writes below its free-space floor)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-dev libsasl2-dev libssl-dev zlib1g-dev libcurl4-openssl-dev
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: pip install cryptography
      - run: cargo fetch --locked
      - name: Extract the pinned engine
        run: ./scripts/extract-engine.sh
      - run: just e2e-up
      - run: ./scripts/e2e-seed.sh
      - run: cargo build --locked -p logweir
      - run: cargo test --locked -p e2e --features e2e -- --test-threads=1 --skip a_pod_really_reaches_the_k8s_listener
      - name: Kafka adapter and production timeout integration tests
        run: |
          cargo test --locked -p logweir-kafka --features e2e --test live -- --test-threads=1
          cargo test --locked -p logweir --features e2e --lib check_storage_skips_a_genuinely_unreachable_endpoint
          cargo test --locked -p logweir --features e2e --test doctor check_7_an_unreachable_target_is_named_as_a_target_problem
          cargo test --locked -p logweir --features e2e --test notify the_production_agent_gives_up_on_a_sink_that_never_replies
      - if: always()
        run: docker compose -f e2e/compose/docker-compose.yml logs --no-color > /tmp/compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: /tmp/compose.log }
      - if: always()
        run: docker compose -f e2e/compose/docker-compose.yml --profile setup --profile tools down -v --remove-orphans

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    uses: ./.github/workflows/images.yml
    with:
      tag: sha-${{ github.sha }}
      promote_latest: true
    secrets: inherit
