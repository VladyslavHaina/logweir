name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Extract the pinned engine
        run: ./scripts/extract-engine.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: pure-layer linkage guard (Global Constraint 2)
        run: ./scripts/check-no-oso.sh
      - name: pure-layer purity guard (Global Constraint 1)
        run: ./scripts/check-pure-core.sh
      # `scripts/check-dod.sh` — the sole enforcer of the ASF attribution
      # footer (Global Constraint 14), the GC14 namespace rule and relative
      # link integrity. It existed, worked, printed an honest list of what it
      # does NOT cover, and was reachable only from `just dod`: `grep -rn
      # check-dod .github/` returned nothing, so a doc merged without the
      # footer, or a publish to a forbidden namespace added to a workflow, was
      # caught by nobody. It is a laptop-only check by design (no network, no
      # GitHub API), which is exactly why it runs here as an ordinary step.
      # NOTE for whoever edits this comment: check-dod.sh greps THIS directory
      # for a publish under the upstream namespace, so do not write that
      # pattern out in prose here — the guard would report itself.
      - name: definition of done (attribution, GC14 namespaces, link integrity)
        run: ./scripts/check-dod.sh
      - name: schema drift
        run: |
          cargo run -p logweir-core --example emit_schema > /tmp/schema.json
          diff -u schemas/logweir-drill-scorecard-1.0.0.json /tmp/schema.json
      - name: known-TODO tracker (Task 19 fix round 2, review FIX 6)
        # Runs every `#[ignore]`d marker test in the workspace — currently only
        # `oso_cli_engine_must_override_validation_run_once_docker_is_available`
        # (crates/logweir-engine-oso/tests/engine.rs), tracking the
        # `DataEngine::validation_run` override still owed on `OsoCliEngine`.
        # EXPECTED TO FAIL here, same as locally: this CI runner has no
        # Docker/extracted kafka-backup binary either. `continue-on-error`
        # keeps that failure informational rather than blocking merges — the
        # point is that this step is ACTUALLY EXECUTED on every build, so a
        # default trait method nobody is reminded to override cannot go
        # unnoticed the way a doc comment alone would let it. The day the
        # real override lands (and this marker test is deleted as part of
        # that change, per its own doc comment), this step simply stops
        # running it — the obligation is closed, not silently long-lived.
        continue-on-error: true
        run: cargo test --workspace -- --ignored
  # Task 21c. The only job that runs Logweir end to end against a real broker,
  # a real MinIO and a real archive. Deliberately a SEPARATE job from `build`:
  # it needs Docker, it takes minutes rather than seconds, and its failures mean
  # something different from a unit-test failure.
  #
  # linux/amd64 runner, so `.engine/kafka-backup` executes natively and
  # `harness::engine_bin`'s probe picks it over `e2e/fixtures/engine-docker.sh`.
  # The harness PRINTS which route it took; read that line before trusting a
  # green run on any other architecture.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake
      # `docs/verify_scorecard.py` is the auditor's independent verifier and the
      # e2e suite runs it on every signed artifact. `harness::python_verify`
      # PANICS rather than skipping when `cryptography` is missing, so this
      # install is load-bearing, not decoration.
      - run: pip install cryptography
      - name: Extract the pinned engine
        run: ./scripts/extract-engine.sh
      - run: docker compose -f e2e/compose/docker-compose.yml up -d --wait
      - run: docker compose -f e2e/compose/docker-compose.yml --profile setup run --rm minio-setup
      - run: docker compose -f e2e/compose/docker-compose.yml --profile setup run --rm topic-setup
      # A SUCCESSFUL SEED ALWAYS DIRTIES THE TREE (scripts/e2e-seed.sh says so
      # in those words): the two refreshed fixtures are not byte-reproducible.
      # Never add a `git diff --exit-code` after this step.
      - run: ./scripts/e2e-seed.sh
      - run: cargo test --workspace --features e2e -- --test-threads=1
      - if: always()
        run: docker compose -f e2e/compose/docker-compose.yml logs --no-color > /tmp/compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: /tmp/compose.log }
      - if: always()
        run: docker compose -f e2e/compose/docker-compose.yml --profile setup --profile tools down -v --remove-orphans

  python-verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography pytest
      - run: python3 -m pytest docs/test_verify_scorecard.py -q

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  sync-upstream:
    runs-on: ubuntu-24.04
    env:
      # The single place the upstream SOURCE pin lives. Global Constraint 8 pins v0.1
      # to engine v0.21.0. The engine BINARY is pinned by digest, in
      # third_party/kafka-backup-binary.digest (Global Constraint 7); this tag pins only
      # the read-only source checkout the vendored structs are compared against.
      UPSTREAM_TAG: v0.21.0
    steps:
      - uses: actions/checkout@v4
      # Upstream's own repository, checked out read-only to READ its struct definitions.
      # Permitted by global ruling GR6: Global Constraint 14 forbids Logweir PUBLISHING
      # under the osodevops/ namespace, not referencing upstream's published source.
      - uses: actions/checkout@v4
        with:
          repository: osodevops/kafka-backup
          ref: ${{ env.UPSTREAM_TAG }}
          path: upstream/kafka-backup
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask sync-upstream --tag "$UPSTREAM_TAG" --upstream upstream/kafka-backup
