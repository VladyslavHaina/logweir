name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: pure-layer linkage guard (Global Constraint 2)
        run: ./scripts/check-no-oso.sh
      - name: schema drift
        run: |
          cargo run -p logweir-core --example emit_schema > /tmp/schema.json
          diff -u schemas/logweir-drill-scorecard-1.0.0.json /tmp/schema.json
  python-verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography pytest
      - run: python3 -m pytest docs/test_verify_scorecard.py -q

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
