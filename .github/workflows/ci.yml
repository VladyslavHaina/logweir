name: ci
on:
  # The tracker and decision records under docs/to-do/ feed no build, test or
  # image; a change touching only them starts no run.
  push: { branches: [main], paths-ignore: ['docs/to-do/**'] }
  pull_request: { paths-ignore: ['docs/to-do/**'] }
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Other docs/ changes still run `check` (its contract tests read the docs),
  # but cannot change what `e2e` measures or what `publish` ships, so those two
  # run only when something outside docs/ changed (scripts/ci-changes.sh).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-changes.sh "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Docker Hub rate-limits anonymous pulls per IP; GitHub's shared runners
      # exhaust it (PR #13's check and e2e failed `toomanyrequests`). The
      # daemon pulls Docker Hub images through Google's public mirror first and
      # falls back to Docker Hub on a miss. No credential reaches this job.
      - name: Pull Docker Hub images through a mirror
        run: |
          sudo mkdir -p /etc/docker
          if [ -s /etc/docker/daemon.json ]; then cur="$(sudo cat /etc/docker/daemon.json)"; else cur='{}'; fi
          echo "$cur" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: taiki-e/install-action@v2
        with: { tool: 'just,cargo-deny@0.20.2' }
      - uses: azure/setup-helm@v4
        with: { version: v4.0.1 }
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-dev libsasl2-dev libssl-dev zlib1g-dev libcurl4-openssl-dev
      - run: pip install cryptography pytest
      - run: bash scripts/ci-check.sh
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # 50, not 35: PROD-00.2 compiles the engine from the vendored source in
    # this job (one release build of its own workspace, about 8 minutes cold).
    timeout-minutes: 50
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      # PROD-01.3's `auth_modes` rows need the `auth` profile's `kafka-auth`
      # listeners (SASL_SSL/PLAIN, SCRAM-SHA-256, mTLS). `just e2e-up` starts
      # every profile COMPOSE_PROFILES names; without it those rows fail.
      COMPOSE_PROFILES: auth
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Docker Hub rate-limits anonymous pulls per IP; GitHub's shared runners
      # exhaust it (PR #13's check and e2e failed `toomanyrequests`). The
      # daemon pulls Docker Hub images through Google's public mirror first and
      # falls back to Docker Hub on a miss. No credential reaches this job.
      - name: Pull Docker Hub images through a mirror
        run: |
          sudo mkdir -p /etc/docker
          if [ -s /etc/docker/daemon.json ]; then cur="$(sudo cat /etc/docker/daemon.json)"; else cur='{}'; fi
          echo "$cur" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - name: free disk space (MinIO refuses writes below its free-space floor)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-dev libsasl2-dev libssl-dev zlib1g-dev libcurl4-openssl-dev
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: pip install cryptography
      - run: cargo fetch --locked
      - name: Extract the pinned engine
        run: ./scripts/extract-engine.sh
      # WHAT SHIPS IS WHAT THIS JOB TESTS (PROD-00.2). The extraction above
      # pins OSO's release, which the compose stack's `kafka-backup` service
      # uses to seed the drill archive. Every engine run by `logweir` below is
      # LOGWEIR'S BUILD, the one the runner image carries: the vendored
      # tarball, verified, plus the patch folder, compiled natively over
      # `.engine/kafka-backup`. It prints the build env's ENGINE_VERSION
      # (third_party/kafka-backup-build.env), which PROD-01.1's CONTRACT_ENGINE
      # must equal (crates/logweir/tests/engine_pin.rs), so the record-semantics
      # contract is asserted on the shipped engine on every run.
      - name: Build Logweir's engine from the vendored source
        run: bash scripts/engine-source.sh build
      - run: just e2e-up
      - run: ./scripts/e2e-seed.sh
      - run: cargo build --locked -p logweir
      - run: cargo test --locked -p e2e --features e2e -- --test-threads=1 --skip a_pod_really_reaches_the_k8s_listener
      - name: Kafka adapter and production timeout integration tests
        run: |
          cargo test --locked -p logweir-kafka --features e2e --test live -- --test-threads=1
          cargo test --locked -p logweir --features e2e --lib check_storage_skips_a_genuinely_unreachable_endpoint
          cargo test --locked -p logweir --features e2e --test doctor check_7_an_unreachable_target_is_named_as_a_target_problem
          cargo test --locked -p logweir --features e2e --test notify the_production_agent_gives_up_on_a_sink_that_never_replies
      - if: always()
        run: docker compose -f e2e/compose/docker-compose.yml logs --no-color > /tmp/compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: /tmp/compose.log }
      - if: always()
        run: docker compose -f e2e/compose/docker-compose.yml --profile setup --profile tools down -v --remove-orphans

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    # images.yml's `sign` job signs keylessly (PROD-00.2): a reusable
    # workflow's jobs get no more than this job grants.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/images.yml
    with:
      tag: sha-${{ github.sha }}
      promote_latest: true
    secrets: inherit
