name: helm-demo
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: free disk space (MinIO refuses writes below its free-space floor)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: the Dockerfile's packages (the runner compiles the same crates the image does)
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-dev libsasl2-dev libssl-dev zlib1g-dev libcurl4-openssl-dev
      - uses: taiki-e/install-action@v2
        with: { tool: just@1.58.0 }
      - name: kind, install only (the cluster is created by a step of this job)
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.30.0
      - uses: azure/setup-helm@v4
        with:
          version: v4.0.1
      - name: cryptography (the auditor's reader is a real second implementation)
        run: python3 -m pip install cryptography
      - name: Extract the pinned engine
        run: ./scripts/extract-engine.sh
      - name: The demo binary (step 7 mints the approval with the shipped CLI)
        run: cargo build -p logweir
      - name: just image (the runner image; amd64, Global Constraint 10)
        run: just image
      - name: just image-ui (the page's image — the chart no longer carries the files)
        env:
          LOGWEIR_IMAGE_PLATFORM: linux/amd64
        run: just image-ui
      - name: just image-weirkeeper (the controller image, built NATIVELY for this runner)
        env:
          LOGWEIR_IMAGE_PLATFORM: linux/amd64
        run: just image-weirkeeper
      - name: kind create cluster
        run: kind create cluster --name logweir --config e2e/k8s/kind-config.yaml
      - name: kind load the three author-only tags
        run: kind load docker-image logweir:check weirkeeper:check logweir-ui:check --name logweir
      - name: helm install (author-only images; NOT evidence for §16 clause 1)
        run: helm install logweir charts/logweir -n logweir-system --create-namespace --kube-context kind-logweir -f charts/logweir/examples/author-only.values.yaml --set demoKafka.enabled=true --set minio.enabled=true --set ui.enabled=true --wait --timeout 10m
      - name: "The walk — scripts/helm-demo.sh, every step, on the kind cluster the job created"
        env:
          LOGWEIR_KUBE_CONTEXT: kind-logweir
        run: bash scripts/helm-demo.sh
      - name: collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          set +e
          kubectl --context kind-logweir get all -A -o yaml > diagnostics/cluster.yaml 2>&1
          echo "rc=$? (kubectl get all -A -o yaml)"
          kubectl --context kind-logweir -n logweir-system logs deploy/weirkeeper --tail=2000 > diagnostics/weirkeeper.log 2>&1
          echo "rc=$? (kubectl logs deploy/weirkeeper)"
          kubectl --context kind-logweir get events -A --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1
          echo "rc=$? (kubectl get events -A)"
          helm --kube-context kind-logweir -n logweir-system status logweir > diagnostics/helm-status.txt 2>&1
          echo "rc=$? (helm status logweir)"
          for ns in logweir-system logweir-helm; do
            for pod in $(kubectl --context kind-logweir -n "$ns" get pods -o name 2>/dev/null); do
              name="${pod#pod/}"
              kubectl --context kind-logweir -n "$ns" logs "$pod" --all-containers --tail=2000 \
                > "diagnostics/$ns-$name.log" 2>&1
              echo "rc=$? (logs $ns/$name)"
              kubectl --context kind-logweir -n "$ns" logs "$pod" --all-containers --previous --tail=2000 \
                > "diagnostics/$ns-$name.previous.log" 2>&1
              echo "rc=$? (logs $ns/$name --previous)"
              kubectl --context kind-logweir -n "$ns" describe "$pod" \
                > "diagnostics/$ns-$name.describe.txt" 2>&1
              echo "rc=$? (describe $ns/$name)"
              echo "--- $ns/$name (last 40 lines, current then previous) ---"
              tail -40 "diagnostics/$ns-$name.log"
              tail -40 "diagnostics/$ns-$name.previous.log"
            done
          done
          cp -r .demo/helm diagnostics/walk 2>/dev/null
          rm -f diagnostics/walk/*.pem
          echo "rc=$? (the walk's own logs, keys removed)"
          set -e
          exit 0
      - name: upload the cluster state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-demo-cluster
          path: |
            diagnostics/cluster.yaml
            diagnostics/events.txt
            diagnostics/helm-status.txt
            diagnostics/*.describe.txt
      - name: upload the controller logs and the walk's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-demo-logs
          path: diagnostics/
      - name: kind delete cluster
        if: always()
        run: kind delete cluster --name logweir
