name: release
# Builds the v0.1.0 release artifacts on a `v*` tag.
#
# NOT YET EXECUTED. This workflow has never run: there is no GitHub remote
# configured for this repository at the time of the v0.1.0 tag, so the release
# DoD line "release.yml produced binaries and a debian:bookworm-slim image" is
# recorded as UNVERIFIED rather than ticked. Whoever first pushes this repo
# should run it via `workflow_dispatch` before announcing the tag.
#
# Three triples, from `[workspace.metadata.dist]` in the root Cargo.toml — the
# only place cargo-dist reads them from:
#   x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, aarch64-apple-darwin
#
# THE BINARIES CARRY NO ENGINE (Global Constraint 10). The engine is dynamically
# linked against glibc >= 2.36 and ships in the debian:bookworm-slim image only.
# A standalone binary (a release tarball, or `cargo install --path`) needs
# `kafka-backup` of the pinned digest on $PATH, plus LOGWEIR_ENGINE_VERSION and
# LOGWEIR_ENGINE_DIGEST. Logweir is NOT on crates.io at v0.1.0 — the workspace's
# path dependencies carry no versions, so `cargo publish` refuses.
#
# The musl target is ATTEMPTED and never blocks the release (ADR 0004: rdkafka
# vendors and compiles librdkafka from C). It is deliberately NOT in
# `[workspace.metadata.dist].targets`, because a triple listed there is a
# hard-failing build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-dist@0.28.0 }
      - id: plan
        run: |
          cargo dist plan --output-format=json > dist-manifest.json
          echo "manifest<<EOF" >> "$GITHUB_OUTPUT"
          cat dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: dist-manifest, path: dist-manifest.json }

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - name: cmake (rdkafka vendors and builds librdkafka from C)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: cmake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-dist@0.28.0 }
      - run: cargo dist build --target=${{ matrix.target }} --output-format=json > dist.json
      - name: The binary must carry no engine
        # Global Constraint 10, asserted rather than assumed. If a future change
        # ever embeds the engine, this fails the release rather than shipping a
        # binary whose provenance story is wrong.
        run: |
          bin=$(find target -name logweir -type f -perm -u+x | head -1)
          [ -n "$bin" ] || { echo "no logweir binary was produced" >&2; exit 1; }
          if strings "$bin" | grep -q 'kafka-backup-core'; then
            echo "the released binary references kafka-backup-core" >&2; exit 1
          fi
          echo "ok: $bin ($(du -h "$bin" | cut -f1))"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: target/distrib/*

  # ATTEMPTED, never blocking. Step 6 and ADR 0004: if the vendored librdkafka
  # build does not cooperate, the release ships without musl and
  # docs/stability.md records the omission.
  musl:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with: { targets: x86_64-unknown-linux-musl }
      - run: sudo apt-get update && sudo apt-get install -y cmake musl-tools
      - run: cargo build --release -p logweir --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: binary-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/logweir
      - name: Record the outcome for docs/stability.md
        if: failure()
        run: |
          echo "::warning::the musl build failed; the release ships without it, as ADR 0004 allows." \
               " docs/stability.md must record this — do NOT block the release on it."

  image:
    runs-on: ubuntu-24.04
    # THE DIGEST OF THE BYTES THIS JOB ASSERTED. It is captured in the `push`
    # step and nowhere else, because that is the only step where a REPOSITORY
    # digest exists: the build below has no registry exporter, so its own
    # `outputs.digest` would be a local image config digest, not the digest a
    # `docker pull` resolves. `publish:` reads this for the release notes.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract the pinned engine
        # The image is the ONLY artifact that carries the engine, so the digest
        # pin and the MIT licence redistribution both matter here.
        run: ./scripts/extract-engine.sh
      - uses: docker/setup-buildx-action@v3
      # THE CHECKS RUN BEFORE THE PUSH, and that ordering is the point — and as
      # of T0-17 the image that is checked IS the image that is pushed. There
      # used to be two independent builds here: one local tag that every
      # assertion ran against, and a second `build-push-action` with
      # `push: true` whose bytes nothing had ever looked at. `logweir:check` was
      # never referenced again after the last assertion and its digest was never
      # captured, so the image an operator pulled had passed no check at all —
      # while this comment already claimed "only a verified image is pushed".
      # `crates/logweir/tests/workflow_lint.rs` is what keeps that from
      # returning; the shape below is machine-checked, the RUN is not (this
      # workflow has still never executed — see the header).
      - id: build
        name: Build the release image once, into the local daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          # linux/amd64 ONLY, and stated rather than defaulted: the engine layer
          # has no arm64 manifest (Global Constraint 10, Dockerfile:10-15).
          platforms: linux/amd64
          tags: logweir:check
      - name: The image must carry the engine, the licences and a working CLI
        # ONE implementation, TWO callers: `just smoke` on a laptop and this
        # job. `.engine/kafka-backup --version` inside the script is a flag, not
        # a subcommand — global ruling GR8, so Global Constraint 3 is untouched.
        #
        # A SINGLE COMMAND WHOSE EXIT CODE THE RUNNER READS DIRECTLY: no pipe,
        # no `|| true`, no `set +e`. The script's contract is exit 0 or 1.
        run: bash scripts/check-image.sh logweir:check
      - uses: docker/login-action@v3
        # TAG-GATED, like the push below. `on:` carries `workflow_dispatch`
        # (`:28`), so without this condition a dispatch from a branch logs in
        # with `packages: write` and the step after it publishes `:<branch>` —
        # and moves `:latest` — from a ref no tag ever named. The condition is
        # on BOTH steps because logging in without pushing is still an
        # unnecessary credential exchange, and because a future editor who
        # removes one of the two should fail a test rather than a release.
        # `workflow_lint_login_and_push_are_tag_gated` asserts both, in every
        # job.
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push the image that was just asserted, and capture its digest
        if: startsWith(github.ref, 'refs/tags/')
        # `shell: bash` is not decoration: the runner's default for `run:` on
        # Linux is `bash -e {0}` WITHOUT pipefail, and this shell is
        # `bash --noprofile --norc -eo pipefail {0}`.
        shell: bash
        # ghcr.io under the LITERAL `logweir/` namespace. Global Constraint 14:
        # Logweir never publishes under `osodevops/`, `kafkabackup.com` or
        # `oso.sh`. Pulling upstream's image to extract the engine is a
        # different act and is permitted (global ruling GR6).
        #
        # NOTHING IS REBUILT HERE. `docker tag` renames the bytes the step above
        # asserted; `docker push` uploads those exact bytes.
        run: |
          # THE LITERAL TARGET (Global Constraint 24), never
          # `github.repository`. That expression is `<owner>/<repo>`: it equals
          # the required string only when the repository is literally
          # `logweir/logweir`, and one repository can never produce the TWO
          # names this project publishes (`logweir`, the runner, here; and
          # `weirkeeper`, the controller, from the same job in Task 30b). The
          # shipped control plane names these same repositories —
          # `logweir.yaml`'s Deployment and `crates/weirkeeper/src/job.rs`'s
          # `RUNNER_IMAGE` — and
          # `workflow_lint_pushed_references_match_the_shipped_manifest`
          # asserts that what is pushed here is a subset of what ships there.
          ver="ghcr.io/logweir/logweir:${{ github.ref_name }}"
          latest="ghcr.io/logweir/logweir:latest"
          # `$ver` FIRST, `:latest` SECOND, and the ORDER IS THE POINT: a failed
          # `$ver` push must not leave `:latest` already moved onto bytes that
          # no immutable reference names. (The comment that stood here
          # instructed a "Task 10" to move these `:latest` lines into a separate
          # job; that stage-2 task never landed, so the instruction is retired
          # rather than left to mislead the next reader. If `:latest` ever does
          # move to its own job, this ordering constraint moves with it.)
          # `workflow_lint_version_tag_is_pushed_before_latest` asserts the two
          # line indices inside this block.
          docker tag logweir:check "$ver"
          docker push "$ver"
          docker tag logweir:check "$latest"
          docker push "$latest"
          # RepoDigests is populated by the push above. No pipe: the exit code
          # that matters is `docker inspect`'s, and `${rd##*@}` is shell
          # expansion, not a process.
          #
          # THE ENTRY IS SELECTED BY REPOSITORY, NOT BY POSITION, and that is a
          # correction made from a measurement rather than from taste. T0-17's
          # own fix text said `{{index .RepoDigests 0}}`; on a daemon backed by
          # the containerd image store (Docker Desktop 4.4x, and the runner
          # image once `containerd-snapshotter` is on) the same image carries
          # one RepoDigests entry PER repository name it has ever been tagged
          # with, and index 0 was MEASURED here to be `logweir@sha256:...` — the
          # throwaway local tag — not the ghcr one. Publishing "the digest of
          # `ghcr.io/<repo>`" from an entry that names a different repository is
          # the same class of mistake as asserting one image and pushing
          # another, even on the days the two digests happen to agree.
          rd=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ver")
          repo="${ver%:*}"
          digest=""
          for entry in $rd; do
            case "$entry" in
              "$repo"@sha256:*) digest="${entry##*@}" ;;
            esac
          done
          case "$digest" in
            sha256:*) ;;
            *) echo "no repository digest for $ver after push: '$rd'" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed $ver at $digest"

  publish:
    needs: [plan, build, image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          body: |
            The binaries in this release **carry no engine**: they need
            `kafka-backup` of the pinned digest on `$PATH`, plus
            `LOGWEIR_ENGINE_VERSION` and `LOGWEIR_ENGINE_DIGEST`. The container
            image carries both.

            Container image:
            `ghcr.io/logweir/logweir@${{ needs.image.outputs.digest }}`
            — this is the digest of the image the release job asserted
            (`scripts/check-image.sh`), pushed without rebuilding. Pull by
            digest, never by tag (Global Constraint 7).

            Apache Kafka® and Kafka® are registered trademarks of the Apache
            Software Foundation. Logweir is not affiliated with or endorsed by
            the ASF.
