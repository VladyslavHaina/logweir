name: release
# PROD-14.0. A PUSH OF A v<semver> TAG PUBLISHES; A DISPATCH IS A DRY RUN.
#
# Both run the same jobs through `assemble`: the test gate (ci.yml), the CLI
# archives on three native runners, the release drill against the packaged
# Linux binary, the resolution of the sha-<commit> publication the release
# ships, and the assembled, checksummed assets with a digest-pinned chart.
# `publish-images` and `github-release` are the only jobs that write anywhere
# but this run's artifacts, and their `if:` admits a tag push and nothing else.
# A dry run therefore writes workflow artifacts only — `dist-manifest`,
# `binary-<target>`, `release-drill-evidence`, `release-images`,
# `release-assets` — and no registry tag, chart, git tag, release or draft.
#
# The images are NOT rebuilt: a release ships main CI's `sha-<commit>`
# publication of its commit and gives those exact digests the version tag
# (scripts/release.sh, which says how the publication is chosen).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rehearsal_tag:
        description: "The v<semver> tag this dry run rehearses. It names the archives and the chart; nothing is tagged or published."
        required: true
        default: v0.2.0-rc.1
        type: string
      publication:
        description: "Optional: a main commit (40 hex) whose sha-<commit> images the dry run pins, when the dispatched commit has no publication of its own (a branch)."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide the tag, and whether this run may publish (a tag push only)
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DELETED: ${{ github.event.deleted }}
          REHEARSAL_TAG: ${{ inputs.rehearsal_tag }}
        run: |
          bash scripts/release.sh validate > release.env
          cat release.env
          cat release.env >> "$GITHUB_OUTPUT"

  tests:
    needs: [validate]
    uses: ./.github/workflows/ci.yml

  plan:
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-dist@0.28.0 }
      # --force-tag: the tag names the release; the workspace's Cargo version
      # (0.1.0) is what `logweir --version` prints and is not bumped here.
      - name: Plan exactly three archives of one app, the CLI
        run: |
          dist plan --tag "$RELEASE_TAG" --force-tag --output-format=json > dist-manifest.json
          jq -e --arg tag "$RELEASE_TAG" '
            .announcement_tag == $tag
            and ([.releases[].app_name] == ["logweir"])
            and (([.artifacts | to_entries[] | select(.value.kind == "executable-zip") | .key] | sort)
                 == ["logweir-aarch64-apple-darwin.tar.xz",
                     "logweir-aarch64-unknown-linux-gnu.tar.xz",
                     "logweir-x86_64-unknown-linux-gnu.tar.xz"])' dist-manifest.json
      - uses: actions/upload-artifact@v4
        with: { name: dist-manifest, path: dist-manifest.json }

  # THE CLI MATRIX, NATIVE ON EACH ARCHITECTURE. Every run for v0.1.1–v0.1.5
  # failed here, each at a different first failure (no `dist`; no `repository`
  # key; no `dist` profile; a table header that handed release.yml to dist;
  # then the engine check counting Logweir's own source citations). The build
  # and its checks are scripts/release-build.sh, so they run the same here and
  # on a workstation: Linux inside rust:1.89-bookworm, the runner image's
  # builder base, so the archive has the runner image's ABI; macOS on the
  # runner. No cross toolchain: librdkafka is compiled from C against the
  # target's OpenSSL, SASL and zlib, which a runner of that architecture has.
  build:
    name: build (${{ matrix.target }})
    needs: [validate, plan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and check the archive (Linux, in the runner image's builder base)
        if: runner.os == 'Linux'
        run: >-
          docker run --rm -e RELEASE_TAG -e CARGO_TERM_COLOR=always
          -v "$PWD:/src" -w /src rust:1.89-bookworm
          bash scripts/release-build.sh "$TARGET"
      - name: cmake (macOS; librdkafka is compiled from C)
        if: runner.os == 'macOS'
        run: command -v cmake || brew install cmake
      - name: Build and check the archive (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/release-build.sh "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            target/distrib/logweir-${{ matrix.target }}.tar.xz
            target/distrib/logweir-${{ matrix.target }}.tar.xz.sha256
            target/distrib/logweir-${{ matrix.target }}.linkage.txt
          if-no-files-found: error

  drill:
    needs: [build]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-drill.yml

  # THE PUBLICATION THIS RELEASE SHIPS, read anonymously: the four sha-<commit>
  # images of the release commit (or of its newest ancestor that differs only
  # under docs/), their digests, platforms and revision labels.
  images:
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NS: ${{ vars.DOCKERHUB_NAMESPACE || 'vladyslavhaina' }}
      COMMIT: ${{ github.sha }}
      PUBLICATION: ${{ inputs.publication }}
      PUBLISH: ${{ needs.validate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: docker/setup-buildx-action@v3
      - name: Resolve the sha-<commit> publication, anonymously
        run: bash scripts/release.sh resolve images.json
      - uses: actions/upload-artifact@v4
        with: { name: release-images, path: images.json, if-no-files-found: error }

  # Every asset, checked, with SHA256SUMS, release.json and the notes — and the
  # chart packaged ONCE, pinned by digest. The dry run ends here.
  assemble:
    needs: [validate, build, drill, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NS: ${{ vars.DOCKERHUB_NAMESPACE || 'vladyslavhaina' }}
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      COMMIT: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: v4.0.1 }
      - uses: actions/download-artifact@v4
        with: { pattern: binary-*, path: release-in, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: release-images, path: release-in }
      - name: Assemble and verify the release's assets
        run: |
          bash scripts/release.sh assemble release-in release/assets release/notes.md
          cat release/notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release/assets/
            release/notes.md
            release-in/images.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # PUBLICATION. Only a push of a v* tag reaches these two jobs; the owner
  # approves that push. Both wait for the test gate as well as the drill.
  # ---------------------------------------------------------------------------
  publish-images:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.publish == 'true'
    needs: [validate, tests, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Serialized with main's image promotion (images.yml): one writer at a time.
    concurrency:
      group: logweir-image-promotion
      cancel-in-progress: false
    env:
      NS: ${{ vars.DOCKERHUB_NAMESPACE || 'vladyslavhaina' }}
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    outputs:
      chart_digest: ${{ steps.chart.outputs.chart_digest }}
    # EVERY ACTION IN THIS JOB IS PINNED BY COMMIT (review L-7): the job holds
    # the Docker Hub token — login-action receives it, setup-buildx-action's
    # post step runs while it is on disk, and the Helm setup-helm installs is
    # handed it. Each comment names the release tag that commit carried when
    # pinned (resolved 2026-10-05); move a pin by resolving the new tag's
    # commit and changing both.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-assets, path: release-assets }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Give the publication's own digests the version tag
        run: bash scripts/release.sh promote release-assets/release-in/images.json
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: v4.0.1 }
      - name: Publish the chart package the release lists, as those bytes
        id: chart
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/ci-images.sh chart-push "release-assets/release/assets/logweir-chart-$VERSION.tgz"

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.validate.outputs.publish == 'true'
    needs: [validate, tests, assemble, publish-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate.outputs.tag }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      CHART_DIGEST: ${{ needs.publish-images.outputs.chart_digest }}
    # Pinned by commit like publish-images': this job holds `contents: write`.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: release-assets, path: release-assets }
      - name: Create the GitHub Release from the verified assets (a re-run verifies the one it finds)
        run: |
          set -euo pipefail
          assets=release-assets/release/assets
          notes=release-assets/release/notes.md
          bash scripts/release.sh verify "$assets"
          if [ -n "$CHART_DIGEST" ]; then
            printf '\nThe chart, as an anonymous helm pull reports it: OCI manifest %s.\n' "$CHART_DIGEST" >> "$notes"
          fi
          # "No release yet" only when GitHub SAYS so: `release not found` is
          # gh's answer for a tag without a release (measured 2026-10-05). Any
          # other failure is refused, never taken for an absent release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2> "$RUNNER_TEMP/view.err"; then
            echo "$TAG already has a GitHub Release; it is verified below, not recreated"
          elif grep -qxF 'release not found' "$RUNNER_TEMP/view.err"; then
            flags=(--verify-tag --title "Logweir $TAG" --notes-file "$notes")
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" "$assets"/*
          else
            cat "$RUNNER_TEMP/view.err" >&2
            echo "could not tell whether $TAG has a GitHub Release; nothing created" >&2
            exit 1
          fi
      - name: Download the published release and verify every asset
        run: |
          set -euo pipefail
          mkdir downloaded
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          bash scripts/release.sh verify downloaded
          for asset in release-assets/release/assets/*; do cmp "$asset" "downloaded/${asset##*/}"; done
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName --jq '"\(.isDraft) \(.isPrerelease) \(.tagName)"')
          [ "$state" = "false $PRERELEASE $TAG" ] || { echo "the release reads '$state'" >&2; exit 1; }
          echo "$TAG: $(wc -l < downloaded/SHA256SUMS | tr -d ' ') assets and SHA256SUMS, all verified" >> "$GITHUB_STEP_SUMMARY"
