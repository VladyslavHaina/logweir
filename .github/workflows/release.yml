name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Require a version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/v*) ;;
            *) echo "Run releases from a v* tag, not a branch." >&2; exit 1 ;;
          esac

  tests:
    needs: [validate-tag]
    uses: ./.github/workflows/ci.yml

  plan:
    needs: [validate-tag]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-dist@0.28.0 }
      # Release metadata follows the tag; --force-tag permits independent Cargo versions.
      - name: Plan artifacts using the requested release version
        run: |
          dist plan --tag "$RELEASE_TAG" --force-tag --output-format=json > dist-manifest.json
          test "$(jq -r .announcement_tag dist-manifest.json)" = "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with: { name: dist-manifest, path: dist-manifest.json }

  build:
    needs: [plan, tests]
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - name: cmake (rdkafka vendors and builds librdkafka from C)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-dev libsasl2-dev libssl-dev zlib1g-dev libcurl4-openssl-dev
      - name: cmake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-dist@0.28.0 }
      - run: dist build --tag "$RELEASE_TAG" --force-tag --target=${{ matrix.target }} --output-format=json > dist.json
      - name: The shipped binary carries no engine
        run: bash scripts/check-no-engine-in-binary.sh "target/distrib/logweir-${{ matrix.target }}.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            target/distrib/*.tar.xz*
            target/distrib/*.tar.gz*
          if-no-files-found: error

  drill:
    needs: [build]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-drill.yml

  images:
    needs: [tests, drill]
    uses: ./.github/workflows/images.yml
    with:
      tag: ${{ github.ref_name }}
      promote_latest: false
    secrets: inherit

  publish:
    needs: [plan, build, drill, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      NS: ${{ vars.DOCKERHUB_NAMESPACE || 'vladyslavhaina' }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: dist-manifest
          path: artifacts
      - name: Assemble the install bundle and independent verifier
        run: |
          tar -czf "artifacts/logweir-$RELEASE_TAG-install.tar.gz" \
            --exclude='ui/tests' \
            logweir.yaml LICENSE NOTICE THIRD_PARTY_NOTICES.md \
            docs/verify_scorecard.py ui
          cd artifacts
          sha256sum "logweir-$RELEASE_TAG-install.tar.gz" > "logweir-$RELEASE_TAG-install.tar.gz.sha256"
          sha256sum ./*.tar.xz ./*.tar.gz > sha256.sum
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: artifacts/**
          generate_release_notes: true
          body: |
            Standalone binaries require the pinned `kafka-backup` engine on
            `$PATH`, plus `LOGWEIR_ENGINE_VERSION` and `LOGWEIR_ENGINE_DIGEST`.
            The Linux amd64 archive passed a backup/restore drill before publication.

            Tested container images:

            - runner: `docker.io/${{ env.NS }}/logweir@${{ needs.images.outputs.runner_digest }}` (linux/amd64)
            - controller: `docker.io/${{ env.NS }}/weirkeeper@${{ needs.images.outputs.controller_digest }}` (linux/amd64 and linux/arm64)
            - UI: `docker.io/${{ env.NS }}/logweir-ui@${{ needs.images.outputs.ui_digest }}` (linux/amd64 and linux/arm64)
            - console: `docker.io/${{ env.NS }}/logweir-console@${{ needs.images.outputs.console_digest }}` (linux/amd64 and linux/arm64)

            The install bundle includes the Kubernetes manifest, static UI,
            licenses, notices and `docs/verify_scorecard.py`, the independent
            scorecard verifier. UI tests are excluded.

            Apache Kafka® and Kafka® are registered trademarks of the Apache
            Software Foundation. Logweir is not affiliated with or endorsed by
            the ASF.
