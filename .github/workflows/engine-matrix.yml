name: engine-matrix
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: engine-matrix-${{ github.ref }}
  cancel-in-progress: false

# The rows are DECLARED, not discovered, and each one states the outcome it is
# expected to record. A job is green exactly when the outcome it recorded
# equals `expect`; a row that records anything else turns red and says what it
# got. The outcome is derived from what every step did
# (scripts/engine-matrix-outcome.sh). A row below the 0.21.0 full-drill floor
# (docs/support-matrix.md) records `unsupported(lever-absent)`, never a fault,
# only when Logweir is seen refusing that engine in the reduced row and the
# control; an engine a drill accepted records `fail(floor-not-enforced)`.
#
# `kafka` is the broker the row declares and asks the compose stack for,
# through `KAFKA_VERSION` (e2e/compose/docker-compose.yml; PROD-01.5 owns the
# broker lines). The row records the version the running broker logged, and
# fails when it differs. The pinned engine is also run on the newest supported
# Apache Kafka line, because the engine sends fixed protocol versions and never
# negotiates (kafka-backup-core `kafka/client.rs:625-648` at v0.23.3).
#
# The window is the newest four engine minors plus every version an OSO
# operator still defaults to: v0.19.1 (strimzi-backup-operator v0.2.22-v0.2.25)
# and v0.19.2 (kafka-backup-operator 1.3.0 links kafka-backup-core 0.19.2).
# Since PROD-00.3f the pin is v0.23.3, so it holds the two full rows (default
# broker and newest broker); v0.21.0 keeps its default-broker row as the
# full-drill floor and the previous pin, and its 4.3.1 row retired: the fixed
# protocol versions that row watched are byte-identical in v0.23.3, whose own
# 4.3.1 row now carries the tripwire. v0.22.0 is what strimzi-backup-operator
# v0.3.0-v0.4.0 default to. docs/to-do/decisions/PROD-00-engine-route.md
# (sections 5 and 12) records the evidence.
jobs:
  matrix:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      KAFKA_VERSION: ${{ matrix.kafka }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: v0.23.3, kafka: 3.7.1, floor: full, expect: "pass" }
          - { tag: v0.23.3, kafka: 4.3.1, floor: full, expect: "pass" }
          - { tag: v0.22.0, kafka: 3.7.1, floor: full, expect: "pass" }
          - { tag: v0.21.0, kafka: 3.7.1, floor: full, expect: "pass" }
          - { tag: v0.20.0, kafka: 3.7.1, floor: below, expect: "unsupported(lever-absent)" }
          - { tag: v0.19.2, kafka: 3.7.1, floor: below, expect: "unsupported(lever-absent)" }
          - { tag: v0.19.1, kafka: 3.7.1, floor: below, expect: "unsupported(lever-absent)" }
    steps:
      - uses: actions/checkout@v4
      - name: free disk space (MinIO refuses writes below its free-space floor)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-dev libsasl2-dev libssl-dev zlib1g-dev libcurl4-openssl-dev
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: pip install cryptography
      - run: cargo fetch --locked

      # Docker Hub tags are mutable. The row records the digest it ran, and the
      # image's revision label must name the commit the upstream tag points at
      # (the same digest-to-commit binding scripts/extract-engine.sh asserts
      # for the pin).
      - name: Resolve this tag to an immutable digest and check its provenance
        id: pin
        env:
          TAG: ${{ matrix.tag }}
        run: |
          docker pull --platform linux/amd64 "osodevops/kafka-backup:$TAG"
          d=$(docker inspect --format='{{index .RepoDigests 0}}' "osodevops/kafka-backup:$TAG" | cut -d@ -f2)
          [ -n "$d" ] || { echo "could not resolve a digest for $TAG" >&2; exit 1; }
          rev=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "osodevops/kafka-backup:$TAG")
          want=$(git ls-remote --tags https://github.com/osodevops/kafka-backup \
                   | awk -v t="refs/tags/$TAG" '$2 == t || $2 == t "^{}" { sha = $1 } END { print sha }')
          [ -n "$want" ] || { echo "upstream has no tag $TAG" >&2; exit 1; }
          [ "$rev" = "$want" ] || { echo "$TAG: image revision $rev is not the tag's commit $want" >&2; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "$TAG -> $d (revision $rev)"

      - name: Extract this engine and point the stack at it (this worktree only)
        env:
          DIGEST: ${{ steps.pin.outputs.digest }}
        run: |
          mkdir -p .engine
          cid=$(docker create --platform linux/amd64 "osodevops/kafka-backup@$DIGEST")
          docker cp "$cid:/usr/local/bin/kafka-backup" .engine/kafka-backup
          docker rm "$cid" >/dev/null
          chmod +x .engine/kafka-backup
          .engine/kafka-backup --version
          # `.env` names this row's engine and nothing else. The row's broker
          # is the job's KAFKA_VERSION, which compose takes over `.env`. The
          # full drill renders the stack with every stack variable removed
          # and expects the compose file's own default broker
          # (e2e/tests/stack_params.rs, PROD-01.5), so `.env` must not pin it.
          printf 'OSO_DIGEST=%s\n' "$DIGEST" > e2e/compose/.env
          echo "$DIGEST" > third_party/kafka-backup-binary.digest

      # The CI e2e job's own setup (gate_lint `ci_uses_the_complete_compose_setup`
      # pins what `e2e-up` must contain, SCRAM credentials included).
      - name: Bring the stack up
        id: up
        run: just e2e-up

      # The row records the broker the stack actually ran, read back from the
      # container, not the one it declares; a difference fails the row.
      - name: Read back the broker the stack runs
        id: broker
        if: steps.up.outcome == 'success'
        continue-on-error: true
        run: |
          out=$(./scripts/engine-matrix-broker.sh)
          printf '%s\n' "$out"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"

      # The seed never refreshes the tracked fixtures here, and below the floor
      # it accepts segments without a sha256 (those engines write none) while
      # still checking the record count and every digest that is present.
      - name: Seed with this engine
        id: seed
        continue-on-error: true
        env:
          LOGWEIR_SEED_REFRESH_FIXTURES: "0"
          LOGWEIR_SEED_SEGMENT_SHA256: ${{ matrix.floor == 'full' && 'required' || 'optional' }}
        run: ./scripts/e2e-seed.sh

      - name: Build logweir
        id: build
        run: cargo build --locked -p logweir

      - name: Full drill (at or above the floor), exactly as the CI e2e job runs it
        id: full
        if: matrix.floor == 'full' && steps.seed.outcome == 'success'
        continue-on-error: true
        run: cargo test --locked -p e2e --features e2e -- --test-threads=1 --skip a_pod_really_reaches_the_k8s_listener

      # The reduced row and the control keep their transcripts: a below-floor
      # row is `unsupported(lever-absent)` only when both show Logweir's floor
      # refusal (scripts/engine-matrix-outcome.sh).
      - name: Reduced row set (below the floor)
        id: reduced
        if: matrix.floor == 'below' && steps.seed.outcome == 'success'
        continue-on-error: true
        env:
          CARGO_TEST_ARGS: --locked -p e2e --features e2e
        run: |
          mkdir -p matrix-logs
          rc=0
          ./scripts/run-named-tests.sh a_restore_into_an_empty_scratch_target_succeeds > matrix-logs/reduced.log 2>&1 || rc=$?
          cat matrix-logs/reduced.log
          exit "$rc"

      - name: Deleted-segment positive control
        id: control
        if: steps.seed.outcome == 'success'
        continue-on-error: true
        env:
          CARGO_TEST_ARGS: --locked -p e2e --features e2e
        run: |
          mkdir -p matrix-logs
          rc=0
          ./scripts/run-named-tests.sh a_corrupted_segment_yields_exit_2_and_a_signed_preflight_failed_scorecard > matrix-logs/control.log 2>&1 || rc=$?
          cat matrix-logs/control.log
          exit "$rc"

      # What the broker's time-retention check deleted while the row ran. A
      # fixture stamped older than the broker's retention (7 days, checked
      # every 5 minutes) loses its records if the check runs between its
      # produce and the engine's capture: run 36542777892's v0.22.0 row
      # (decision record 5.6). A failed suite's reason names it; the outcome
      # is unchanged.
      - name: Read back what the broker's time retention deleted
        id: retention
        if: always() && steps.up.outcome == 'success'
        continue-on-error: true
        run: |
          out=$(./scripts/engine-matrix-broker.sh --retention)
          printf '%s\n' "$out"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"

      # The outcome is derived from what every step did
      # (scripts/engine-matrix-outcome.sh; crates/logweir/tests/engine_matrix.rs
      # runs this step's own text over the step-outcome table).
      - name: Record this row
        id: record
        if: always()
        env:
          TAG: ${{ matrix.tag }}
          FLOOR: ${{ matrix.floor }}
          KAFKA_DECLARED: ${{ matrix.kafka }}
          DIGEST: ${{ steps.pin.outputs.digest }}
          UP: ${{ steps.up.outcome }}
          BROKER_IMAGE: ${{ steps.broker.outputs.image }}
          BROKER_IMAGE_ID: ${{ steps.broker.outputs.image_id }}
          BROKER_VERSION: ${{ steps.broker.outputs.version }}
          SEED: ${{ steps.seed.outcome }}
          BUILD: ${{ steps.build.outcome }}
          FULL: ${{ steps.full.outcome }}
          REDUCED: ${{ steps.reduced.outcome }}
          CONTROL: ${{ steps.control.outcome }}
          REDUCED_LOG: matrix-logs/reduced.log
          CONTROL_LOG: matrix-logs/control.log
          RETENTION_DELETIONS: ${{ steps.retention.outputs.retention_deletions }}
          RETENTION_TOPICS: ${{ steps.retention.outputs.retention_topics }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          result=$(./scripts/engine-matrix-outcome.sh)
          outcome=$(sed -n 's/^outcome=//p' <<<"$result")
          reason=$(sed -n 's/^reason=//p' <<<"$result")
          [ -n "$outcome" ] || { echo "the outcome script produced no outcome" >&2; exit 1; }
          broker="broker not read back"
          if [ -n "$BROKER_VERSION" ]; then
            broker="broker ${BROKER_IMAGE} (${BROKER_IMAGE_ID:0:19}) logged Kafka ${BROKER_VERSION}"
          fi
          mkdir -p matrix-rows
          row="matrix-rows/${TAG}-kafka-${KAFKA_DECLARED}.row"
          # shellcheck disable=SC2016
          printf '| %s | %s | `%s` | `%s` | %s; %s ([run](%s)) |\n' \
            "$TAG" "${BROKER_VERSION:-unmeasured}" "${DIGEST:-unresolved}" "$outcome" "$reason" "$broker" "$RUN_URL" \
            > "$row"
          cat "$row"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      # Not a hidden directory: upload-artifact@v4 skips hidden files by
      # default, which is why every earlier run uploaded `.matrix/` as nothing
      # and `publish` found no rows.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-row-${{ matrix.tag }}-kafka-${{ matrix.kafka }}
          path: matrix-rows/
          if-no-files-found: error

      - name: The recorded outcome must be the declared one
        if: always()
        env:
          TAG: ${{ matrix.tag }}
          GOT: ${{ steps.record.outputs.outcome }}
          WANT: ${{ matrix.expect }}
        run: |
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::$TAG on Kafka $KAFKA_VERSION recorded '$GOT', declared '$WANT'"
            exit 1
          fi
          echo "recorded '$GOT' as declared"

      - if: failure()
        run: docker compose -f e2e/compose/docker-compose.yml logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: "compose-logs-${{ matrix.tag }}-kafka-${{ matrix.kafka }}", path: compose.log }
      - if: always()
        run: just e2e-down

  # Renders every recorded row into the generated section of
  # docs/support-matrix.md and publishes the file as the `support-matrix`
  # artifact and in the run summary. Read-only: this repository does not let
  # GitHub Actions open pull requests (Settings -> Actions -> "Allow GitHub
  # Actions to create and approve pull requests" is off), so opening one is the
  # separate, opt-in `open-pr` job below.
  publish:
    timeout-minutes: 10
    needs: matrix
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: matrix-row-*, path: matrix-rows, merge-multiple: true }
      - name: Render the rows into the generated section of docs/support-matrix.md
        env:
          NOTE: "Generated by [engine-matrix run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on `${{ github.ref_name }}` at `${{ github.sha }}`."
        # --expect is the number of `include` rows above; a table missing a row
        # is refused rather than published (crates/logweir/tests/engine_matrix.rs
        # keeps the two in step).
        run: python3 scripts/engine-matrix-rows.py docs/support-matrix.md matrix-rows --expect 7 --note "$NOTE"
      - uses: actions/upload-artifact@v4
        with: { name: support-matrix, path: docs/support-matrix.md, if-no-files-found: error }
      - name: Summarise
        run: |
          {
            echo "## engine-matrix rows"
            echo
            echo "| Engine version | Kafka broker | Image digest | Outcome | Evidence |"
            echo "|---|---|---|---|---|"
            cat matrix-rows/*.row
          } >> "$GITHUB_STEP_SUMMARY"

  open-pr:
    timeout-minutes: 10
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.ENGINE_MATRIX_OPEN_PR == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: support-matrix, path: docs }
      - name: Open a PR if the matrix changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: refresh the engine support matrix"
          title: "docs: refresh the engine support matrix"
          branch: engine-matrix/refresh
          body: |
            Weekly `engine-matrix` run. Tags below the declared 0.21.0
            full-drill floor are reported `unsupported (lever-absent)` and are
            never a fault.

            Apache Kafka® and Kafka® are registered trademarks of the Apache
            Software Foundation. Logweir is not affiliated with or endorsed by
            the ASF.
