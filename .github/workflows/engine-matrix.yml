name: engine-matrix
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: engine-matrix-${{ github.ref }}
  cancel-in-progress: false

# The rows are DECLARED, not discovered, and each one states the outcome it is
# expected to record. A job is green exactly when the outcome it recorded
# equals `expect`; a row that records anything else turns red and says what it
# got. Rows below the 0.21.0 full-drill floor (docs/support-matrix.md) record
# `unsupported(lever-absent)`, which is never a fault, with what the reduced row
# and the positive control observed as evidence.
#
# `kafka` is the broker the compose stack runs, through `KAFKA_VERSION`
# (e2e/compose/docker-compose.yml, `apache/kafka:${KAFKA_VERSION}`; PROD-01.5
# owns the broker lines). The pinned engine is also run on the newest supported
# Apache Kafka line, because the engine sends fixed protocol versions and never
# negotiates (kafka-backup-core `kafka/client.rs:587-611`).
#
# The window is the newest four engine minors plus every version an OSO
# operator still defaults to: v0.19.1 (strimzi-backup-operator v0.2.25) and
# v0.19.2 (kafka-backup-operator 1.3.0 links kafka-backup-core 0.19.2).
# docs/to-do/decisions/PROD-00-engine-route.md records the evidence.
jobs:
  matrix:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      KAFKA_VERSION: ${{ matrix.kafka }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: v0.22.0, kafka: 3.7.1, floor: full, expect: "pass" }
          - { tag: v0.21.0, kafka: 3.7.1, floor: full, expect: "pass" }
          - { tag: v0.21.0, kafka: 4.3.1, floor: full, expect: "pass" }
          - { tag: v0.20.0, kafka: 3.7.1, floor: below, expect: "unsupported(lever-absent)" }
          - { tag: v0.19.2, kafka: 3.7.1, floor: below, expect: "unsupported(lever-absent)" }
          - { tag: v0.19.1, kafka: 3.7.1, floor: below, expect: "unsupported(lever-absent)" }
    steps:
      - uses: actions/checkout@v4
      - name: free disk space (MinIO refuses writes below its free-space floor)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-dev libsasl2-dev libssl-dev zlib1g-dev libcurl4-openssl-dev
      - uses: taiki-e/install-action@v2
        with: { tool: just }
      - run: pip install cryptography
      - run: cargo fetch --locked

      # Docker Hub tags are mutable. The row records the digest it ran, and the
      # image's revision label must name the commit the upstream tag points at
      # (the same digest-to-commit binding scripts/extract-engine.sh asserts
      # for the pin).
      - name: Resolve this tag to an immutable digest and check its provenance
        id: pin
        env:
          TAG: ${{ matrix.tag }}
        run: |
          docker pull --platform linux/amd64 "osodevops/kafka-backup:$TAG"
          d=$(docker inspect --format='{{index .RepoDigests 0}}' "osodevops/kafka-backup:$TAG" | cut -d@ -f2)
          [ -n "$d" ] || { echo "could not resolve a digest for $TAG" >&2; exit 1; }
          rev=$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "osodevops/kafka-backup:$TAG")
          want=$(git ls-remote --tags https://github.com/osodevops/kafka-backup \
                   | awk -v t="refs/tags/$TAG" '$2 == t || $2 == t "^{}" { sha = $1 } END { print sha }')
          [ -n "$want" ] || { echo "upstream has no tag $TAG" >&2; exit 1; }
          [ "$rev" = "$want" ] || { echo "$TAG: image revision $rev is not the tag's commit $want" >&2; exit 1; }
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "$TAG -> $d (revision $rev)"

      - name: Extract this engine and point the stack at it (this worktree only)
        env:
          DIGEST: ${{ steps.pin.outputs.digest }}
        run: |
          mkdir -p .engine
          cid=$(docker create --platform linux/amd64 "osodevops/kafka-backup@$DIGEST")
          docker cp "$cid:/usr/local/bin/kafka-backup" .engine/kafka-backup
          docker rm "$cid" >/dev/null
          chmod +x .engine/kafka-backup
          .engine/kafka-backup --version
          printf 'KAFKA_VERSION=%s\nOSO_DIGEST=%s\n' "$KAFKA_VERSION" "$DIGEST" > e2e/compose/.env
          echo "$DIGEST" > third_party/kafka-backup-binary.digest

      # The CI e2e job's own setup (gate_lint `ci_uses_the_complete_compose_setup`
      # pins what `e2e-up` must contain, SCRAM credentials included).
      - run: just e2e-up

      # The seed never refreshes the tracked fixtures here, and below the floor
      # it accepts segments without a sha256 (those engines write none) while
      # still checking the record count and every digest that is present.
      - name: Seed with this engine
        id: seed
        continue-on-error: true
        env:
          LOGWEIR_SEED_REFRESH_FIXTURES: "0"
          LOGWEIR_SEED_SEGMENT_SHA256: ${{ matrix.floor == 'full' && 'required' || 'optional' }}
        run: ./scripts/e2e-seed.sh

      - run: cargo build --locked -p logweir

      - name: Full drill (at or above the floor), exactly as the CI e2e job runs it
        id: full
        if: matrix.floor == 'full' && steps.seed.outcome == 'success'
        continue-on-error: true
        run: cargo test --locked -p e2e --features e2e -- --test-threads=1 --skip a_pod_really_reaches_the_k8s_listener

      - name: Reduced row set (below the floor)
        id: reduced
        if: matrix.floor == 'below' && steps.seed.outcome == 'success'
        continue-on-error: true
        env:
          CARGO_TEST_ARGS: --locked -p e2e --features e2e
        run: ./scripts/run-named-tests.sh a_restore_into_an_empty_scratch_target_succeeds

      - name: Deleted-segment positive control
        id: control
        if: steps.seed.outcome == 'success'
        continue-on-error: true
        env:
          CARGO_TEST_ARGS: --locked -p e2e --features e2e
        run: ./scripts/run-named-tests.sh a_corrupted_segment_yields_exit_2_and_a_signed_preflight_failed_scorecard

      - name: Record this row
        id: record
        if: always()
        env:
          TAG: ${{ matrix.tag }}
          FLOOR: ${{ matrix.floor }}
          DIGEST: ${{ steps.pin.outputs.digest }}
          SEED: ${{ steps.seed.outcome }}
          FULL: ${{ steps.full.outcome }}
          REDUCED: ${{ steps.reduced.outcome }}
          CONTROL: ${{ steps.control.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          if [ -z "$DIGEST" ]; then
            outcome="fail(setup)"
            reason="the tag did not resolve to a digest whose revision is the tag's commit"
          elif [ "$FLOOR" = "below" ]; then
            outcome="unsupported(lever-absent)"
            reason="below the 0.21.0 full-drill floor; seed ${SEED:-not run}, reduced row ${REDUCED:-not run}, deleted-segment control ${CONTROL:-not run}"
          elif [ "$SEED" != "success" ]; then
            outcome="fail(seed)"
            reason="the seed did not produce a verifiable archive with this engine (seed step: ${SEED:-not run})"
          elif [ "$CONTROL" != "success" ]; then
            outcome="fail(lever-not-honoured)"
            reason="the deleted-segment positive control did not block the restore at preflight"
          elif [ "$FULL" = "success" ]; then
            outcome="pass"
            reason="full e2e suite and the deleted-segment positive control passed"
          else
            outcome="fail(e2e suite)"
            reason="the full e2e suite failed; see the job log"
          fi
          mkdir -p matrix-rows
          # shellcheck disable=SC2016
          printf '| %s | %s | `%s` | `%s` | %s ([run](%s)) |\n' \
            "$TAG" "$KAFKA_VERSION" "${DIGEST:-unresolved}" "$outcome" "$reason" "$RUN_URL" \
            > "matrix-rows/${TAG}-kafka-${KAFKA_VERSION}.row"
          cat "matrix-rows/${TAG}-kafka-${KAFKA_VERSION}.row"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      # Not a hidden directory: upload-artifact@v4 skips hidden files by
      # default, which is why every earlier run uploaded `.matrix/` as nothing
      # and `publish` found no rows.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-row-${{ matrix.tag }}-kafka-${{ matrix.kafka }}
          path: matrix-rows/
          if-no-files-found: error

      - name: The recorded outcome must be the declared one
        if: always()
        env:
          TAG: ${{ matrix.tag }}
          GOT: ${{ steps.record.outputs.outcome }}
          WANT: ${{ matrix.expect }}
        run: |
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::$TAG on Kafka $KAFKA_VERSION recorded '$GOT', declared '$WANT'"
            exit 1
          fi
          echo "recorded '$GOT' as declared"

      - if: failure()
        run: docker compose -f e2e/compose/docker-compose.yml logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: "compose-logs-${{ matrix.tag }}-kafka-${{ matrix.kafka }}", path: compose.log }
      - if: always()
        run: just e2e-down

  # Renders every recorded row into the generated section of
  # docs/support-matrix.md and publishes the file as the `support-matrix`
  # artifact and in the run summary. Read-only: this repository does not let
  # GitHub Actions open pull requests (Settings -> Actions -> "Allow GitHub
  # Actions to create and approve pull requests" is off), so opening one is the
  # separate, opt-in `open-pr` job below.
  publish:
    timeout-minutes: 10
    needs: matrix
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: matrix-row-*, path: matrix-rows, merge-multiple: true }
      - name: Render the rows into the generated section of docs/support-matrix.md
        env:
          NOTE: "Generated by [engine-matrix run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on `${{ github.ref_name }}` at `${{ github.sha }}`."
        # --expect is the number of `include` rows above; a table missing a row
        # is refused rather than published (crates/logweir/tests/engine_matrix.rs
        # keeps the two in step).
        run: python3 scripts/engine-matrix-rows.py docs/support-matrix.md matrix-rows --expect 6 --note "$NOTE"
      - uses: actions/upload-artifact@v4
        with: { name: support-matrix, path: docs/support-matrix.md, if-no-files-found: error }
      - name: Summarise
        run: |
          {
            echo "## engine-matrix rows"
            echo
            echo "| Engine version | Kafka broker | Image digest | Outcome | Evidence |"
            echo "|---|---|---|---|---|"
            cat matrix-rows/*.row
          } >> "$GITHUB_STEP_SUMMARY"

  open-pr:
    timeout-minutes: 10
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.ENGINE_MATRIX_OPEN_PR == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: support-matrix, path: docs }
      - name: Open a PR if the matrix changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: refresh the engine support matrix"
          title: "docs: refresh the engine support matrix"
          branch: engine-matrix/refresh
          body: |
            Weekly `engine-matrix` run. Tags below the declared 0.21.0
            full-drill floor are reported `unsupported (lever-absent)` and are
            never a fault.

            Apache Kafka® and Kafka® are registered trademarks of the Apache
            Software Foundation. Logweir is not affiliated with or endorsed by
            the ASF.
