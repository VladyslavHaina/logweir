name: kind-demo
# **Demo 1, end to end, on a `kind` cluster this workflow creates.** Task 31.
#
# Spec §16 clause 2: *Demo 1 (§2) runs end-to-end in CI on a `kind` cluster
# created by the workflow, with the compose broker reached over the published
# `K8S` listener.* Global Constraint 17 permits it because `kind` on a
# GitHub-hosted runner costs nothing, and STANDING RULE 16 makes `kind` a
# CI-only cluster: it is created here, it is deleted here, and it never appears
# on a developer's machine except under a single proving run the controller
# authorises at dispatch.
#
# EXECUTED, AND GREEN — run 34700987743, commit a113dd2, 2026-09-12:
# https://github.com/VladyslavHaina/logweir/actions/runs/34700987743
#
# That run created a `kind` cluster from the pinned `e2e/k8s/kind-config.yaml`,
# brought the compose stack up, built both images natively on the amd64 runner,
# patched CoreDNS, probed the broker from inside the cluster (`reachable=true`),
# and then ran all twelve steps of `scripts/demo-steps.sh`: `Backup` reaching
# `phase: Succeeded`, X-UIWRITE (a) returning HTTP 201 through `kubectl proxy`,
# the approval minted with the shipped CLI, `Restore` reaching
# `phase: Succeeded` with `status.outcome: pass`, both readers over the
# scorecard, `PHASE C EXIT CRITERION MET`, and a clean teardown. It was red on
# its first eight runs — seven on environment facts a laptop had hidden, and the
# eighth on the demo's step 3 meeting the laptop's pins, which Task 33 fixed.
# `docs/tag1-checklist.md` clause 2 now reads `closed` and names that URL.
#
# IT TOOK THE AUTHOR-ONLY INSTALL BRANCH, AND THAT IS THE WHOLE LIMIT OF WHAT IT
# PROVES. Both images were built by that run and `kind load`ed onto the node;
# nothing was pulled from a registry. So this run is NOT evidence for clause 1
# (Global Constraint 37): the digest rows still read
# `blocked: images not published`, and what closes clause 1 is a pull of the
# published digests on a host that did not build them — one tagged run of
# `release.yml`, which has never run because no tag has been pushed. The
# PUBLISHED install branch below has therefore still never executed.
#
# The shape is held independently of the run: `crates/logweir/tests/workflow_lint.rs`
# parses this file; `scripts/kind-demo.sh`'s three pre-steps and the ORDER of the
# walk are proven dry with stubs (the order with tracers standing in for the step
# bodies), and step 1's preflight is proven dry BY EXECUTION under this driver —
# the real `scripts/demo-steps.sh`, no tracers
# (`laptop_demo_lint.rs::kind_demo_passes_its_first_step_on_its_own_context`).
# One locally authorised proving run is transcribed in `docs/kubernetes.md` §18
# and labelled as what it is.
#
# ===========================================================================
# THE ONE HARD PROBLEM, AND WHY THERE IS NO `extraPortMappings` HERE
# ===========================================================================
# The demo's broker is the compose stack on the runner HOST; the runner is a POD
# inside kind. A Kafka client is redirected by the broker's metadata response to
# the ADVERTISED listener, which STANDING RULE 15 fixes at
# `K8S://host.docker.internal:9095` and which only Task 7 may change. So
# computing an address and passing it as `--bootstrap` fixes the first packet and
# nothing after it, and `extraPortMappings` is host -> node, the other direction.
#
# `scripts/kind-demo.sh` resolves the NAME instead: it reads the kind network's
# gateway and adds a CoreDNS `hosts` block for `host.docker.internal` inside the
# cluster's own DNS. The bootstrap string then stays the literal
# `host.docker.internal:9095` in both demos, byte-identical to spec §2.
#
# ===========================================================================
# TWO INSTALL BRANCHES, AND THE STEP NAMES SAY WHICH ONE RAN
# ===========================================================================
# Global Constraint 37: a locally built or locally loaded image is AUTHOR-ONLY
# and never satisfies spec §16 clause 1, the `registry:2` fallback included. So
# a green run here does not, on its own, mean the shipped digests work for a
# stranger — it depends entirely on which branch installed.
#
#   * `install (author-only images; NOT evidence for §16 clause 1)` — the
#     default, and the only branch that can run today. `kind load
#     docker-image` puts the two locally built tags into the node and
#     `LOGWEIR_DEMO_PULL_POLICY=Never` keeps the kubelet from reaching for a
#     registry. This proves the code path and says nothing about publication.
#   * `install (published digests, pulled by the cluster)` — once a remote
#     exists and `release.yml` has pushed. No `kind load` at all: the cluster
#     PULLS `docker.io/vladyslavhaina/logweir@sha256:…`, and the `rollout status` that
#     follows is the assertion X-APPLY cannot make — a pod pulled the shipped
#     digest from a registry the author does not control and reached Ready.
#     Together with `release.yml`'s `pullback:` job that is what moves clause 1
#     off `blocked`.
#
# WHICH BRANCH RUNS is `env.LOGWEIR_INSTALL_PATH`, resolved in this order:
#   1. the `install_path` input of a `workflow_dispatch` run;
#   2. the repository variable `vars.LOGWEIR_INSTALL_PATH`, for scheduled and
#      `push` runs — set it to `published` once the digests are real;
#   3. `author-only`, the default, which is the state today.
# On the published branch, `vars.LOGWEIR_PUBLISHED_RUNNER_REF` carries the
# runner image reference the probe and the demo use — the full
# `docker.io/vladyslavhaina/logweir@sha256:…`, never a tag (Global Constraint 7).
#
# ===========================================================================
# BOTH BRANCHES HAND THE DEMO A REFERENCE THAT IS NOT THE DEFAULT, AND THAT IS
# WHAT MAKES STEP 3 HAND IT TO THE CONTROLLER (Task 33)
# ===========================================================================
# `weirkeeper::job::RUNNER_IMAGE` is a COMPILE-TIME digest and no manifest can
# patch it, so on a cluster that did not build the pins the controller would
# create Jobs naming an image that node has never held — which is what stopped
# the fourth run of this workflow at `rollout status deploy/weirkeeper`. The
# controller therefore honours `LOGWEIR_RUNNER_IMAGE` at run time, and step 3
# of `scripts/demo-steps.sh` sets it on the Deployment (with `kubectl set env`)
# whenever `LOGWEIR_DEMO_IMAGE_REF` is not the value that file defaults it to.
# Nothing below changes for that: the author-only branch already hands
# `logweir:check`, and the published branch hands
# `vars.LOGWEIR_PUBLISHED_RUNNER_REF` — also not the default, so the override
# carries the PUBLISHED digest into every Job, which is what that branch means.
# The controller image and its pull policy are put back to the overlay's only
# under the author-only policy (`Never`); the published branch keeps the
# controller image its cluster pulled.
# The shipped `logweir.yaml` is applied unedited on both
# (`scripts/render-install.sh --check`).
#
# ===========================================================================
# X-UIWRITE HAS TWO HALVES AND A RUNNER HAS NO BROWSER
# ===========================================================================
# Spec §10's gate is a `create` of a `Restore` FROM THE PAGE. `curl` is not the
# page. The demo's step 10 here performs the same-origin `POST` through
# `kubectl proxy` and asserts 201 — the mechanical half — and the step that runs
# the walk says so in its own name and cites `e2e/k8s/laptop-demo.md`, where the
# in-browser half is recorded (Task 28/28a, proven by `"manager": "logweir-ui"`
# in the created object's `managedFields`).
#
# ===========================================================================
# IMAGES ARE BUILT BY THE TWO NAMED PRODUCERS AND BY NOTHING ELSE
# ===========================================================================
# There is no `docker build` and no `docker buildx` line in this file.
# `just image` and `just image-weirkeeper` are the one place the local tags and
# their platforms are written (`justfile`), and
# `workflow_lint_kind_demo_builds_weirkeeper_for_the_runner_platform` refuses a
# second producer here.
#
# `just image-weirkeeper` builds `--platform "${LOGWEIR_IMAGE_PLATFORM:-linux/arm64}"`
# — arm64 by Global Constraint 10, because the development host is arm64 and
# every local gate inspects a loaded tag. A GitHub runner is amd64, where that
# build would be EMULATED, which STANDING RULE 10 forbids and
# `docs/stability.md` measures at 33x. So the step below sets
# `LOGWEIR_IMAGE_PLATFORM: linux/amd64` and the build is NATIVE.
#
# THE RUNNER IMAGE IS amd64-ONLY (Global Constraint 10: the engine binary is
# dynamically linked and has no arm64 manifest) and this runner host is amd64,
# so nothing here is emulated. The same demo on the arm64 development host runs
# the runner image under binfmt/Rosetta, and the two wall clocks are not
# comparable — a Job that takes minutes there says nothing about this job.
on:
  workflow_dispatch:
    inputs:
      install_path:
        description: "author-only (the default; locally built images) or published (pull the shipped digests)"
        type: choice
        options: [author-only, published]
        default: author-only
  push:
    branches: [main]

permissions:
  contents: read

env:
  LOGWEIR_INSTALL_PATH: ${{ inputs.install_path || vars.LOGWEIR_INSTALL_PATH || 'author-only' }}

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # FREE THE DISK FIRST. The runner image ships tens of gigabytes of toolchains
      # this job never touches (.NET, Android, GHC, Boost, CodeQL); with a debug
      # build of the workspace and the Docker images beside them MinIO reaches its
      # free-space floor and refuses every PUT (`XMinioStorageFull`, the sixth CI
      # run, 2026-09-12 — the same job had passed at the margin one run earlier).
      # `df` before and after is the record.
      - name: free disk space (MinIO refuses writes below its free-space floor)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: cmake (rdkafka vendors and builds librdkafka from C)
          # The Dockerfile's build-stage package list, verbatim: the runner compiles
        # the same crates the image does (sasl2-sys wants libsasl2, librdkafka's
        # cmake build wants curl's headers — both missing on a bare runner, both
        # found by the first two CI runs on 2026-09-12).
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-dev libsasl2-dev libssl-dev zlib1g-dev libcurl4-openssl-dev
      - uses: taiki-e/install-action@v2
        with: { tool: just@1.58.0 }
      - name: kind, install only (the cluster is created by a step of this job)
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.30.0
      # `crates/logweir/tests/two_reader_parity.rs` and the demo's own scorecard
      # verification both run `docs/verify_scorecard.py`, which imports
      # `cryptography` and PANICS rather than skipping without it.
      - name: cryptography (the auditor's reader is a real second implementation)
        run: python3 -m pip install cryptography
      - name: Extract the pinned engine
        run: ./scripts/extract-engine.sh
      # The compose stack, then the three one-shot setup services as FOREGROUND
      # commands whose exit codes the runner reads — `justfile`'s `e2e-up`,
      # command for command. `--wait` blocks on the healthchecks; the setup
      # services are `--profile setup` and must each exit 0 before a client
      # authenticates (STANDING RULE 15).
      - name: The five-listener compose stack, up and seeded
        run: |
          docker compose -f e2e/compose/docker-compose.yml up -d --wait
          docker compose -f e2e/compose/docker-compose.yml --profile setup run --rm minio-setup
          docker compose -f e2e/compose/docker-compose.yml --profile setup run --rm topic-setup
          docker compose -f e2e/compose/docker-compose.yml --profile setup run --rm scram-setup
      - name: The demo binary (step 11 mints the approval with the shipped CLI)
        run: cargo build -p logweir
      - name: just image (the runner image; amd64, Global Constraint 10)
        run: just image
      - name: just image-weirkeeper (the controller image, built NATIVELY for this runner)
        env:
          LOGWEIR_IMAGE_PLATFORM: linux/amd64
        run: just image-weirkeeper
      - name: kind create cluster
        run: kind create cluster --name logweir --config e2e/k8s/kind-config.yaml
      # ---------------------------------------------------------------------
      # THE INSTALL, ONE BRANCH OF TWO. The names are the record of which.
      # ---------------------------------------------------------------------
      # PLAN ERRATUM E19b, TRANSPOSED TO `kind`. The kubelet keys images on the
      # WHOLE reference, so `weirkeeper::job::RUNNER_IMAGE` —
      # `docker.io/vladyslavhaina/logweir@sha256:…`, a Rust constant kustomize cannot
      # reach — is `ErrImageNeverPull` on a node holding the same digest under
      # the local name. On the laptop one `docker tag` fixes it because the
      # daemon and the kubelet share an image store; a kind node has an image
      # store of its own, so the tag is made on the host and the TAGGED NAME is
      # loaded. `docker save` preserves the manifest digest (measured
      # 2026-09-11: the saved index carries `sha256:6440a4a0…`, the digest the
      # constant pins), so the reference resolves inside the node.
      #
      # `kind load` saves every name listed in ONE tarball and imports it once,
      # so naming the same bytes twice costs one transfer.
      - name: install (author-only images; NOT evidence for §16 clause 1)
        if: env.LOGWEIR_INSTALL_PATH != 'published'
        run: |
          docker tag logweir:check docker.io/vladyslavhaina/logweir:v0.1.0
          kind load docker-image logweir:check weirkeeper:check docker.io/vladyslavhaina/logweir:v0.1.0 --name logweir
          ./scripts/render-install.sh --check
          kubectl --context kind-logweir apply --server-side -k config/overlays/local-images
      - name: install (published digests, pulled by the cluster)
        if: env.LOGWEIR_INSTALL_PATH == 'published'
        run: |
          ./scripts/render-install.sh --check
          kubectl --context kind-logweir apply --server-side -f logweir.yaml
      # THE ASSERTION X-APPLY CANNOT MAKE: a pod pulled the shipped digest from
      # a registry the author does not control and reached Ready. Only on the
      # published branch, because only there is anything pulled.
      - name: rollout status (the pod pulled the published digest and is Ready)
        if: env.LOGWEIR_INSTALL_PATH == 'published'
        run: kubectl --context kind-logweir -n logweir-system rollout status deploy/weirkeeper --timeout=180s
      # ---------------------------------------------------------------------
      # THE WALK. `scripts/kind-demo.sh` reads the kind gateway, patches
      # CoreDNS, probes the advertised listener from a pod, and then runs the
      # twelve steps of `scripts/demo-steps.sh` — the same twelve
      # `scripts/laptop-demo.sh` runs.
      # ---------------------------------------------------------------------
      - name: "Demo 1, all twelve steps — X-UIWRITE (mechanical half only; the browser half is recorded on the laptop, see e2e/k8s/laptop-demo.md)"
        env:
          LOGWEIR_DEMO_NONINTERACTIVE: "1"
          LOGWEIR_DEMO_PULL_POLICY: ${{ env.LOGWEIR_INSTALL_PATH == 'published' && 'IfNotPresent' || 'Never' }}
          LOGWEIR_DEMO_IMAGE_REF: ${{ env.LOGWEIR_INSTALL_PATH == 'published' && vars.LOGWEIR_PUBLISHED_RUNNER_REF || 'logweir:check' }}
        run: bash scripts/kind-demo.sh
      # ---------------------------------------------------------------------
      # DIAGNOSTICS AND TEARDOWN, ALL `if: always()`. A failed run that deleted
      # its evidence has told you nothing you can act on.
      # ---------------------------------------------------------------------
      - name: collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          set +e
          docker compose -f e2e/compose/docker-compose.yml logs --no-color > diagnostics/compose.log 2>&1
          echo "rc=$? (docker compose logs)"
          kubectl --context kind-logweir get all -A -o yaml > diagnostics/cluster.yaml 2>&1
          echo "rc=$? (kubectl get all -A -o yaml)"
          kubectl --context kind-logweir -n logweir-system logs deploy/weirkeeper --tail=2000 > diagnostics/weirkeeper.log 2>&1
          echo "rc=$? (kubectl logs deploy/weirkeeper)"
          kubectl --context kind-logweir get events -A --sort-by=.lastTimestamp > diagnostics/events.txt 2>&1
          echo "rc=$? (kubectl get events -A)"
          set -e
          exit 0
      - name: upload the compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: kind-demo-compose-logs, path: diagnostics/compose.log }
      - name: upload the cluster state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kind-demo-cluster
          path: |
            diagnostics/cluster.yaml
            diagnostics/events.txt
      - name: upload the controller logs
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: kind-demo-weirkeeper-logs, path: diagnostics/weirkeeper.log }
      - name: kind delete cluster
        if: always()
        run: kind delete cluster --name logweir
      # The BOTH-PROFILES form. `down` only removes containers for services in
      # the ACTIVE profile set, so a plain `down -v` walks past any
      # `minio-setup` / `topic-setup` / `scram-setup` container an earlier `up`
      # left behind — `justfile`'s `e2e-down`, and its reason.
      - name: compose down -v (both profiles)
        if: always()
        run: docker compose -f e2e/compose/docker-compose.yml --profile setup --profile tools down -v --remove-orphans
