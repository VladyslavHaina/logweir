name: no-oso
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "0 6 * * 1" }]
permissions:
  contents: read
jobs:
  pure-layer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: pure crates build with no default features
        # THE PURE LAYER IS THESE FOUR CRATES — `logweir-verify` joined it when
        # Task 14 extracted it, and both this build list and the
        # forbidden-dependency loop below were extended in that same commit.
        # `logweir-store` is DELIBERATELY NOT HERE and its
        # absence is not an oversight: it takes `object_store` with Global
        # Constraint 9's ["aws","azure","gcp","http"] feature set, which pulls
        # `aws-*`, so it is outside the pure layer BY ADR — see
        # docs/adr/0008-mvp-constraint-amendments.md §E and Global Constraint 1,
        # which names `crates/weirkeeper` and `crates/logweir-store` as outside
        # "by ADR, never by a quiet edit to the grep". Widening the grep below
        # to admit it would be exactly that quiet edit. The asymmetry between
        # the two Task-13/Task-14 extractions is the whole point of ADR 0008 §E:
        # one lands outside the pure layer and one inside it.
        run: |
          cargo build -p logweir-core     --no-default-features
          cargo build -p logweir-evidence --no-default-features
          cargo build -p logweir-kafka    --no-default-features
          cargo build -p logweir-verify   --no-default-features
      - run: cargo build -p logweir-core -p logweir-evidence -p logweir-kafka -p logweir-verify --no-default-features
      - name: zero OSO / AWS / Kubernetes dependencies in the pure layer
        # The loop below IS extended to `logweir-verify` (Task 14) and is NOT
        # extended to `logweir-store`, and must not be:
        # `logweir-store` links `object_store` with the `aws` feature and would
        # fail this grep by construction. It is outside the pure layer by ADR
        # (docs/adr/0008-mvp-constraint-amendments.md §E; Global Constraint 1).
        run: |
          for c in logweir-core logweir-evidence logweir-kafka logweir-verify; do
            deps=$(cargo tree -p "$c" --no-default-features --prefix none --edges normal \
                   | grep -Ei '^(aws-|rusoto|kube|k8s-openapi|kafka-backup)' || true)
            if [ -n "$deps" ]; then
              echo "FAIL: $c pulls a forbidden dependency:"; echo "$deps"; exit 1
            fi
          done
      - run: ./scripts/check-no-oso.sh
      # Global Constraint 1, the OTHER pure-layer dimension. The job above
      # greps `cargo tree` for cloud/k8s/engine crates only; nothing checked
      # that `logweir-core` reads no clock and no entropy, and
      # `ids::new_run_id` called `ulid::Ulid::new()` — a `SystemTime::now()`
      # plus an OS-entropy read — through every review of the build.
      - run: ./scripts/check-pure-core.sh
  # Job 2 exists from SP4 onward and is EXEMPT from the zero-AWS assertion by
  # construction — that is the whole point of the optional `msk-iam` feature
  # (spec §6 C2). It is a no-op in v0.1 because the feature does not yet exist.
  msk-iam-feature:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: build with msk-iam when the feature exists
        run: |
          if cargo metadata --format-version 1 --no-deps \
             | grep -q '"msk-iam"'; then
            cargo build -p logweir-kafka --features msk-iam
          else
            echo "msk-iam feature not present in v0.1 — SP4 introduces it"
          fi
