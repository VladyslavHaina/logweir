# `Cargo.lock` carries six `cargo update -p <pkg> --precise <version>` pins
# below the newest resolvable version, none of them reflected in any
# `[dependencies]`/`[workspace.dependencies]` entry here (they are all
# TRANSITIVE):
#   indexmap  2.13.1
#   wasip2    1.0.0+wasi-0.2.4
#   base64ct  1.7.3
#   zeroize   1.8.2
#   clap      4.5.40
#   jobserver 0.1.34
# The first five predate Task 9 (see task-1-report.md in the SDD tracking
# directory for how each was found); `jobserver` was added by Task 9's own
# fix pass. All six were pinned against rustc 1.82.0 (this workspace's
# toolchain at the time): their newest-at-the-time releases either declared
# `edition = "2024"`, which 1.82.0 could not parse at all, or (`jobserver`
# 0.1.35) an explicit `rust-version = "1.85"` above the 1.82 floor.
#
# STATUS AS OF THE 1.89.0 MSRV BUMP (Task 12b, addendum ruling A5 — see
# below): **none of these six pins are load-bearing anymore.** Each was
# individually floated to its newest version and `cargo check --workspace`
# run against it, one at a time, then reverted; all six now build cleanly on
# 1.89.0 — the edition2024 and 1.85-floor reasons above have both evaporated
# at the current toolchain. They are left pinned here regardless: letting
# all six float at once is a separate lockfile-hygiene decision (re-verify
# each individually, update this comment, drop the ones that no longer need
# a precise pin) that no task has taken on, so `Cargo.lock` keeps the exact
# versions above until that cleanup happens. A bare `cargo update` must
# still never be run without that re-verification — it would float these
# (and everything else) in one uncontrolled step.
#
# Task 12b (addendum ruling A5) bumped the toolchain pin itself from 1.82.0
# to 1.89.0 — object_store 0.14's aws+azure+gcp+http dependency tree requires
# edition2024 (stable since 1.85) AND, once that resolved, `crc-fast` /
# `icu_*` / `idna_adapter` report an MSRV floor as high as 1.89. Global
# Constraint 9 fixes the object_store crate, version and feature set, so per
# A5 the toolchain is what yields, never object_store.
#
# If a new dependency drags in another edition2024 or MSRV-floor crate above
# whatever this workspace's toolchain is AT THE TIME, pin it the same way and
# add it to the list above, noting the toolchain version it was pinned
# against so a future MSRV bump can re-check it the same way this comment
# just did.
[workspace]
resolver = "2"
members = ["crates/*", "xtask", "e2e"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/logweir/logweir"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
insta = { version = "1", features = ["json", "yaml"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` backs serde_json::Map with an IndexMap, so an embedded
# serde_json::Value round-trips its keys in READ order. That is required by
# Task 3's engine_subreport handling and by det_json.rs's stated contract.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
ureq = { version = "2", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sha2 = "0.10"
thiserror = "1"
# Global Constraint 9: the same crate, version and feature set OSO uses, so a
# bucket OSO can read, we can read. Task 12b.
object_store = { version = "0.14", features = ["aws", "azure", "gcp", "http"] }
futures = "0.3"
# No "process": nothing here spawns via tokio — the engine runner is
# std::process (Task 12). "rt" + "time" + "net" is what object_store's HTTP
# clients need from the single reused current-thread runtime.
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
