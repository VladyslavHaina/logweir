# `Cargo.lock` carries deliberate `cargo update -p <pkg> --precise <version>`
# pins below the newest resolvable version, none of them reflected in any
# `[dependencies]`/`[workspace.dependencies]` entry here (they are all
# TRANSITIVE). All exist because this workspace's pinned toolchain
# (`rust-toolchain.toml`, CI's `dtolnay/rust-toolchain@1.82.0`) is rustc
# 1.82.0, which cannot parse Rust edition 2024 and enforces an MSRV floor on
# every crate it builds. A bare `cargo update` must never be run — it would
# float every one of these back to a version that will not build:
#   indexmap  2.13.1              (later releases move to edition2024)
#   wasip2    1.0.0+wasi-0.2.4    (later releases move to edition2024)
#   base64ct  1.7.3               (later releases move to edition2024)
#   zeroize   1.8.2               (later releases move to edition2024)
#   clap      4.5.40              (later releases move to edition2024)
#   jobserver 0.1.34              (0.1.35 declares rust-version = "1.85";
#                                  pulled in transitively by `cc`, via
#                                  `zstd-sys`'s build script, once Task 9
#                                  added `zstd` as a dependency)
# The first five predate Task 9 (see task-1-report.md in the SDD tracking
# directory for how each was found); `jobserver` was added by Task 9's own
# fix pass. If a new dependency drags in another edition2024 or MSRV-floor
# crate, pin it the same way and add it to this list.
[workspace]
resolver = "2"
members = ["crates/*", "xtask", "e2e"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/logweir/logweir"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
insta = { version = "1", features = ["json", "yaml"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` backs serde_json::Map with an IndexMap, so an embedded
# serde_json::Value round-trips its keys in READ order. That is required by
# Task 3's engine_subreport handling and by det_json.rs's stated contract.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
ureq = { version = "2", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sha2 = "0.10"
thiserror = "1"
