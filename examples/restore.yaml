# logweir RESTORE spec — the canonical restore plan document (interface I20).
#
# Run:
#   logweir restore run --spec restore.yaml --approval approval.json \
#     --approver-key approver.pem --allowed-clusters allowed-clusters.json \
#     --signing-key signer.pem
#
# `logweir drill run` is the tag-0 name for the same command and takes the same
# flags; it prints one deprecation line and does nothing else differently.
#
# THIS DOCUMENT HAS ONE GRAMMAR, and it is this one (spec §6.1 amendment 4):
# `logweir_core::spec::RestoreSpec`, which is what `--spec` deserialises with
# `serde_yaml::from_str`, what the `Restore` CRD's `spec.planBytes` carries, and
# what `docs/formats/` describes. `examples/drill.yaml` is the same grammar with
# `target.mode: scratch` — a drill IS a restore into a scratch cluster, which is
# why there is no separate `Drill` kind.
#
# THIS IS THE HOST-SIDE SHAPE. `logweir` and the engine both run on the HOST
# (the engine binary is `.engine/kafka-backup`, extracted by
# `scripts/extract-engine.sh`), so the compose SERVICE name for MinIO does not
# resolve here — only the published `localhost` port does. Both storage blocks
# below therefore name `http://localhost:9000`, exactly as
# `examples/drill.yaml` and `examples/backup.yaml` do, and
# `e2e/compose/config/backup-drill.yaml:6-13` writes the container-side lesson
# out in full: that file is loaded INSIDE the compose network, where the service
# name is the only one that works.
#
# Apache Kafka® and Kafka® are registered trademarks of the Apache Software
# Foundation. Logweir is not affiliated with or endorsed by the ASF.
source:
  storage:
    backend: s3
    bucket: kafka-backups
    # `scripts/e2e-seed.sh` backs up under `backup_id: drill-demo`
    # (e2e/compose/config/backup-drill.yaml), so this is the prefix the archive
    # actually lives at.
    prefix: drill-demo
    region: us-east-1
    endpoint: http://localhost:9000
    path_style: true
    allow_http: true
  backup: latestCompleted
  topics: [orders, payments]

target:
  bootstrap_servers: [localhost:9092]

  # THE MODE (interface I33). `newTopic` is what tag 1's flagship does: restore
  # a point in time into topics that DID NOT EXIST, on a real cluster, without
  # touching anything that was already there.
  #
  # It differs from `scratch` in exactly four ways, and each one is a check that
  # would be meaningless here (see `logweir_core::spec::TargetMode`):
  #   1. no marker topic is required — `logweir.scratch` on a production cluster
  #      would be a lie about that cluster's purpose;
  #   2. the target cluster need not be in `--allowed-clusters` — an allowlist of
  #      throwaway clusters cannot contain the one you are recovering into;
  #   3. the target cluster MAY be the source cluster — for a point-in-time
  #      recovery that is the normal case, not an error;
  #   4. phase 9 tears NOTHING down, at any value of `teardown` below — deleting
  #      the restored topic would delete the recovery.
  #
  # What replaces them is stronger than all four for the question that matters:
  # the run is REFUSED before anything happens (exit 3,
  # `refusal-reason=GuardRefused`) if any mapped target topic already exists,
  # because appending into a half-populated topic produces a restore that
  # reconciles against records it did not write.
  mode: newTopic

  # NO `topic_naming` BLOCK HERE, ON PURPOSE. Absent, the target topics are named
  # `restore-<YYYYmmddTHHMMSSZ>-<topic>` from `restore.point_in_time` below — so
  # with the recovery point set to 2026-09-07T14:05:00Z, `orders` is restored as
  #
  #     restore-20260907T140500Z-orders
  #
  # which says on the broker's own topic list both what the topic is and what
  # instant it was recovered to. Set `topic_naming.prefix` to override it:
  #
  #   topic_naming:
  #     prefix: "incident-4471-"
  #
  # The key is `topic_naming` in THIS document and `topicNaming` on the
  # `Restore` custom resource: the CRD follows Kubernetes' camelCase convention
  # and this grammar follows the snake_case one every other field here uses
  # (`topic_mapping_prefix`, `point_in_time`, `records_per_partition`). The
  # VALUES of `mode` are camelCase in both, because those are one closed set of
  # two strings shared by the CRD enum and the Rust `TargetMode`
  # (interface I33).
  #
  # The compact `YYYYmmddTHHMMSSZ` form is for KAFKA topic names only, which
  # permit it. Kubernetes object names use the DNS-1123 form instead.

  # UNREAD IN `newTopic` MODE, and still required. It is the SCRATCH prefix, and
  # it has no serde default because an empty prefix maps every source topic onto
  # ITSELF — on a scratch cluster that is a restore into the topic the archive
  # was taken from. A spec that omits it is refused before any phase runs, which
  # is the right refusal; carrying it here costs nothing and makes switching to
  # `mode: scratch` a one-line edit.
  topic_mapping_prefix: "drill-"

  # Also unread in `newTopic` mode (see difference 1 above); kept for the same
  # reason.
  marker_topic: logweir.scratch

  default_replication_factor: 1
  # Unread in `newTopic` mode (difference 4). Phase 9 deletes only what a
  # `mode: scratch` run created — Global Constraint 19.
  teardown: delete

restore:
  # THE RECOVERY POINT. A literal RFC 3339 instant, and the END of the window
  # this restore asks the engine for (inclusive: a record whose timestamp equals
  # it exactly is restored).
  #
  # There is deliberately no `window_start` here and there never will be. The
  # window's START is the ARCHIVE's earliest covered timestamp over the topics
  # this restore names, read out of the manifest — guard **G-WIN**. A
  # spec-supplied floor is what that guard exists to refuse: a restore that
  # inherits a later start silently loses everything before it while phase 7
  # reconciles only the sampled records and the scorecard says pass.
  #
  # CHANGE THIS. A recovery point at or before the archive's floor is refused,
  # exit 3, naming both integers — the window would hold no instant.
  point_in_time: "2026-09-07T14:05:00Z"

sample:
  # THESE TWO DATES ARE ILLUSTRATIVE AND YOU MUST CHANGE THEM. They name the
  # window this restore SAMPLES for per-record reconciliation, so they are
  # specific to your archive, not to Logweir. A window that overlaps no segment
  # in the archive is REFUSED — the alternative is a restore that reconciles
  # nothing and calls it a pass.
  #
  # `window_end` is superseded by `restore.point_in_time` above whenever that is
  # present, which it is here; `window_start` bounds the SAMPLE and never the
  # restore window, whose floor is the archive's.
  #
  # `scripts/demo.sh` REBINDS these two fields (and only these two) to the last
  # 24 hours before running, since that is where the seed script just produced
  # records. That is not Logweir papering over a defect: a fixed date in a
  # checked-in example cannot follow your archive, and the honest thing is to
  # say so rather than to ship a window that silently stops overlapping
  # anything a week after it was written.
  window_start: "2026-09-07T12:00:00Z"
  window_end:   "2026-09-07T15:00:00Z"
  records_per_partition: 25
  # `head` is the only anchor v0.1 implements end to end, and it is the default
  # when the field is omitted. `tail` and `random` are REFUSED at phase 0
  # (exit 3) rather than silently mis-sampling — see
  # `logweir_core::spec::Anchor`.
  anchor: head

objectives:
  rto_seconds: 900
  rpo_seconds: 300
  pass_rate: 1.0

evidence:
  backend: s3
  bucket: logweir-evidence
  # Global Constraint 6: logweir writes only under `logweir/`, and
  # `Store::from_url` refuses an evidence prefix that does not start with
  # exactly that — trailing slash included.
  prefix: logweir/
  region: us-east-1
  endpoint: http://localhost:9000
  path_style: true
  allow_http: true

notifications:
  webhooks: []
  # slack_webhook: https://hooks.slack.com/services/…
  # pagerduty_routing_key: R0…
