# A scheduled Logweir drill as a plain Kubernetes CronJob.
#
# NO CRD, NO OPERATOR, and it creates no Kubernetes Job of its own: the pod runs
# `logweir drill run`, which spawns the engine as a LOCAL SUBPROCESS. The image
# already contains the extracted, digest-pinned `kafka-backup` binary.
#
# Read docs/kubernetes.md before deploying this. In particular: the exit code
# that means "a drill ran and did not pass" is nearly invisible to a Kubernetes
# operator unless the Job is shaped exactly as it is below.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logweir-drill
# v0.1 makes NO Kubernetes API calls, so it needs no token at all. Mounting one
# would be a credential in a pod that has no use for it.
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: logweir-drill
spec:
  schedule: "17 3 * * 1"          # 03:17 every Monday
  concurrencyPolicy: Forbid       # a drill restores; never run two at once
  successfulJobsHistoryLimit: 3
  # Keep FAILED pods around: the exit code lives only on the pod object, so
  # deleting them deletes the result. See docs/kubernetes.md §1.
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      # THE TWO LINES THAT MAKE THE EXIT CODE READABLE (docs/kubernetes.md §1).
      #
      # `backoffLimit: 0` + `restartPolicy: Never` yields exactly ONE pod, an
      # immediate Failed condition, and a cleanly readable
      # `.status.containerStatuses[0].state.terminated.exitCode`.
      #
      # The alternative is actively harmful: `restartPolicy: OnFailure` with a
      # non-zero backoffLimit RETRIES a drill that legitimately did not pass —
      # re-running a restore against the same archive expecting a different
      # answer — and buries the original code in `lastState`.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: logweir-drill
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            # WITHOUT THIS LINE EVERY SCHEDULED DRILL DIES OPENING ITS OWN
            # SIGNING KEY. Kubelet writes Secret files owned by `root:root`, so
            # a container running as 65532 reads nothing through the owner
            # bits: `cat /etc/logweir-keys/signing.pem` is `Permission denied`
            # and `drill run` exits 1 at phase 1 having done nothing. This
            # manifest shipped `runAsUser: 65532`, `defaultMode: 0400` and no
            # `fsGroup` at all.
            #
            # `fsGroup` chowns the volume's group to this GID *and* ORs
            # group-read into the file mode, so it is sufficient on its own.
            # Widening the mode without it is not: the group is still root's.
            # All four combinations were run live on docker-desktop — see the
            # table in docs/kubernetes.md §3.
            #
            # `fsGroup` applies to Secret, ConfigMap, emptyDir and most
            # dynamically provisioned volumes. It does NOT apply to `hostPath`
            # — see the `metrics` volume below, which needs host-side
            # ownership instead.
            fsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: logweir
              # A DIGEST, NEVER A TAG (Global Constraint 7, pinned by Task 23).
              # This line was `logweir:v0.1.0` — a MUTABLE TAG under the
              # mandatory `imagePullPolicy: Never` below, on a single node. So
              # the org-root anchor baked into the image
              # (`/etc/logweir/org-root.fingerprint`) could be replaced by a
              # `docker build -t logweir:v0.1.0` on that node WITHOUT TOUCHING
              # A SINGLE KUBERNETES OBJECT. A digest names bytes; a tag names
              # whatever was built last.
              #
              # Replace it with your own registry's digest. Logweir publishes
              # nothing under the `osodevops/` namespace — that namespace is
              # upstream's, and this image only CONTAINS the engine binary
              # extracted from it under the MIT licence carried in third_party/.
              #
              # The value below is a LOCALLY BUILT digest and is author-only
              # (Global Constraint 37): no such image has been pushed, and on a
              # node that has not built it this pod fails as `ErrImageNeverPull`
              # naming the whole reference. `docs/kubernetes.md` §14 carries the
              # measurement and the one `docker tag` an author needs.
              image: docker.io/vladyslavhaina/logweir@sha256:6440a4a06d6f4a0ecbef71fa7d8ad11b5a87f3670298c585d5cd0073ae2e1229
              # docs/kubernetes.md §2: on an arm64 node the engine layer is
              # linux/amd64 and MUST be pre-pulled host-side with
              # `docker pull --platform linux/amd64 <digest>`. `Never` makes a
              # missing pre-pull fail legibly as ErrImageNeverPull instead of as
              # an opaque pull error. On an amd64 cluster with a real registry,
              # `IfNotPresent` is the right value.
              imagePullPolicy: Never
              args:
                - drill
                - run
                - --spec=/etc/logweir/drill.yaml
                # The four AUTHORISING files come from the Secret mounted at
                # /approval, never from the ConfigMap — see the `approval`
                # volume below for why.
                - --approval=/approval/approval.json
                - --approver-key=/approval/approver.pub.pem
                - --allowed-clusters=/approval/allowed-clusters.json
                - --signing-key=/etc/logweir-keys/signing.pem
                - --out=/scratch/scorecard.json
                - --metrics-file=/metrics/logweir.prom
                - --triggered-by=cronjob/logweir-drill
              env:
                # MANDATORY. An empty version or digest is refused with exit 1:
                # a signed scorecard must name the engine image that produced
                # the restore. Keep these in lockstep with the image tag above
                # and with third_party/kafka-backup-binary.digest.
                - name: LOGWEIR_ENGINE_VERSION
                  value: "0.21.0"
                - name: LOGWEIR_ENGINE_DIGEST
                  value: "sha256:8ff5be71f92a118cde64c082a86d188a4187d8f8f64311458081b8727e99c317"
                # The rendered restore.yaml and the restore checkpoint land
                # here. Pod-local and never uploaded — a crashed restore is not
                # resumable in v0.1 (docs/stability.md).
                - name: TMPDIR
                  value: /scratch
                # Logweir's binary defaults to `info` on its own (see README
                # §Logging), so this line is belt-and-braces, not the mechanism:
                # it pins the level where a cluster-wide policy or a base image
                # might otherwise inject a quieter one, and it makes the level
                # visible in `kubectl get cronjob -o yaml` without reading the
                # source. Below `info` the run id and the exit-code meaning line
                # are lost, and the exit code is otherwise readable only from the
                # terminated pod's containerStatuses.
                - name: RUST_LOG
                  value: info
                # object_store's OWN credential chain, not the AWS SDK's:
                # ~/.aws/credentials, AWS_PROFILE and SSO are unsupported.
                # On EKS, drop these two and use IRSA / Pod Identity instead.
                - name: AWS_REGION
                  value: us-east-1
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: logweir-s3, key: access-key-id }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: logweir-s3, key: secret-access-key }
              volumeMounts:
                - { name: config,   mountPath: /etc/logweir,      readOnly: true }
                - { name: approval, mountPath: /approval,         readOnly: true }
                - { name: keys,     mountPath: /etc/logweir-keys, readOnly: true }
                - { name: scratch,  mountPath: /scratch }
                - { name: metrics,  mountPath: /metrics }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: "250m", memory: "512Mi" }
                limits:   { memory: "2Gi" }
          volumes:
            # THE PLAN, AND ONLY THE PLAN. What stays in the ConfigMap is what
            # is public AND authorises nothing: `drill.yaml` names topics, a
            # window and a target, and every one of those is re-checked against
            # the approval and the allowlist before anything runs.
            - name: config
              configMap:
                name: logweir-drill-config
                items:
                  - { key: drill.yaml, path: drill.yaml }
            # THE APPROVAL BUNDLE, IN ITS OWN SECRET, AND THE REASON IS ONE
            # SENTENCE: reading a Secret is a different RBAC verb from reading
            # a ConfigMap, so the four files that decide WHO may authorise this
            # run and WHICH clusters it may touch are no longer replaceable by
            # any subject holding `patch configmaps` in this namespace.
            #
            # None of this stops a cluster-admin, and the file says so rather
            # than implying otherwise — docs/stability.md, O0.
            #
            # Produce `approval.json` and `approval.sig` with the SHIPPED
            # binary, on the approver's own machine, with the approver's
            # PRIVATE key — the image can do this and needs nothing else:
            #
            #   docker run --rm -v "$PWD:/w" -w /w logweir:v0.1.0 drill approve \
            #     --spec drill.yaml --key approver.pem \
            #     --approver sre-oncall@example.com --ticket CHG-40881 \
            #     --subject-kind Restore --out approval.json
            #
            # RE-RUN IT ON EVERY EDIT OF drill.yaml, the sample window
            # included: `plan_hash` binds the approval to the spec's exact
            # bytes and phase 1 refuses a mismatch with exit 3.
            #
            # `approver.pub.pem` is the PUBLIC half. No private key reaches a
            # runner pod on this path; `approver.pem` never leaves the
            # approver's machine. Create the Secret with the command in
            # config/samples/secrets.yaml §2.
            - name: approval
              secret:
                secretName: logweir-approval-bundle
                defaultMode: 0440
                items:
                  - { key: approval.json,          path: approval.json }
                  - { key: approval.sig,           path: approval.sig }
                  - { key: approver.pub.pem,       path: approver.pub.pem }
                  - { key: allowed-clusters.json,  path: allowed-clusters.json }
            # The PRIVATE signing key, and nothing else.
            #
            # `0440`, not `0400`: with `fsGroup` set, kubelet writes the file
            # as `root:65532` and ORs group-read in anyway, so `0400` lands on
            # disk as `0440` regardless. Saying `0440` here means the manifest
            # states the permission that actually exists instead of one kubelet
            # silently widens — `ls -l` inside the pod matches this line.
            #
            # It is `fsGroup` above that makes the key readable, NOT this mode:
            # `0440` with no `fsGroup` is still `root:root` and still denied.
            # Verified live on docker-desktop, all four combinations
            # (docs/kubernetes.md §3).
            - name: keys
              secret:
                secretName: logweir-signing-key
                defaultMode: 0440
                items:
                  - { key: signing.pem, path: signing.pem }
            # emptyDir is verified; no PVC was exercised in v0.1 (the test
            # cluster's only StorageClass was `hostpath`).
            - name: scratch
              emptyDir: {}
            # The Prometheus textfile collector's directory. v0.1 has NO HTTP
            # surface, so this file — not a /metrics endpoint — is how the
            # dashboard gets data. It MUST therefore be the same directory
            # node_exporter's `--collector.textfile.directory` points at.
            #
            # This was an `emptyDir`, directly beneath that sentence. An
            # emptyDir is deleted with the pod, so every scheduled drill wrote
            # `logweir.prom` into a filesystem nothing would ever scrape and
            # then destroyed it: dashboards/logweir.json stays empty forever,
            # which is
            # indistinguishable from Logweir being broken.
            #
            # `type: Directory` and NOT `DirectoryOrCreate`, deliberately: a
            # created-on-demand directory would be root-owned 0755 and this pod
            # (uid 65532) could not write into it, so the drill would die at
            # phase 8 having done all the work. `fsGroup` does not apply to
            # hostPath. The directory must already exist on every node this
            # CronJob can be scheduled onto, writable by GID 65532 — which is
            # normally already true where node_exporter runs as a DaemonSet:
            #
            #   sudo install -d -m 0775 -g 65532 /var/lib/node_exporter/textfile
            #
            # If it is missing, the pod fails at mount time with a FailedMount
            # event that names the path. That is the loud failure; the emptyDir
            # was the silent one.
            #
            # A hostPath volume is FORBIDDEN by Pod Security `baseline` and
            # `restricted` (verified: `violates PodSecurity "baseline:latest":
            # hostPath volumes`). Everything else in this manifest satisfies
            # `restricted`; this volume is the one thing that does not. In such
            # a namespace, delete BOTH the `--metrics-file` argument above and
            # this volume, rather than pointing the flag at an emptyDir: no
            # metrics is an honest state, and a dashboard fed by a file that is
            # deleted with the pod is not.
            - name: metrics
              hostPath:
                path: /var/lib/node_exporter/textfile
                type: Directory
