# logweir drill spec. Run:
#   logweir drill run --spec drill.yaml --approval approval.json \
#     --approver-key approver.pem --allowed-clusters allowed-clusters.json \
#     --signing-key signer.pem
source:
  storage:
    backend: s3
    bucket: kafka-backups
    # `scripts/e2e-seed.sh` backs up under `backup_id: drill-demo`
    # (e2e/compose/config/backup-drill.yaml), so this is the prefix the archive
    # actually lives at. It read `basic-demo` — the name of a DIFFERENT upstream
    # demo — until Task 21c ran this example against the real stack and got
    # "the archive holds no backup set at the configured source storage
    # location".
    prefix: drill-demo
    region: us-east-1
    endpoint: http://localhost:9000
    path_style: true
    allow_http: true
  backup: latestCompleted
  topics: [orders, payments]

target:
  bootstrap_servers: [localhost:9092]
  marker_topic: logweir.scratch
  topic_mapping_prefix: "drill-"
  default_replication_factor: 1
  teardown: delete

sample:
  # THESE TWO DATES ARE ILLUSTRATIVE AND YOU MUST CHANGE THEM. They name the
  # point-in-time range this drill recovers to, so they are specific to your
  # archive, not to Logweir. A window that overlaps no segment in the archive is
  # REFUSED — `drill run` exits 1 with "a drill over an empty window would
  # report a pass that means nothing" — because the alternative is a drill that
  # restores nothing and calls it a pass.
  #
  # `scripts/demo.sh` therefore REBINDS these two fields (and only these two)
  # to the last 24 hours before running, since that is where the seed script
  # just produced records; `e2e/tests/harness/mod.rs` does the same for the e2e
  # suite via `spec_example_with_only_the_window_bound`. Neither is Logweir
  # papering over a defect: a fixed date in a checked-in example cannot follow
  # your archive, and the honest thing is to say so rather than to ship a
  # window that silently stops overlapping anything a week after it was written.
  window_start: "2026-08-29T00:00:00Z"
  window_end:   "2026-08-30T02:00:00Z"
  records_per_partition: 25
  # `head` is the only anchor v0.1 implements end to end, and it is now the
  # default when the field is omitted. This example read `anchor: random`
  # until Task 21c ran it against a real archive: phase 4 sampled archive
  # records spread across the window while phase 7 read the target's first 25,
  # so a byte-for-byte correct restore scored pass_rate 0.08 and
  # `fail-integrity`. `tail` and `random` are now REFUSED at phase 0 (exit 3)
  # rather than silently mis-sampling — see `logweir_core::spec::Anchor`.
  anchor: head

objectives:
  rto_seconds: 900
  rpo_seconds: 300
  pass_rate: 1.0

evidence:
  backend: s3
  bucket: logweir-evidence
  # Global Constraint 6: logweir writes only under `logweir/`, and
  # `Store::from_url` refuses an evidence prefix that does not start with
  # exactly that — trailing slash included. `logweir` (no slash) is refused at
  # construction, which Task 21a found by wiring `drill run` end to end.
  prefix: logweir/
  region: us-east-1
  endpoint: http://localhost:9000
  path_style: true
  allow_http: true

notifications:
  webhooks: []
  # slack_webhook: https://hooks.slack.com/services/…
  # pagerduty_routing_key: R0…
