# logweir drill spec. Run:
#   logweir drill run --spec drill.yaml --approval approval.json \
#     --approver-key approver.pem --allowed-clusters allowed-clusters.json \
#     --signing-key signer.pem
source:
  storage:
    backend: s3
    bucket: kafka-backups
    # `scripts/e2e-seed.sh` backs up under `backup_id: drill-demo`
    # (e2e/compose/config/backup-drill.yaml), so this is the prefix the archive
    # actually lives at. It read `basic-demo` — the name of a DIFFERENT upstream
    # demo — until Task 21c ran this example against the real stack and got
    # "the archive holds no backup set at the configured source storage
    # location".
    prefix: drill-demo
    region: us-east-1
    endpoint: http://localhost:9000
    path_style: true
    allow_http: true
  backup: latestCompleted
  topics: [orders, payments]

target:
  bootstrap_servers: [localhost:9092]
  marker_topic: logweir.scratch
  topic_mapping_prefix: "drill-"
  default_replication_factor: 1
  teardown: delete

sample:
  window_start: "2026-08-29T00:00:00Z"
  window_end:   "2026-08-30T02:00:00Z"
  records_per_partition: 25
  anchor: random

objectives:
  rto_seconds: 900
  rpo_seconds: 300
  pass_rate: 1.0

evidence:
  backend: s3
  bucket: logweir-evidence
  # Global Constraint 6: logweir writes only under `logweir/`, and
  # `Store::from_url` refuses an evidence prefix that does not start with
  # exactly that — trailing slash included. `logweir` (no slash) is refused at
  # construction, which Task 21a found by wiring `drill run` end to end.
  prefix: logweir/
  region: us-east-1
  endpoint: http://localhost:9000
  path_style: true
  allow_http: true

notifications:
  webhooks: []
  # slack_webhook: https://hooks.slack.com/services/…
  # pagerduty_routing_key: R0…
